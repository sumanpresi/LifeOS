\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Indefinite Pronouns:<\/strong> Refer to persons or things in a general way, not to any particular person or thing.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Forms:<\/strong> one, some, any, all, none, somebody, anybody, nobody, everyone, anyone<br/><br/>\n<strong>Examples:<\/strong><br/>\n                            • <span class=\"wm-hl\">One<\/span> hardly knows what to do.<br/>\n                            • <span class=\"wm-hl\">Some<\/span> are born great.<br/>\n                            • <span class=\"wm-hl\">Nobody<\/span> was there to rescue the child.<br/>\n                            • <span class=\"wm-hl\">Everyone<\/span> should do their best.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Distributive Pronouns \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Distributive Pronouns:<\/strong> Refer to persons or things one at a time. Always singular.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Forms:<\/strong> each, either, neither<br/><br/>\n<strong>Examples:<\/strong><br/>\n                            • <span class=\"wm-hl\">Each<\/span> of the boys gets a prize.<br/>\n                            • <span class=\"wm-hl\">Either<\/span> of these roads leads to the station.<br/>\n                            • <span class=\"wm-hl\">Neither<\/span> of the accusations is true.\n                        <\/div>\n<div class=\"wm-note\">\n<strong>Note:<\/strong> Either and neither should only be used when speaking of two persons or things.\n                        <\/div>\n<\/div>\n<\/div>", "src": ["48-71"], "desc": "Demonstrative Pronouns: Used to point out objects to which they refer.", "n": 16, "ex": 0, "items": 0, "ans": 0, "words": 181, "cn": 16}, {"part": 1, "title": "Relative Pronouns", "html": "<div class=\"wm-sub\">\n<h3>\n                        Definition &amp; Function \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Relative Pronouns:<\/strong> Do double work - the work of a pronoun and a conjunction. They relate to an antecedent and join clauses.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Example:<\/strong><br/>\n                            • I met Hari. + Hari had just returned.<br/>\n                            • Combined: I met Hari <span class=\"wm-hl\">who<\/span> had just returned.<br/><br/>\n                            Here \"who\" refers back to \"Hari\" (antecedent) and joins the two sentences.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Forms of Relative Pronouns \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<div class=\"wm-tablewrap\"><table style=\"width:100%; border-collapse: collapse; margin: 10px 0;\">\n<tr style=\"background: #f0f0f0;\">\n<th style=\"border: 1px solid #ddd; padding: 8px;\">Case<\/th>\n<th style=\"border: 1px solid #ddd; padding: 8px;\">Who<\/th>\n<th style=\"border: 1px solid #ddd; padding: 8px;\">Which<\/th>\n<th style=\"border: 1px solid #ddd; padding: 8px;\">That<\/th>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">Nominative<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">who<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">which<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">that<\/td>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">Possessive<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">whose<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">whose<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">-<\/td>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">Accusative<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">whom/who<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">which<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">that<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Usage Rules \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Who:<\/strong> Used for persons only<br/>\n                            • The man <span class=\"wm-hl\">who<\/span> is honest is trusted.<br/><br/>\n<strong>Which:<\/strong> Used for things and animals<br/>\n                            • The book <span class=\"wm-hl\">which<\/span> you gave me is good.<br/><br/>\n<strong>That:<\/strong> Used for persons and things (defining clauses only)<br/>\n                            • The boy <span class=\"wm-hl\">that<\/span> I told you of is here.<br/><br/>\n<strong>What:<\/strong> Used without antecedent (= that which)<br/>\n                            • <span class=\"wm-hl\">What<\/span> cannot be cured must be endured.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Practice Exercise \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Exercise: Fill in Relative Pronouns<\/h4>\n<ol>\n<li>We always like boys _____ speak the truth.<\/li>\n<li>I know _____ you mean.<\/li>\n<li>He _____ does his best shall be praised.<\/li>\n<li>Here is the pen _____ you lost.<\/li>\n<li>The letter _____ you wrote never arrived.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["48-71"], "desc": "Relative Pronouns: Do double work - the work of a pronoun and a conjunction.", "n": 17, "ex": 1, "items": 0, "ans": 0, "words": 182, "cn": 17}, {"part": 1, "title": "Interrogative Pronouns", "html": "<div class=\"wm-sub\">\n<h3>\n                        Definition &amp; Forms \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Interrogative Pronouns:<\/strong> Used for asking questions.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Forms:<\/strong><br/>\n                            • <span class=\"wm-hl\">Who<\/span> - Nominative (persons)<br/>\n                            • <span class=\"wm-hl\">Whose<\/span> - Possessive (persons)<br/>\n                            • <span class=\"wm-hl\">Whom/Who<\/span> - Accusative (persons)<br/>\n                            • <span class=\"wm-hl\">What<\/span> - All cases (things)<br/>\n                            • <span class=\"wm-hl\">Which<\/span> - All cases (selection from limited number)\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Usage Rules \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Who:<\/strong> Used for persons only<br/>\n                            • <span class=\"wm-hl\">Who<\/span> is there?<br/>\n                            • <span class=\"wm-hl\">Who<\/span> goes there?<br/><br/>\n<strong>Which:<\/strong> Implies selection (persons and things)<br/>\n                            • <span class=\"wm-hl\">Which<\/span> is your friend?<br/>\n                            • <span class=\"wm-hl\">Which<\/span> of these books is yours?<br/><br/>\n<strong>What:<\/strong> Used for things only<br/>\n                            • <span class=\"wm-hl\">What<\/span> have you found?<br/>\n                            • <span class=\"wm-hl\">What<\/span> do you want?<br/><br/>\n<strong>Special use:<\/strong> \"What are you?\" = \"What is your profession?\"\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Practice Exercise \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Exercise: Choose the Correct Interrogative Pronoun<\/h4>\n<ol>\n<li>_____ wishes to see you? (Who/What/Which)<\/li>\n<li>_____ do you wish to see? (Who/Whom/Which)<\/li>\n<li>_____ of the girls can sew the best? (Who/What/Which)<\/li>\n<li>_____ are you seeking? (Who/What/Which)<\/li>\n<li>_____ is better, honour or riches? (Who/What/Which)<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["48-71"], "desc": "Interrogative Pronouns: Used for asking questions.", "n": 18, "ex": 1, "items": 0, "ans": 0, "words": 140, "cn": 18}, {"part": 1, "title": "Transitive and Intransitive Verbs", "html": "<div class=\"wm-sub\">\n<h3>\n                        Definition \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Verb:<\/strong> A word that tells or asserts something about a person or thing.\n                        <\/div>\n<div class=\"wm-example\">\n                            A verb may tell us:<br/>\n                            1. <span class=\"wm-hl\">What a person or thing does:<\/span> Hari laughs.<br/>\n                            2. <span class=\"wm-hl\">What is done to a person or thing:<\/span> Hari is scolded.<br/>\n                            3. <span class=\"wm-hl\">What a person or thing is:<\/span> The cat is dead.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Transitive vs Intransitive \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Transitive Verb:<\/strong> Action passes over from the doer to an object.<br/>\n<strong>Intransitive Verb:<\/strong> Action does not pass over to an object.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Transitive:<\/strong><br/>\n                            • The boy <span class=\"wm-hl\">kicks<\/span> the football. (action passes to football)<br/>\n                            • She <span class=\"wm-hl\">wrote<\/span> a letter. (action passes to letter)<br/><br/>\n<strong>Intransitive:<\/strong><br/>\n                            • The boy <span class=\"wm-hl\">laughs<\/span> loudly. (action stops with the boy)<br/>\n                            • The baby <span class=\"wm-hl\">sleeps<\/span>. (action stops with the baby)\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Direct &amp; Indirect Objects \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n                            Some transitive verbs take two objects: an indirect object (person) and a direct object (thing).\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                            • His father gave <span class=\"wm-hl\">him<\/span> (indirect) <span class=\"wm-hl\">a watch<\/span> (direct).<br/>\n                            • He told <span class=\"wm-hl\">me<\/span> (indirect) <span class=\"wm-hl\">a secret<\/span> (direct).<br/>\n                            • She offered <span class=\"wm-hl\">us<\/span> (indirect) <span class=\"wm-hl\">tea<\/span> (direct).\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Cognate Objects \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Cognate Object:<\/strong> An object similar in meaning to the intransitive verb.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                            • I have fought <span class=\"wm-hl\">a good fight<\/span>.<br/>\n                            • He laughed <span class=\"wm-hl\">a hearty laugh<\/span>.<br/>\n                            • She sang <span class=\"wm-hl\">a sweet song<\/span>.<br/>\n                            • He ran <span class=\"wm-hl\">a race<\/span>.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Practice Exercise \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Exercise: Identify Transitive/Intransitive &amp; Objects<\/h4>\n<ol>\n<li>The sun shines brightly.<\/li>\n<li>The boy cut his hand with a knife.<\/li>\n<li>The clock stopped this morning.<\/li>\n<li>The policeman blew his whistle.<\/li>\n<li>The cat sleeps on the rug.<\/li>\n<li>Time changes all things.<\/li>\n<li>Tell the truth.<\/li>\n<li>Birds fly in the air.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["48-71"], "desc": "Verb: A word that tells or asserts something about a person or thing.", "n": 19, "ex": 1, "items": 0, "ans": 0, "words": 249, "cn": 19}, {"part": 1, "title": "Verbs of Incomplete Predication", "html": "<div class=\"wm-sub\">\n<h3>\n                        Definition \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Verbs of Incomplete Predication:<\/strong> Intransitive verbs that require a word (complement) to make complete sense.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Complete sense:<\/strong> The baby sleeps. ✓<br/>\n<strong>Incomplete sense:<\/strong> The baby seems... ✗<br/>\n<strong>Complete with complement:<\/strong> The baby seems <span class=\"wm-hl\">happy<\/span>. ✓\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Types of Complements \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Subjective Complement:<\/strong> Describes the subject<br/>\n<strong>Objective Complement:<\/strong> Describes the object\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Subjective Complements:<\/strong><br/>\n                            • Tabby is <span class=\"wm-hl\">a cat<\/span>. (predicative noun)<br/>\n                            • The earth is <span class=\"wm-hl\">round<\/span>. (predicative adjective)<br/>\n                            • John became <span class=\"wm-hl\">a soldier<\/span>.<br/>\n                            • You look <span class=\"wm-hl\">happy<\/span>.<br/><br/>\n<strong>Objective Complements:<\/strong><br/>\n                            • The boys made Rama <span class=\"wm-hl\">captain<\/span>.<br/>\n                            • His parents named him <span class=\"wm-hl\">Hari<\/span>.<br/>\n                            • The jury found him <span class=\"wm-hl\">guilty<\/span>.<br/>\n                            • We thought him <span class=\"wm-hl\">a rascal<\/span>.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Common Linking Verbs \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Verbs that usually take complements:<\/strong><br/>\n                            • <span class=\"wm-hl\">Be verbs:<\/span> am, is, are, was, were, being, been<br/>\n                            • <span class=\"wm-hl\">Become:<\/span> become, became<br/>\n                            • <span class=\"wm-hl\">Seem/Appear:<\/span> seem, appear, look<br/>\n                            • <span class=\"wm-hl\">Sensory verbs:<\/span> taste, smell, sound, feel<br/>\n                            • <span class=\"wm-hl\">Others:<\/span> grow, turn, remain, stay\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Practice Exercise \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Exercise: Identify Verbs and Complements<\/h4>\n<ol>\n<li>The hungry lion roars.<\/li>\n<li>The report proved false.<\/li>\n<li>The child had fallen sick.<\/li>\n<li>The wind is cold.<\/li>\n<li>The results are out.<\/li>\n<li>We see with our eyes.<\/li>\n<li>The child fell asleep.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["48-71"], "desc": "Verbs of Incomplete Predication: Intransitive verbs that require a word (complement) to make complete sense.", "n": 20, "ex": 1, "items": 0, "ans": 0, "words": 186, "cn": 20}, {"part": 1, "title": "Verb: Moods", "html": "<div class=\"wm-sub\">\n<h3>1. Indicative Mood<\/h3>\n<p>Used to make statements of fact, ask questions, or express suppositions assumed as fact.<\/p>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Statements:<\/strong> He writes legibly. • Napoleon died at St. Helena. • The child is alive.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Questions:<\/strong> Have you found your book? • Are you well?\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Suppositions:<\/strong> If I am to be a beggar, it shall never make me a rascal. • If it rains, I shall stay at home.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>2. Imperative Mood<\/h3>\n<p>Used to express commands, exhortations, entreaties, or prayers.<\/p>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Commands:<\/strong> Wait there. • Come here. • Open your book at page 7.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Exhortations:<\/strong> Be steady. • Take care of your health. • Try to do better.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Entreaties/Prayers:<\/strong> Have mercy upon us. • Give us this day our daily bread.\n                    <\/div>\n<\/div>\n<div class=\"wm-hl\">\n<strong>📝 Notes:<\/strong>\n<ul>\n<li>Strictly used only in Second Person (person spoken to)<\/li>\n<li>For First and Third Persons, use auxiliary verb \"let\": Let me go, Let us go, Let him go<\/li>\n<li>Subject \"you\" is usually omitted in imperative mood<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>3. Subjunctive Mood<\/h3>\n<p>Scarcely exists in present-day English, but appears in specific contexts.<\/p>\n<div class=\"wm-tablewrap\"><table class=\"wm-rule\">\n<thead>\n<tr>\n<th>Person<\/th>\n<th>Present Subjunctive (be)<\/th>\n<th>Present Subjunctive (other verbs)<\/th>\n<th>Past Subjunctive (be)<\/th>\n<th>Past Subjunctive (other verbs)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr><td>I<\/td><td>I be<\/td><td>I speak<\/td><td>I were<\/td><td>I spoke<\/td><\/tr>\n<tr><td>We<\/td><td>We be<\/td><td>We speak<\/td><td>We were<\/td><td>We spoke<\/td><\/tr>\n<tr><td>You<\/td><td>You be<\/td><td>You speak<\/td><td>You were<\/td><td>You spoke<\/td><\/tr>\n<tr><td>He/She<\/td><td>He be<\/td><td>He speak<\/td><td>He were<\/td><td>He spoke<\/td><\/tr>\n<tr><td>They<\/td><td>They be<\/td><td>They speak<\/td><td>They were<\/td><td>They spoke<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"wm-rule\">\n<h4>Present Subjunctive Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Traditional phrases:<\/strong> God bless you! • God save the King! • Heaven help us!\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Formal English:<\/strong> I move that Mr Gupta be appointed Chairman. • It is suggested that a ring road be built.\n                    <\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Past Subjunctive Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>After \"wish\":<\/strong> I wish I knew his name. • I wish I were a millionaire.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>After \"if\" (improbability):<\/strong> If I were you I should not do that.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>After \"as if/as though\":<\/strong> He orders me about as if I were his wife.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>After \"it is time\":<\/strong> It is time we started.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>After \"would rather\":<\/strong> I would rather you went by air.\n                    <\/div>\n<\/div>\n<\/div>", "src": ["77-87"], "desc": "Used to make statements of fact, ask questions, or express suppositions assumed as fact.", "n": 21, "ex": 0, "items": 0, "ans": 0, "words": 329, "cn": 21}, {"part": 1, "title": "The Tenses: Introduction", "html": "<div class=\"wm-hl\">\n<h3>What is Tense?<\/h3>\n<p>Tense shows the <strong>time<\/strong> and the <strong>state<\/strong> of an action or event.<\/p>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                    • I write this letter to please you. (Present time)<br/>\n                    • I wrote the letter in his very presence. (Past time)<br/>\n                    • I shall write another letter tomorrow. (Future time)\n                <\/div>\n<\/div>\n<div>\n<div>\n<h4>Present Tense<\/h4>\n<div>\n<p><strong>Simple Present:<\/strong> I love<\/p>\n<p><strong>Present Continuous:<\/strong> I am loving<\/p>\n<p><strong>Present Perfect:<\/strong> I have loved<\/p>\n<p><strong>Present Perfect Continuous:<\/strong> I have been loving<\/p>\n<\/div>\n<\/div>\n<div>\n<h4>Past Tense<\/h4>\n<div>\n<p><strong>Simple Past:<\/strong> I loved<\/p>\n<p><strong>Past Continuous:<\/strong> I was loving<\/p>\n<p><strong>Past Perfect:<\/strong> I had loved<\/p>\n<p><strong>Past Perfect Continuous:<\/strong> I had been loving<\/p>\n<\/div>\n<\/div>\n<div>\n<h4>Future Tense<\/h4>\n<div>\n<p><strong>Simple Future:<\/strong> I shall/will love<\/p>\n<p><strong>Future Continuous:<\/strong> I shall/will be loving<\/p>\n<p><strong>Future Perfect:<\/strong> I shall/will have loved<\/p>\n<p><strong>Future Perfect Continuous:<\/strong> I shall have been loving<\/p>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-hl\">\n<h3>Complete Conjugation Table - Verb \"to love\"<\/h3>\n<div class=\"wm-tablewrap\"><table class=\"wm-rule\">\n<thead>\n<tr>\n<th>Tense<\/th>\n<th>1st Person Singular<\/th>\n<th>2nd Person Singular<\/th>\n<th>3rd Person Singular<\/th>\n<th>1st Person Plural<\/th>\n<th>2nd Person Plural<\/th>\n<th>3rd Person Plural<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Present<\/strong><\/td>\n<td>I love<\/td>\n<td>You love<\/td>\n<td>He loves<\/td>\n<td>We love<\/td>\n<td>You love<\/td>\n<td>They love<\/td>\n<\/tr>\n<tr>\n<td><strong>Past<\/strong><\/td>\n<td>I loved<\/td>\n<td>You loved<\/td>\n<td>He loved<\/td>\n<td>We loved<\/td>\n<td>You loved<\/td>\n<td>They loved<\/td>\n<\/tr>\n<tr>\n<td><strong>Future<\/strong><\/td>\n<td>I shall/will love<\/td>\n<td>You will love<\/td>\n<td>He will love<\/td>\n<td>We shall/will love<\/td>\n<td>You will love<\/td>\n<td>They will love<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>", "src": ["77-87"], "desc": "Tense shows the time and the state of an action or event.", "n": 22, "ex": 0, "items": 0, "ans": 0, "words": 190, "cn": 22}, {"part": 1, "title": "Present and Past Tenses", "html": "<div class=\"wm-sub\">\n<h3>Simple Present Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Habitual actions:<\/strong> He drinks tea every morning. • I get up everyday at five o'clock.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. General truths:<\/strong> The sun rises in the east. • Honey is sweet. • Fortune favours the brave.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>3. Exclamatory sentences (here/there):<\/strong> Here comes the bus! • There she goes!\n                    <\/div>\n<div class=\"wm-example\">\n<strong>4. Vivid narrative (substitute for Simple Past):<\/strong> Sohrab now rushes forward and deals a heavy blow to Rustam.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>5. Fixed timetables/programmes:<\/strong> The next flight is at 7.00 tomorrow morning. • The match starts at 9 o'clock.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>6. Introducing quotations:<\/strong> Keats says, 'A thing of beauty is a joy for ever'.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>7. In time and condition clauses:<\/strong> I shall wait till you finish your lunch. • If it rains we shall get wet.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Present Continuous Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Action going on now:<\/strong> She is singing (now). • The boys are playing hockey.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Temporary action:<\/strong> I am reading 'David Copperfield' (but not reading at this moment).\n                    <\/div>\n<div class=\"wm-example\">\n<strong>3. Arranged future action:<\/strong> I am going to the cinema tonight. • My uncle is arriving tomorrow.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>4. Persistent habits (with always, continually):<\/strong> My dog is always running out into the road.\n                    <\/div>\n<\/div>\n<div class=\"wm-hl\">\n<h4>Verbs NOT normally used in continuous form:<\/h4>\n<ul>\n<li><strong>Perception:<\/strong> see, hear, smell, notice, recognize<\/li>\n<li><strong>Appearing:<\/strong> appear, look, seem<\/li>\n<li><strong>Emotion:<\/strong> want, wish, desire, feel, like, love, hate, hope, refuse, prefer<\/li>\n<li><strong>Thinking:<\/strong> think, suppose, believe, agree, consider, trust, remember, forget, know, understand<\/li>\n<li><strong>Possession:<\/strong> have (=possess), own, possess, belong to, contain, consist of, be<\/li>\n<\/ul>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> These grapes are tasting sour. • I am thinking you are wrong.<br/>\n<strong>Right:<\/strong> These grapes taste sour. • I think you are wrong.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Present Perfect Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Completed activities in immediate past (with 'just'):<\/strong> He has just gone out. • It has just struck ten.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Past actions (time not given/definite):<\/strong> Have you read 'Gulliver's Travels'? • I have never known him to be angry.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>3. Past events affecting present:<\/strong> Gopi has eaten all the biscuits (none left). • I have cut my finger (bleeding now).\n                    <\/div>\n<div class=\"wm-example\">\n<strong>4. Actions continuing to present (with since/for):<\/strong> I have known him for a long time. • He has been ill since last week.\n                    <\/div>\n<\/div>\n<div class=\"wm-hl\">\n<h4>Adverbs used with Present Perfect:<\/h4>\n<p>never, ever (questions only), so far, till now, yet (negatives/questions), already, today, this week, this month<\/p>\n<p><strong>⚠️ Never use with past time adverbs:<\/strong> ❌ He has gone to Kolkata yesterday. ✅ He went to Kolkata yesterday.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Present Perfect Continuous Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Action began in past, still continuing:<\/strong> He has been sleeping for five hours (still sleeping). • They have been building the bridge for several months.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Recently finished action (emphasizing continuity):<\/strong> 'Why are your clothes so wet?' — 'I have been watering the garden'.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Simple Past Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Completed past action (with time adverbs):<\/strong> The steamer sailed yesterday. • I received his letter a week ago. • She left school last year.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Past action (time implied):<\/strong> I learnt Hindi in Nagpur. • I didn't sleep well (last night). • Babar defeated Rana Sanga at Kanwaha.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>3. Past habits:<\/strong> He studied many hours everyday. • She always carried an umbrella.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Past Continuous Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Action going on in past:<\/strong> We were listening to the radio all evening. • It was getting darker.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Background action for new action:<\/strong> The light went out while I was reading. • When I saw him, he was playing chess.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>3. Persistent past habits (with always, continually):<\/strong> He was always grumbling.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Past Perfect Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Action completed before past moment:<\/strong> I met him in New Delhi in 1996. I had seen him last five years before.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Earlier of two past actions:<\/strong> When I reached the station the train had started. • I had done my exercise when Hari came to see me.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Past Perfect Continuous Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Action began before past point, continued to that time:<\/strong> At that time he had been writing a novel for two months. • When Mr Mukerji came to the school in 1995, Mr Anand had already been teaching there for five years.\n                    <\/div>\n<\/div>\n<\/div>", "src": ["77-87"], "desc": "never, ever (questions only), so far, till now, yet (negatives/questions), already, today, this week, this month", "n": 23, "ex": 0, "items": 0, "ans": 0, "words": 662, "cn": 23}, {"part": 1, "title": "Future Tenses", "html": "<div class=\"wm-sub\">\n<h3>Simple Future Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Uncontrollable future events (future as fact):<\/strong> I shall be twenty next Saturday. • It will be Diwali in a week. • We will know our exam results in May.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Future predictions/beliefs:<\/strong> I think Pakistan will win the match. • I'm sure Helen will get a first class.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>3. Instant decisions:<\/strong> It is raining. I will take an umbrella. • \"Mr Sinha is very busy.\" – \"All right. I'll wait.\"\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Going to Form<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Pre-decided actions:<\/strong> \"Have you decided what to do?\" – \"Yes. I am going to resign the job.\" • \"Why sell your motorbike?\" – \"I'm going to buy a car.\"\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Future based on present evidence:<\/strong> It is going to rain; look at those clouds. • The boat is full of water. It is going to sink. • She is going to have a baby.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>3. Action about to happen:<\/strong> Let's get into the train. It's going to leave. • Look! The cracker is going to explode.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Be about to<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Immediate future:<\/strong> Let's get into the train. It's about to leave. • Don't go out now. We are about to have lunch.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Simple Present for Future<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Official programmes/timetables:<\/strong> The college opens on 23rd June. • The film starts at 6.30 and finishes at 9.00. • When does the next train leave for Chennai?\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. In time/condition clauses:<\/strong> I won't go out if it rains. • Can I have some milk before I go to bed? • Let's wait till he finishes his work. • Please ring me up as soon as he comes.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Present Continuous for Future<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Personal arrangements/plans:<\/strong> I am going to Shimla tomorrow. • We are eating out tonight. • Mr Abdul Rehman is arriving this evening.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Future Continuous Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>1. Actions in progress at future time:<\/strong> I suppose it will be raining when we start. • This time tomorrow I will be sitting on the beach in Singapore. • \"Can I see you at 5 o'clock?\" – \"Please don't come then. I will be watching the tennis match on TV.\"\n                    <\/div>\n<div class=\"wm-example\">\n<strong>2. Future actions already planned/expected:<\/strong> I will be staying here till Sunday. • He will be meeting us next week. • The postman will be coming soon.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Be to Form<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Official plans/arrangements (formal style):<\/strong> The Prime Minister is to visit America next month. • The conference is to discuss \"Nuclear Tests.\"\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Future Perfect Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Actions completed by future time:<\/strong> I shall have written my exercise by then. • He will have left before you go to see him. • By the end of this month I will have worked here for five years.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Future Perfect Continuous Tense<\/h3>\n<div class=\"wm-rule\">\n<h4>Uses:<\/h4>\n<div class=\"wm-example\">\n<strong>Actions in progress over period ending in future:<\/strong> By next March we shall have been living here for four years. • I'll have been teaching for twenty years next July.\n                    <\/div>\n<\/div>\n<\/div>", "src": ["77-87"], "desc": "Immediate future: Let's get into the train.", "n": 24, "ex": 0, "items": 0, "ans": 0, "words": 477, "cn": 24}, {"part": 1, "title": "Verb: Person and Number", "html": "<div class=\"wm-hl\">\n<h3>Fundamental Rule<\/h3>\n<p><strong>The Verb must agree with its Subject in Number and Person<\/strong><\/p>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                    • I am here. (1st person singular) <br/>\n                    • You are there. (2nd person singular/plural)<br/>\n                    • He is playing. (3rd person singular)<br/>\n                    • They are singing. (3rd person plural)\n                <\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Person in Verbs<\/h3>\n<div class=\"wm-rule\">\n<div class=\"wm-example\">\n<strong>First Person:<\/strong> I speak (subject doing the speaking)<br/>\n<strong>Second Person:<\/strong> You speak (subject being spoken to)<br/>\n<strong>Third Person:<\/strong> He speaks (subject being spoken about)\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Number in Verbs<\/h3>\n<div class=\"wm-rule\">\n<div class=\"wm-example\">\n<strong>Singular:<\/strong> He speaks (one person)<br/>\n<strong>Plural:<\/strong> They speak (more than one person)\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-tablewrap\"><table class=\"wm-rule\">\n<thead>\n<tr>\n<th>Tense<\/th>\n<th>Person<\/th>\n<th>Singular<\/th>\n<th>Plural<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td rowspan=\"3\"><strong>Simple Present<\/strong><\/td>\n<td>1st<\/td>\n<td>I speak<\/td>\n<td>We speak<\/td>\n<\/tr>\n<tr>\n<td>2nd<\/td>\n<td>You speak<\/td>\n<td>You speak<\/td>\n<\/tr>\n<tr>\n<td>3rd<\/td>\n<td>He speaks<\/td>\n<td>They speak<\/td>\n<\/tr>\n<tr>\n<td rowspan=\"3\"><strong>Present Continuous<\/strong><\/td>\n<td>1st<\/td>\n<td>I am speaking<\/td>\n<td>We are speaking<\/td>\n<\/tr>\n<tr>\n<td>2nd<\/td>\n<td>You are speaking<\/td>\n<td>You are speaking<\/td>\n<\/tr>\n<tr>\n<td>3rd<\/td>\n<td>He is speaking<\/td>\n<td>They are speaking<\/td>\n<\/tr>\n<tr>\n<td rowspan=\"3\"><strong>Present Perfect<\/strong><\/td>\n<td>1st<\/td>\n<td>I have spoken<\/td>\n<td>We have spoken<\/td>\n<\/tr>\n<tr>\n<td>2nd<\/td>\n<td>You have spoken<\/td>\n<td>You have spoken<\/td>\n<\/tr>\n<tr>\n<td>3rd<\/td>\n<td>He has spoken<\/td>\n<td>They have spoken<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>", "src": ["77-87"], "desc": "The Verb must agree with its Subject in Number and Person", "n": 25, "ex": 0, "items": 0, "ans": 0, "words": 151, "cn": 25}, {"part": 1, "title": "Practice: Moods and Tenses", "html": "<div class=\"wm-exercise\"><h4>Practice: Moods, Tenses, Person and Number<\/h4><p class=\"wm-instr\">Choose the correct option for each question.<\/p><ol class=\"wm-qlist\">\n<li>\"The river flows under the bridge.\" - Identify the mood and tense:<ul class=\"wm-opts\"><li>Indicative Mood, Simple Present<\/li><li>Imperative Mood, Simple Present<\/li><li>Subjunctive Mood, Simple Present<\/li><\/ul><div class=\"wm-answer\">Indicative Mood, Simple Present<\/div><\/li>\n<li>\"Be good, sweet maid.\" - Identify the mood:<ul class=\"wm-opts\"><li>Indicative Mood<\/li><li>Imperative Mood<\/li><li>Subjunctive Mood<\/li><\/ul><div class=\"wm-answer\">Imperative Mood<\/div><\/li>\n<li>\"I wish my brother were here.\" - Identify the mood:<ul class=\"wm-opts\"><li>Indicative Mood<\/li><li>Imperative Mood<\/li><li>Subjunctive Mood<\/li><\/ul><div class=\"wm-answer\">Subjunctive Mood<\/div><\/li>\n<li>The earth _____ round the sun.<ul class=\"wm-opts\"><li>move<\/li><li>moves<\/li><li>moved<\/li><\/ul><div class=\"wm-answer\">moves<\/div><\/li>\n<li>My friends _____ the Prime Minister yesterday.<ul class=\"wm-opts\"><li>see<\/li><li>have seen<\/li><li>saw<\/li><\/ul><div class=\"wm-answer\">saw<\/div><\/li>\n<li>I _____ him only one letter up to now.<ul class=\"wm-opts\"><li>sent<\/li><li>have sent<\/li><li>send<\/li><\/ul><div class=\"wm-answer\">have sent<\/div><\/li>\n<li>It started to rain while we _____ tennis.<ul class=\"wm-opts\"><li>are playing<\/li><li>were playing<\/li><li>had played<\/li><\/ul><div class=\"wm-answer\">were playing<\/div><\/li>\n<li>He _____ here for the last five years.<ul class=\"wm-opts\"><li>worked<\/li><li>is working<\/li><li>has been working<\/li><\/ul><div class=\"wm-answer\">has been working<\/div><\/li>\n<li>The plane _____ at 3.30. (timetable)<ul class=\"wm-opts\"><li>arrives<\/li><li>will arrive<\/li><li>is arriving<\/li><\/ul><div class=\"wm-answer\">arrives<\/div><\/li>\n<li>Look at those black clouds. It _____.<ul class=\"wm-opts\"><li>will rain<\/li><li>is going to rain<\/li><li>rains<\/li><\/ul><div class=\"wm-answer\">is going to rain<\/div><\/li>\n<li>I _____ the Joshis this evening. (arrangement)<ul class=\"wm-opts\"><li>visit<\/li><li>am visiting<\/li><li>will visit<\/li><\/ul><div class=\"wm-answer\">am visiting<\/div><\/li>\n<li>By 2020, robots _____ many of the jobs that people do today.<ul class=\"wm-opts\"><li>will be taking over<\/li><li>will have taken over<\/li><li>are taking over<\/li><\/ul><div class=\"wm-answer\">will have taken over<\/div><\/li>\n<\/ol><\/div>", "src": ["77-87"], "desc": "Choose the correct option for each question.", "n": 26, "ex": 1, "items": 12, "ans": 12, "words": 216, "cn": 26}, {"part": 2, "title": "Analysis of Simple Sentences", "html": "<div class=\"wm-rule\">\n<h4>Definition<\/h4>\n<p>A <strong>Sentence<\/strong> is a set or group of words which makes complete sense. The first stage in analysis is to divide it into two main parts—the <strong>Subject<\/strong> and the <strong>Predicate<\/strong>.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Subject and Predicate<\/h3>\n<p><strong>Subject:<\/strong> The person or thing about which something is said.<\/p>\n<p><strong>Predicate:<\/strong> What is said about the person or thing denoted by the Subject.<\/p>\n<div class=\"wm-example\">\n<h4>Interactive Examples<\/h4>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">Dogs<\/span> <span class=\"wm-hl\">bark<\/span>.\n                    <\/div>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">The sun<\/span> <span class=\"wm-hl\">gives light<\/span>.\n                    <\/div>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">My father<\/span> <span class=\"wm-hl\">gave me a watch<\/span>.\n                    <\/div>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">The hour to prepare lessons<\/span> <span class=\"wm-hl\">has arrived<\/span>.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>Subject<\/th>\n<th>Predicate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr><td>1<\/td><td>Dogs<\/td><td>bark<\/td><\/tr>\n<tr><td>2<\/td><td>The sun<\/td><td>gives light<\/td><\/tr>\n<tr><td>3<\/td><td>The child<\/td><td>is dead<\/td><\/tr>\n<tr><td>4<\/td><td>The boys<\/td><td>made Rama captain<\/td><\/tr>\n<tr><td>5<\/td><td>My father<\/td><td>gave me a watch<\/td><\/tr>\n<tr><td>6<\/td><td>The flames<\/td><td>spread everywhere<\/td><\/tr>\n<tr><td>7<\/td><td>The flames<\/td><td>spread in every direction<\/td><\/tr>\n<tr><td>8<\/td><td>The hour to prepare lessons<\/td><td>has arrived<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 1: Separate Subject and Predicate\n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> In the following sentences separate the Subject and the Predicate.<\/p>\n<div class=\"wm-qitem\">1. The cackling of geese saved Rome.<\/div>\n<div class=\"wm-qitem\">2. Stone walls do not make a prison.<\/div>\n<div class=\"wm-qitem\">3. All matter is indestructible.<\/div>\n<div class=\"wm-qitem\">4. No man can serve two masters.<\/div>\n<div class=\"wm-qitem\">5. A sick room should be well aired.<\/div>\n<div class=\"wm-qitem\">6. I shot an arrow in the air.<\/div>\n<div class=\"wm-qitem\">7. The shepherd hears barking sound.<\/div>\n<div class=\"wm-qitem\">8. Up went the balloon.<\/div>\n<div class=\"wm-qitem\">9. The naked everyday he clad.<\/div>\n<div class=\"wm-qitem\">10. Into the street the piper stepped.<\/div>\n<div class=\"wm-qitem\">11. Sweet are the uses of adversity.<\/div>\n<div class=\"wm-qitem\">12. Dear, gentle, patient, noble Nell was dead.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Subject-word and Simple Subject<\/h3>\n<p>When the Subject consists of several words, there is always one word which is more important than the others. This chief word is called the <strong>Subject-word<\/strong> or <strong>Simple Subject<\/strong>.<\/p>\n<div class=\"wm-rule\">\n<h4>Key Point<\/h4>\n<p>The Subject-word is always a Noun, or a word or group of words that does the work of a Noun.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Examples of Subject-words<\/h4>\n<div class=\"wm-example\">\n                        The little <span class=\"wm-hl\">child<\/span>, tired of play, is sleeping.\n                    <\/div>\n<p><em>Here, \"child\" is the Subject-word.<\/em><\/p>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Enlargement or Attribute<\/h3>\n<p>In the complete Subject, the Subject-word is qualified by an Adjective or Adjective-equivalent called its <strong>Enlargement<\/strong> or <strong>Attribute<\/strong>.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table>\n<thead>\n<tr>\n<th>No.<\/th>\n<th>Subject-word<\/th>\n<th>Attribute<\/th>\n<th>Predicate<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr><td>1<\/td><td>brooms<\/td><td>New<\/td><td>sweep clean<\/td><\/tr>\n<tr><td>2<\/td><td>dogs<\/td><td>Barking<\/td><td>seldom bite<\/td><\/tr>\n<tr><td>3<\/td><td>father<\/td><td>Hari's<\/td><td>is an engineer<\/td><\/tr>\n<tr><td>4<\/td><td>views<\/td><td>My<\/td><td>are quite different<\/td><\/tr>\n<tr><td>5<\/td><td>Firdousi<\/td><td>the poet<\/td><td>wrote the Shah Namah<\/td><\/tr>\n<tr><td>6<\/td><td>desire<\/td><td>(1) A (2) to excel<\/td><td>is commendable<\/td><\/tr>\n<tr><td>7<\/td><td>stitch<\/td><td>(1) A (2) in time<\/td><td>saves nine<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 2: Subject-word and Attributes\n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> Pick out the complete Subject; then separate Subject-word from its Attributes.<\/p>\n<div class=\"wm-qitem\">1. The boy, anxious to learn, worked hard.<\/div>\n<div class=\"wm-qitem\">2. A burnt child dreads the fire.<\/div>\n<div class=\"wm-qitem\">3. Birds of a feather flock together.<\/div>\n<div class=\"wm-qitem\">4. The attempt to scale the fort was an utter failure.<\/div>\n<div class=\"wm-qitem\">5. The days of our youth are the days of our glory.<\/div>\n<div class=\"wm-qitem\">6. Ill habits gather by unseen degrees.<\/div>\n<div class=\"wm-qitem\">7. The dog, seizing the man by the collar, dragged him out.<\/div>\n<div class=\"wm-qitem\">8. The streets of some of our cities are noted for their crookedness.<\/div>\n<div class=\"wm-qitem\">9. A house divided against itself cannot stand.<\/div>\n<div class=\"wm-qitem\">10. Deceived by his friends, he lost all hope.<\/div>\n<div class=\"wm-qitem\">11. The man carrying a hoe is a gardener.<\/div>\n<div class=\"wm-qitem\">12. One man's meat is another man's poison.<\/div>\n<div class=\"wm-qitem\">13. My days among the Dead are past.<\/div>\n<div class=\"wm-qitem\">14. With his white hair unbonneted, the stout old sheriff comes.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Extension or Adverbial Qualification<\/h3>\n<p>Just as the Subject-word may be qualified by an Adjective, the Verb in the Predicate may be qualified by an Adverb or Adverb-equivalent, called its <strong>Extension<\/strong> or <strong>Adverbial Qualification<\/strong>.<\/p>\n<div class=\"wm-example\">\n<h4>Types of Adverbial Qualification<\/h4>\n<ul>\n<li><strong>Adverb:<\/strong> The flames spread <em>everywhere<\/em><\/li>\n<li><strong>Adverbial Accusative:<\/strong> He went <em>home<\/em><\/li>\n<li><strong>Gerundial Infinitive:<\/strong> He rose <em>to go<\/em><\/li>\n<li><strong>Group of words doing work of an Adverb:<\/strong> The flames spread <em>in every direction<\/em><\/li>\n<li><strong>Absolute Phrase:<\/strong> <em>Spring advancing<\/em>, the swallows appear<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 3: Adverbial Qualification\n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> Point out the Adverbial Qualification and identify its type.<\/p>\n<div class=\"wm-qitem\">1. She spoke distinctly.<\/div>\n<div class=\"wm-qitem\">2. He spoke in a distinct voice.<\/div>\n<div class=\"wm-qitem\">3. The boy ran a mile.<\/div>\n<div class=\"wm-qitem\">4. The postman called again.<\/div>\n<div class=\"wm-qitem\">5. He has come to stay.<\/div>\n<div class=\"wm-qitem\">6. Wait a minute.<\/div>\n<div class=\"wm-qitem\">7. The book is printed in clear type.<\/div>\n<div class=\"wm-qitem\">8. I recognized your voice at once.<\/div>\n<div class=\"wm-qitem\">9. Help a lame dog over a stile.<\/div>\n<div class=\"wm-qitem\">10. The tide having turned, the ship set sail.<\/div>\n<div class=\"wm-qitem\">11. He sold his horse below its value.<\/div>\n<div class=\"wm-qitem\">12. He leaves two children behind him.<\/div>\n<div class=\"wm-qitem\">13. He gets his living by trade.<\/div>\n<div class=\"wm-qitem\">14. He made his money by trade.<\/div>\n<div class=\"wm-qitem\">15. The enemy disputed the ground inch by inch.<\/div>\n<div class=\"wm-qitem\">16. He saw a new world spread about him.<\/div>\n<div class=\"wm-qitem\">17. The village life suited him in all respects.<\/div>\n<div class=\"wm-qitem\">18. Him will I follow to the ends of the earth.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Intransitive Verbs and Complements<\/h3>\n<p>Sometimes the Verb is an Intransitive Verb of Incomplete Predication, requiring a Complement to make the Predicate complete.<\/p>\n<div class=\"wm-rule\">\n<h4>Subjective Complement<\/h4>\n<p>The Complement of an Intransitive Verb serves to describe the Subject, and is therefore called a <strong>Subjective Complement<\/strong>.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Examples of Complements<\/h4>\n<div class=\"wm-example\">\n                        The sky grew <span class=\"wm-hl\">dark<\/span>. (Adjective)\n                    <\/div>\n<div class=\"wm-example\">\n                        Venus is <span class=\"wm-hl\">a planet<\/span>. (Noun)\n                    <\/div>\n<div class=\"wm-example\">\n                        It is <span class=\"wm-hl\">me<\/span>. (Pronoun)\n                    <\/div>\n<div class=\"wm-example\">\n                        The man seems <span class=\"wm-hl\">worried<\/span>. (Participle)\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 4: Complements\n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> Pick out the Complement and identify its type.<\/p>\n<div class=\"wm-qitem\">1. John became a soldier.<\/div>\n<div class=\"wm-qitem\">2. Roses smell sweet.<\/div>\n<div class=\"wm-qitem\">3. The child appears pleased.<\/div>\n<div class=\"wm-qitem\">4. The workman seems tired.<\/div>\n<div class=\"wm-qitem\">5. The earth is round.<\/div>\n<div class=\"wm-qitem\">6. He looks happy.<\/div>\n<div class=\"wm-qitem\">7. Sugar tastes sweet.<\/div>\n<div class=\"wm-qitem\">8. The old woman is dead.<\/div>\n<div class=\"wm-qitem\">9. The weather was cold.<\/div>\n<div class=\"wm-qitem\">10. He became unconscious.<\/div>\n<div class=\"wm-qitem\">11. The old gentleman is of a gentle disposition.<\/div>\n<div class=\"wm-qitem\">12. The child is there.<\/div>\n<div class=\"wm-qitem\">13. The children look healthy.<\/div>\n<div class=\"wm-qitem\">14. Today she seems sad.<\/div>\n<div class=\"wm-qitem\">15. The cup is full to the brim.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Transitive Verbs and Objects<\/h3>\n<p>Sometimes the Verb is a Transitive Verb, requiring an Object to complete its sense.<\/p>\n<div class=\"wm-example\">\n<h4>Types of Objects<\/h4>\n<div class=\"wm-example\">\n                        Birds build <span class=\"wm-hl\">nests<\/span>. (Noun)\n                    <\/div>\n<div class=\"wm-example\">\n                        I know <span class=\"wm-hl\">him<\/span>. (Pronoun)\n                    <\/div>\n<div class=\"wm-example\">\n                        All good children pity <span class=\"wm-hl\">the poor<\/span>. (Adjective used as Noun)\n                    <\/div>\n<div class=\"wm-example\">\n                        The Gurkhas love <span class=\"wm-hl\">fighting<\/span>. (Gerund)\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Direct and Indirect Objects<\/h3>\n<p>Some Transitive Verbs take two Objects—a Direct Object and an Indirect Object.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table>\n<thead>\n<tr>\n<th>Subject<\/th>\n<th>Verb<\/th>\n<th>Indirect Object<\/th>\n<th>Direct Object<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr><td>I<\/td><td>promised<\/td><td>him<\/td><td>a present<\/td><\/tr>\n<tr><td>He<\/td><td>teaches<\/td><td>us<\/td><td>Geometry<\/td><\/tr>\n<tr><td>Father<\/td><td>bought<\/td><td>Mini<\/td><td>a doll<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Objective Complement<\/h3>\n<p>Some Transitive Verbs require a Complement in addition to the Object. The Complement refers to the Object and is called an <strong>Objective Complement<\/strong>.<\/p>\n<div class=\"wm-example\">\n<h4>Examples of Objective Complements<\/h4>\n<div class=\"wm-example\">\n                        The boys made Rama <span class=\"wm-hl\">captain<\/span>.\n                    <\/div>\n<div class=\"wm-example\">\n                        The jury found him <span class=\"wm-hl\">guilty<\/span>.\n                    <\/div>\n<div class=\"wm-example\">\n                        His parents named him <span class=\"wm-hl\">Hari<\/span>.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercises 5-7: Objects and Analysis\n<\/h4>\n<div class=\"wm-sub\">\n<h4>Exercise 5: Point out Objects and Attributes<\/h4>\n<div class=\"wm-qitem\">1. The world knows nothing of its greatest men.<\/div>\n<div class=\"wm-qitem\">2. We should learn to govern ourselves.<\/div>\n<div class=\"wm-qitem\">3. Her arms across her breast she laid.<\/div>\n<div class=\"wm-qitem\">4. The architect drew a plan for the house.<\/div>\n<div class=\"wm-qitem\">5. Serpents cast their skin once a year.<\/div>\n<h4>Exercise 6: Objective Complements<\/h4>\n<div class=\"wm-qitem\">1. Abdul called his cousin a fool.<\/div>\n<div class=\"wm-qitem\">2. Exercise has made his muscles strong.<\/div>\n<div class=\"wm-qitem\">3. This will make you happy.<\/div>\n<div class=\"wm-qitem\">4. The Nawab appointed his own brother Vizier.<\/div>\n<div class=\"wm-qitem\">5. The Court appointed him guardian of the orphan child.<\/div>\n<h4>Exercise 7: Complete Analysis<\/h4>\n<div class=\"wm-qitem\">1. A nod from a lord is breakfast for a fool.<\/div>\n<div class=\"wm-qitem\">2. A good paymaster never wants workmen.<\/div>\n<div class=\"wm-qitem\">3. Home they brought her warrior dead.<\/div>\n<div class=\"wm-qitem\">4. Sickness made the child irritable.<\/div>\n<div class=\"wm-qitem\">5. Gentle Evangeline was the pride of the village.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-note\">\n<strong>📌 Review of Predicate Forms:<\/strong>\n<ol>\n<li>Intransitive Verb alone<\/li>\n<li>Intransitive Verb + Complement<\/li>\n<li>Transitive Verb + Object<\/li>\n<li>Transitive Verb + Indirect Object + Direct Object<\/li>\n<li>Transitive Verb + Object + Complement<\/li>\n<\/ol>\n<\/div>", "src": ["1-22"], "desc": "A Sentence is a set or group of words which makes complete sense.", "n": 27, "ex": 5, "items": 74, "ans": 0, "words": 1207, "cn": 1}, {"part": 2, "title": "Phrases", "html": "<div class=\"wm-rule\">\n<h4>What is a Phrase?<\/h4>\n<p>A <strong>Phrase<\/strong> is a group of words that does the work of a single part of speech. There are three main types: Adjective Phrases, Adverb Phrases, and Noun Phrases.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h3>I. Adjective Phrases<\/h3>\n<p>An <strong>Adjective Phrase<\/strong> is a group of words that does the work of an Adjective.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Single Adjective<\/h4>\n<p>The vizier was a <strong>wealthy<\/strong> man.<\/p>\n<p>The magistrate was a <strong>kind<\/strong> man.<\/p>\n<p>The chief lived in a <strong>stone<\/strong> house.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Adjective Phrase<\/h4>\n<p>The vizier was a man <span class=\"wm-hl\">of great wealth<\/span>.<\/p>\n<p>The magistrate was a man <span class=\"wm-hl\">with a kindly nature<\/span>.<\/p>\n<p>The chief lived in a house <span class=\"wm-hl\">built of stone<\/span>.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Adjectives vs Adjective Phrases<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table>\n<thead>\n<tr>\n<th>Adjectives<\/th>\n<th>Adjective Phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr><td>A golden crown<\/td><td>A crown made of gold<\/td><\/tr>\n<tr><td>A purple cloak<\/td><td>A cloak of purple colour<\/td><\/tr>\n<tr><td>A white elephant<\/td><td>An elephant with a white skin<\/td><\/tr>\n<tr><td>A jungle track<\/td><td>A track through the jungle<\/td><\/tr>\n<tr><td>A blue-eyed boy<\/td><td>A boy with blue eyes<\/td><\/tr>\n<tr><td>A deserted village<\/td><td>A village without any inhabitants<\/td><\/tr>\n<tr><td>The Spanish flag<\/td><td>The flag of Spain<\/td><\/tr>\n<tr><td>A heavy load<\/td><td>A load of great weight<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 8: Pick out Adjective Phrases\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-qitem\">1. A man in great difficulties came to me for help.<\/div>\n<div class=\"wm-qitem\">2. He is a person of very considerable renown.<\/div>\n<div class=\"wm-qitem\">3. Wild beasts in small cages are a sorry sight.<\/div>\n<div class=\"wm-qitem\">4. A man without an enemy is a man with few friends.<\/div>\n<div class=\"wm-qitem\">5. He tells a tale with the ring of truth in it.<\/div>\n<div class=\"wm-qitem\">6. A friend in need is a friend indeed.<\/div>\n<div class=\"wm-qitem\">7. A stitch in time saves nine.<\/div>\n<div class=\"wm-qitem\">8. A bird in the hand is worth two in the bush.<\/div>\n<div class=\"wm-qitem\">9. Gardens with cool shady trees surround the village.<\/div>\n<div class=\"wm-qitem\">10. Only a man with plenty of money buys a car of such beauty and power.<\/div>\n<div class=\"wm-qitem\">11. In a low voice he told the tale of his cruel wrongs.<\/div>\n<div class=\"wm-qitem\">12. Do you know the story of the noble Padmini?<\/div>\n<div class=\"wm-qitem\">13. He was a lad of great promise.<\/div>\n<div class=\"wm-qitem\">14. He bore a banner with a strange device.<\/div>\n<div class=\"wm-qitem\">15. The police arrested a man of one of the criminal tribes.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercises 9-11: Transform Adjectives and Phrases\n<\/h4>\n<div class=\"wm-sub\">\n<h4>Exercise 9: Replace Adjectives with Adjective Phrases<\/h4>\n<div class=\"wm-qitem\">1. A <em>grey<\/em> cloud spread over the sky.<\/div>\n<div class=\"wm-qitem\">2. He dwelt in a <em>wooden<\/em> hut.<\/div>\n<div class=\"wm-qitem\">3. He had a <em>bald<\/em> head.<\/div>\n<div class=\"wm-qitem\">4. She wore a <em>diamond<\/em> necklace.<\/div>\n<div class=\"wm-qitem\">5. It was a <em>horrible<\/em> night.<\/div>\n<h4>Exercise 10: Replace Adjective Phrases with Adjectives<\/h4>\n<div class=\"wm-qitem\">1. He wore a turban <em>made of silk<\/em>.<\/div>\n<div class=\"wm-qitem\">2. He has done a deed <em>of shame<\/em>.<\/div>\n<div class=\"wm-qitem\">3. He led a life <em>devoid of blame<\/em>.<\/div>\n<div class=\"wm-qitem\">4. He is a man <em>without a friend<\/em>.<\/div>\n<div class=\"wm-qitem\">5. They came to a path <em>covered with mud<\/em>.<\/div>\n<h4>Exercise 11: Fill in the blanks with Adjective Phrases<\/h4>\n<div class=\"wm-qitem\">1. An elephant ____ is considered sacred by some people.<\/div>\n<div class=\"wm-qitem\">2. Birds ____ flock together.<\/div>\n<div class=\"wm-qitem\">3. He leads a life ____.<\/div>\n<div class=\"wm-qitem\">4. Children like books ____.<\/div>\n<div class=\"wm-qitem\">5. He lost a diamond ____.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>II. Adverb Phrases<\/h3>\n<p>An <strong>Adverb Phrase<\/strong> is a group of words that does the work of an Adverb.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Single Adverb<\/h4>\n<p>Rama ran <strong>quickly<\/strong>. (How?)<\/p>\n<p>He answered <strong>rudely<\/strong>. (How?)<\/p>\n<p>He is coming <strong>now<\/strong>. (When?)<\/p>\n<p>The arrow fell <strong>here<\/strong>. (Where?)<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Adverb Phrase<\/h4>\n<p>Rama ran <span class=\"wm-hl\">with great speed<\/span>. (How?)<\/p>\n<p>He answered <span class=\"wm-hl\">in a very rude manner<\/span>. (How?)<\/p>\n<p>He is coming <span class=\"wm-hl\">at this very moment<\/span>. (When?)<\/p>\n<p>The arrow fell <span class=\"wm-hl\">on this spot<\/span>. (Where?)<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Adverbs vs Adverb Phrases<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table>\n<thead>\n<tr>\n<th>Adverbs<\/th>\n<th>Adverb Phrases<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr><td>Bravely<\/td><td>In a brave manner, or with bravery<\/td><\/tr>\n<tr><td>Unwisely<\/td><td>In an unwise manner, or without wisdom<\/td><\/tr>\n<tr><td>Swiftly<\/td><td>In a swift manner, or with swiftness<\/td><\/tr>\n<tr><td>Beautifully<\/td><td>In a beautiful style<\/td><\/tr>\n<tr><td>Formerly<\/td><td>In former times, or once upon a time<\/td><\/tr>\n<tr><td>Recently<\/td><td>Just now, or at a recent date<\/td><\/tr>\n<tr><td>Soon<\/td><td>Before very long, or at an early date<\/td><\/tr>\n<tr><td>There<\/td><td>At that place<\/td><\/tr>\n<tr><td>Away<\/td><td>To another place<\/td><\/tr>\n<tr><td>Abroad<\/td><td>To (in) a foreign country<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 13: Pick out Adverb Phrases\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-qitem\">1. She lived in the middle of a great wood.<\/div>\n<div class=\"wm-qitem\">2. Nothing can live on the moon.<\/div>\n<div class=\"wm-qitem\">3. Come into the garden, Maud.<\/div>\n<div class=\"wm-qitem\">4. Three fishers went sailing over the sea.<\/div>\n<div class=\"wm-qitem\">5. O'er her hangs the great dark bell.<\/div>\n<div class=\"wm-qitem\">6. Down in a green and shady bed, a modest violet grew.<\/div>\n<div class=\"wm-qitem\">7. On your conscience this will lie.<\/div>\n<div class=\"wm-qitem\">8. They sat for a while on the bank.<\/div>\n<div class=\"wm-qitem\">9. Honesty is written on his face.<\/div>\n<div class=\"wm-qitem\">10. The gun went off with a loud report.<\/div>\n<div class=\"wm-qitem\">11. There dwelt a miller hale and bold, beside the river Dee.<\/div>\n<div class=\"wm-qitem\">12. I stood on the bridge at midnight.<\/div>\n<div class=\"wm-qitem\">13. To the northward stretched the desert.<\/div>\n<div class=\"wm-qitem\">14. Beside a green meadow a stream used to flow.<\/div>\n<div class=\"wm-qitem\">15. I have read Bacon to my great profit.<\/div>\n<div class=\"wm-qitem\">16. In her ear he whispers gaily.<\/div>\n<div class=\"wm-qitem\">17. Beside the ungathered rice he lay.<\/div>\n<div class=\"wm-qitem\">18. They fought to the last man.<\/div>\n<div class=\"wm-qitem\">19. He persevered in the face of all obstacles.<\/div>\n<div class=\"wm-qitem\">20. The shoe is pressing on my toe.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercises 14-16: Transform Adverbs and Phrases\n<\/h4>\n<div class=\"wm-sub\">\n<h4>Exercise 14: Replace Adverbs with Adverb Phrases<\/h4>\n<div class=\"wm-qitem\">1. The pigeon flies <em>swiftly<\/em>.<\/div>\n<div class=\"wm-qitem\">2. Did Rama behave <em>well<\/em>?<\/div>\n<div class=\"wm-qitem\">3. Go <em>away<\/em>.<\/div>\n<div class=\"wm-qitem\">4. The dying man replied <em>feebly<\/em>.<\/div>\n<div class=\"wm-qitem\">5. <em>Gently<\/em> fell the rain.<\/div>\n<h4>Exercise 15: Replace Adverb Phrases with Adverbs<\/h4>\n<div class=\"wm-qitem\">1. The bodies were mangled <em>in a terrible manner<\/em>.<\/div>\n<div class=\"wm-qitem\">2. Let us cease work <em>from this very moment<\/em>.<\/div>\n<div class=\"wm-qitem\">3. It was just <em>on this spot<\/em> that he died.<\/div>\n<div class=\"wm-qitem\">4. The child replied <em>with perfect truthfulness<\/em>.<\/div>\n<div class=\"wm-qitem\">5. He arrived <em>at that moment<\/em>.<\/div>\n<h4>Exercise 16: Fill in the blanks with Adverb Phrases<\/h4>\n<div class=\"wm-qitem\">1. The knight fought ____.<\/div>\n<div class=\"wm-qitem\">2. The Rajah treated his vizier ____.<\/div>\n<div class=\"wm-qitem\">3. The woodman struck the wolf ____.<\/div>\n<div class=\"wm-qitem\">4. Do not answer ____.<\/div>\n<div class=\"wm-qitem\">5. I agree ____.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-note\">\n<strong>📌 Important Note:<\/strong> The same phrase may be an Adjective Phrase in one sentence and an Adverb Phrase in another, depending on what it modifies.\n                    <br/><br/>\n                    Example:\n                    <br/>• \"The crowd <em>in the bazaar<\/em> was very noisy.\" (Adjective Phrase - describes crowd)\n                    <br/>• \"The crowd halted <em>in the bazaar<\/em>.\" (Adverb Phrase - tells where they halted)\n                <\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>III. Noun Phrases<\/h3>\n<p>A <strong>Noun Phrase<\/strong> is a group of words that does the work of a Noun.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Single Noun<\/h4>\n<p>The boy wants <strong>something<\/strong>.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Noun Phrase<\/h4>\n<p>The boy wants <span class=\"wm-hl\">to go home<\/span>.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Examples of Noun Phrases<\/h4>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">Early to bed<\/span> is a good maxim. (Subject)\n                    <\/div>\n<div class=\"wm-example\">\n                        He hopes <span class=\"wm-hl\">to win the first prize<\/span>. (Object)\n                    <\/div>\n<div class=\"wm-example\">\n                        We enjoy <span class=\"wm-hl\">playing cricket<\/span>. (Object)\n                    <\/div>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">To win a prize<\/span> is my ambition. (Subject)\n                    <\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercises 20-22: Noun Phrases\n<\/h4>\n<div class=\"wm-sub\">\n<h4>Exercise 20: Pick out the Noun Phrases<\/h4>\n<div class=\"wm-qitem\">1. His father wished to speak to the Headmaster.<\/div>\n<div class=\"wm-qitem\">2. The wicked vizier loves getting people into trouble.<\/div>\n<div class=\"wm-qitem\">3. The poor debtor intended to pay back every penny of the money.<\/div>\n<div class=\"wm-qitem\">4. He dislikes having to punish his servants.<\/div>\n<div class=\"wm-qitem\">5. Horses prefer living in dark stables.<\/div>\n<div class=\"wm-qitem\">6. I should hate to do such a thing.<\/div>\n<div class=\"wm-qitem\">7. Have you ever tried climbing a coconut palm?<\/div>\n<div class=\"wm-qitem\">8. Thinking good thoughts precedes good actions.<\/div>\n<div class=\"wm-qitem\">9. He refuses to answer the question.<\/div>\n<div class=\"wm-qitem\">10. To write such rubbish is disgraceful.<\/div>\n<h4>Exercise 21: Supply a Noun Phrase<\/h4>\n<div class=\"wm-qitem\">1. I want ____.<\/div>\n<div class=\"wm-qitem\">2. ____ delights me.<\/div>\n<div class=\"wm-qitem\">3. We all hope ____.<\/div>\n<div class=\"wm-qitem\">4. Pretend ____.<\/div>\n<div class=\"wm-qitem\">5. ____ seems dishonest.<\/div>\n<h4>Exercise 22: Identify Phrase Types<\/h4>\n<div class=\"wm-qitem\">1. He speaks like a born orator.<\/div>\n<div class=\"wm-qitem\">2. It grieved me to hear of your illness.<\/div>\n<div class=\"wm-qitem\">3. Beyond a doubt this man is honest.<\/div>\n<div class=\"wm-qitem\">4. He failed in spite of his best efforts.<\/div>\n<div class=\"wm-qitem\">5. He won the prize by means of trickery.<\/div>\n<div class=\"wm-qitem\">6. Do not talk like that.<\/div>\n<div class=\"wm-qitem\">7. I have forgotten how to play this game.<\/div>\n<div class=\"wm-qitem\">8. He gained their affection in spite of many faults.<\/div>\n<div class=\"wm-qitem\">9. I do not expect such treatment at your hands.<\/div>\n<div class=\"wm-qitem\">10. He speaks too fast to be understood.<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["1-22"], "desc": "A Phrase is a group of words that does the work of a single part of speech.", "n": 28, "ex": 5, "items": 90, "ans": 0, "words": 1271, "cn": 2}, {"part": 2, "title": "Clauses", "html": "<div class=\"wm-rule\">\n<h4>What is a Clause?<\/h4>\n<p>A <strong>Clause<\/strong> is a group of words that forms part of a sentence, and has a Subject and a Predicate of its own. Unlike a Phrase, it is like a sentence but is part of a sentence.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h3>I. Adverb Clauses<\/h3>\n<p>An <strong>Adverb Clause<\/strong> is a group of words which contains a Subject and a Predicate of its own, and does the work of an Adverb.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Adverb Phrase<\/h4>\n<p>They rested <strong>at sunset<\/strong>.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Adverb Clause<\/h4>\n<p>They rested <span class=\"wm-hl\">when evening came<\/span>.<\/p>\n<small>Subject: evening, Predicate: came when<\/small>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 23: Pick out Adverb Clauses\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-qitem\">1. You may sit wherever you like.<\/div>\n<div class=\"wm-qitem\">2. He fled where his pursuers could not follow.<\/div>\n<div class=\"wm-qitem\">3. He behaves as one might expect him to do.<\/div>\n<div class=\"wm-qitem\">4. Because you have done this I shall punish you.<\/div>\n<div class=\"wm-qitem\">5. As he was not there, I spoke to his brother.<\/div>\n<div class=\"wm-qitem\">6. If you eat too much you will be ill.<\/div>\n<div class=\"wm-qitem\">7. He finished first though he began late.<\/div>\n<div class=\"wm-qitem\">8. Will you wait till I return?<\/div>\n<div class=\"wm-qitem\">9. Just as he entered the room the clock struck.<\/div>\n<div class=\"wm-qitem\">10. They went where living was cheaper.<\/div>\n<div class=\"wm-qitem\">11. He does not always speak as he thinks.<\/div>\n<div class=\"wm-qitem\">12. Take a lamp because the night is dark.<\/div>\n<div class=\"wm-qitem\">13. I do it because I choose to.<\/div>\n<div class=\"wm-qitem\">14. If I make a promise I keep it.<\/div>\n<div class=\"wm-qitem\">15. You will pass if you work hard.<\/div>\n<div class=\"wm-qitem\">16. He advanced as far as he dared.<\/div>\n<div class=\"wm-qitem\">17. I forgive you since you repent.<\/div>\n<div class=\"wm-qitem\">18. I shall remain where I am.<\/div>\n<div class=\"wm-qitem\">19. We shall wait here until you come.<\/div>\n<div class=\"wm-qitem\">20. When I was younger, I thought so.<\/div>\n<div class=\"wm-qitem\">21. It was so dark that you could not see your hand.<\/div>\n<div class=\"wm-qitem\">22. Wherever one goes, one hears the same story.<\/div>\n<div class=\"wm-qitem\">23. If you do not hurry you will miss the train.<\/div>\n<div class=\"wm-qitem\">24. Since you have already decided, why do you ask my opinion?<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercises 24-26: Adverb Clause Transformations\n<\/h4>\n<div class=\"wm-sub\">\n<h4>Exercise 24: Supply suitable Adverb Clauses<\/h4>\n<div class=\"wm-qitem\">1. Do not go ____.<\/div>\n<div class=\"wm-qitem\">2. He is not so clever ____.<\/div>\n<div class=\"wm-qitem\">3. I was so hurried ____.<\/div>\n<div class=\"wm-qitem\">4. He ran so fast ____.<\/div>\n<div class=\"wm-qitem\">5. He always does ____.<\/div>\n<h4>Exercise 25: Replace Adverb Phrases with Adverb Clauses<\/h4>\n<div class=\"wm-qitem\">1. <em>On his return<\/em> we asked him many questions.<\/div>\n<div class=\"wm-qitem\">2. Do it <em>to the best of your ability<\/em>.<\/div>\n<div class=\"wm-qitem\">3. The prince was met <em>on his arrival<\/em> by his secretary.<\/div>\n<div class=\"wm-qitem\">4. <em>In spite of poverty<\/em> he became distinguished.<\/div>\n<div class=\"wm-qitem\">5. <em>Upon seeing the signal<\/em> the troops set out.<\/div>\n<h4>Exercise 26: Replace Adverb Clauses with Adverbs or Phrases<\/h4>\n<div class=\"wm-qitem\">1. I have not been well <em>since I returned from Chennai<\/em>.<\/div>\n<div class=\"wm-qitem\">2. <em>When the sun set<\/em> he returned home.<\/div>\n<div class=\"wm-qitem\">3. They fought <em>as heroes do<\/em>.<\/div>\n<div class=\"wm-qitem\">4. <em>When the righteous rule<\/em>, the people rejoice.<\/div>\n<div class=\"wm-qitem\">5. <em>Though I am poor<\/em>, yet am I contented.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>II. Adjective Clauses<\/h3>\n<p>An <strong>Adjective Clause<\/strong> is a group of words which contains a Subject and a Predicate of its own, and does the work of an Adjective.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Adjective Phrase<\/h4>\n<p>The umbrella <strong>with a broken handle<\/strong> is mine.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Adjective Clause<\/h4>\n<p>The umbrella <span class=\"wm-hl\">which has a broken handle<\/span> is mine.<\/p>\n<small>Subject: which, Predicate: has a broken handle<\/small>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 27: Pick out Adjective Clauses\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-qitem\">1. Mary had a little lamb whose fleece was white as snow.<\/div>\n<div class=\"wm-qitem\">2. The letter brought money which was badly needed.<\/div>\n<div class=\"wm-qitem\">3. The house that I live in belongs to my father.<\/div>\n<div class=\"wm-qitem\">4. I am monarch of all I survey.<\/div>\n<div class=\"wm-qitem\">5. I have a little shadow which goes in and out with me.<\/div>\n<div class=\"wm-qitem\">6. The dog that bites does not bark.<\/div>\n<div class=\"wm-qitem\">7. He tells a tale that sounds untrue.<\/div>\n<div class=\"wm-qitem\">8. It's an ill wind that blows nobody any good.<\/div>\n<div class=\"wm-qitem\">9. The boy stood on the burning deck whence all but he had fled.<\/div>\n<div class=\"wm-qitem\">10. They never fail who die in a great cause.<\/div>\n<div class=\"wm-qitem\">11. I remember the house where I was born.<\/div>\n<div class=\"wm-qitem\">12. He that climbs too high is sure to fall.<\/div>\n<div class=\"wm-qitem\">13. Here is the book you want.<\/div>\n<div class=\"wm-qitem\">14. Heaven helps those who help themselves.<\/div>\n<div class=\"wm-qitem\">15. He died in the village where he was born.<\/div>\n<div class=\"wm-qitem\">16. He never does anything that is silly.<\/div>\n<div class=\"wm-qitem\">17. People who live in glass houses should not throw stones.<\/div>\n<div class=\"wm-qitem\">18. It is a long lane that has no turning.<\/div>\n<div class=\"wm-qitem\">19. He laughs best who laughs last.<\/div>\n<div class=\"wm-qitem\">20. Thrice is he armed that hath his quarrel just.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercises 28-30: Adjective Clause Transformations\n<\/h4>\n<div class=\"wm-sub\">\n<h4>Exercise 28: Supply suitable Adjective Clauses<\/h4>\n<div class=\"wm-qitem\">1. I know the place ____.<\/div>\n<div class=\"wm-qitem\">2. He is the man ____.<\/div>\n<div class=\"wm-qitem\">3. The house ____ is a hundred years old.<\/div>\n<div class=\"wm-qitem\">4. His offence is one ____.<\/div>\n<div class=\"wm-qitem\">5. Where is the book ____?<\/div>\n<h4>Exercise 29: Replace Adjective Phrases with Adjective Clauses<\/h4>\n<div class=\"wm-qitem\">1. A man <em>of industrious habits<\/em> is sure to succeed.<\/div>\n<div class=\"wm-qitem\">2. He told us the time <em>of his arrival<\/em>.<\/div>\n<div class=\"wm-qitem\">3. The time <em>for departing<\/em> has now arrived.<\/div>\n<div class=\"wm-qitem\">4. Do you know the road <em>leading to the temple<\/em>?<\/div>\n<div class=\"wm-qitem\">5. I have a box, <em>filled with almonds<\/em>.<\/div>\n<h4>Exercise 30: Replace Adjective Clauses with Adjectives or Phrases<\/h4>\n<div class=\"wm-qitem\">1. Do you know the woman <em>who is wearing a blue sari<\/em>?<\/div>\n<div class=\"wm-qitem\">2. The boy <em>who sits near me<\/em> is my cousin.<\/div>\n<div class=\"wm-qitem\">3. That was the reason <em>why he came late<\/em>.<\/div>\n<div class=\"wm-qitem\">4. The reason <em>why he failed<\/em> is obvious.<\/div>\n<div class=\"wm-qitem\">5. The workers, <em>who were weary with their exertions<\/em>, lay down to rest.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>III. Noun Clauses<\/h3>\n<p>A <strong>Noun Clause<\/strong> is a group of words which contains a Subject and a Predicate of its own, and does the work of a Noun.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Noun Phrase<\/h4>\n<p>I expect <strong>to get a prize<\/strong>.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Noun Clause<\/h4>\n<p>I expect <span class=\"wm-hl\">that I shall get a prize<\/span>.<\/p>\n<small>Subject: I, Predicate: shall get a prize<\/small>\n<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Functions of Noun Clauses<\/h4>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">That you have come<\/span> pleases me. (Subject)\n                    <\/div>\n<div class=\"wm-example\">\n                        I expect <span class=\"wm-hl\">that I shall get a prize<\/span>. (Object)\n                    <\/div>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">Where we were to lodge that night<\/span> was the problem. (Subject)\n                    <\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercise 31: Point out Noun Clauses\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-qitem\">1. I often wonder how you are getting on.<\/div>\n<div class=\"wm-qitem\">2. I fear that I shall fail.<\/div>\n<div class=\"wm-qitem\">3. He replied that he would come.<\/div>\n<div class=\"wm-qitem\">4. Do you deny that you stole the watch?<\/div>\n<div class=\"wm-qitem\">5. I thought that it would be a fine day.<\/div>\n<div class=\"wm-qitem\">6. That you should cheat me hurts me.<\/div>\n<div class=\"wm-qitem\">7. No one knows who he is.<\/div>\n<div class=\"wm-qitem\">8. He saw that the clock had stopped.<\/div>\n<div class=\"wm-qitem\">9. That you should say this is very strange.<\/div>\n<div class=\"wm-qitem\">10. I don't see how you can get out of this mess.<\/div>\n<div class=\"wm-qitem\">11. I earn whatever I can.<\/div>\n<div class=\"wm-qitem\">12. I do not know what he wants.<\/div>\n<div class=\"wm-qitem\">13. There were no complaints except that the day was too hot.<\/div>\n<div class=\"wm-qitem\">14. I went to see what had happened.<\/div>\n<div class=\"wm-qitem\">15. I do not understand how it all happened.<\/div>\n<div class=\"wm-qitem\">16. Pay careful attention to what I am going to say.<\/div>\n<div class=\"wm-qitem\">17. It grieved me to hear that she was ill.<\/div>\n<div class=\"wm-qitem\">18. I want to know how far it is from here.<\/div>\n<div class=\"wm-qitem\">19. Where we were to lodge that night was the problem.<\/div>\n<div class=\"wm-qitem\">20. He begged that his life might be spared.<\/div>\n<div class=\"wm-qitem\">21. I think you have made a mistake.<\/div>\n<div class=\"wm-qitem\">22. Can you guess what I want?<\/div>\n<div class=\"wm-qitem\">23. How the burglar got in is a mystery!<\/div>\n<div class=\"wm-qitem\">24. It is uncertain whether he will come.<\/div>\n<div class=\"wm-qitem\">25. I do not know what he will do.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercises 32-34: Noun Clause Transformations\n<\/h4>\n<div class=\"wm-sub\">\n<h4>Exercise 32: Complete with suitable Noun Clauses<\/h4>\n<div class=\"wm-qitem\">1. I cannot understand ____.<\/div>\n<div class=\"wm-qitem\">2. They all said ____.<\/div>\n<div class=\"wm-qitem\">3. I think ____.<\/div>\n<div class=\"wm-qitem\">4. This is just ____.<\/div>\n<div class=\"wm-qitem\">5. He told me ____.<\/div>\n<h4>Exercise 33: Replace words with Noun Clauses<\/h4>\n<div class=\"wm-qitem\">1. The time <em>of his coming<\/em> no one can guess.<\/div>\n<div class=\"wm-qitem\">2. I heard <em>of his success<\/em>.<\/div>\n<div class=\"wm-qitem\">3. The reason <em>of his failure<\/em> will never be known.<\/div>\n<div class=\"wm-qitem\">4. I predict <em>a change in the weather<\/em>.<\/div>\n<div class=\"wm-qitem\">5. The jury believed <em>the man guilty<\/em>.<\/div>\n<h4>Exercise 34: Replace Noun Clauses with Nouns or Phrases<\/h4>\n<div class=\"wm-qitem\">1. I hope <em>that I shall be there in time<\/em>.<\/div>\n<div class=\"wm-qitem\">2. He is sure <em>that we will win the match<\/em>.<\/div>\n<div class=\"wm-qitem\">3. I remarked <em>that it was a fine day<\/em>.<\/div>\n<div class=\"wm-qitem\">4. They do not know <em>where he is concealed<\/em>.<\/div>\n<div class=\"wm-qitem\">5. The police must know <em>where he is living<\/em>.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-note\">\n<strong>📌 Three Kinds of Clauses:<\/strong>\n<ol>\n<li><strong>Adverb Clauses<\/strong> - do the work of Adverbs<\/li>\n<li><strong>Adjective Clauses<\/strong> - do the work of Adjectives<\/li>\n<li><strong>Noun Clauses<\/strong> - do the work of Nouns<\/li>\n<\/ol>\n<br/>\n<strong>Important:<\/strong> The same clause may function differently in different sentences. Always examine the work it does in the specific sentence.\n            <\/div>\n<div class=\"wm-exercise\">\n<h4>\n Exercises 35-36: Comprehensive Clause Analysis\n<\/h4>\n<div class=\"wm-sub\">\n<h4>Exercise 35: Identify clause types and connections<\/h4>\n<div class=\"wm-qitem\">1. Come when you like.<\/div>\n<div class=\"wm-qitem\">2. I know the man who is here.<\/div>\n<div class=\"wm-qitem\">3. He says that he met your brother.<\/div>\n<d
