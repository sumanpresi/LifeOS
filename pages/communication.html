  plan:[["0–5 min","Read the assignment conversation. Ask what was actually wrong with Anaya's work."],["5–10 min","Intruder hunt with the library paragraph on the board."],["10–15 min","Teach topic sentence, support, conclusion using the pattern cards."],["15–20 min","Order and linking words. Students re-order a scrambled paragraph."],["20–26 min","Practice Levels 1–4, then the spoken paragraph activity."],["26–30 min","Set the written paragraph; explain the read-aloud-and-cut task."]]
}
}

];
</script>
<script>
/* =========================================================
   APPLICATION LAYER
   Nothing below knows about any particular lesson.
   ========================================================= */

/* ---------- storage: works inside the app, in a browser, or offline ---------- */
const Store = (() => {
  const mem = {};
  const api = (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") ? window.storage : null;
  async function get(k){
    if (api) { try { const r = await api.get(k, false); return r ? JSON.parse(r.value) : null; } catch(e) { /* falls through */ } }
    try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e) { return mem[k] ?? null; }
  }
  async function set(k, v){
    if (api) { try { await api.set(k, JSON.stringify(v), false); return; } catch(e) { /* falls through */ } }
    try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) { mem[k] = v; }
  }
  return { get, set };
})();

const KEY = "class8english.v1";
const STEPS = [
  {id:"learn",    label:"Learn"},
  {id:"practise", label:"Practise"},
  {id:"speak",    label:"Speak"},
  {id:"write",    label:"Write"},
  {id:"test",     label:"Test"},
  {id:"review",   label:"Review"}
];

let S = {
  mode:"student",
  view:"today",
  lessonId:null,
  step:"learn",
  progress:{},   // lessonId -> { steps:{}, practice:{}, test:{}, writes:{}, speak:{} }
  errors:{},     // category -> {wrong, total}
  mistakes:[],   // mistake notebook: {topic, q, mine, right, why, lesson, at}
  schedule:{},   // lessonId -> [{due, label, done}] spaced revision
  reviewTarget:null
};

/* spaced revision: a lesson comes back four times after it is first tested */
const REVIEW_STEPS = [
  {d:0, label:"Today"}, {d:1, label:"Tomorrow"},
  {d:3, label:"After 3 days"}, {d:7, label:"After 7 days"}
];

let saveTimer = null;
/* ---------- persistence ----------

   Inside LifeOS this page is not the owner of its data: `state.communication`
   is, and it reaches Supabase through persist() like every other module. So
   a save posts the durable half of S up to the parent and lets the bridge
   merge it; localStorage is written too, but only as a local cache so the
   page still shows something before the parent's first reply.

   Opened on its own — straight from the file, or outside the app — there is
   no parent to talk to and localStorage is all there is. That path is
   unchanged, which is why the postMessage is a best-effort extra rather
   than a replacement. */
const inLifeOS = (function(){ try { return window.parent && window.parent !== window; } catch(e) { return false; } })();

/* Only the durable half travels. Which lesson is open, which step is
   showing and the Student/Teacher toggle are this device's view state —
   syncing them would move the phone to whatever lesson the desk is on. */
function durable(){
  return { progress: S.progress, errors: S.errors, mistakes: S.mistakes, schedule: S.schedule };
}
function pushToLifeOS(){
  if(!inLifeOS) return;
  try { window.parent.postMessage({ type:"lifeos:comm:save", data: durable() }, "*"); } catch(e){}
}
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ Store.set(KEY, S); pushToLifeOS(); }, 200);
}

/* The parent hands over the merged, cloud-backed copy: on first load, and
   again whenever a sync brings in work done on another device. Adopted
   without re-saving, or every device would echo back what it was just
   given. View state is left exactly as it is. */
function adoptFromLifeOS(data){
  if(!data || typeof data !== "object") return;
  S.progress = (data.progress && typeof data.progress === "object") ? data.progress : {};
  S.errors   = (data.errors   && typeof data.errors   === "object") ? data.errors   : {};
  S.schedule = (data.schedule && typeof data.schedule === "object") ? data.schedule : {};
  S.mistakes = Array.isArray(data.mistakes) ? data.mistakes : [];
  Store.set(KEY, S);          // refresh the local cache, don't post back
  if(booted) render();
}
let booted = false;
if(inLifeOS){
  window.addEventListener("message", e => {
    const m = e.data || {};
    if(m.type === "lifeos:comm:init") adoptFromLifeOS(m.data);
  });
}

/* ---------- helpers ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function node(html){
  const t = document.createElement("template"); t.innerHTML = html.trim();
  if(t.content.children.length > 1){        // keep every sibling instead of silently dropping it
    const w = document.createElement("div"); w.appendChild(t.content); return w;
  }
  return t.content.firstElementChild;
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function norm(s){
  const v = String(s).toLowerCase()
    .replace(/[’‘]/g,"'").replace(/[“”]/g,'"')
    .replace(/\s+/g," ").trim();
  const stripped = v.replace(/[.,!?;:]+$/,"").trim();
  return stripped.length ? stripped : v;   // a lone "?" is a valid answer
}
function normLoose(s){   // word-order answers carry internal commas the chips cannot supply
  return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"]/g,"").replace(/\s+/g," ").trim();
}
function lessonById(id){ return LESSONS.find(l => l.id === id); }
function prog(id){
  if(!S.progress[id]) S.progress[id] = { steps:{}, practice:{}, test:null, writes:{}, speak:{} };
  return S.progress[id];
}
function stepDone(id, step){ return !!prog(id).steps[step]; }
function markStep(id, step){ const p = prog(id); if(!p.steps[step]){ p.steps[step] = true; save(); } }
function lessonPct(id){
  const p = prog(id);
  return Math.round(STEPS.filter(s => p.steps[s.id]).length / STEPS.length * 100);
}
function lessonDone(id){ return lessonPct(id) === 100; }
function coursePct(){
  if(!LESSONS.length) return 0;
  return Math.round(LESSONS.reduce((a,l)=>a+lessonPct(l.id),0) / LESSONS.length);
}
function logResult(cat, ok){
  if(!cat) return;
  if(!S.errors[cat]) S.errors[cat] = {wrong:0, total:0};
  S.errors[cat].total++;
  if(!ok) S.errors[cat].wrong++;
  save();
}
function weakAreas(){
  return Object.entries(S.errors)
    .filter(([,v]) => v.wrong > 0)
    .map(([k,v]) => ({cat:k, wrong:v.wrong, total:v.total, rate:v.wrong/v.total}))
    .sort((a,b) => b.wrong - a.wrong || b.rate - a.rate);
}
function lessonsForCategory(cat){
  return LESSONS.filter(l =>
    (l.practice||[]).concat(l.test||[]).some(q => q.cat === cat) ||
    (l.mistakes||[]).some(m => m.cat === cat));
}

/* ---------- speaking aloud ---------- */
const CAN_SPEAK = typeof window !== "undefined" && "speechSynthesis" in window;
function sayAloud(text){
  if(!CAN_SPEAK){ toast("This browser cannot read text aloud"); return; }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/<[^>]+>/g,""));
    u.lang = "en-IN"; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }catch(e){ toast("This browser cannot read text aloud"); }
}
function listenBtn(text, label){
  if(!CAN_SPEAK) return null;
  const b = node(`<button class="listen" aria-label="Listen to this sentence">🔊 ${label||"Listen"}</button>`);
  b.onclick = () => sayAloud(text);
  return b;
}

/* ---------- mistake notebook ---------- */
function addMistake(m){
  if(!m || !m.mine || !m.right) return;
  if(norm(m.mine) === norm(m.right)) return;
  S.mistakes.unshift(Object.assign({at:Date.now()}, m));
  S.mistakes = S.mistakes.slice(0, 120);
  save();
}
function mistakesByTopic(){
  const g = {};
  S.mistakes.forEach(m => { const k = m.topic || "Other"; (g[k] = g[k] || []).push(m); });
  return Object.entries(g).sort((a,b) => b[1].length - a[1].length);
}

/* ---------- spaced revision ---------- */
function scheduleReviews(id){
  const now = Date.now();
  S.schedule[id] = REVIEW_STEPS.map(r => ({due: now + r.d*86400000, label:r.label, done:false}));
  save();
}
function dueReviews(){
  const out = [];
  Object.keys(S.schedule || {}).forEach(id => {
    if(!lessonById(id)) return;
    S.schedule[id].forEach((r, i) => { if(!r.done && r.due <= Date.now()) out.push({id, i, label:r.label, due:r.due}); });
  });
  return out.sort((a,b) => a.due - b.due);
}
function nextReview(id){
  const arr = S.schedule[id]; if(!arr) return null;
  return arr.find(r => !r.done) || null;
}
function dayName(ts){
  const d = Math.round((ts - Date.now())/86400000);
  if(d <= 0) return "due now";
  if(d === 1) return "tomorrow";
  return "in " + d + " days";
}

/* ---------- icons ---------- */
const ICON = {
  today:'<svg viewBox="0 0 24 24"><path d="M12 3v2M5 7h14a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zM4 11h16"/></svg>',
  course:'<svg viewBox="0 0 24 24"><path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-7a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h7z"/></svg>',
  practise:'<svg viewBox="0 0 24 24"><path d="M4 12h4l2 6 4-14 2 8h4"/></svg>',
  review:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>',
  progress:'<svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>'
};
const NAV = [
  {id:"today", label:"Today"},
  {id:"course", label:"Course"},
  {id:"practise", label:"Practise"},
  {id:"review", label:"Review"},
  {id:"progress", label:"Progress"}
];

/* ---------- chrome ---------- */
function paintChrome(){
  document.body.classList.toggle("teacher", S.mode === "teacher");

  $("#tabbar").innerHTML = NAV.map(n =>
    `<button data-nav="${n.id}" ${S.view===n.id?'aria-current="page"':""}>${ICON[n.id]}<span>${n.label}</span></button>`).join("");
  $("#railnav").innerHTML = NAV.map(n =>
    `<button data-nav="${n.id}" ${S.view===n.id?'aria-current="page"':""}>${ICON[n.id]}<span>${n.label}</span></button>`).join("");

  const sw = `<button data-mode="student" aria-pressed="${S.mode==='student'}">Student</button>
              <button data-mode="teacher" aria-pressed="${S.mode==='teacher'}">Teacher</button>`;
  $("#modeswitch1").innerHTML = sw;
  $("#modeswitch2").innerHTML = sw;

  const pct = coursePct();
  $("#railbar").style.width = pct + "%";
  $("#railpct").textContent = pct + "% complete";
  $("#topsub").textContent = S.mode === "teacher" ? "Teacher mode" : "Learn · Speak · Write";

  $$("[data-nav]").forEach(b => b.onclick = () => go(b.dataset.nav));
  $$("[data-mode]").forEach(b => b.onclick = () => { S.mode = b.dataset.mode; save(); render(); toast(S.mode==="teacher" ? "Teacher mode on — notes and answer keys are visible" : "Student mode on"); });
}

function go(view, lessonId, step){
  S.view = view;
  if(lessonId !== undefined) S.lessonId = lessonId;
  if(step) S.step = step;
  save(); render();
  window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});
  $("#main").focus({preventScroll:true});
}

/* =========================================================
   EXERCISE ENGINE
   ========================================================= */
function questionCard(q, meta){
  const {onResult, index, total, saveKey} = meta || {};
  const card = node(`<div class="q"></div>`);
  const levelTag = q.level ? `Level ${q.level}` : (q.cat || "");
  card.appendChild(node(`<div class="qhead">
      <span class="u">${index!=null ? `Question ${index+1}${total?" of "+total:""}` : ""}</span>
      <span class="chip">${esc(levelTag)}</span>
    </div>`));

  const fb = node(`<div class="fb" role="status" aria-live="polite"></div>`);
  const store = prog(S.lessonId || "_mixed");

  function settle(ok, title, body, mine, right){
    fb.className = "fb show " + (ok===true ? "good" : ok===false ? "bad" : "info");
    fb.innerHTML = `<span class="lbl">${title}</span>${body||""}`;
    if(ok !== null) logResult(q.cat, ok);
    if(ok === false && mine && right){
      addMistake({topic:q.cat, q:String(q.q||"").replace(/<[^>]+>/g,""), mine, right, why:q.why,
                  lesson:(lessonById(S.lessonId)||{}).title || "Mixed practice"});
      fb.appendChild(node(`<div class="savednote">Saved to My Mistakes</div>`));
    }
    if(saveKey){ store.practice[saveKey] = ok===true ? "correct" : ok===false ? "wrong" : "seen"; save(); }
    if(onResult) onResult(ok);
  }

  /* ---- multiple choice ---- */
  if(q.t === "mcq"){
    card.appendChild(node(`<div class="qtext">${q.q}</div>`));
    const wrap = node(`<div class="opts"></div>`);
    q.options.forEach((o,i) => {
      const b = node(`<button class="opt"><span class="key">${String.fromCharCode(65+i)}</span><span>${o}</span></button>`);
      b.onclick = () => {
        $$(".opt", wrap).forEach(x => x.disabled = true);
        const ok = i === q.a;
        b.classList.add(ok ? "correct" : "wrong");
        if(!ok) $$(".opt", wrap)[q.a].classList.add("correct");
        settle(ok, ok ? "Correct" : "Not quite", `<div>${q.why||""}</div>`, q.options[i], q.options[q.a]);
      };
      wrap.appendChild(b);
    });
    card.appendChild(wrap);
  }

  /* ---- fill in / correct the sentence ---- */
  if(q.t === "fill" || q.t === "correct"){
    const label = q.t === "correct" ? "Rewrite this sentence correctly:" : "";
    if(label) card.appendChild(node(`<div class="u" style="margin-bottom:6px">${label}</div>`));
    card.appendChild(node(`<div class="qtext">${q.t==="correct" ? `<span class="mk x">✗</span><span style="color:var(--red)">${esc(q.q)}</span>` : q.q}</div>`));
    const inp = node(`<input class="text" type="text" autocomplete="off" autocapitalize="sentences" placeholder="${q.t==="correct" ? "Type the correct sentence" : "Type your answer"}" aria-label="Your answer">`);
    card.appendChild(inp);
    const row = node(`<div class="btnrow"></div>`);
    const check = node(`<button class="btn sm">Check answer</button>`);
    const hint  = q.hint ? node(`<button class="btn sm quiet">Hint</button>`) : null;
    const show  = node(`<button class="btn sm quiet">Show answer</button>`);
    row.appendChild(check); if(hint) row.appendChild(hint); row.appendChild(show);
    card.appendChild(row);

    check.onclick = () => {
      const v = norm(inp.value);
      if(!v){ toast("Type an answer first"); inp.focus(); return; }
      const ok = q.a.some(a => norm(a) === v);
      inp.classList.toggle("ok", ok); inp.classList.toggle("no", !ok);
      inp.readOnly = true; check.disabled = true; if(hint) hint.disabled = true;
      settle(ok, ok ? "Correct" : "Not yet", `<div>${ok ? "" : `<span class="mk v">✓</span><b>${esc(q.a[0])}</b><br>`}${q.why||""}</div>`, inp.value, q.a[0]);
    };
    if(hint) hint.onclick = () => { fb.className = "fb show info"; fb.innerHTML = `<span class="lbl">Hint</span>${q.hint}`; };
    show.onclick = () => {
      inp.value = q.a[0]; inp.readOnly = true; check.disabled = true;
      settle(false, "Answer shown", `<div>${q.why||""}</div>`, "(answer shown)", q.a[0]);
    };
    inp.addEventListener("keydown", e => { if(e.key === "Enter" && !check.disabled) check.click(); });
  }

  /* ---- rearrange the words ---- */
  if(q.t === "order"){
    card.appendChild(node(`<div class="qtext">Put the words in the right order.</div>`));
    const tray = node(`<div class="tray" aria-live="polite"><span class="ph">Tap the words below</span></div>`);
    const bank = node(`<div class="words"></div>`);
    card.appendChild(tray); card.appendChild(bank);
    const chosen = [];
    const shuffled = q.words.slice().sort(() => Math.random() - .5);
    shuffled.forEach(w => {
      const b = node(`<button class="word">${esc(w)}</button>`);
      b.onclick = () => {
        if(b.classList.contains("used")) return;
        b.classList.add("used"); chosen.push({w, b});
        redraw();
      };
      bank.appendChild(b);
    });
    function redraw(){
      tray.innerHTML = "";
      if(!chosen.length){ tray.appendChild(node(`<span class="ph">Tap the words below</span>`)); return; }
      chosen.forEach((c, i) => {
        const t = node(`<button class="word">${esc(c.w)}</button>`);
        t.onclick = () => { c.b.classList.remove("used"); chosen.splice(i,1); redraw(); };
        tray.appendChild(t);
      });
    }
    const row = node(`<div class="btnrow"></div>`);
    const check = node(`<button class="btn sm">Check answer</button>`);
    const reset = node(`<button class="btn sm quiet">Start again</button>`);
    row.appendChild(check); row.appendChild(reset); card.appendChild(row);
    check.onclick = () => {
      if(!chosen.length){ toast("Build the sentence first"); return; }
      const built = chosen.map(c => c.w).join(" ");
      const ok = normLoose(built) === normLoose(q.a);
      check.disabled = true; reset.disabled = true;
      $$(".word", tray).forEach(x => x.disabled = true);
      $$(".word", bank).forEach(x => x.disabled = true);
      settle(ok, ok ? "Correct" : "Not quite", `<div>${ok ? "" : `<span class="mk v">✓</span><b>${esc(q.a)}</b><br>`}${q.why||""}</div>`, built, q.a);
    };
    reset.onclick = () => { chosen.splice(0); $$(".word", bank).forEach(x => x.classList.remove("used")); redraw(); };
  }

  /* ---- build your own sentence ---- */
  if(q.t === "build"){
    card.appendChild(node(`<div class="qtext">${q.q}</div>`));
    const inp = node(`<input class="text" type="text" autocomplete="off" placeholder="Write your sentence" aria-label="Your sentence">`);
    card.appendChild(inp);
    const row = node(`<div class="btnrow"></div>`);
    const done = node(`<button class="btn sm">Compare with a model</button>`);
    const hint = q.hint ? node(`<button class="btn sm quiet">Hint</button>`) : null;
    row.appendChild(done); if(hint) row.appendChild(hint); card.appendChild(row);
    if(hint) hint.onclick = () => { fb.className = "fb show info"; fb.innerHTML = `<span class="lbl">Hint</span>${q.hint}`; };
    done.onclick = () => {
      if(!norm(inp.value)){ toast("Write your own sentence first"); inp.focus(); return; }
      done.disabled = true;
      fb.className = "fb show info";
      fb.innerHTML = `<span class="lbl">One possible answer</span><div><span class="mk v">✓</span>${esc(q.model)}</div>
        <div style="margin-top:8px" class="muted">Yours does not have to match. Check that it follows the same pattern.</div>`;
      const mark = node(`<div class="btnrow"><button class="btn sm quiet" data-m="1">Mine follows the pattern</button><button class="btn sm quiet" data-m="0">I need to fix mine</button></div>`);
      fb.appendChild(mark);
      $$("[data-m]", mark).forEach(b => b.onclick = () => {
        const ok = b.dataset.m === "1";
        logResult(q.cat, ok);
        if(!ok) addMistake({topic:q.cat, q:String(q.q||"").replace(/<[^>]+>/g,""), mine:inp.value, right:q.model, why:q.hint,
                            lesson:(lessonById(S.lessonId)||{}).title || "Mixed practice"});
        if(saveKey){ store.practice[saveKey] = ok ? "correct" : "wrong"; save(); }
        mark.remove();
        fb.appendChild(node(`<div style="margin-top:6px" class="muted">${ok ? "Good. Keep going." : "Noted — this will come back in your review."}</div>`));
        if(onResult) onResult(ok);
      });
    };
  }

  /* ---- speaking task ---- */
  if(q.t === "say"){
    card.appendChild(node(`<div class="qtext">${q.q}</div>`));
    const b = node(`<button class="btn sm quiet">I said it out loud</button>`);
    card.appendChild(node(`<div class="btnrow"></div>`)).appendChild(b);
    b.onclick = () => { b.disabled = true; settle(null, "Well done", "Saying it aloud is what moves grammar into speech."); };
  }

  /* ---- written task ---- */
  if(q.t === "write"){
    card.appendChild(node(`<div class="qtext">${q.q}</div>`));
    if(q.checklist) card.appendChild(node(`<ul class="goal-list">${q.checklist.map(c=>`<li><span class="k">☐</span><span>${c}</span></li>`).join("")}</ul>`));
    const ta = node(`<textarea class="text" style="margin-top:10px" aria-label="Your writing"></textarea>`);
    card.appendChild(ta);
    const b = node(`<button class="btn sm">Save my answer</button>`);
    card.appendChild(node(`<div class="btnrow"></div>`)).appendChild(b);
    if(saveKey && store.writes[saveKey]) ta.value = store.writes[saveKey];
    b.onclick = () => {
      if(!ta.value.trim()){ toast("Write something first"); ta.focus(); return; }
      if(saveKey){ store.writes[saveKey] = ta.value; save(); }
      settle(null, "Saved", "Read it once more against the checklist before you move on.");
    };
  }

  card.appendChild(fb);
  return card;
}

/* =========================================================
   VIEWS
   ========================================================= */
function render(){
  paintChrome();
  const m = $("#main");
  if(S.view === "today")    m.innerHTML = "", m.appendChild(viewToday());
  else if(S.view === "course")   m.innerHTML = "", m.appendChild(viewCourse());
  else if(S.view === "lesson")   m.innerHTML = "", m.appendChild(viewLesson());
  else if(S.view === "practise") m.innerHTML = "", m.appendChild(viewPractise());
  else if(S.view === "review")   m.innerHTML = "", m.appendChild(viewReview());
  else if(S.view === "progress") m.innerHTML = "", m.appendChild(viewProgress());
}

/* ---------- Today ---------- */
function viewToday(){
  const next = LESSONS.find(l => !lessonDone(l.id)) || LESSONS[0];
  const started = LESSONS.filter(l => lessonPct(l.id) > 0).length;
  const finished = LESSONS.filter(l => lessonDone(l.id)).length;
  const weak = weakAreas()[0];
  const p = lessonPct(next.id);

  const wrap = node(`<div class="wrap"></div>`);
  wrap.appendChild(node(`
    <section class="hero">
      <div class="u">Class 8 · English</div>
      <h1>Grammar you can actually speak.</h1>
      <p class="lead">Six steps every lesson: learn it, practise it, say it aloud, write it, test it, review it.</p>
    </section>`));

  wrap.appendChild(node(`
    <div class="today">
      <div class="band"><span class="u">${p>0 ? "Continue" : "Start here"}</span><span class="u">${next.minutes} min</span></div>
      <div class="body">
        <div class="chiprow" style="margin-bottom:8px"><span class="chip ${next.tier.toLowerCase()}">${next.tier}</span><span class="chip ref">${next.difficulty}</span></div>
        <h2>${next.title}</h2>
        <p class="muted" style="margin-top:6px">${next.tagline}</p>
        <div class="bar" style="margin-top:12px"><i style="width:${p}%"></i></div>
        <div class="btnrow">
          <button class="btn" data-open="${next.id}">${p>0 ? "Continue lesson" : "Begin lesson"}</button>
          <button class="btn quiet" data-nav2="course">See the whole course</button>
        </div>
      </div>
    </div>`));

  wrap.appendChild(node(`
    <div class="statgrid">
      <div class="stat"><b>${finished}</b><span>Lessons finished</span></div>
      <div class="stat"><b>${started}</b><span>Lessons started</span></div>
      <div class="stat"><b>${coursePct()}%</b><span>Course done</span></div>
    </div>`));

  const due = dueReviews();
  if(due.length){
    const card = node(`<div class="card" style="margin-top:14px;border-left:3px solid var(--amber)">
      <div class="eyebrow"><span class="dot" style="background:var(--amber)"></span><span class="u">Revision due</span></div>
      <p class="muted" style="margin-bottom:10px">Five quick questions bring a finished lesson back before you forget it.</p>
      </div>`);
    due.slice(0,3).forEach(d => {
      const L2 = lessonById(d.id);
      const row = node(`<div class="due"><div><b style="font-family:var(--display)">${L2.title}</b>
        <div class="n" style="color:var(--amber)">${d.label} · 5 questions</div></div></div>`);
      const b = node(`<button class="btn sm">Start</button>`);
      b.onclick = () => { S.reviewTarget = {id:d.id, i:d.i}; go("practise"); };
      row.appendChild(b); card.appendChild(row);
    });
    wrap.appendChild(card);
  }

  if(S.mistakes.length){
    wrap.appendChild(node(`<div class="card" style="margin-top:14px">
      <div class="eyebrow"><span class="dot"></span><span class="u">My mistakes</span></div>
      <p class="muted" style="margin:0">${S.mistakes.length} saved. The Review tab groups them by topic so you can see the pattern rather than the individual slip.</p>
      </div>`));
  }

  if(weak){
    const rec = lessonsForCategory(weak.cat)[0];
    wrap.appendChild(node(`
      <div class="card ruled" style="margin-top:14px">
        <div class="eyebrow"><span class="dot"></span><span class="u">Where you slip</span></div>
        <h3 class="block-title">${esc(weak.cat)}</h3>
        <p class="muted" style="margin-bottom:0">You have got ${weak.wrong} of ${weak.total} questions wrong in this area.${rec ? ` Ten minutes on <b>${esc(rec.title)}</b> would fix most of it.` : ""}</p>
        <div class="btnrow">
          <button class="btn sm" data-nav2="practise">Mixed practice</button>
          ${rec ? `<button class="btn sm quiet" data-open="${rec.id}">Open ${esc(rec.title)}</button>` : ""}
        </div>
      </div>`));
  }

  if(S.mode === "teacher"){
    wrap.appendChild(node(`
      <div class="tnote" style="margin-top:14px">
        <div class="th"><span>Teacher mode is on</span><span class="u" style="color:rgba(255,255,255,.7)">Notes visible</span></div>
        <div class="tb">
          <p style="margin:0">Every lesson now has a <b>Teach</b> step: objectives, board examples, questions to ask, common misconceptions, an answer key and a fifteen-minute plan. Student work and scores are unaffected by this switch.</p>
        </div>
      </div>`));
  }

  wrap.appendChild(node(`
    <div class="card" style="margin-top:14px">
      <div class="eyebrow"><span class="dot"></span><span class="u">How a lesson works</span></div>
      <ul class="goal-list">
        ${STEPS.map((s,i)=>`<li><span class="k">${i+1}</span><span><b>${s.label}</b> — ${["meet the grammar inside a real conversation","work up from choosing to building","say it out loud in a real situation","turn it into writing","ten mixed questions","the four things to remember"][i]}</span></li>`).join("")}
      </ul>
    </div>`));

  bindOpeners(wrap);
  return wrap;
}

function bindOpeners(root){
  $$("[data-open]", root).forEach(b => b.onclick = () => go("lesson", b.dataset.open, firstUnfinishedStep(b.dataset.open)));
  $$("[data-nav2]", root).forEach(b => b.onclick = () => go(b.dataset.nav2));
}
function firstUnfinishedStep(id){
  const p = prog(id);
  const s = STEPS.find(x => !p.steps[x.id]);
  return s ? s.id : "review";
}

/* ---------- Course map ---------- */
function viewCourse(){
  const wrap = node(`<div class="wrap"></div>`);
  wrap.appendChild(node(`
    <section class="hero">
      <div class="u">The course</div>
      <h1>Three levels, one method.</h1>
      <p class="lead">The order follows the skill you are building — sentences, then speech, then writing — not the order of a contents page.</p>
    </section>`));

  LEVELS.forEach(lv => {
    const live = LESSONS.filter(l => l.unit === lv.id);
    const soon = PLANNED.filter(l => l.unit === lv.id);
    if(!live.length && !soon.length) return;
    const done = live.filter(l => lessonDone(l.id)).length;
    const sec = node(`<section class="unit">
      <div class="levelhead">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
          <h3>${lv.title}</h3><span class="u">${done}/${live.length} done</span>
        </div>
        <p class="muted" style="margin:4px 0 0;font-size:.9rem">${lv.note}</p>
        ${lv.rule ? `<p class="muted" style="margin:4px 0 0;font-size:.84rem;font-family:var(--display)">${lv.rule}</p>` : ""}
      </div>
      <div class="lessonlist"></div>
    </section>`);
    const list = $(".lessonlist", sec);
    let n = 0;
    live.forEach(l => {
      n++;
      const isDone = lessonDone(l.id), pct = lessonPct(l.id), nr = nextReview(l.id);
      list.appendChild(node(`
        <button class="lesson-row ${isDone?"done":""}" data-open="${l.id}">
          <span class="num">${isDone ? "✓" : String(n).padStart(2,"0")}</span>
          <span><h4>${l.title}</h4><p>${l.tagline}</p>
            ${l.ref ? `<span class="srcref">${l.ref}</span>` : ""}
            ${nr ? `<span class="srcref" style="color:var(--amber)">revision ${dayName(nr.due)}</span>` : ""}
            ${pct>0&&!isDone ? `<span class="bar" style="display:block;margin-top:7px"><i style="width:${pct}%"></i></span>` : ""}
          </span>
          <span class="chip ${l.tier.toLowerCase()}">${l.tier}</span>
        </button>`));
    });
    soon.forEach(l => {
      n++;
      list.appendChild(node(`
        <div class="lesson-row soon">
          <span class="num">${String(n).padStart(2,"0")}</span>
          <span><h4>${l.title}</h4><p>${l.tagline}</p>${l.ref?`<span class="srcref">${l.ref}</span>`:""}</span>
          <span class="chip ref">Coming</span>
        </div>`));
    });
    wrap.appendChild(sec);
  });

  wrap.appendChild(node(`
    <div class="card ruled">
      <div class="eyebrow"><span class="dot"></span><span class="u">What the labels mean</span></div>
      <p style="margin-bottom:6px"><span class="chip core">CORE</span> You need this to speak and write correctly now.</p>
      <p style="margin-bottom:6px"><span class="chip useful">USEFUL</span> Makes your English sound natural, but can wait.</p>
      <p style="margin-bottom:0"><span class="chip adv">ADVANCED</span> Worth learning later, or for exams.</p>
    </div>`));
  bindOpeners(wrap);
  return wrap;
}

/* ---------- Lesson ---------- */
function viewLesson(){
  const L = lessonById(S.lessonId) || LESSONS[0];
  const p = prog(L.id);
  const frag = document.createDocumentFragment();
  const steps = S.mode === "teacher" ? STEPS.concat([{id:"teach", label:"Teach"}]) : STEPS;
  if(S.mode !== "teacher" && S.step === "teach") S.step = "learn";

  const head = node(`<div class="wrap"><div class="lessonhead">
      <button class="backlink">← All lessons</button>
      <div class="chiprow" style="margin-top:6px">
        <span class="chip ${L.tier.toLowerCase()}">${L.tier}</span>
        <span class="chip ref">${L.difficulty}</span>
        ${(L.skills||[]).map(k=>`<span class="chip">${k}</span>`).join("")}
      </div>
      <h1>${L.title}</h1>
      <p class="tagline">${L.tagline}</p>
      <div class="meta"><span>${L.minutes} minutes</span><span>${lessonPct(L.id)}% done</span>${L.ref?`<span>${L.ref}</span>`:""}</div>
      ${L.prereq1?`<div class="prereq"><b>Prerequisite from Book 1:</b> ${L.prereq1}</div>`:""}
    </div></div>`);
  $(".backlink", head).onclick = () => go("course");
  frag.appendChild(head);

  const bar = node(`<div class="steps"><div class="inner"></div></div>`);
  steps.forEach(s => {
    const b = node(`<button ${S.step===s.id?'aria-current="true"':""}>${s.label}${p.steps[s.id]?'<span class="tick">✓</span>':""}</button>`);
    b.onclick = () => go("lesson", L.id, s.id);
    $(".inner", bar).appendChild(b);
  });
  frag.appendChild(bar);

  const wrap = node(`<div class="wrap"></div>`);
  const body = ({
    learn:stepLearn, practise:stepPractise, speak:stepSpeak,
    write:stepWrite, test:stepTest, review:stepReview, teach:stepTeach
  })[S.step] || stepLearn;
  wrap.appendChild(body(L));

  const i = steps.findIndex(s => s.id === S.step);
  const nav = node(`<div class="btnrow" style="margin:18px 0 8px"></div>`);
  if(i > 0){ const b = node(`<button class="btn quiet">← ${steps[i-1].label}</button>`); b.onclick = () => go("lesson", L.id, steps[i-1].id); nav.appendChild(b); }
  if(i < steps.length-1){ const b = node(`<button class="btn">${steps[i+1].label} →</button>`); b.onclick = () => go("lesson", L.id, steps[i+1].id); nav.appendChild(b); }
  wrap.appendChild(nav);
  frag.appendChild(wrap);

  const holder = document.createElement("div");
  holder.appendChild(frag);
  return holder;
}

/* ----- step: Learn ----- */
function stepLearn(L){
  const box = document.createElement("div");

  box.appendChild(node(`
    <div class="card ruled">
      <div class="eyebrow"><span class="dot"></span><span class="u">Today you will learn</span></div>
      <ul class="goal-list">${L.objectives.map((o,i)=>`<li><span class="k">${i+1}</span><span>${o}</span></li>`).join("")}</ul>
      <div class="insight" style="background:var(--accent-tint);border-left-color:var(--accent)"><b>Why this matters.</b> ${L.why}</div>
    </div>`));

  /* real English first */
  const c = L.convo;
  const conv = node(`
    <div class="card">
      <div class="eyebrow"><span class="dot"></span><span class="u">Listen first · ${c.setting}</span></div>
      <div class="convo">${c.lines.map((l,i)=>`<div class="line ${i%2?"b":""}"><span class="who">${l[0]}</span><span class="say">${l[1]}</span></div>`).join("")}</div>
    </div>`);
  conv.appendChild(node(`<div class="u" style="margin:14px 0 8px">Before the rule — what do you notice?</div>`));
  conv.appendChild(questionCard({t:"mcq", q:c.q.prompt, options:c.q.options, a:c.q.a, why:c.q.why, cat:null}, {}));
  box.appendChild(conv);

  /* discover the pattern */
  box.appendChild(node(`
    <div class="card">
      <div class="eyebrow"><span class="dot"></span><span class="u">Discover the pattern</span></div>
      <p>${L.discover.prompt}</p>
      <ul class="exlist">${L.discover.items.map(i=>`<li>${i}</li>`).join("")}</ul>
      <details style="margin-top:12px"><summary style="cursor:pointer;font-family:var(--display);font-weight:600;color:var(--accent)">What did you notice?</summary>
        <div class="insight" style="margin-top:10px">${L.discover.insight}</div></details>
    </div>`));

  /* explanations */
  L.explain.forEach(e => {
    box.appendChild(node(`
      <div class="card">
        <h3 class="block-title">${e.h}</h3>
        <p class="muted">${e.body}</p>
        ${e.formula ? `<div class="formula">${e.formula}</div>` : ""}
        ${e.examples ? `<ul class="exlist">${e.examples.map(x=>`<li>${x}</li>`).join("")}</ul>` : ""}
        ${e.note ? `<div class="insight" style="margin-top:12px"><b>Note.</b> ${e.note}</div>` : ""}
      </div>`));
  });

  /* pattern cards */
  if(L.patternCards){
    const pc = node(`<div class="card">
        <div class="eyebrow"><span class="dot"></span><span class="u">Pattern cards</span></div>
        <p class="muted">Learn the verb together with the shape that follows it. Tap Listen, then make your own sentence.</p>
        <div class="pcards"></div></div>`);
    const grid = $(".pcards", pc);
    L.patternCards.forEach(c => {
      const card = node(`<div class="pcard">
          <span class="nm">${esc(c.name)}</span>
          <code class="fm">${esc(c.formula)}</code>
          <p class="exq">${esc(c.example)}</p>
          <p class="mn">${esc(c.meaning)}</p>
        </div>`);
      const row = node(`<div class="btnrow" style="margin-top:8px;gap:6px"></div>`);
      const lb = listenBtn(c.example); if(lb) row.appendChild(lb);
      const mk = node(`<button class="listen">✏️ Make your sentence</button>`);
      mk.onclick = () => {
        if($(".mine", card)) { $(".mine", card).querySelector("input").focus(); return; }
        const box = node(`<div class="mine" style="margin-top:9px">
            <div class="u" style="margin-bottom:5px">${esc(c.turn)}</div>
            <input class="text" type="text" placeholder="Your sentence" aria-label="Your sentence">
          </div>`);
        const inp = $("input", box);
        const ok = node(`<button class="listen" style="margin-top:7px">🔊 Hear mine</button>`);
        ok.onclick = () => inp.value.trim() ? sayAloud(inp.value) : toast("Write your sentence first");
        box.appendChild(ok); card.appendChild(box); inp.focus();
      };
      row.appendChild(mk);
      card.appendChild(row);
      grid.appendChild(card);
    });
    box.appendChild(pc);
  }

  /* examples at three levels */
  if(L.examples3){
    const e3 = node(`<div class="card">
      <div class="eyebrow"><span class="dot"></span><span class="u">The same grammar, three levels</span></div>
      <div class="lvl3"></div></div>`);
    const g = $(".lvl3", e3);
    [["Level 1 · Easy","easy"],["Level 2 · Everyday","everyday"],["Level 3 · Natural conversation","natural"]].forEach(([lab,k]) => {
      if(!L.examples3[k]) return;
      const r = node(`<div class="row"><span class="u">${lab}</span></div>`);
      L.examples3[k].forEach(x => {
        const line = node(`<div class="e3line"><span>${x}</span></div>`);
        const lb = listenBtn(x); if(lb) line.appendChild(lb);
        r.appendChild(line);
      });
      g.appendChild(r);
    });
    box.appendChild(e3);
  }

  /* pattern table */
  if(L.pattern){
    box.appendChild(node(`
      <div class="card">
        <div class="eyebrow"><span class="dot"></span><span class="u">See the pattern</span></div>
        <div style="overflow-x:auto"><table class="pattern">
          <thead><tr>${L.pattern.headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead>
          <tbody>${L.pattern.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i===L.pattern.hi?"hi":""}">${c}</td>`).join("")}</tr>`).join("")}</tbody>
        </table></div>
        <div class="insight">${L.pattern.insight}</div>
      </div>`));
  }

  /* clickable sentence breakdown */
  if(L.breakdown){
    const bd = node(`
      <div class="card">
        <div class="eyebrow"><span class="dot"></span><span class="u">Why is this sentence built like this?</span></div>
        <p class="muted">Tap each part.</p>
        <div class="breakdown"></div>
        <div class="tokinfo"><span class="role">Start here</span>Tap any part of the sentence above to see the job it does.</div>
        <div class="insight" style="margin-top:12px"><b>The whole meaning.</b> ${L.breakdown.meaning}</div>
      </div>`);
    const strip = $(".breakdown", bd), info = $(".tokinfo", bd);
    L.breakdown.parts.forEach(p => {
      const t = node(`<button class="tok" aria-pressed="false">${esc(p[0])}</button>`);
      t.onclick = () => {
        $$(".tok", strip).forEach(x => x.setAttribute("aria-pressed","false"));
        t.setAttribute("aria-pressed","true");
        info.innerHTML = `<span class="role">${esc(p[1])}</span>${p[2]}`;
      };
      strip.appendChild(t);
    });
    box.appendChild(bd);
  }

  /* compare */
  if(L.compare){
    const cp = node(`
      <div class="card">
        <div class="eyebrow"><span class="dot"></span><span class="u">Compare and understand</span></div>
        <h3 class="block-title">${L.compare.title}</h3>
        <div class="compare">
          ${[L.compare.left, L.compare.right].map(s=>`
            <div class="side"><h4>${s.h}</h4><p class="muted" style="font-size:.94rem">${s.when}</p>
            <ul>${s.ex.map(e=>`<li>${e}</li>`).join("")}</ul></div>`).join("")}
        </div>
      </div>`);
    if(L.compare.mini) cp.appendChild(questionCard({t:"mcq", ...L.compare.mini, q:L.compare.mini.prompt, cat:null}, {}));
    box.appendChild(cp);
  }

  /* mistakes */
  box.appendChild(node(`
    <div class="card">
      <div class="eyebrow"><span class="dot"></span><span class="u">Common mistakes</span></div>
      ${L.mistakes.map(m=>`
        <div class="mistake">
          <div><span class="mk x">✗</span><span class="wrong">${esc(m.wrong)}</span></div>
          <div><span class="mk v">✓</span><span class="right">${esc(m.right)}</span></div>
          <div class="why">${m.why}</div>
        </div>`).join("")}
      <p class="muted" style="font-size:.88rem;margin:8px 0 0">Some of these are simply wrong English. Others are ordinary in Indian speech but out of place in formal writing — the note under each one tells you which.</p>
    </div>`));

  const doneBtn = node(`<button class="btn">I have understood this — go to practice</button>`);
  doneBtn.onclick = () => { markStep(L.id, "learn"); go("lesson", L.id, "practise"); };
  const row = node(`<div class="btnrow"></div>`); row.appendChild(doneBtn);
  box.appendChild(row);
  return box;
}

/* ----- step: Practise ----- */
function stepPractise(L){
  const box = document.createElement("div");
  box.appendChild(node(`
    <div class="card ruled">
      <div class="eyebrow"><span class="dot"></span><span class="u">Guided practice</span></div>
      <p style="margin:0">Eight questions that get harder: choose, complete, correct, rearrange, then build your own. Every answer comes with the reason, not just a tick.</p>
    </div>`));
  let answered = 0;
  const total = L.practice.length;
  const meter = node(`<div class="card" style="padding:12px 16px"><div class="u" style="margin-bottom:6px">Progress <span id="pcount">0 of ${total}</span></div><div class="bar"><i id="pbar" style="width:0%"></i></div></div>`);
  box.appendChild(meter);
  L.practice.forEach((q, i) => {
    box.appendChild(questionCard(q, {
      index:i, total, saveKey:"p"+i,
      onResult:() => {
        answered++;
        $("#pcount", meter).textContent = `${Math.min(answered,total)} of ${total}`;
        $("#pbar", meter).style.width = Math.min(answered/total*100,100) + "%";
        if(answered >= total){ markStep(L.id, "practise"); toast("Practice finished — now say it out loud"); }
      }
    }));
  });
  return box;
}

/* ----- step: Speak ----- */
function stepSpeak(L){
  const box = document.createElement("div");
  const p = prog(L.id);
  box.appendChild(node(`
    <div class="card ruled">
      <div class="eyebrow"><span class="dot"></span><span class="u">Speak now</span></div>
      <p style="margin:0">Read each conversation aloud twice — once as each speaker. Then do the tasks. Grammar only becomes yours when your mouth has said it.</p>
    </div>`));
  if(L.speak.drill){
    const d = L.speak.drill;
    const dr = node(`<div class="drill">
        <div class="dh">${esc(d.title)}</div>
        <div class="db">
          <div class="u" style="margin-bottom:6px">The frame</div>
          <div class="frame">${esc(d.frame)}</div>
          <div class="u" style="margin:12px 0 6px">Swap the ending — say the whole sentence each time</div>
          <div class="prompts"></div>
        </div></div>`);
    const pr = $(".prompts", dr);
    d.prompts.forEach(p => {
      const b = node(`<button class="word">${esc(p)}</button>`);
      b.onclick = () => {
        const full = d.frame.replace(/_+\.?/, p + ".");
        $(".frame", dr).textContent = full;
        b.classList.add("used-soft");
        if(CAN_SPEAK) sayAloud(full);
      };
      pr.appendChild(b);
    });
    const stage = node(`<div class="hidebox">Step 1 — <b>Listen</b> to the model. Step 2 — <b>Read</b> it aloud. Step 3 — <b>Hide</b> it. Step 4 — <b>Speak</b> from memory.</div>`);
    const row = node(`<div class="btnrow" style="gap:6px"></div>`);
    const lb = listenBtn(d.modelLine, "Listen to the model"); if(lb) row.appendChild(lb);
    const hide = node(`<button class="listen">🙈 Hide the frame</button>`);
    let hidden = false;
    hide.onclick = () => {
      hidden = !hidden;
      $(".frame", dr).style.visibility = hidden ? "hidden" : "visible";
      hide.textContent = hidden ? "👁 Show the frame" : "🙈 Hide the frame";
      if(hidden) toast("Now say it from memory");
    };
    row.appendChild(hide);
    $(".db", dr).appendChild(row);
    $(".db", dr).appendChild(stage);
    box.appendChild(dr);
  }

  L.speak.situations.forEach(s => {
    const sit = node(`
      <div class="situation">
        <h4>${s.h}</h4>
        <div class="convo">${s.lines.map((l,i)=>`<div class="line ${i%2?"b":""}"><span class="who">${l[0]}</span><span class="say">${l[1]}</span></div>`).join("")}</div>
      </div>`);
    const lb = listenBtn(s.lines.map(l => l[1]).join(". "), "Listen to the whole conversation");
    if(lb) sit.appendChild(node(`<div class="btnrow" style="margin-top:2px"></div>`)).appendChild(lb);
    box.appendChild(sit);
  });
  const tasks = node(`<div class="card"><div class="eyebrow"><span class="dot"></span><span class="u">Your turn</span></div></div>`);
  L.speak.tasks.forEach((t, i) => {
    const row = node(`<div class="task"><p>${t}</p></div>`);
    const b = node(`<button class="btn sm quiet ${p.speak[i]?"done":""}">${p.speak[i]?"✓ Said":"I said it"}</button>`);
    b.onclick = () => {
      p.speak[i] = true; save();
      b.textContent = "✓ Said"; b.classList.add("done");
      if(L.speak.tasks.every((_,k) => p.speak[k])){ markStep(L.id, "speak"); toast("All spoken — now write it"); }
    };
    row.appendChild(b); tasks.appendChild(row);
  });
  box.appendChild(tasks);

  if(L.think){
    const th = node(`<div class="card">
      <div class="eyebrow"><span class="dot"></span><span class="u">Think in English</span></div>
      <p class="muted">No translation. Read the situation and produce the English sentence directly.</p>
      </div>`);
    L.think.forEach((t, i) => {
      const item = node(`<div class="thinkbox">
          <p class="sit">${t.situation}</p>
          <div class="u" style="margin:6px 0">${t.prompt}</div>
          <input class="text" type="text" placeholder="Say it, then type it" aria-label="Your English sentence">
        </div>`);
      const inp = $("input", item);
      const row = node(`<div class="btnrow" style="gap:6px;margin-top:8px"></div>`);
      const cmp = node(`<button class="listen">Compare with a model</button>`);
      cmp.onclick = () => {
        if(!inp.value.trim()){ toast("Try it yourself first"); inp.focus(); return; }
        if($(".model", item)) return;
        const m = node(`<div class="model fb show info" style="margin-top:8px"><span class="lbl">One natural answer</span>${esc(t.model)}</div>`);
        const lb2 = listenBtn(t.model); if(lb2) m.appendChild(node(`<div style="margin-top:7px"></div>`)).appendChild(lb2);
        item.appendChild(m);
        if(S.mode !== "teacher") markStep(L.id, "speak");
      };
      row.appendChild(cmp);
      const lb = listenBtn(t.model, "Listen to a model"); if(lb) row.appendChild(lb);
      item.appendChild(row);
      th.appendChild(item);
    });
    box.appendChild(th);
  }
  return box;
}

/* ----- step: Write ----- */
function stepWrite(L){
  const box = document.createElement("div");
  const p = prog(L.id);
  box.appendChild(node(`
    <div class="card ruled">
      <div class="eyebrow"><span class="dot"></span><span class="u">Write now</span></div>
      <p>${L.write.prompt}</p>
      <div class="u" style="margin:14px 0 6px">Check before you finish</div>
      <ul class="goal-list">${L.write.checklist.map(c=>`<li><span class="k">☐</span><span>${c}</span></li>`).join("")}</ul>
      <div class="u" style="margin:14px 0 6px">Stuck? Start with</div>
      <ul class="exlist">${L.write.starters.map(s=>`<li>${s}</li>`).join("")}</ul>
    </div>`));
  const card = node(`<div class="card"></div>`);
  const ta = node(`<textarea class="text" placeholder="Write here…" aria-label="Your writing"></textarea>`);
  if(p.writes.main) ta.value = p.writes.main;
  card.appendChild(ta);
  const row = node(`<div class="btnrow"></div>`);
  const saveB = node(`<button class="btn sm">Save my writing</button>`);
  const modelB = node(`<button class="btn sm quiet">Show a model paragraph</button>`);
  row.appendChild(saveB); row.appendChild(modelB); card.appendChild(row);
  const fb = node(`<div class="fb"></div>`); card.appendChild(fb);
  saveB.onclick = () => {
    if(!ta.value.trim()){ toast("Write something first"); ta.focus(); return; }
    p.writes.main = ta.value; markStep(L.id, "write"); save();
    fb.className = "fb show good"; fb.innerHTML = `<span class="lbl">Saved</span>Now read it once against the checklist above. Fix anything that fails a line.`;
  };
  modelB.onclick = () => {
    fb.className = "fb show info";
    fb.innerHTML = `<span class="lbl">A model answer — not the only correct one</span><div style="white-space:pre-line">${esc(L.write.model)}</div>`;
  };
  box.appendChild(card);

  if(L.realTask){
    box.appendChild(node(`
      <div class="card ruled" style="border-left:0">
        <div class="eyebrow"><span class="dot"></span><span class="u">Real-life task</span></div>
        <h3 class="block-title">${L.realTask.title}</h3>
        <p class="muted">${L.realTask.brief}</p>
        <ul class="goal-list">${L.realTask.steps.map((x,i)=>`<li><span class="k">${i+1}</span><span>${x}</span></li>`).join("")}</ul>
      </div>`));
  }
  return box;
}

/* ----- step: Test ----- */
function stepTest(L){
  const box = document.createElement("div");
  const p = prog(L.id);
  if(p.test){
    box.appendChild(scoreCard(L, p.test));
    const again = node(`<div class="btnrow"><button class="btn quiet">Take the test again</button></div>`);
    $("button", again).onclick = () => { p.test = null; save(); render(); };
    box.appendChild(again);
    return box;
  }
  box.appendChild(node(`
    <div class="card ruled">
      <div class="eyebrow"><span class="dot"></span><span class="u">Chapter test · ${L.test.length} questions</span></div>
      <p style="margin:0">A mixture of everything: choosing, completing, correcting, rearranging, writing and speaking. Answer them all, then submit for your score and a review plan.</p>
    </div>`));
  const results = {};
  L.test.forEach((q, i) => {
    box.appendChild(questionCard(q, {index:i, total:L.test.length, onResult:(ok) => { results[i] = ok; refresh(); }}));
  });
  const foot = node(`<div class="card"><div class="u" id="tcount">0 of ${L.test.length} answered</div><div class="btnrow"><button class="btn" id="submit" disabled>Submit test</button></div></div>`);
  box.appendChild(foot);
  function refresh(){
    const n = Object.keys(results).length;
    $("#tcount", foot).textContent = `${n} of ${L.test.length} answered`;
    $("#submit", foot).disabled = n < L.test.length;
  }
  $("#submit", foot).onclick = () => {
    const graded = L.test.map((q,i) => ({cat:q.cat, ok:results[i]}));
    const scored = graded.filter(g => g.ok !== null && g.ok !== undefined);
    const right = scored.filter(g => g.ok === true).length;
    p.test = { right, total:scored.length, at:Date.now(), wrongCats:[...new Set(scored.filter(g=>g.ok===false).map(g=>g.cat))] };
    markStep(L.id, "test");
    if(!S.schedule[L.id]) scheduleReviews(L.id);
    save(); render();
  };
  return box;
}

function scoreCard(L, t){
  const pct = t.total ? Math.round(t.right / t.total * 100) : 0;
  const ready = pct >= 70;
  const card = node(`
    <div class="card ruled">
      <div class="eyebrow"><span class="dot"></span><span class="u">Your result</span></div>
      <div class="score">
        <div class="big">${t.right}<small>/${t.total}</small></div>
        <div>
          <div class="bar" style="margin-bottom:8px"><i style="width:${pct}%"></i></div>
          <div class="muted">${pct}% accuracy on the auto-marked questions. Writing and speaking tasks are not scored — your teacher checks those.</div>
        </div>
      </div>
      <div class="insight" style="${ready?"":"background:var(--red-tint);border-left-color:var(--red)"}">
        <b>${ready ? "You are ready to move on." : "Worth another pass before you move on."}</b>
        ${ready ? " Go to Review, then start the next lesson." : " Redo the Learn step for the areas below, then take the test again."}
      </div>
      ${t.wrongCats && t.wrongCats.length ? `<div style="margin-top:12px"><div class="u" style="margin-bottom:6px">Where you lost marks</div>${t.wrongCats.filter(Boolean).map(c=>`<span class="tag r">${esc(c)}</span>`).join("")}</div>` : `<div style="margin-top:12px"><span class="tag g">No pattern of errors</span></div>`}
    </div>`);
  return card;
}

/* ----- step: Review ----- */
function stepReview(L){
  const box = document.createElement("div");
  const p = prog(L.id);
  box.appendChild(node(`
    <div class="card ruled">
      <div class="eyebrow"><span class="dot"></span><span class="u">Four things to remember</span></div>
      <ul class="goal-list">${L.review.points.map((x,i)=>`<li><span class="k">${i+1}</span><span>${x}</span></li>`).join("")}</ul>
    </div>`));
  if(p.test) box.appendChild(scoreCard(L, p.test));
  box.appendChild(node(`
    <div class="card">
      <div class="eyebrow"><span class="dot"></span><span class="u">What comes next</span></div>
      <p style="margin:0">${L.review.next}</p>
    </div>`));

  const idx = LESSONS.findIndex(x => x.id === L.id);
  const nxt = LESSONS[idx+1];
  const row = node(`<div class="btnrow"></div>`);
  const fin = node(`<button class="btn">Finish this lesson</button>`);
  fin.onclick = () => {
    markStep(L.id, "review");
    toast("Lesson marked as finished");
    if(nxt) go("lesson", nxt.id, "learn"); else go("course");
  };
  row.appendChild(fin);
  const mix = node(`<button class="btn quiet">Mixed practice instead</button>`);
  mix.onclick = () => go("practise");
  row.appendChild(mix);
  box.appendChild(row);
  return box;
}

/* ----- step: Teach (teacher mode only) ----- */
function stepTeach(L){
  const t = L.teacher;
  const box = document.createElement("div");
  const list = (arr) => `<ul>${arr.map(x=>`<li>${x}</li>`).join("")}</ul>`;

  box.appendChild(node(`
    <div class="tnote">
      <div class="th"><span>Teach this in ${L.minutes} minutes</span><span class="u" style="color:rgba(255,255,255,.7)">Lesson plan</span></div>
      <div class="tb"><div class="timeline">
        ${t.plan.map(s=>`<div class="tstep"><span class="t">${s[0]}</span><span>${s[1]}</span></div>`).join("")}
      </div></div>
    </div>`));

  box.appendChild(node(`
    <div class="tnote"><div class="th"><span>Objectives and prerequisites</span></div>
      <div class="tb"><div class="u">By the end of the lesson</div>${list(t.objectives)}
      <div class="u" style="margin-top:10px">Students should already be able to</div>${list(t.prereq)}</div></div>`));

  box.appendChild(node(`
    <div class="tnote"><div class="th"><span>Key rules and board work</span></div>
      <div class="tb">${list(t.rules)}
      <div class="u" style="margin-top:10px">Write these on the board</div>
      <ul class="exlist">${t.board.map(b=>`<li>${esc(b)}</li>`).join("")}</ul></div></div>`));

  box.appendChild(node(`
    <div class="tnote"><div class="th"><span>Ask the student</span></div>
      <div class="tb">${t.ask.map(a=>`<div class="ask">${a}</div>`).join("")}
      <div class="u" style="margin-top:10px">Common misconceptions</div>${list(t.misconceptions)}</div></div>`));

  box.appendChild(node(`
    <div class="tnote"><div class="th"><span>Activities</span></div>
      <div class="tb">
        <div class="u">Classroom activity</div><p>${t.activity}</p>
        <div class="u">Speaking activity</div><p>${t.speaking}</p>
        <div class="u">Homework</div><p>${t.homework}</p>
        <div class="u">If they finish early</div><p>${t.extension}</p>
        <div class="u">If they are struggling</div><p style="margin-bottom:0">${t.remedial}</p>
      </div></div>`));

  if(L.think || (L.speak && L.speak.drill)){
    const ex = node(`<div class="tnote"><div class="th"><span>Expected answers</span><span class="u" style="color:rgba(255,255,255,.7)">Speaking</span></div><div class="tb"></div></div>`);
    const eb = $(".tb", ex);
    if(L.speak.drill){
      eb.appendChild(node(`<div class="u">Drill frame</div><p>${esc(L.speak.drill.frame)} → ${esc(L.speak.drill.modelLine)}</p>`));
    }
    (L.think||[]).forEach(t => {
      eb.appendChild(node(`<div style="padding:7px 0;border-bottom:1px solid var(--rule)">
        <div style="font-size:.94rem">${t.situation}</div>
        <div class="muted" style="font-size:.9rem"><b>Expected:</b> ${esc(t.model)}</div></div>`));
    });
    box.appendChild(ex);
  }

  const key = node(`<div class="tnote"><div class="th"><span>Answer key</span><span class="u" style="color:rgba(255,255,255,.7)">Practice + test</span></div><div class="tb"></div></div>`);
  const kb = $(".tb", key);
  const rows = (arr, label) => {
    kb.appendChild(node(`<div class="u" style="margin:6px 0">${label}</div>`));
    arr.forEach((q,i) => {
      let a = "—";
      if(q.t === "mcq") a = q.options[q.a];
      else if(q.t === "fill" || q.t === "correct") a = q.a.join("  /  ");
      else if(q.t === "order") a = q.a;
      else if(q.t === "build") a = q.model + " (accept any sentence with the same pattern)";
      else if(q.t === "write" || q.t === "say") a = "Open response — mark against the checklist";
      kb.appendChild(node(`<div style="padding:7px 0;border-bottom:1px solid var(--rule);font-size:.94rem"><b>${i+1}.</b> ${esc(a)}${q.why?`<div class="muted" style="font-size:.86rem">${q.why}</div>`:""}</div>`));
    });
  };
  rows(L.practice, "Guided practice");
  rows(L.test, "Chapter test");
  box.appendChild(key);
  return box;
}

/* ---------- Mixed practice ---------- */
function viewQuickReview(){
  const t = S.reviewTarget, L = lessonById(t.id);
  const wrap = node(`<div class="wrap"></div>`);
  const slot = (S.schedule[t.id]||[])[t.i] || {label:"Review"};
  wrap.appendChild(node(`
    <section class="hero">
      <div class="u">Spaced revision · ${slot.label}</div>
      <h1>${L.title}</h1>
      <p class="lead">Five questions from a lesson you have already finished. Coming back to it on day 1, 3 and 7 is what moves it into long-term memory.</p>
    </section>`));

  const weak = weakAreas().map(w => w.cat);
  const pool = L.practice.concat(L.test).filter(q => ["mcq","fill","correct","order"].includes(q.t));
  const set = pool.map(q => ({q, w: Math.random() + (weak.indexOf(q.cat) >= 0 ? 1 : 0)}))
                  .sort((a,b) => b.w - a.w).slice(0,5).map(x => x.q);
  let n = 0;
  const meter = node(`<div class="card" style="padding:12px 16px"><div class="u" style="margin-bottom:6px"><span id="qcount">0 of ${set.length}</span> answered</div><div class="bar"><i id="qbar" style="width:0%"></i></div></div>`);
  wrap.appendChild(meter);
  set.forEach((q,i) => wrap.appendChild(questionCard(q, {index:i, total:set.length, onResult:() => {
    n++; $("#qcount", meter).textContent = `${n} of ${set.length}`; $("#qbar", meter).style.width = n/set.length*100 + "%";
    if(n === set.length){
      if(S.schedule[t.id] && S.schedule[t.id][t.i]) S.schedule[t.id][t.i].done = true;
      S.reviewTarget = null; save();
      toast("Revision done — the next one is scheduled");
    }
  }})));
  const out = node(`<div class="btnrow"><button class="btn quiet">Not now</button></div>`);
  $("button", out).onclick = () => { S.reviewTarget = null; save(); go("today"); };
  wrap.appendChild(out);
  return wrap;
}

function viewPractise(){
  if(S.reviewTarget && lessonById(S.reviewTarget.id)) return viewQuickReview();
  const wrap = node(`<div class="wrap"></div>`);
  wrap.appendChild(node(`
    <section class="hero">
      <div class="u">Mixed review</div>
      <h1>Ten questions, no warning.</h1>
      <p class="lead">Drawn from the lessons you have opened, weighted towards the things you got wrong. This is how you stop forgetting.</p>
    </section>`));

  const pool = [];
  LESSONS.forEach(l => {
    const p = prog(l.id);
    const touched = lessonPct(l.id) > 0 || Object.keys(p.practice).length > 0 || p.test;
    if(!touched) return;
    l.practice.concat(l.test).forEach(q => { if(["mcq","fill","correct","order"].includes(q.t)) pool.push(q); });
  });

  if(!pool.length){
    wrap.appendChild(node(`<div class="locked">Open a lesson first. Mixed practice pulls from what you have already studied, so there is nothing to draw on yet.</div>`));
    const b = node(`<div class="btnrow"><button class="btn">Go to the course</button></div>`);
    $("button", b).onclick = () => go("course");
    wrap.appendChild(b);
    return wrap;
  }

  const weak = weakAreas().map(w => w.cat);
  const scored = pool.map(q => ({q, w: Math.random() + (weak.indexOf(q.cat) >= 0 ? 1.2 - weak.indexOf(q.cat)*0.1 : 0)}));
  const set = scored.sort((a,b) => b.w - a.w).slice(0, 10).map(x => x.q);

  let n = 0;
  const meter = node(`<div class="card" style="padding:12px 16px"><div class="u" style="margin-bottom:6px"><span id="mcount">0 of ${set.length}</span> answered</div><div class="bar"><i id="mbar" style="width:0%"></i></div></div>`);
  wrap.appendChild(meter);
  set.forEach((q, i) => wrap.appendChild(questionCard(q, {index:i, total:set.length, onResult:() => {
    n++; $("#mcount", meter).textContent = `${n} of ${set.length}`; $("#mbar", meter).style.width = n/set.length*100 + "%";
    if(n === set.length) toast("Mixed review done — check Review for your weak areas");
  }})));

  const again = node(`<div class="btnrow"><button class="btn quiet">Give me ten more</button></div>`);
  $("button", again).onclick = () => render();
  wrap.appendChild(again);
  return wrap;
}

/* ---------- Review ---------- */
function viewReview(){
  const wrap = node(`<div class="wrap"></div>`);
  const weak = weakAreas();
  wrap.appendChild(node(`
    <section class="hero">
      <div class="u">Review</div>
      <h1>What keeps catching you out.</h1>
      <p class="lead">Every wrong answer is filed under a category. The categories with the most mistakes are the ones worth ten minutes tonight.</p>
    </section>`));

  if(!weak.length){
    wrap.appendChild(node(`<div class="locked">No mistakes recorded yet. Answer some practice questions and this page will fill up.</div>`));
  } else {
    const card = node(`<div class="card ruled"><div class="eyebrow"><span class="dot"></span><span class="u">Mistakes by category</span></div></div>`);
    weak.forEach(w => {
      const rec = lessonsForCategory(w.cat)[0];
      const row = node(`<div class="weak">
        <div><b style="font-family:var(--display)">${esc(w.cat)}</b>
          <div class="n">${w.wrong} wrong out of ${w.total}</div></div>
      </div>`);
      if(rec){ const b = node(`<button class="btn sm quiet">Revise</button>`); b.onclick = () => go("lesson", rec.id, "learn"); row.appendChild(b); }
      card.appendChild(row);
    });
    wrap.appendChild(card);
    const b = node(`<div class="btnrow"><button class="btn">Practise these now</button></div>`);
    $("button", b).onclick = () => go("practise");
    wrap.appendChild(b);
  }

  /* spaced revision schedule */
  const due = dueReviews();
  const sched = node(`<div class="card"><div class="eyebrow"><span class="dot"></span><span class="u">Revision schedule</span></div></div>`);
  if(due.length){
    due.forEach(d => {
      const L2 = lessonById(d.id);
      const row = node(`<div class="due"><div><b style="font-family:var(--display)">${L2.title}</b><div class="n" style="color:var(--amber)">${d.label} · due now</div></div></div>`);
      const b = node(`<button class="btn sm">Start</button>`);
      b.onclick = () => { S.reviewTarget = {id:d.id, i:d.i}; go("practise"); };
      row.appendChild(b); sched.appendChild(row);
    });
  } else {
    sched.appendChild(node(`<p class="muted" style="margin:0">Nothing due right now. A lesson enters the schedule when you submit its test, and comes back today, tomorrow, after 3 days and after 7 days.</p>`));
  }
  const upcoming = Object.keys(S.schedule||{}).map(id => ({id, r:nextReview(id)}))
      .filter(x => x.r && x.r.due > Date.now() && lessonById(x.id));
  if(upcoming.length){
    sched.appendChild(node(`<div class="u" style="margin:12px 0 6px">Coming up</div>` +
      upcoming.map(x => `<div class="weak"><div><b style="font-family:var(--display)">${lessonById(x.id).title}</b><div class="n" style="color:var(--ink-faint)">${x.r.label} · ${dayName(x.r.due)}</div></div></div>`).join("")));
  }
  wrap.appendChild(sched);

  /* mistake notebook */
  const groups = mistakesByTopic();
  if(groups.length){
    const nb = node(`<div class="card"><div class="eyebrow"><span class="dot"></span><span class="u">My mistakes · ${S.mistakes.length} saved</span></div>
      <p class="muted" style="margin-bottom:10px">Your own answer against the correct one, grouped by topic.</p></div>`);
    groups.forEach(([topic, items]) => {
      const det = node(`<details class="mgroup"><summary><b>${esc(topic)}</b> <span class="n">${items.length}</span></summary></details>`);
      items.slice(0,8).forEach(m => {
        det.appendChild(node(`<div class="mnote">
          <div class="qq">${esc(m.q).slice(0,120)}</div>
          <div><span class="mk x">✗</span><span class="wrong">${esc(m.mine)}</span></div>
          <div><span class="mk v">✓</span><span class="right">${esc(m.right)}</span></div>
          ${m.why?`<div class="why">${m.why}</div>`:""}
          <div class="srcref">${esc(m.lesson||"")}</div>
        </div>`));
      });
      nb.appendChild(det);
    });
    const clear = node(`<div class="btnrow"><button class="btn sm quiet">Clear my mistake notebook</button></div>`);
    $("button", clear).onclick = () => { if(confirm("Delete all saved mistakes?")){ S.mistakes = []; save(); render(); } };
    nb.appendChild(clear);
    wrap.appendChild(nb);
  }

  /* everything you have got wrong, as a mistake sheet */
  const seen = [];
  LESSONS.forEach(l => l.mistakes.forEach(m => { if(weak.some(w => w.cat === m.cat)) seen.push({...m, lesson:l.title}); }));
  if(seen.length){
    wrap.appendChild(node(`
      <div class="card">
        <div class="eyebrow"><span class="dot"></span><span class="u">Your mistake sheet</span></div>
        ${seen.slice(0,10).map(m=>`<div class="mistake">
          <div><span class="mk x">✗</span><span class="wrong">${esc(m.wrong)}</span></div>
          <div><span class="mk v">✓</span><span class="right">${esc(m.right)}</span></div>
          <div class="why">${m.why} <span class="muted">· ${esc(m.lesson)}</span></div></div>`).join("")}
      </div>`));
  }
  return wrap;
}

      </div>
      <div class="bar" style="margin-top:7px"><i style="width:${pct}%"></i></div>
      <div style="margin-top:7px">${STEPS.map(s=>`<span class="tag ${p.steps[s.id]?"g":""}" style="${p.steps[s.id]?"":"background:var(--paper);color:var(--ink-faint)"}">${s.label}</span>`).join("")}</div>
    </div>`);
    row.style.cursor = "pointer";
    row.onclick = () => go("lesson", l.id, firstUnfinishedStep(l.id));
    card.appendChild(row);
  });
  wrap.appendChild(card);

  const reset = node(`<div class="btnrow"><button class="btn quiet">Clear all my progress</button></div>`);
  $("button", reset).onclick = () => {
    if(confirm("This deletes every score, saved piece of writing and mistake record. Continue?")){
      S.progress = {}; S.errors = {}; S.mistakes = []; S.schedule = {}; S.reviewTarget = null;
      save(); toast("Progress cleared"); go("today");
    }
  };
  wrap.appendChild(reset);
  return wrap;
}

/* ---------- boot ---------- */
(async function boot(){
  const saved = await Store.get(KEY);
  if(saved && typeof saved === "object") S = Object.assign(S, saved);
  if(!Array.isArray(S.mistakes)) S.mistakes = [];
  if(!S.schedule || typeof S.schedule !== "object") S.schedule = {};
  if(S.view === "lesson" && !lessonById(S.lessonId)) { S.view = "today"; S.lessonId = null; }
  render();
  booted = true;
  /* Ask the parent for the cloud copy. Rendering first from the local cache
     keeps the page instant; the reply arrives a beat later and re-renders
     with anything done on another device. */
  if(inLifeOS){ try { window.parent.postMessage({ type:"lifeos:comm:ready" }, "*"); } catch(e){} }
})();

document.addEventListener("keydown", e => {
  if(e.key === "Escape" && S.view === "lesson") go("course");
});
</script>
</body>
</html>
