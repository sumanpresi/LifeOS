iv class=\"wm-qitem\">4. The hand that rocks the cradle rules the world.<\/div>\n<div class=\"wm-qitem\">5. Before I die I intend to see Venice.<\/div>\n<div class=\"wm-qitem\">6. Let us rejoice as we go forward.<\/div>\n<div class=\"wm-qitem\">7. I was reading a book which I had read before.<\/div>\n<div class=\"wm-qitem\">8. Perhaps he thinks that I am a fool.<\/div>\n<div class=\"wm-qitem\">9. As I drew near I saw a very curious sight.<\/div>\n<div class=\"wm-qitem\">10. Where are the friends whom I knew?<\/div>\n<h4>Exercise 36: Write Clauses to replace phrases<\/h4>\n<div class=\"wm-qitem\">1. He cannot find <em>a place to sleep in<\/em>.<\/div>\n<div class=\"wm-qitem\">2. The girl <em>with long hair<\/em> is my cousin.<\/div>\n<div class=\"wm-qitem\">3. Have you heard <em>the news<\/em>?<\/div>\n<div class=\"wm-qitem\">4. <em>In spite of his efforts<\/em> he failed.<\/div>\n<div class=\"wm-qitem\">5. He walked slowly <em>to avoid slipping<\/em>.<\/div>\n<\/div>\n<\/div>", "src": ["1-22"], "desc": "A Clause is a group of words that forms part of a sentence, and has a Subject and a Predicate of its own.", "n": 29, "ex": 7, "items": 129, "ans": 0, "words": 1537, "cn": 3}, {"part": 2, "title": "Sentences: Simple, Compound and Complex", "html": "<div class=\"wm-rule\">\n<h4>Three Types of Sentences<\/h4>\n<p>Based on structure, sentences are classified into three types:<\/p>\n<ul>\n<li><strong>Simple Sentence<\/strong> - One Subject and one Predicate<\/li>\n<li><strong>Compound Sentence<\/strong> - Two or more Principal/Main Clauses<\/li>\n<li><strong>Complex Sentence<\/strong> - One Main Clause and one or more Subordinate Clauses<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Simple Sentences<\/h3>\n<p>A <strong>Simple sentence<\/strong> is one which has only one Subject and one Predicate, or only one Finite Verb.<\/p>\n<div class=\"wm-example\">\n<h4>Examples of Simple Sentences<\/h4>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">His courage<\/span> <span class=\"wm-hl\">won him honour<\/span>.\n                    <\/div>\n<p><em>One Subject (His courage) and one Predicate (won him honour)<\/em><\/p>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Compound Sentences<\/h3>\n<p>A <strong>Compound sentence<\/strong> is one made up of two or more Principal or Main Clauses.<\/p>\n<div class=\"wm-example\">\n<h4>Examples of Compound Sentences<\/h4>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">The moon<\/span> <span class=\"wm-hl\">was bright<\/span> <strong>and<\/strong> <span class=\"wm-hl\">we<\/span> <span class=\"wm-hl\">could see our way<\/span>.\n                    <\/div>\n<p><em>Two Main Clauses joined by coordinating conjunction \"and\"<\/em><\/p>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">Night<\/span> <span class=\"wm-hl\">came on<\/span> <strong>and<\/strong> <span class=\"wm-hl\">rain<\/span> <span class=\"wm-hl\">fell heavily<\/span> <strong>and<\/strong> <span class=\"wm-hl\">we all<\/span> <span class=\"wm-hl\">got very wet<\/span>.\n                    <\/div>\n<p><em>Three Main Clauses joined by coordinating conjunctions<\/em><\/p>\n<\/div>\n<div class=\"wm-note\">\n<strong>📌 Key Features of Compound Sentences:<\/strong>\n<ul>\n<li>Contains two or more Principal/Main Clauses<\/li>\n<li>Each clause can stand alone as a complete sentence<\/li>\n<li>Clauses are joined by coordinating conjunctions (and, but, or, so, yet, for, nor)<\/li>\n<li>All clauses are of equal importance (same order or rank)<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Complex Sentences<\/h3>\n<p>A <strong>Complex sentence<\/strong> contains one Main Clause and one or more Subordinate Clauses.<\/p>\n<div class=\"wm-example\">\n<h4>Examples of Complex Sentences<\/h4>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">They<\/span> <span class=\"wm-hl\">rested<\/span> <span class=\"wm-hl\">when evening came<\/span>.\n                    <\/div>\n<p><em>Main Clause: \"They rested\" + Subordinate Clause: \"when evening came\"<\/em><\/p>\n<div class=\"wm-example\">\n<span class=\"wm-hl\">As the boxers advanced into the ring<\/span>, <span class=\"wm-hl\">the people<\/span> <span class=\"wm-hl\">said<\/span> <span class=\"wm-hl\">they would not allow them to fight<\/span>.\n                    <\/div>\n<p><em>Main Clause: \"the people said...\" + Two Subordinate Clauses<\/em><\/p>\n<\/div>\n<div class=\"wm-note\">\n<strong>📌 Key Features of Complex Sentences:<\/strong>\n<ul>\n<li>Contains one Main/Principal Clause<\/li>\n<li>Contains one or more Subordinate/Dependent Clauses<\/li>\n<li>Subordinate clauses cannot stand alone<\/li>\n<li>Subordinate clauses function as nouns, adjectives, or adverbs<\/li>\n<li>Joined by subordinating conjunctions (when, because, if, that, which, who, etc.)<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Interactive Example - Click to See Analysis!<\/h4>\n<div>\n<p><strong>Simple:<\/strong> <span>Dogs bark.<\/span><\/p>\n<p><strong>Compound:<\/strong> <span>The sun was shining and the birds were singing.<\/span><\/p>\n<p><strong>Complex:<\/strong> <span>When the sun rose, the birds began to sing.<\/span><\/p>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Simple Sentence<\/h4>\n<p><strong>Structure:<\/strong> One clause<\/p>\n<p><strong>Example:<\/strong> The cat sleeps.<\/p>\n<p><strong>Features:<\/strong><\/p>\n<ul>\n<li>One subject, one predicate<\/li>\n<li>One finite verb<\/li>\n<li>Expresses one complete thought<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-example\">\n<h4>Compound Sentence<\/h4>\n<p><strong>Structure:<\/strong> Two+ main clauses<\/p>\n<p><strong>Example:<\/strong> The cat sleeps, and the dog plays.<\/p>\n<p><strong>Features:<\/strong><\/p>\n<ul>\n<li>Multiple independent clauses<\/li>\n<li>Coordinating conjunctions<\/li>\n<li>Equal importance of clauses<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<div class=\"wm-example\" style=\"margin: 20px 0; background: #f0f8ff; border: 2px solid #4169e1;\">\n<h4>Complex Sentence<\/h4>\n<p><strong>Structure:<\/strong> One main + subordinate clause(s)<\/p>\n<p><strong>Example:<\/strong> When I arrived, the cat was sleeping.<\/p>\n<p><strong>Features:<\/strong><\/p>\n<ul>\n<li>One independent clause<\/li>\n<li>One or more dependent clauses<\/li>\n<li>Subordinating conjunctions<\/li>\n<li>Hierarchy of clauses<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table>\n<thead>\n<tr>\n<th>Sentence Type<\/th>\n<th>Structure<\/th>\n<th>Conjunction Type<\/th>\n<th>Example<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Simple<\/td>\n<td>1 Main Clause<\/td>\n<td>None (or coordinating within phrases)<\/td>\n<td>Birds fly.<\/td>\n<\/tr>\n<tr>\n<td>Compound<\/td>\n<td>2+ Main Clauses<\/td>\n<td>Coordinating (and, but, or, so)<\/td>\n<td>Birds fly and fish swim.<\/td>\n<\/tr>\n<tr>\n<td>Complex<\/td>\n<td>1 Main + 1+ Subordinate<\/td>\n<td>Subordinating (when, because, if)<\/td>\n<td>When winter comes, birds migrate.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n Practice: Identify Sentence Types\n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> Identify whether each sentence is Simple, Compound, or Complex.<\/p>\n<div class=\"wm-qitem\">1. The dog barked loudly.<\/div>\n<div class=\"wm-qitem\">2. I went to the store, and I bought some milk.<\/div>\n<div class=\"wm-qitem\">3. When the rain stopped, we went outside.<\/div>\n<div class=\"wm-qitem\">4. She studied hard for the exam.<\/div>\n<div class=\"wm-qitem\">5. The book that I read was very interesting.<\/div>\n<div class=\"wm-qitem\">6. He ran fast, but he missed the bus.<\/div>\n<div class=\"wm-qitem\">7. Although it was late, she continued working.<\/div>\n<div class=\"wm-qitem\">8. The sun shines brightly.<\/div>\n<div class=\"wm-qitem\">9. We can go to the movies, or we can stay home.<\/div>\n<div class=\"wm-qitem\">10. Since you asked, I'll tell you the truth.<\/div>\n<div class=\"wm-qitem\">11. The teacher explained the lesson clearly and the students understood.<\/div>\n<div class=\"wm-qitem\">12. What you said makes perfect sense.<\/div>\n<div class=\"wm-qitem\">13. The concert was cancelled because of rain.<\/div>\n<div class=\"wm-qitem\">14. She laughed, and everyone joined in.<\/div>\n<div class=\"wm-qitem\">15. The car that broke down belongs to my neighbor.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-note\">\n<strong>🎯 Quick Identification Tips:<\/strong>\n<ul>\n<li><strong>Simple:<\/strong> Count finite verbs - if only one, it's simple<\/li>\n<li><strong>Compound:<\/strong> Look for coordinating conjunctions joining equal clauses<\/li>\n<li><strong>Complex:<\/strong> Look for subordinating conjunctions or relative pronouns<\/li>\n<li><strong>Test:<\/strong> Can you split the sentence into independent parts? If yes, it's compound or complex<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Further coverage — identifying sentence types<\/span><\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h3>Key Definitions<\/h3>\n<p><strong>Simple Sentence:<\/strong> One which has only one Subject and one Predicate (OR one which has only one Finite Verb)<\/p>\n<p><strong>Compound Sentence:<\/strong> One made up of two or more Principal or Main Clauses<\/p>\n<p><strong>Complex Sentence:<\/strong> Consists of one Main Clause and one or more Subordinate Clauses<\/p>\n<\/div>\n<h3>Example Analysis<\/h3>\n<div class=\"wm-example\">\n<p><strong>1. His courage won him honour.<\/strong> → Simple (one subject + one predicate)<\/p>\n<p><strong>2. The moon was bright and we could see our way.<\/strong> → Compound (two main clauses joined by 'and')<\/p>\n<p><strong>3. They rested when evening came.<\/strong> → Complex (main clause + subordinate clause)<\/p>\n<\/div>\n<div class=\"wm-note\">\n<p><strong>Note:<\/strong> The term <em>Double<\/em> is used for a sentence with two principal clauses, and <em>Multiple<\/em> for more than two principal clauses.<\/p>\n<\/div>\n<h3>Co-ordinating Conjunctions<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li>I shall do it now <strong>or<\/strong> I shall not do it at all.<\/li>\n<li>He gave them no money <strong>nor<\/strong> did he help them in any way.<\/li>\n<li>He threw the stone <strong>but<\/strong> it missed the dog.<\/li>\n<li>He <strong>neither<\/strong> obtains success <strong>nor<\/strong> deserves it.<\/li>\n<li>He is <strong>either<\/strong> mad <strong>or<\/strong> he has become a criminal.<\/li>\n<li>I <strong>both<\/strong> thanked him <strong>and<\/strong> rewarded him.<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n                         Exercise 37: Identify Compound vs Complex Sentences\n                        \n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<div class=\"wm-qitem\">1. The horse reared and the rider was thrown.<\/div>\n<div class=\"wm-qitem\">2. Walk quickly, else you will not overtake him.<\/div>\n<div class=\"wm-qitem\">3. The town in which I live is very large.<\/div>\n<div class=\"wm-qitem\">4. I called him, but he gave me no answer.<\/div>\n<div class=\"wm-qitem\">5. I agree to your proposals, for I think them reasonable.<\/div>\n<div class=\"wm-qitem\">6. I went because I was invited.<\/div>\n<div class=\"wm-qitem\">7. Either he is drowned or some passing ship has saved him.<\/div>\n<div class=\"wm-qitem\">8. I returned home because I was tired.<\/div>\n<div class=\"wm-qitem\">9. They always talk who never think.<\/div>\n<div class=\"wm-qitem\">10. He came oftener than we expected.<\/div>\n<div class=\"wm-qitem\">11. He blushes; therefore he is guilty.<\/div>\n<div class=\"wm-qitem\">12. A guest is unwelcome when he stays too long.<\/div>\n<div class=\"wm-qitem\">13. Whatever you do, do well.<\/div>\n<div class=\"wm-qitem\">14. He must have done his duty, for he is a conscientious man.<\/div>\n<div class=\"wm-qitem\">15. He rushed into the field, and foremost fighting fell.<\/div>\n<div class=\"wm-qitem\">16. Man proposes, but God disposes.<\/div>\n<div class=\"wm-qitem\">17. Where ignorance is bliss, 'tis folly to be wise.<\/div>\n<div class=\"wm-qitem\">18. Listen carefully and take notes.<\/div>\n<div class=\"wm-qitem\">19. The heavens declare the glory of God; and the firmament showeth His handiwork.<\/div>\n<div class=\"wm-qitem\">20. He tried hard, but he did not succeed.<\/div>\n<div class=\"wm-qitem\">21. She must weep or she will die.<\/div>\n<div class=\"wm-qitem\">22. They serve God well who serve His creatures.<\/div>\n<div class=\"wm-qitem\">23. Man is guided by reason, and beast by instinct.<\/div>\n<div class=\"wm-qitem\">24. Quarrels would not last long if the fault were only on one side.<\/div>\n<div class=\"wm-qitem\">25. God made the country and man made the town.<\/div>\n<div class=\"wm-qitem\">26. He trudged on, though he was very tired.<\/div>\n<div class=\"wm-qitem\">27. There was one philosopher who chose to live in a tub.<\/div>\n<div class=\"wm-qitem\">28. The Commons passed the bill, but the Lords threw it out.<\/div>\n<div class=\"wm-qitem\">29. Tell me the news as you have heard.<\/div>\n<div class=\"wm-qitem\">30. He that has most time has none to lose.<\/div>\n<div class=\"wm-qitem\">31. Your arguments are weighty; still they do not convince me.<\/div>\n<div class=\"wm-qitem\">32. Everything comes, if a man will only work and wait.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["1-22", "22-35"], "desc": "Based on structure, sentences are classified into three types:", "n": 30, "ex": 2, "items": 47, "ans": 0, "words": 1120, "cn": 4}, {"part": 2, "title": "More About Noun Clauses", "html": "<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h3>What is a Noun Clause?<\/h3>\n<p>A Noun Clause is a subordinate clause which does the work of a noun in a Complex sentence.<\/p>\n<\/div>\n<h3>Functions of Noun Clauses<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>1. Subject of a verb<\/h4>\n<p><em>That you should say so<\/em> surprises me.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>2. Object of a transitive verb<\/h4>\n<p>He says <em>that he won't go<\/em>.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>3. Object of a preposition<\/h4>\n<p>Pay attention to <em>what I am going to say<\/em>.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>4. In Apposition<\/h4>\n<p>Your statement <em>that you found the money<\/em> will not be believed.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>5. Complement of a verb<\/h4>\n<p>My belief is <em>that he will not come<\/em>.<\/p>\n<\/div>\n<\/div>\n<h3>Examples by Function<\/h3>\n<div class=\"wm-example\">\n<h4>As Subject:<\/h4>\n<ul>\n<li><strong>That it would rain<\/strong> seemed likely.<\/li>\n<li><strong>What he said<\/strong> was true.<\/li>\n<li><strong>When I shall return<\/strong> is uncertain.<\/li>\n<li><strong>How he could assist his friend<\/strong> was his chief concern.<\/li>\n<li><strong>Why he left<\/strong> is a mystery.<\/li>\n<li><strong>Whether we can start tomorrow<\/strong> seems uncertain.<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-example\">\n<h4>As Object:<\/h4>\n<ul>\n<li>I hoped <strong>that it was true<\/strong>.<\/li>\n<li>She denied <strong>that she had written the letter<\/strong>.<\/li>\n<li>I cannot tell <strong>what has become of him<\/strong>.<\/li>\n<li>I do not know <strong>when I shall return<\/strong>.<\/li>\n<li>I asked the boy <strong>how old he was<\/strong>.<\/li>\n<li>Tell me <strong>why you did this<\/strong>.<\/li>\n<li>No one knows <strong>who he is<\/strong>.<\/li>\n<li>I earn <strong>whatever I can<\/strong>.<\/li>\n<li>Ask <strong>if he is at home<\/strong>.<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-note\">\n<p><strong>Note:<\/strong> A Noun Clause is generally introduced by the subordinating conjunction <em>that<\/em>. Sometimes, however, the conjunction <em>that<\/em> is omitted; as \"I know (that) he did it.\"<\/p>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n                         Exercise 38: Write Complex Sentences with Noun Clauses\n                        \n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> Write down a dozen Complex sentences, each containing a Noun Clause. Make the Noun Clause the Subject in the first three, the Object in the next three, and in Apposition to a Noun or Pronoun in the next three. Use the Noun Clause predicatively in the last three.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n                         Exercise 39: Identify Noun Clause Functions\n                        \n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<div class=\"wm-qitem\">1. Tell me how you found that out.<\/div>\n<div class=\"wm-qitem\">2. That he will succeed is certain.<\/div>\n<div class=\"wm-qitem\">3. I think you have made a mistake.<\/div>\n<div class=\"wm-qitem\">4. She says her mother is ill.<\/div>\n<div class=\"wm-qitem\">5. How long I shall stay here is doubtful.<\/div>\n<div class=\"wm-qitem\">6. I did not know that he had come.<\/div>\n<div class=\"wm-qitem\">7. It is clear that he was guilty.<\/div>\n<div class=\"wm-qitem\">8. I do not understand how it all happened.<\/div>\n<div class=\"wm-qitem\">9. Can you tell who wrote Shakuntala?<\/div>\n<div class=\"wm-qitem\">10. All depends on how it is done.<\/div>\n<div class=\"wm-qitem\">11. Do you deny that you stole the purse?<\/div>\n<div class=\"wm-qitem\">12. The law will punish whosoever is guilty.<\/div>\n<div class=\"wm-qitem\">13. I think I know your face.<\/div>\n<div class=\"wm-qitem\">14. Ask if dinner is ready.<\/div>\n<div class=\"wm-qitem\">15. The report that he was killed is untrue.<\/div>\n<div class=\"wm-qitem\">16. He was very hopeful that he would succeed.<\/div>\n<div class=\"wm-qitem\">17. Do whatever you think right.<\/div>\n<div class=\"wm-qitem\">18. I don't see how you can get out of this mess.<\/div>\n<div class=\"wm-qitem\">19. Do you know when the train will arrive?<\/div>\n<div class=\"wm-qitem\">20. Whoever came was made welcome.<\/div>\n<div class=\"wm-qitem\">21. I understand you want a situation.<\/div>\n<div class=\"wm-qitem\">22. My verdict is that the prisoners shall die.<\/div>\n<div class=\"wm-qitem\">23. I cannot express how sorry I am.<\/div>\n<div class=\"wm-qitem\">24. They guessed what he meant.<\/div>\n<div class=\"wm-qitem\">25. I am afraid that she will be angry.<\/div>\n<div class=\"wm-qitem\">26. Will you explain why you behaved so?<\/div>\n<div class=\"wm-qitem\">27. No one can tell how this will end.<\/div>\n<div class=\"wm-qitem\">28. The truth is that we have been deceived.<\/div>\n<div class=\"wm-qitem\">29. It is not clear who has done this.<\/div>\n<div class=\"wm-qitem\">30. I do not know how I can deal with this rascal.<\/div>\n<div class=\"wm-qitem\">31. I did not know whether I should laugh or cry.<\/div>\n<div class=\"wm-qitem\">32. We are desirous that you should succeed.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["22-35"], "desc": "A Noun Clause is a subordinate clause which does the work of a noun in a Complex sentence.", "n": 31, "ex": 2, "items": 32, "ans": 0, "words": 568, "cn": 5}, {"part": 2, "title": "More About Adjective Clauses", "html": "<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h3>What is an Adjective Clause?<\/h3>\n<p>An Adjective Clause in a Complex sentence is a subordinate clause which does the work of an Adjective, and so qualifies some noun or pronoun in the main clause.<\/p>\n<\/div>\n<h3>Introduction Methods<\/h3>\n<div class=\"wm-example\">\n<h4>Introduced by Relative Pronouns or Relative Adverbs:<\/h4>\n<ul>\n<li>Uneasy lies the head <strong>that wears a crown<\/strong>.<\/li>\n<li>He is the man <strong>whom we all respect<\/strong>.<\/li>\n<li>The time <strong>when the boat leaves<\/strong> is not yet fixed.<\/li>\n<li>The house <strong>where the accident occurred<\/strong> is nearby.<\/li>\n<li>The reason <strong>why I did it<\/strong> is obvious.<\/li>\n<\/ul>\n<\/div>\n<h3>Co-ordinate vs Subordinate Clauses<\/h3>\n<div class=\"wm-note\">\n<p><strong>Sometimes a Relative Pronoun introduces a Co-ordinate clause:<\/strong><\/p>\n<p>I met Rama, <strong>who (= and he) gave me your message<\/strong>.<\/p>\n<p>This is co-ordinate because it doesn't identify or describe Rama - it just adds information.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>More Co-ordinate Examples:<\/h4>\n<ul>\n<li>I met Mr. Joshi, <strong>who (= and he) thereupon shook hands with me<\/strong>.<\/li>\n<li>The prisoner was taken before the Captain, <strong>who (= and he) condemned him to instant death<\/strong>.<\/li>\n<li>He gave me a message, <strong>which (= and it) is this<\/strong>.<\/li>\n<li>He released the bird, <strong>which (= and it) at once flew away<\/strong>.<\/li>\n<\/ul>\n<\/div>\n<h3>Understood Relative Pronouns/Adverbs<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li>Eat all ^ you can. [<em>that<\/em> is understood]<\/li>\n<li>I saw a man ^ I know. [<em>whom<\/em> is understood]<\/li>\n<li>Where's the book ^ he left for me? [<em>which<\/em> is understood]<\/li>\n<li>On the day ^ you pass the examination I shall give you a reward. [<em>when<\/em> is understood]<\/li>\n<li>The reason ^ I have come is to ask for my money. [<em>why<\/em> is understood]<\/li>\n<\/ul>\n<\/div>\n<h3>Historical Note: \"But\" as Relative Pronoun<\/h3>\n<div class=\"wm-note\">\n<p>In older English, <em>but<\/em> was used as a relative pronoun equivalent to a relative pronoun followed by <em>not<\/em>:<\/p>\n<ul>\n<li>There was not a woman present <strong>but wept<\/strong> to hear such news. [= who did not weep]<\/li>\n<li>And not a man of the three hundred at Thermopylae <strong>but died<\/strong> at his post. [= who did not die]<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n                         Exercise 40: Pick out Adjective Clauses\n                        \n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<div class=\"wm-qitem\">1. This is the house that Jack built.<\/div>\n<div class=\"wm-qitem\">2. He that climbs too high is sure to fall.<\/div>\n<div class=\"wm-qitem\">3. She sleeps the sleep that knows no waking.<\/div>\n<div class=\"wm-qitem\">4. We obeyed the order the teacher gave us.<\/div>\n<div class=\"wm-qitem\">5. Servants that are honest are trusted.<\/div>\n<div class=\"wm-qitem\">6. They never fail who die in a great cause.<\/div>\n<div class=\"wm-qitem\">7. We love those who love us.<\/div>\n<div class=\"wm-qitem\">8. The moment which is lost is lost for ever.<\/div>\n<div class=\"wm-qitem\">9. I have a little shadow which goes in and out with me.<\/div>\n<div class=\"wm-qitem\">10. It is an ill wind that blows nobody good.<\/div>\n<div class=\"wm-qitem\">11. Youth is the time when the seeds of character are sown.<\/div>\n<div class=\"wm-qitem\">12. It was the schooner Hesperus that sailed the wintry sea.<\/div>\n<div class=\"wm-qitem\">13. They never pardon who have done the wrong.<\/div>\n<div class=\"wm-qitem\">14. He has a son who has made a name for himself.<\/div>\n<div class=\"wm-qitem\">15. A friend who helps you in time of need is a real friend.<\/div>\n<div class=\"wm-qitem\">16. All that glitters is not gold.<\/div>\n<div class=\"wm-qitem\">17. He could not answer the question I asked him.<\/div>\n<div class=\"wm-qitem\">18. He laughs best who laughs last.<\/div>\n<div class=\"wm-qitem\">19. All the blessings we enjoy come from God.<\/div>\n<div class=\"wm-qitem\">20. They that are whole have no need of the physician.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n                         Exercise 41: Make sentences with understood Relative Pronouns\n                        \n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> Make ten sentences, each containing an Adjective Clause, in which a Relative Pronoun is understood.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n                         Exercise 42: Make sentences with understood Relative Adverbs\n                        \n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> Make ten sentences, each containing an Adjective Clause, in which a Relative Adverb is understood.<\/p>\n<\/div>\n<\/div>\n<\/div>", "src": ["22-35"], "desc": "An Adjective Clause in a Complex sentence is a subordinate clause which does the work of an Adjective, and so qualifies some noun or pronoun in the main clause.", "n": 32, "ex": 3, "items": 20, "ans": 0, "words": 565, "cn": 6}, {"part": 2, "title": "More About Adverb Clauses", "html": "<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h3>What is an Adverb Clause?<\/h3>\n<p>An Adverb clause is a subordinate clause which does the work of an Adverb. It may modify some verb, adjective, or Adverb in the main clause.<\/p>\n<\/div>\n<h3>Types of Adverb Clauses<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>1. Time<\/h4>\n<p>When, while, after, before, since, as<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>2. Place<\/h4>\n<p>Where, wherever<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>3. Purpose<\/h4>\n<p>So that, in order that, lest<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>4. Cause/Reason<\/h4>\n<p>Because, as, since, that<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>5. Condition<\/h4>\n<p>If, whether, unless<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>6. Result<\/h4>\n<p>That (often with so/such)<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>7. Comparison<\/h4>\n<p>Than, as (degree &amp; manner)<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>8. Concession<\/h4>\n<p>Though, although, even if<\/p>\n<\/div>\n<\/div>\n<h3>1. Adverb Clauses of Time<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li><strong>When<\/strong> you have finished your work you may go home.<\/li>\n<li>Don't talk <strong>while<\/strong> she is singing.<\/li>\n<li>He came <strong>after<\/strong> night had fallen.<\/li>\n<li>Do it <strong>before<\/strong> you forget.<\/li>\n<li>I have not been well <strong>since<\/strong> I returned from Chennai.<\/li>\n<li>There was silence <strong>as<\/strong> the leader spoke.<\/li>\n<li>The doctor always comes <strong>whenever<\/strong> he is sent for.<\/li>\n<li><strong>As soon as<\/strong> he heard the news he wrote to me.<\/li>\n<li><strong>No sooner<\/strong> did he see us <strong>than<\/strong> he disappeared.<\/li>\n<\/ul>\n<\/div>\n<h3>2. Adverb Clauses of Place<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li>I have put it <strong>where<\/strong> I can find it again.<\/li>\n<li>They can stay <strong>where<\/strong> they are.<\/li>\n<li><strong>Where<\/strong> you live I will live.<\/li>\n<li>He led the caravan <strong>wherever<\/strong> he wanted to go.<\/li>\n<li>Let him be arrested <strong>wherever<\/strong> he may be found.<\/li>\n<\/ul>\n<\/div>\n<h3>3. Adverb Clauses of Purpose<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li>I will give you a map <strong>so that<\/strong> you can find the way.<\/li>\n<li>We eat <strong>so that<\/strong> we may live.<\/li>\n<li>The UNO was formed <strong>in order that<\/strong> countries might discuss world problems better.<\/li>\n<li>He was extra polite to his superiors <strong>lest<\/strong> something adverse should be written into his records.<\/li>\n<\/ul>\n<\/div>\n<h3>4. Adverb Clauses of Cause or Reason<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li><strong>Because<\/strong> I like you, I shall help you.<\/li>\n<li>I did it <strong>because<\/strong> I wanted to.<\/li>\n<li><strong>Since<\/strong> you are so clever you will be able to explain this.<\/li>\n<li>I am glad <strong>that<\/strong> you like it.<\/li>\n<li><strong>As<\/strong> he was not there, I spoke to his brother.<\/li>\n<\/ul>\n<\/div>\n<h3>5. Adverb Clauses of Condition<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li><strong>If<\/strong> I like it, I shall buy it.<\/li>\n<li><strong>If<\/strong> it rains we shall stay at home.<\/li>\n<li>You must go <strong>whether<\/strong> you hear from him or not.<\/li>\n<li><strong>Unless<\/strong> you work harder you will fail.<\/li>\n<li>I will forgive you <strong>on condition that<\/strong> you do not repeat the offence.<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-note\">\n<p><strong>Note:<\/strong> Sometimes the Subordinating Conjunction is omitted in Adverb Clauses of Condition:<\/p>\n<ul>\n<li><strong>Had I not seen<\/strong> this with my own eyes I would not have believed it.<\/li>\n<li><strong>Were an angel to tell me<\/strong> such a thing of you, I would not believe it.<\/li>\n<\/ul>\n<\/div>\n<h3>6. Adverb Clauses of Result or Consequence<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li>They fought <strong>so bravely that<\/strong> the enemy were driven off.<\/li>\n<li>He is <strong>such a good man that<\/strong> all respect him.<\/li>\n<li><strong>So great a fire raged that<\/strong> London was burnt down.<\/li>\n<li>He spoke in <strong>such a low voice that<\/strong> few could hear him.<\/li>\n<li><strong>So cold was it that<\/strong> many died.<\/li>\n<\/ul>\n<\/div>\n<h3>7. Adverb Clauses of Comparison<\/h3>\n<div class=\"wm-example\">\n<h4>Degree:<\/h4>\n<ul>\n<li>He is older <strong>than<\/strong> he looks.<\/li>\n<li>No one can run faster <strong>than<\/strong> Rama.<\/li>\n<li>He is <strong>as<\/strong> stupid <strong>as<\/strong> he is lazy.<\/li>\n<li>He is not <strong>so<\/strong> clever <strong>as<\/strong> you think.<\/li>\n<\/ul>\n<h4>Manner:<\/h4>\n<ul>\n<li>You may do <strong>as<\/strong> you please.<\/li>\n<li>It all ended <strong>as<\/strong> I expected.<\/li>\n<li><strong>As<\/strong> you have made your bed <strong>so<\/strong> you must lie on it.<\/li>\n<li><strong>As<\/strong> the twig is bent the branch will grow.<\/li>\n<\/ul>\n<\/div>\n<h3>8. Adverb Clauses of Supposition or Concession<\/h3>\n<div class=\"wm-example\">\n<ul>\n<li><strong>Though<\/strong> I am poor I am honest.<\/li>\n<li><strong>Though<\/strong> the heavens fall, justice must be done.<\/li>\n<li><strong>Although<\/strong> troops had marched all day they fought bravely all night.<\/li>\n<li><strong>Even if<\/strong> it rains I shall come.<\/li>\n<li>I would not do it <strong>even if<\/strong> you paid me.<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n                         Exercise 52: Identify Adverb Clause Types\n                        \n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<div class=\"wm-qitem\">1. Forgive us as we forgive our enemies.<\/div>\n<div class=\"wm-qitem\">2. We sow so that we may reap.<\/div>\n<div class=\"wm-qitem\">3. He did it as I told him.<\/div>\n<div class=\"wm-qitem\">4. I couldn't be angry with him, if I tried.<\/div>\n<div class=\"wm-qitem\">5. He arrived as we were setting out.<\/div>\n<div class=\"wm-qitem\">6. If this story were false, what should you do?<\/div>\n<div class=\"wm-qitem\">7. It is ten hours since I had nothing to eat.<\/div>\n<div class=\"wm-qitem\">8. I make friends wherever I go.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["22-35"], "desc": "An Adverb clause is a subordinate clause which does the work of an Adverb.", "n": 33, "ex": 1, "items": 8, "ans": 0, "words": 658, "cn": 7}, {"part": 2, "title": "Analysis of Complex Sentences", "html": "<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h3>What is Clause Analysis?<\/h3>\n<p>Clause analysis means breaking up a given sentence into its several clauses and showing their relation to one another.<\/p>\n<\/div>\n<h3>Steps for Analyzing a Complex Sentence<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>Step 1<\/h4>\n<p>Find the Principal or Main Clause<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Step 2<\/h4>\n<p>Find the Subordinate Clause(s)<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Step 3<\/h4>\n<p>Show the relationship of each clause<\/p>\n<\/div>\n<\/div>\n<h3>Example Analysis<\/h3>\n<div class=\"wm-example\">\n<h4>Sentence: \"Whenever he heard the question, the old man who lived in that house, answered that the earth is flat.\"<\/h4>\n<p><strong>Complex sentence containing three Subordinate clauses:<\/strong><\/p>\n<ol>\n<li><strong>The old man.... answered<\/strong> (Principal clause)<\/li>\n<li><strong>Whenever he heard the question<\/strong> (Adverb clause of time, modifying answered in 1.)<\/li>\n<li><strong>Who lived in that house<\/strong> (Adjective clause, qualifying man in 1.)<\/li>\n<li><strong>That the earth is flat<\/strong> (Noun clause, object of answered in 1.)<\/li>\n<\/ol>\n<\/div>\n<h3>Nested Subordinate Clauses<\/h3>\n<div class=\"wm-example\">\n<h4>Example A: \"I think that he destroyed the letter which you sent there.\"<\/h4>\n<ol>\n<li><strong>I think....<\/strong> (Principal clause)<\/li>\n<li><strong>That he destroyed the letter ....<\/strong> (Noun Clause, object of think in 1.)<\/li>\n<li><strong>Which you sent there.....<\/strong> (Adjective clause, subordinate to 2, qualifying letter.)<\/li>\n<\/ol>\n<\/div>\n<div class=\"wm-example\">\n<h4>Example B: \"He replied that he worked whenever he liked.\"<\/h4>\n<ol>\n<li><strong>He replied....<\/strong> (Principal clause)<\/li>\n<li><strong>That he worked...<\/strong> (Noun clause, object of replied in 1.)<\/li>\n<li><strong>Whenever he liked...<\/strong> (Adverb clause, subordinate to 2, modifying worked.)<\/li>\n<\/ol>\n<\/div>\n<div class=\"wm-example\">\n<h4>Example C: \"I know the man who said that this would happen.\"<\/h4>\n<ol>\n<li><strong>I know the man....<\/strong> (Principal clause)<\/li>\n<li><strong>Who said....<\/strong> (Adjective clause, qualifying man in 1.)<\/li>\n<li><strong>That this would happen<\/strong> (Noun clause, object of said in 2.)<\/li>\n<\/ol>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\n                         Exercise 53: Use Clauses in Sentences\n                        \n<\/h4>\n<div class=\"wm-sub\">\n<p><strong>Instructions:<\/strong> Use each of the following clauses in a sentence, and say what work it does in your sentence.<\/p>\n<div class=\"wm-exercise\">\n<div class=\"wm-qitem\">1. that he was tired<\/div>\n<div class=\"wm-qitem\">2. where he was born<\/div>\n<div class=\"wm-qitem\">3. as he was told<\/div>\n<div class=\"wm-qitem\">4. what you say<\/div>\n<div class=\"wm-qitem\">5. whosoever is guilty<\/div>\n<div class=\"wm-qitem\">6. who laughs last<\/div>\n<div class=\"wm-qitem\">7. because he is generous<\/div>\n<div class=\"wm-qitem\">8. since you say so<\/div>\n<div class=\"wm-qitem\">9. as he deserved<\/div>\n<div class=\"wm-qitem\">10. before it was too late<\/div>\n<div class=\"wm-qitem\">11. as soon as he heard the news<\/div>\n<div class=\"wm-qitem\">12. that he soon overtook me<\/div>\n<div class=\"wm-qitem\">13. where he had left it<\/div>\n<div class=\"wm-qitem\">14. how old he was<\/div>\n<div class=\"wm-qitem\">15. if you are diligent<\/div>\n<div class=\"wm-qitem\">16. because I was tired<\/div>\n<div class=\"wm-qitem\">17. what has become of him<\/div>\n<div class=\"wm-qitem\">18. when the train will arrive<\/div>\n<div class=\"wm-qitem\">19. who did it<\/div>\n<div class=\"wm-qitem\">20. whatever you think right<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Further coverage — worked clause analysis and exercises<\/span><\/div>\n<div class=\"wm-sub\"><h4>What is Clause Analysis?<\/h4><p>Clause analysis involves breaking up a given sentence into its several clauses and showing their relation to one another.<\/p>\n<div class=\"wm-example\">\n<p class=\"wm-hl\">Whenever he heard the question, the old man who lived in that house, answered that the earth is flat.<\/p>\n<ol><li>1. The old man... answered (Principal clause)<\/li><li>2. Whenever he heard the question (Adverb clause of time, modifying answered in 1)<\/li><li>3. Who lived in that house (Adjective clause, qualifying man in 1)<\/li><li>4. That the earth is flat (Noun clause, object of answered in 1)<\/li><\/ol>\n<\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Steps for Analysis<\/h4><p>First find the Principal or Main Clause, then identify Subordinate Clauses and their relationships.<\/p>\n<div class=\"wm-example\">\n<p class=\"wm-hl\">I think that he destroyed the letter which you sent there.<\/p>\n<ol><li>1. I think... (Principal clause)<\/li><li>2. That he destroyed the letter... (Noun Clause, object of think in 1)<\/li><li>3. Which you sent there... (Adjective clause, subordinate to 2, qualifying letter)<\/li><\/ol>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\"><h4>Exercise 56 - Analyze Complex Sentences<\/h4>\n<ol class=\"wm-qlist\">\n<li>As my eldest son was bred a scholar, I determined to send him to town, where his abilities might contribute to our support and his own.<\/li>\n<li>Clive had been only a few months in the army, when intelligence arrived that peace had been concluded between Great Britain and France.<\/li>\n<li>I had a partial father, who gave me a better education than his broken fortune would have allowed.<\/li>\n<li>Among the many reasons which make me glad to have been born in England, one of the first is that I read Shakespeare in my mother tongue.<\/li>\n<\/ol><\/div>", "src": ["22-35", "35-60"], "desc": "Learn to break down complex sentences into their component clauses", "n": 34, "ex": 2, "items": 24, "ans": 0, "words": 618, "cn": 8}, {"part": 2, "title": "Analysis of Compound Sentences", "html": "<div class=\"wm-sub\"><h4>Types of Compound Sentences<\/h4><p>Compound sentences are made up of two or more independent clauses joined by coordinating conjunctions.<\/p>\n<div class=\"wm-example\">\n<p class=\"wm-hl\">The horse reared and the rider was thrown.<\/p>\n<ol><li>Each coordinate clause is a simple sentence<\/li><\/ol>\n<\/div>\n<div class=\"wm-example\">\n<p class=\"wm-hl\">They asked him how he received the wound, but he refused to answer.<\/p>\n<ol><li>First clause is complex, second clause is simple<\/li><\/ol>\n<\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Connection Types<\/h4><p>Compound sentences can be connected in four ways: Copulative, Adversative, Alternative, and Illative.<\/p>\n<div class=\"wm-example\">\n<p class=\"wm-hl\">God made the country and man made the town.<\/p>\n<p><strong>Explanation:<\/strong> Main clauses are simply coupled together<\/p>\n<\/div>\n<div class=\"wm-example\">\n<p class=\"wm-hl\">He is slow, but he is sure.<\/p>\n<p><strong>Explanation:<\/strong> Two main clauses are opposed in meaning<\/p>\n<\/div>\n<div class=\"wm-example\">\n<p class=\"wm-hl\">She must weep, or she will die.<\/p>\n<p><strong>Explanation:<\/strong> Choice between clauses is offered<\/p>\n<\/div>\n<div class=\"wm-example\">\n<p class=\"wm-hl\">He is diligent, therefore he will succeed.<\/p>\n<p><strong>Explanation:<\/strong> Second clause draws inference from first<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\"><h4>Exercise 57 - Analyze Compound Sentences<\/h4>\n<ol class=\"wm-qlist\">\n<li>I am satisfied with things as they are; and it will be my pride and pleasure to hand down this country to my children as I received it from those who preceded me.<\/li>\n<li>Some politicians of our time lay it down as a self-evident proposition that no people ought to be free till they are fit to use their freedom.<\/li>\n<li>Subhash Chandra Bose died before his aim was achieved, and yet he will always be remembered as a great hero, who fought and sacrificed his life for the freedom of the country.<\/li>\n<\/ol><\/div>", "src": ["35-60"], "desc": "Understanding how to analyze compound sentences with multiple independent clauses", "n": 35, "ex": 1, "items": 3, "ans": 0, "words": 226, "cn": 9}, {"part": 2, "title": "Transformation of Sentences", "html": "<div class=\"wm-sub\">\n<h3>Exercise 86: Complex to Compound Sentences<\/h3>\n<div class=\"wm-rule\">\n<h4>How to Transform:<\/h4>\n<p>Replace subordinating conjunctions (when, if, though, etc.) with coordinating conjunctions (and, but, or) and adjust sentence structure.<\/p>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nPractice Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-qitem\">\n<strong>Complex:<\/strong> Rama went to school as soon as he had finished his meal.<br/>\n<strong>Compound:<\/strong> Rama finished his meal and then went to school.\n                        <\/div>\n<div class=\"wm-qitem\">\n<strong>Complex:<\/strong> If I ask a civil question I expect a civil reply.<br/>\n<strong>Compound:<\/strong> I ask a civil question and I expect a civil reply.\n                        <\/div>\n<div class=\"wm-qitem\">\n<strong>Complex:<\/strong> Though he began late, he finished first.<br/>\n<strong>Compound:<\/strong> He began late but he finished first.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Interactive Practice<\/h4>\n<p><strong>Transform this complex sentence:<\/strong><br/>\n                    \"He feigned sleep as he had an object in doing so.\"<\/p>\n\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nAll 31 Practice Sentences\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-qitem\">1. Rama went to school as soon as he had finished his meal.<\/div>\n<div class=\"wm-qitem\">2. If I ask a civil question I expect a civil reply.<\/div>\n<div class=\"wm-qitem\">3. They have never been poor since they opened that shop.<\/div>\n<div class=\"wm-qitem\">4. I could answer if I chose.<\/div>\n<div class=\"wm-qitem\">5. We might admire a bad man though we cannot admire a weak one.<\/div>\n<div class=\"wm-qitem\">6. I advise you to try although you may not succeed.<\/div>\n<div class=\"wm-qitem\">7. I spoke plainly so that you might understand.<\/div>\n<div class=\"wm-qitem\">8. He feigned sleep as he had an object in doing so.<\/div>\n<div class=\"wm-qitem\">9. He gave himself up because the flight was useless.<\/div>\n<div class=\"wm-qitem\">10. As we are here we will stay here.<\/div>\n<!-- Continue with remaining sentences... -->\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Exercise 87: Miscellaneous Transformations<\/h3>\n<div class=\"wm-exercise\">\n<h4>\nAdvanced Recasting Techniques\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Using \"No sooner\":<\/strong><br/>\n                            Original: A soldier leaped into the water as soon as the ship touched the shore.<br/>\n                            Recast: No sooner did the ship touch the shore than a soldier leaped into the water.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Using \"Not only...but also\":<\/strong><br/>\n                            Original: We helped them with money as well as workers.<br/>\n                            Recast: We helped them not only with money but also with workers.\n                        <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Further coverage — methods of transformation<\/span><\/div>\n<div class=\"wm-sub\"><h4>Sentences with \"too\"<\/h4><p>Transform sentences containing the adverb \"too\" to equivalent forms.<\/p>\n<div class=\"wm-example\">\n<p><strong>Original:<\/strong> The news is too good to be true.<\/p>\n<p><strong>Transformed:<\/strong> The news is so good that it cannot be true.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<p><strong>Original:<\/strong> He drove too fast for the police to catch.<\/p>\n<p><strong>Transformed:<\/strong> He drove so fast that the police could not catch him.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Degrees of Comparison<\/h4><p>Change the degree of comparison without changing meaning.<\/p>\n<div class=\"wm-example\">\n<\/div>\n<div class=\"wm-example\">\n<\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Active and Passive Voice<\/h4><p>Convert between active and passive voice.<\/p>\n<div class=\"wm-example\">\n<\/div>\n<div class=\"wm-example\">\n<\/div>\n<\/div>\n<div class=\"wm-exercise\"><h4>Exercise 59 - Transform \"too\" sentences<\/h4>\n<ol class=\"wm-qlist\">\n<li>It is never too late to mend.<\/li>\n<li>He is too proud to beg.<\/li>\n<li>My heart is too full for words.<\/li>\n<li>He was too late to hear the first speech.<\/li>\n<\/ol><\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Advanced transformations<\/span><\/div>\n<div class=\"wm-sub\"><h4>Simple to Compound<\/h4><p>Convert simple sentences to compound by enlarging words/phrases into coordinate clauses.<\/p>\n<div class=\"wm-example\">\n<\/div>\n<div class=\"wm-example\">\n<\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Complex to Simple<\/h4><p>Convert complex sentences to simple by contracting clauses into phrases.<\/p>\n<div class=\"wm-example\">\n<\/div>\n<div class=\"wm-example\">\n<\/div>\n<\/div>\n<div class=\"wm-exercise\"><h4>Exercise 71 - Simple to Compound<\/h4>\n<ol class=\"wm-qlist\">\n<li>In this tower sat the poet gazing on the sea.<\/li>\n<li>To everyone's surprise, the project completely failed.<\/li>\n<li>Seeing the rain coming on, we took shelter under a tree.<\/li>\n<li>Being occupied with important matters, he had no leisure to see us.<\/li>\n<\/ol><\/div>", "src": ["60-84", "35-60"], "desc": "Learn various ways to transform sentences while maintaining meaning", "n": 36, "ex": 6, "items": 21, "ans": 0, "words": 478, "cn": 10}, {"part": 2, "title": "Synthesis of Sentences", "html": "<div class=\"wm-sub\">\n<h3>Methods of Combining Simple Sentences<\/h3>\n\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Using Participles<\/h4>\n<p>Combine sentences by converting one verb into a participle form<\/p>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nParticiple Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Separate:<\/strong> He jumped up. He ran away.<br/>\n<strong>Combined:<\/strong> Jumping up, he ran away.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Separate:<\/strong> He was tired of play. He sat down to rest.<br/>\n<strong>Combined:<\/strong> Tired of play, he sat down to rest.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\" style=\"\">\n<div class=\"wm-rule\">\n<h4>Using Infinitives<\/h4>\n<p>Express purpose or intention using \"to + verb\"<\/p>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nInfinitive Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Separate:<\/strong> I have some duties. I must perform them.<br/>\n<strong>Combined:<\/strong> I have some duties to perform.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Separate:<\/strong> He wanted to educate his son. He sent him to Europe.<br/>\n<strong>Combined:<\/strong> He sent his son to Europe to be educated.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\" style=\"\">\n<div class=\"wm-rule\">\n<h4>Using Prepositions<\/h4>\n<p>Use prepositions with nouns or gerunds to show relationships<\/p>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nPreposition Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Separate:<\/strong> He has failed many times. He still hopes to succeed.<br/>\n<strong>Combined:<\/strong> In spite of many failures, he hopes to succeed.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Separate:<\/strong> Her husband died. She heard the news. She fainted.<br/>\n<strong>Combined:<\/strong> On hearing the news of her husband's death, she fainted.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\" style=\"\">\n<div class=\"wm-rule\">\n<h4>Nominative Absolute Construction<\/h4>\n<p>Use when subjects of the sentences are different<\/p>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nAbsolute Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Separate:<\/strong> The soldiers arrived. The mob dispersed.<br/>\n<strong>Combined:<\/strong> The soldiers having arrived, the mob dispersed.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Separate:<\/strong> The sun rose. The fog cleared away.<br/>\n<strong>Combined:<\/strong> The sun having risen, the fog cleared away.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Synthesis Practice<\/h4>\n<p><strong>Combine these sentences using participles:<\/strong><br/>\n                \"He hurt his foot. He stopped.\"<\/p>\n\n<\/div>", "src": ["60-84"], "desc": "Combine sentences by converting one verb into a participle form", "n": 37, "ex": 5, "items": 0, "ans": 0, "words": 215, "cn": 11}, {"part": 2, "title": "Sequence of Tenses", "html": "<div class=\"wm-sub\">\n<h3>Fundamental Rules<\/h3>\n<div class=\"wm-rule\">\n<h4>Primary Rule<\/h4>\n<p>When the reporting verb is in the Past Tense, all Present tenses in the subordinate clause change to corresponding Past tenses.<\/p>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nTense Changes Chart\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Simple Present → Simple Past<\/strong><br/>\n                            He said, \"I am unwell.\" → He said that he was unwell.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Present Continuous → Past Continuous<\/strong><br/>\n                            He said, \"I am writing.\" → He said that he was writing.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Present Perfect → Past Perfect<\/strong><br/>\n                            He said, \"I have finished.\" → He said that he had finished.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Will → Would, Shall → Should<\/strong><br/>\n                            He said, \"I will come.\" → He said that he would come.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Exceptions to the Rule<\/h3>\n<div class=\"wm-rule\">\n<h4>Universal Truths<\/h4>\n<p>Past tense in main clause may be followed by present tense when expressing universal truths.<\/p>\n<div class=\"wm-example\">\n                            Newton discovered that the earth moves around the sun.<br/>\n                            Galileo maintained that the earth moves round the sun.\n                        <\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Comparative Clauses<\/h4>\n<p>When subordinate clause is introduced by \"than\", any tense may be used as required by sense.<\/p>\n<div class=\"wm-example\">\n                            He liked you better than he likes me.<br/>\n                            He helped him more than he helps his own children.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Sequence Practice<\/h4>\n<p><strong>Fill in the correct tense:<\/strong><br/>\n                    \"I waited for my friend until he ______ (come).\"<\/p>\n\n<\/div>\n<\/div>", "src": ["60-84"], "desc": "When the reporting verb is in the Past Tense, all Present tenses in the subordinate clause change to corresponding Past tenses.", "n": 38, "ex": 2, "items": 0, "ans": 0, "words": 188, "cn": 12}, {"part": 2, "title": "Direct and Indirect Speech", "html": "<div class=\"wm-sub\">\n<h3>Conversion Rules<\/h3>\n\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Converting Statements<\/h4>\n<ul>\n<li>Use \"that\" to introduce indirect speech<\/li>\n<li>Change pronouns appropriately<\/li>\n<li>Apply sequence of tenses<\/li>\n<li>Change time/place expressions<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nStatement Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Direct:<\/strong> Rama said, \"I am very busy now.\"<br/>\n<strong>Indirect:<\/strong> Rama said that he was very busy then.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Direct:<\/strong> She said, \"I will come tomorrow.\"<br/>\n<strong>Indirect:<\/strong> She said that she would come the next day.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\" style=\"\">\n<div class=\"wm-rule\">\n<h4>Converting Questions<\/h4>\n<ul>\n<li>Use reporting verbs like \"asked\", \"inquired\"<\/li>\n<li>Use \"whether/if\" for yes/no questions<\/li>\n<li>Use question words directly for wh-questions<\/li>\n<li>Change question order to statement order<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nQuestion Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Direct:<\/strong> He said, \"Are you coming?\"<br/>\n<strong>Indirect:<\/strong> He asked whether I was coming.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Direct:<\/strong> \"Where do you live?\" he asked.<br/>\n<strong>Indirect:<\/strong> He asked where I lived.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\" style=\"\">\n<div class=\"wm-rule\">\n<h4>Converting Commands<\/h4>\n<ul>\n<li>Use verbs like \"ordered\", \"commanded\", \"requested\"<\/li>\n<li>Change imperative to infinitive<\/li>\n<li>Use \"to + verb\" for positive commands<\/li>\n<li>Use \"not to + verb\" for negative commands<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nCommand Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Direct:<\/strong> He said, \"Go away.\"<br/>\n<strong>Indirect:<\/strong> He ordered me to go away.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Direct:<\/strong> \"Please wait here,\" he said.<br/>\n<strong>Indirect:<\/strong> He requested me to wait there.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\" style=\"\">\n<div class=\"wm-rule\">\n<h4>Converting Exclamations<\/h4>\n<ul>\n<li>Use verbs like \"exclaimed\", \"cried out\"<\/li>\n<li>Convert exclamatory sentences to statements<\/li>\n<li>Add appropriate adverbs to show emotion<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>\nExclamation Examples\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Direct:<\/strong> He said, \"Alas! I am ruined.\"<br/>\n<strong>Indirect:<\/strong> He exclaimed sadly that he was ruined.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Direct:<\/strong> \"How clever I am!\" she said.<br/>\n<strong>Indirect:<\/strong> She exclaimed that she was very clever.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>Time and Place Changes<\/h3>\n<div class=\"wm-exercise\">\n<h4>\nExpression Changes Chart\n<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Time Expressions:<\/strong><br/>\n                            now → then<br/>\n                            today → that day<br/>\n                            tomorrow → the next/following day<br/>\n                            yesterday → the previous/day before<br/>\n                            last night → the night before\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Place Expressions:<\/strong><br/>\n                            here → there<br/>\n                            this → that<br/>\n                            these → those<br/>\n                            thus → so\n                        <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Speech Conversion Practice<\/h4>\n<p><strong>Convert to Indirect Speech:<\/strong><br/>\n                He said, \"I am going to school now.\"<\/p>\n\n<\/div>", "src": ["60-84"], "desc": "Use \"that\" to introduce indirect speech Change pronouns appropriately Apply sequence of tenses Change time/place expressions", "n": 39, "ex": 6, "items": 0, "ans": 0, "words": 275, "cn": 13}, {"part": 2, "title": "Correct Usage: Introduction", "html": "<h3>\n<p>Master the essential rules for proper English usage, especially for non-native speakers<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<h4>Welcome to Part II: Composition and Correct Usage<\/h4>\n<p>This section focuses on areas of usage which are often troublesome to non-native speakers of English, especially Indian students.<\/p>\n<div class=\"wm-example\">\n<h4>Common Mistakes to Avoid<\/h4>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> He gave me an advice\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> He gave me some advice\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> This is a good news\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> This is good news\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> He sold all the furnitures\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> He sold all the furniture\n                        <\/div>\n<\/div>\n<div class=\"wm-note\">\n<h4>Key Learning Areas<\/h4>\n<p>This guide covers punctuation, idioms, word formation, figures of speech, and the differences between formal and informal English.<\/p>\n<\/div>\n<\/div>", "src": ["85-102"], "desc": "Master the essential rules for proper English usage, especially for non-native speakers", "n": 40, "ex": 0, "items": 0, "ans": 0, "words": 99, "cn": 14}, {"part": 2, "title": "Agreement of the Verb with the Subject", "html": "<h3>\n<p>Chapter 17: Essential rules for subject-verb agreement<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<div>Rule 109<\/div>\n<h4>Basic Agreement Rule<\/h4>\n<p><strong>A Verb must agree with its Subject in Number and Person.<\/strong><\/p>\n<div class=\"wm-note\">\n<h4>Error of Proximity<\/h4>\n<p>Often, the verb is made to agree with a noun near it instead of with its proper subject. This should be avoided.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Correct Examples<\/h4>\n<div class=\"wm-example\">The quality of the mangoes <strong>was<\/strong> not good.<\/div>\n<div class=\"wm-example\">The introduction of tea and coffee <strong>has<\/strong> not been without effect.<\/div>\n<div class=\"wm-example\">His knowledge of Indian vernaculars <strong>is<\/strong> far beyond the common.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>Two or more singular nouns or pronouns joined by <strong>and<\/strong> require a plural verb.<\/p>\n<div class=\"wm-example\">\n<h4>Examples<\/h4>\n<div class=\"wm-example\">Gold and silver <strong>are<\/strong> precious metals.<\/div>\n<div class=\"wm-example\">Fire and water <strong>do not<\/strong> agree.<\/div>\n<div class=\"wm-example\"><strong>Are<\/strong> your father and mother at home?<\/div>\n<\/div>\n<div class=\"wm-note\">\n<h4>Exception: Same Idea or Person<\/h4>\n<p>If the nouns suggest one idea or refer to the same person, use singular verb:<\/p>\n<div class=\"wm-example\">\n<div class=\"wm-example\">Time and tide <strong>waits<\/strong> for no man.<\/div>\n<div class=\"wm-example\">Bread and butter <strong>is<\/strong> his only food.<\/div>\n<div class=\"wm-example\">My friend and benefactor <strong>has<\/strong> come.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>Words joined to a singular subject by <em>with<\/em>, <em>as well as<\/em>, etc., are parenthetical. The verb should be singular.<\/p>\n<div class=\"wm-example\">\n<h4>Examples<\/h4>\n<div class=\"wm-example\">The house, with its contents, <strong>was<\/strong> insured.<\/div>\n<div class=\"wm-example\">Silver, as well as cotton, <strong>has<\/strong> fallen in price.<\/div>\n<div class=\"wm-example\">Sanskrit, as well as Arabic, <strong>was<\/strong> taught there.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>Two or more singular subjects connected by <strong>or<\/strong> or <strong>nor<\/strong> require a singular verb.<\/p>\n<div class=\"wm-example\">\n<h4>Examples<\/h4>\n<div class=\"wm-example\">No nook or corner <strong>was<\/strong> left unexplored.<\/div>\n<div class=\"wm-example\">Either the cat or the dog <strong>has<\/strong> been here.<\/div>\n<div class=\"wm-example\">Neither food nor water <strong>was<\/strong> to be found there.<\/div>\n<\/div>\n<div class=\"wm-note\">\n<h4>Mixed Plural and Singular<\/h4>\n<p>When one subject is plural, the verb must be plural, and the plural subject should be placed nearest the verb.<\/p>\n<div class=\"wm-example\">Neither the Chairman nor the directors <strong>are<\/strong> present.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 110: Fill in the correct verb<\/h4>\n<div class=\"wm-qitem\">1. To take pay and then not to do work ____ dishonest.<\/div>\n<div class=\"wm-qitem\">2. The cost of all these articles ____ risen.<\/div>\n<div class=\"wm-qitem\">3. The jury ____ divided in their opinions.<\/div>\n<div class=\"wm-qitem\">4. The Three Musketeers ____ written by Dumas.<\/div>\n<div class=\"wm-qitem\">5. Each of the suspected men ____ arrested.<\/div>\n<\/div>", "src": ["85-102"], "desc": "Chapter 17: Essential rules for subject-verb agreement", "n": 41, "ex": 1, "items": 5, "ans": 0, "words": 323, "cn": 15}, {"part": 2, "title": "Correct Usage: Nouns and Pronouns", "html": "<h3>\n<p>Chapter 18: Proper usage of countable/uncountable nouns and pronouns<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<div>Rule 123<\/div>\n<h4>Countable vs Uncountable Nouns<\/h4>\n<p><strong>Countable nouns:<\/strong> book, table, flower, apple - things that can be counted. Can have plural forms and use a/an.<\/p>\n<p><strong>Uncountable nouns:<\/strong> ink, milk, gold, wisdom - things that cannot be counted. No plural forms, cannot use a/an.<\/p>\n<div class=\"wm-example\">\n<h4>Usually Uncountable in English<\/h4>\n<div class=\"wm-example\">advice, news, information, furniture, luggage, work, business, weather, traffic, scenery, paper, soap, bread<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Common Corrections<\/h4>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> He gave me an advice\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> He gave me some advice (or: a piece of advice)\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> The sceneries here are very good\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> The scenery here is very good\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>The use of the Possessive (Genitive) Case should be confined to:<\/p>\n<div class=\"wm-example\">\n<h4>1. Names of living beings and personified objects<\/h4>\n<div class=\"wm-example\">The Governor's bodyguards; the lion's mane; Nature's laws<\/div>\n<h4>2. Stereotyped phrases<\/h4>\n<div class=\"wm-example\">For conscience' sake, at his fingers' ends, the boat's crew<\/div>\n<h4>3. Nouns of space or time<\/h4>\n<div class=\"wm-example\">A day's work, a hand's breadth, in a year's time<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-note\">\n<h4>Modern Usage<\/h4>\n<p>Today <em>whom<\/em> is not usual except in formal English. <em>Who<\/em> replaces <em>whom<\/em> in spoken English.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Formal vs Informal<\/h4>\n<div class=\"wm-example\">\n<strong>Formal:<\/strong> Whom did you meet?<br/>\n<strong>Informal:<\/strong> Who did you meet?\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Formal:<\/strong> By whom was the book written?<br/>\n<strong>Informal:<\/strong> Who was the book written by?\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 111: Fill with \"who\" or \"whom\"<\/h4>\n<div class=\"wm-qitem\">1. I met a man today ____ I had just heard was on the continent.<\/div>\n<div class=\"wm-qitem\">2. ____ did you give that letter to?<\/div>\n<div class=\"wm-qitem\">3. The man ____ I thought was my friend deceived me.<\/div>\n<div class=\"wm-qitem\">4. ____ do you think is the better of the two at tennis?<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 112: Correct the sentences<\/h4>\n<div class=\"wm-qitem\">1. Please give me a soap.<\/div>\n<div class=\"wm-qitem\">2. What beautiful sceneries!<\/div>\n<div class=\"wm-qitem\">3. Can you give me an advice?<\/div>\n<div class=\"wm-qitem\">4. He has eaten two breads.<\/div>\n<\/div>", "src": ["85-102"], "desc": "Chapter 18: Proper usage of countable/uncountable nouns and pronouns", "n": 42, "ex": 2, "items": 8, "ans": 0, "words": 284, "cn": 16}, {"part": 2, "title": "Correct Usage: Adjectives", "html": "<h3>\n<p>Chapter 19: Comparison, placement, and proper usage<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<div>Rule 145<\/div>\n<h4>Adjective vs Adverb with Verbs<\/h4>\n<p>Use adjectives when expressing a quality of the subject, not the action:<\/p>\n<div class=\"wm-example\">\n<h4>Correct Usage<\/h4>\n<div class=\"wm-example\">The flowers smell <strong>sweet<\/strong> (not sweetly)<\/div>\n<div class=\"wm-example\">She looks <strong>dainty<\/strong><\/div>\n<div class=\"wm-example\">That statement sounds <strong>queer<\/strong><\/div>\n<div class=\"wm-example\">He feels <strong>sad<\/strong><\/div>\n<\/div>\n<div class=\"wm-note\">\n<h4>Test: Substitute with \"to be\"<\/h4>\n<p>If you can substitute with a form of \"to be,\" use the adjective. If you can substitute with a manner phrase, use the adverb.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>These words take <strong>to<\/strong> instead of <strong>than<\/strong>:<\/p>\n<div class=\"wm-example\">\n<h4>Examples<\/h4>\n<div class=\"wm-example\">Jane Austen is <strong>superior to<\/strong> Mrs. Henry Wood.<\/div>\n<div class=\"wm-example\">Hari is <strong>inferior to<\/strong> Rama in intelligence.<\/div>\n<div class=\"wm-example\">He is <strong>senior to<\/strong> me.<\/div>\n<div class=\"wm-example\">The death of King Edward VII was <strong>prior to<\/strong> World War I.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Comparing Two Things<\/h4>\n<p>Use the <strong>Comparative<\/strong> when comparing two things:<\/p>\n<div class=\"wm-example\">\n<div class=\"wm-example\">Of the two suggestions, the former is the <strong>better<\/strong>.<\/div>\n<div class=\"wm-example\">Which is the <strong>cheaper<\/strong> of the two?<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Exclusion Rule<\/h4>\n<p>When using comparative + than, exclude the thing compared from the class:<\/p>\n<div class=\"wm-example\">\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> He is stronger than any man living.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> He is stronger than any <strong>other<\/strong> man living.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Less vs Fewer<\/h4>\n<div class=\"wm-example\"><strong>Less:<\/strong> used before uncountable nouns<\/div>\n<div class=\"wm-example\"><strong>Fewer:<\/strong> used before plural nouns<\/div>\n<div class=\"wm-example\">No <strong>fewer<\/strong> than fifty miners were killed.<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Elder vs Older<\/h4>\n<div class=\"wm-example\"><strong>Older/Oldest:<\/strong> persons or things<\/div>\n<div class=\"wm-example\"><strong>Elder/Eldest:<\/strong> persons only, same family<\/div>\n<div class=\"wm-example\">He is <strong>older<\/strong> than his colleague.<\/div>\n<div class=\"wm-example\">Patricia is the <strong>eldest<\/strong> of the family.<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Verbal vs Oral<\/h4>\n<div class=\"wm-example\"><strong>Verbal:<\/strong> of or pertaining to words<\/div>\n<div class=\"wm-example\"><strong>Oral:<\/strong> delivered by word of mouth (not written)<\/div>\n<div class=\"wm-example\">His written statement differs from his <strong>oral<\/strong> statement.<\/div>\n<\/div>\n<\/div>", "src": ["85-102"], "desc": "Chapter 19: Comparison, placement, and proper usage", "n": 43, "ex": 0, "items": 0, "ans": 0, "words": 242, "cn": 17}, {"part": 2, "title": "Correct Usage: Verbs", "html": "<h3>\n<p>Chapter 20: Proper verb forms, agreement, and common mistakes<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<div>Rule 168<\/div>\n<h4>Lay vs Lie<\/h4>\n<p>Carefully distinguish between these two verbs:<\/p>\n<div class=\"wm-example\">\n<h4>LAY (transitive - needs object)<\/h4>\n<div class=\"wm-example\"><strong>Present:<\/strong> lay, <strong>Past:<\/strong> laid, <strong>Past Participle:<\/strong> laid<\/div>\n<div class=\"wm-example\"><strong>Lay<\/strong> the child down to sleep.<\/div>\n<div class=\"wm-example\">I <strong>laid<\/strong> the book on the table.<\/div>\n<div class=\"wm-example\">The hen has <strong>laid<\/strong> an egg.<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>LIE (intransitive - no object)<\/h4>\n<div class=\"wm-example\"><strong>Present:<\/strong> lie, <strong>Past:<\/strong> lay, <strong>Past Participle:<\/strong> lain<\/div>\n<div class=\"wm-example\">Let me <strong>lie<\/strong> here.<\/div>\n<div class=\"wm-example\">He <strong>lay<\/strong> under that tree.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>A common blunder is to leave the Participle without proper agreement:<\/p>\n<div class=\"wm-example\">\n<h4>Wrong Examples<\/h4>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> Sitting on the gate, a scorpion stung him.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> Being a very hot day, I remained in my tent.\n                        <\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Corrected<\/h4>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> Sitting on the gate, he was stung by a scorpion.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> As it was a very hot day, I remained in my tent.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>MAKE + Object + Infinitive<\/h4>\n<div class=\"wm-example\">\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> She made the boy to do the work.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> She made the boy do the work.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Passive:<\/strong> The boy was made to do the work.\n                            <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Verbs with Gerunds (not infinitives)<\/h4>\n<div class=\"wm-example\">\n<div class=\"wm-example\"><strong>enjoy, avoid, miss, postpone, suggest<\/strong><\/div>\n<div class=\"wm-example\">He enjoys <strong>swimming<\/strong> (not: to swim)<\/div>\n<div class=\"wm-example\">She avoids <strong>meeting<\/strong> people (not: to meet)<\/div>\n<div class=\"wm-example\">We missed <strong>seeing<\/strong> the Prime Minister (not: to see)<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 115: Recast these sentences<\/h4>\n<div class=\"wm-qitem\">1. Being condemned to death, the scaffold was erected for his execution.<\/div>\n<div class=\"wm-qitem\">2. Born in Surat, a part of his education was received in Mumbai.<\/div>\n<div class=\"wm-qitem\">3. Being a wet day, I wore my mackintosh.<\/div>\n<div class=\"wm-qitem\">4. Going up the hill, an old temple was seen.<\/div>\n<\/div>", "src": ["85-102"], "desc": "Chapter 20: Proper verb forms, agreement, and common mistakes", "n": 44, "ex": 1, "items": 4, "ans": 0, "words": 242, "cn": 18}, {"part": 2, "title": "Correct Usage: Adverbs", "html": "<h3>\n<p>Chapter 21: Placement, usage, and common errors<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<div>Rule 178<\/div>\n<h4>Adverb Placement<\/h4>\n<p>Adverbs should be placed next to the word they modify to make meaning clear:<\/p>\n<div class=\"wm-example\">\n<h4>Correct Placement<\/h4>\n<div class=\"wm-example\">He had got <strong>almost<\/strong> to the top when the rope broke.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>As a general rule, <strong>only<\/strong> should be placed immediately before the word it modifies:<\/p>\n<div class=\"wm-example\">\n<h4>Written English<\/h4>\n<div class=\"wm-example\">I worked <strong>only<\/strong> two sums.<\/div>\n<div class=\"wm-example\"><strong>Only<\/strong> Balu succeeded in scoring a century.<\/div>\n<div class=\"wm-example\">I praise him <strong>only<\/strong> when he deserves it.<\/div>\n<\/div>\n<div class=\"wm-note\">\n<h4>Spoken English<\/h4>\n<p>In spoken English, \"only\" is usually put before the verb, with stress on the word it modifies.<\/p>\n<div class=\"wm-example\">He <strong>only<\/strong> worked two sums. (stress on \"two\")<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>Two negatives destroy each other. Avoid double negatives unless you want to make an affirmation:<\/p>\n<div class=\"wm-example\">\n<h4>Corrections<\/h4>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> I haven't got none.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> I haven't got any.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> I could not find it nowhere.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> I could not find it anywhere.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>SO as adverb<\/h4>\n<p>Except colloquially, <strong>so<\/strong> must not be used absolutely (without correlative):<\/p>\n<div class=\"wm-example\">\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> He is so weak.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> He is very weak.\n                            <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>TOO vs VERY<\/h4>\n<p><strong>Too<\/strong> means \"more than enough\" - don't use instead of <strong>very<\/strong>:<\/p>\n<div class=\"wm-example\">\n<div class=\"wm-example\">The news is <strong>too<\/strong> good to be true.<\/div>\n<div class=\"wm-example\">The work is <strong>too<\/strong> much for any man.<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 116: Correct these sentences<\/h4>\n<div class=\"wm-qitem\">1. It was bitter cold.<\/div>\n<div class=\"wm-qitem\">2. I couldn't help not laughing at the joke.<\/div>\n<div class=\"wm-qitem\">3. This novel is too interesting.<\/div>\n<div class=\"wm-qitem\">4. I haven't got no money.<\/div>\n<\/div>", "src": ["85-102"], "desc": "Chapter 21: Placement, usage, and common errors", "n": 45, "ex": 1, "items": 4, "ans": 0, "words": 226, "cn": 19}, {"part": 2, "title": "Correct Usage: Conjunctions", "html": "<h3>\n<p>Chapter 22: Connecting words and phrases correctly<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<div>Rule 190-191<\/div>\n<h4>EXCEPT and WITHOUT as conjunctions<\/h4>\n<div class=\"wm-example\">\n<h4>EXCEPT (not used as conjunction)<\/h4>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> I shall not come except you need me.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> I shall not come unless you need me.\n                        <\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>WITHOUT (not used as conjunction)<\/h4>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> Without you apologize I shall punish you.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> Unless you apologize I shall punish you.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>SCARCELY + WHEN<\/h4>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> Scarcely had he gone, than a policeman knocked.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> Scarcely had he gone, when a policeman knocked.\n                        <\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>NO SOONER + THAN<\/h4>\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> No sooner had he returned but he was off again.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> No sooner had he returned than he was off again.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Incomplete Comparisons<\/h4>\n<div class=\"wm-example\">\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> This is as good if not better than that.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> This is as good as that, if not better.\n                            <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Parallel Structure<\/h4>\n<p>Correlative conjunctions must be followed by the same part of speech:<\/p>\n<div class=\"wm-example\">\n<div class=\"wm-example\">\n<strong>Wrong:<\/strong> He not only lost his ticket, but also his luggage.\n                            <\/div>\n<div class=\"wm-example\">\n<strong>Right:<\/strong> He lost not only his ticket, but also his luggage.\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["85-102"], "desc": "Chapter 22: Connecting words and phrases correctly", "n": 46, "ex": 0, "items": 0, "ans": 0, "words": 162, "cn": 20}, {"part": 2, "title": "Order of Words", "html": "<h3>\n<p>Chapter 23: Proper sentence arrangement<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<div>Rule 203<\/div>\n<h4>Importance of Word Order<\/h4>\n<p>In English, owing to the fewness of inflexions, the order of words in a sentence is of first importance.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>1. Subject before Verb<\/h4>\n<div class=\"wm-example\">The dog bit the horse.<\/div>\n<h4>2. Object after Verb<\/h4>\n<div class=\"wm-example\">The horse bit the dog.<\/div>\n<h4>3. Indirect before Direct Object<\/h4>\n<div class=\"wm-example\">Lend me your ears.<\/div>\n<h4>4. Attributive Adjective before Noun<\/h4>\n<div class=\"wm-example\">Few cats like cold water.<\/div>\n<h4>5. Predicative Adjective after Noun<\/h4>\n<div class=\"wm-example\">The child is asleep.<\/div>\n<h4>6. Adjective Phrase after Noun<\/h4>\n<div class=\"wm-example\">Old Tubal Cain was a man of might.<\/div>\n<h4>7. Adverb close to Modified Word<\/h4>\n<div class=\"wm-example\">He worked only two sums.<\/div>\n<h4>8. Qualifying Clauses close to Modified Words<\/h4>\n<div class=\"wm-example\">He died in the village where he was born.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>Normal order is sometimes altered for emphasis:<\/p>\n<div class=\"wm-example\">\n<div class=\"wm-example\">Uneasy lies the head that wears a crown.<\/div>\n<div class=\"wm-example\">Monkeys I detest.<\/div>\n<div class=\"wm-example\">Money you shall have.<\/div>\n<div class=\"wm-example\">Blessed are the merciful.<\/div>\n<div class=\"wm-example\">Silver and gold have I none.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<p>Poor word arrangement can turn sentences into nonsense:<\/p>\n<div class=\"wm-example\">\n<h4>Confusing Examples<\/h4>\n<div class=\"wm-example\">\n                            Few people learn anything that is worth learning easily.\n                        <\/div>\n<div class=\"wm-example\">\n                            He blew out his brains, after bidding his wife goodbye with a gun.\n                        <\/div>\n<div class=\"wm-example\">\n                            A gentleman has a dog to sell who wishes to go abroad.\n                        <\/div>\n<\/div>\n<div class=\"wm-note\">\n<h4>Solution<\/h4>\n<p>All qualifying words, phrases and clauses should be placed as near as possible to the words to which they refer.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 117: Improve the arrangement<\/h4>\n<div class=\"wm-qitem\">1. For sale, piano, the property of a musician, with carved legs.<\/div>\n<div class=\"wm-qitem\">2. He killed the sparrow which was eating some crumbs with a gun.<\/div>\n<div class=\"wm-qitem\">3. A nurse maid is wanted for a baby about twenty years old.<\/div>\n<div class=\"wm-qitem\">4. It is proposed to construct a bath for males 99 feet long.<\/div>\n<\/div>", "src": ["85-102"], "desc": "In English, owing to the fewness of inflexions, the order of words in a sentence is of first importance.", "n": 47, "ex": 1, "
