m-sub\"><h4>Conditionals Type 2<\/h4><div class=\"wm-rule\"><p>Improbable condition: If + past, would/should/could/might + infinitive<\/p><\/div>\n<div class=\"wm-example\"><ul><li>If you studied hard, you would get a first class.<\/li><li>If I were you, I should not do that.<\/li><li>If you were a millionaire, how would you spend your time?<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Conditionals Type 3<\/h4><div class=\"wm-rule\"><p>Unfulfilled condition: If + past perfect, would/should/could/might + perfect infinitive<\/p><\/div>\n<div class=\"wm-example\"><ul><li>If you had studied hard, you would have got a first class.<\/li><li>If I had seen him, I could have saved him from drowning.<\/li><li>If you had come to me, I would not have got into trouble.<\/li><\/ul><\/div>\n<\/div>", "src": ["141-160"], "desc": "Used when subject is indefinite (preceded by a, an, some, much, many, etc.)", "n": 55, "ex": 0, "items": 0, "ans": 0, "words": 234, "cn": 29}, {"part": 2, "title": "Practice: Structures and Figures", "html": "<div class=\"wm-exercise\"><h4>Exercise 125 - Identify Figures of Speech<\/h4>\n<ol class=\"wm-qlist\">\n<li>The more haste, the less speed.<\/li>\n<li>I must be taught my duty, and by you!<\/li>\n<li>Charity suffereth long, and is kind.<\/li>\n<li>He makes no friend, who never made a foe.<\/li>\n<li>Why all this toil for triumphs of an hour?<\/li>\n<li>Curses are like chickens; they come home to roost.<\/li>\n<li>Boys will be boys.<\/li>\n<li>Language is the art of concealing thought.<\/li>\n<\/ol><\/div>\n<div class=\"wm-exercise\"><h4>Exercise 126 - Verb Patterns<\/h4>\n<ol class=\"wm-qlist\">\n<li>Make up five sentences on each of the patterns (Do not copy examples)<\/li>\n<li>Practice Pattern 1: Subject + Verb<\/li>\n<li>Practice Pattern 3: Subject + Verb + Direct Object<\/li>\n<li>Practice Pattern 8: Subject + Verb + to-infinitive<\/li>\n<\/ol><\/div>\n<div class=\"wm-exercise\"><h4>Exercise 127 - Question Tags<\/h4>\n<ol class=\"wm-qlist\">\n<li>It's very hot today, ____?<\/li>\n<li>You like him, ____?<\/li>\n<li>Kishore will come, ____?<\/li>\n<li>We must hurry, ____?<\/li>\n<li>He will never give up, ____?<\/li>\n<li>Your father is a doctor, ____?<\/li>\n<li>You have tea for breakfast, ____?<\/li>\n<li>I didn't hurt you, ____?<\/li>\n<li>You aren't going out, ____?<\/li>\n<li>They have sold the house, ____?<\/li>\n<\/ol><\/div>", "src": ["141-160"], "desc": "Curses are like chickens; they come home to roost.", "n": 56, "ex": 3, "items": 22, "ans": 0, "words": 163, "cn": 30}, {"part": 2, "title": "Paragraph Writing", "html": "<div class=\"wm-sub\">\n<h3>\n<h3>Core Principles<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>1. UNITY<\/h4>\n<p>Each paragraph must deal with <strong>one topic or idea<\/strong> - and with no more than one. Every sentence must be closely connected with the main topic.<\/p>\n<p><em>The topical sentence<\/em> (usually first) states the main topic and unlocks the subject.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>2. ORDER<\/h4>\n<p>Logical sequence of thought or development of the subject. Events must be related in order of occurrence, ideas arranged by importance.<\/p>\n<p><em>Key:<\/em> First and last sentences are most important - first arouses interest, last satisfies it.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>3. VARIETY<\/h4>\n<p>Paragraphs should be of different lengths and sentence constructions to avoid monotony.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Example Analysis<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Example: \"The Gentleman\" by J.E. Newman<\/h4>\n<div class=\"wm-example\">\"Hence it is that it is almost a definition of a gentleman to say he is one who never inflicts pain. This description is both refined and, as far as it goes, accurate. He is mainly occupied in merely removing the obstacles which hinder the free and unembarrassed action of those about him; and he concurs with their movements rather than takes the initiative himself...\"<\/div>\n<p><strong>Analysis:<\/strong><\/p>\n<ul>\n<li><span class=\"wm-hl\">Topical sentence:<\/span> \"he is one who never inflicts pain\"<\/li>\n<li><span class=\"wm-hl\">Development:<\/span> Explains and illustrates this concept<\/li>\n<li><span class=\"wm-hl\">Conclusion:<\/span> Drives home the point with similes<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Writing Single Paragraphs<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Sample Topic: \"The Cat\"<\/h4>\n<div class=\"wm-example\">There is some truth in the common saying that while dogs become attached to persons, cats are generally attached to places. A dog will follow his master anywhere, but a cat keeps to the house it is used to; and even when the house changes hands, the cat will remain there, so long as it is kindly treated by the new owners. A cat does not seem to be capable of the personal devotion often shown by a dog. It thinks most of its own comfort, and its love is only cupboard love.<\/div>\n<p><strong>Structure Analysis:<\/strong><\/p>\n<ul>\n<li>Opens with topical sentence<\/li>\n<li>Explains by expanding the statement<\/li>\n<li>Concludes with reasoning<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Exercise 132<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Write short paragraphs on the following subjects:<\/h4>\n<div class=\"wm-sub\">\n<div>\n<ul>\n<li>1. A Rainy Day<\/li>\n<li>2. A Walk<\/li>\n<li>3. The Cow<\/li>\n<li>4. Trees<\/li>\n<li>5. Politeness<\/li>\n<li>6. Anger<\/li>\n<li>7. A Picnic<\/li>\n<li>8. A Fire<\/li>\n<li>9. A Flood<\/li>\n<li>10. Some Pet Animal<\/li>\n<\/ul>\n<\/div>\n<div>\n<ul>\n<li>11. Rivers<\/li>\n<li>12. Cricket<\/li>\n<li>13. Contentment<\/li>\n<li>14. Gymnastics<\/li>\n<li>15. Gratitude<\/li>\n<li>16. A Holiday<\/li>\n<li>17. The Elephant<\/li>\n<li>18. The Cobra<\/li>\n<li>19. The Tailor<\/li>\n<li>20. The Astronaut<\/li>\n<\/ul>\n<\/div>\n<div>\n<ul>\n<li>21. Revenge<\/li>\n<li>22. Thrift<\/li>\n<li>23. Stars<\/li>\n<li>24. The Crow<\/li>\n<li>25. Robots<\/li>\n<li>26. Today's Weather<\/li>\n<li>27. Your Hobby<\/li>\n<li>28. Humility<\/li>\n<li>29. The Mango<\/li>\n<li>30. Examinations<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["161-193"], "desc": "Each paragraph must deal with one topic or idea - and with no more than one.", "n": 57, "ex": 1, "items": 0, "ans": 0, "words": 392, "cn": 31}, {"part": 2, "title": "Story Writing", "html": "<div class=\"wm-sub\">\n<h3>\n<h3>Story Writing Principles<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<p>To write a good story, you must have the whole plot clear in your mind, and the main points arranged in their proper order.<\/p>\n<h4>Key Requirements:<\/h4>\n<ul class=\"wm-sub\">\n<li>Clear plot understanding before writing<\/li>\n<li>Follow the given outline order<\/li>\n<li>Connect points naturally for smooth flow<\/li>\n<li>Include dialogue where possible<\/li>\n<li>Build to a surprising conclusion<\/li>\n<li>Use good simple English<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>7 Essential Hints<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>1. Plot Clarity<\/h4>\n<p>See that you have a clear idea of the plot before you begin to write.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>2. Follow Outline<\/h4>\n<p>Do not omit any point, and keep to the order given in the outline.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>3. Natural Connection<\/h4>\n<p>Connect the points naturally so the whole reads as connected composition. Use imagination to fill in details.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>4. Include Dialogue<\/h4>\n<p>Where possible, introduce dialogue or conversation; make it natural and interesting.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>5. Strong Conclusion<\/h4>\n<p>The whole story should lead up to the conclusion naturally, then come as a surprise.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>6. Title Selection<\/h4>\n<p>Choose main character, object, incident, or suitable proverb/quotation for the title.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>7. Quality Writing<\/h4>\n<p>Ensure grammatical, idiomatic, good simple English. Revise and rewrite until perfect.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Complete Example: \"The Boy Who Cried Wolf!\"<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Specimen Outline:<\/h4>\n<p>Boy set to guard sheep—told to cry \"Wolf!\" if he sees a wolf near the flock—watches the sheep for several days—gets tired of the monotonous work—so one day shouts \"Wolf!\" as a joke—all the villagers hasten to his help—they find no wolf—boy laughs at them—villagers angry—plays the same joke a few days later—some villagers take no notice—some come running—finding nothing, they beat the boy—at last wolf really comes—boy is terrified and shouts \"Wolf! Wolf!\"—villagers take no notice—wolf kills several sheep<\/p>\n<div class=\"wm-example\">One of the boys in a village was sent out into fields to look after the sheep.\n\n\"Mind you take care of them and don't let them stray,\" said the villagers to him. \"And keep a good look out for wolves. Don't go far away: and if you see a wolf coming near the sheep, shout out 'Wolf!' as loudly as you can, and we will come at once to help you.\"\n\n\"All right!\" said the boy, \"I will be careful.\"\n\nSo every morning he drove his sheep out to the hillside and watched them all day. And when evening came, he drove them home again.\n\nBut after a few days he got rather tired of this lonely life. Nothing happened and no wolves came. So one afternoon he said to himself: \"These villagers have given me a very stupid job. I think I will play a trick on them just for fun.\"\n\nSo he got up and began shouting as loudly as he could, \"Wolf! Wolf!\"\n\n[Story continues with full narrative showing the consequences of lying]<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Exercise 133 - Story Outlines<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Construct readable stories from the following outlines:<\/h4>\n<div class=\"wm-sub\">\n<h4>1. The Blind Lady and the Doctor<\/h4>\n<p>An old lady becomes blind—calls in a doctor—agrees to pay large fee if cured, but nothing if not—doctor calls daily—covets lady's furniture—delays the cure—every day takes away some of her furniture—at last cures her—demands his fees—lady refuses to pay, saying cure is not complete—doctor brings a court case—judge asks lady why she will not pay—she says sight not properly restored—she cannot see all her furniture—judge gives verdict in her favour—moral<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>2. The Jackal and the Camel<\/h4>\n<p>A jackal wants crabs on the other side of a river—wonders how to get across—tells camel there is sugarcane the other side—camel agrees to carry him across in return for the information—they cross—jackal finishes his meal—plays trick on camel—runs round the fields howling—villagers rush out—see camel in sugarcane—beat him with sticks—camel runs to river—jackal jumps on his back—while crossing, camel asks jackal why he played him such a trick—jackal says he always howls after a good meal—camel replies he always takes a bath after a good meal—rolls in the river—jackal nearly drowned—tit-for-tat<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>3. The Faithful Nurse<\/h4>\n<p>A son is born to a Rajah—the mother dies in childbirth—a young mother with a baby is chosen as nurse—she nurses both babies together—enemies of the Rajah plot to kill his son—they bribe the guards and get into the palace—the nurse is warned just in time—quickly changes the children's dresses—leaves her own child dressed as prince and flies with real prince—murderers enter room and kill the child left behind—so prince is saved—Rajah offers nurse rewards—she refuses them and kills herself—Rajah grieved—erects splendid tomb for the faithful nurse<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["161-193"], "desc": "To write a good story, you must have the whole plot clear in your mind, and the main points arranged in their proper order.", "n": 58, "ex": 1, "items": 0, "ans": 0, "words": 720, "cn": 32}, {"part": 2, "title": "Reproduction of a Story-Poem", "html": "<div class=\"wm-sub\">\n<h3>\n<h3>What You Need to Do<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<p>Tell in your own words the story which is told in a poem. First read the poem as a story to understand what the story is, then tell the same story in your own words and your own way.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>6 Essential Hints<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>1. Read Thoroughly<\/h4>\n<p>Read the whole poem slowly and carefully. If the story isn't clear after first reading, read again until you understand it thoroughly.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>2. Note Chief Facts<\/h4>\n<p>Write down briefly the chief facts of the story, in order to guide your narration. Don't leave out any important point.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>3. Write in Prose<\/h4>\n<p>Write the story in simple, straightforward English, telling the incidents in their natural order.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>4. Use Your Own Words<\/h4>\n<p>Don't copy the language of the poem. Use your own words but don't try to use fine language; be simple and choose plain words.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>5. Review Content<\/h4>\n<p>When finished, read through to see whether you've left out any important fact, or stated any wrongly.<\/p>\n<\/div>\n<div class=\"wm-rule\">\n<h4>6. Check Grammar<\/h4>\n<p>Examine your composition for mistakes in spelling, grammar and punctuation. Ensure sentences are properly constructed and the whole composition reads well.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Example: \"The Glove and the Lions\"<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Original Poem (excerpt):<\/h4>\n<div class=\"wm-example\">King Francis was a hearty king, and loved a royal sport;\nAnd one day, as his lions strove, sat looking on the court;\nThe nobles filled the benches round, the ladies by their side,\nAnd 'mongst them Count de Lorge, with one he hoped to make his bride.\n\nDe Lorge's love o'erheard the king, a beauteous lively dame,\nWith smiling lips, and sharp bright eyes, which always seemed the same;\nShe thought, \"The Count, my lover, is as brave as brave can be;\nHe surely would do desperate things to show his love of me!\"\n\nShe dropped her glove to prove his love; then looked on him and smiled;\nHe bowed, and in a moment leaped among the lions wild;\nThe leap was quick; return was quick; he soon regained his place—\nThen threw the glove, but not with love, right in the lady's face!<\/div>\n<h4>Prose Reproduction:<\/h4>\n<div class=\"wm-example\">King Francis was a great lover of all kinds of sport; and one day he and his courtiers, noblemen and ladies, sat watching wild savage lions fighting each other in the enclosure below. Amongst the courtiers sat Count de Lorge beside a beautiful and lively lady of noble birth whom he loved and hoped to marry. \n\nThe lady, hearing the king's comment about being safer above than below with the lions, thought she would show the king and his court how devoted her lover was to her. So she dropped her glove down among the fighting lions, and then looked at Count de Lorge and smiled at him. \n\nHe bowed to her, and leaped down among the savage lions without hesitation, recovered the glove, and climbed back to his place in a few moments. Then he threw the glove right in the lady's face.\n\nKing Francis cried out, \"Well and bravely done! But it was not love that made your lady set you such a dangerous thing to do, but her vanity!\"<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Exercise 134 - Practice Poems<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Practice with these story-poems:<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>1. \"Abou Ben Adhem\" by Leigh Hunt<\/h4>\n<p>Tell in your own words and identify the moral of the legend.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>2. \"King Bruce and the Spider\"<\/h4>\n<p>Imagine yourself to be King Bruce and tell the story.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>3. \"Bishop Hatto\"<\/h4>\n<p>Tell the story in a letter to a friend.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>4. \"The Blind Men and the Elephant\"<\/h4>\n<p>Tell in your own words as told by J.G. Saxe.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>5. \"Inchcape Rock\"<\/h4>\n<p>Tell the story of Southey's poem in your own words.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>6. \"Androcles and the Lion\"<\/h4>\n<p>Tell the story as related by Androcles.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["161-193"], "desc": "Tell in your own words the story which is told in a poem.", "n": 59, "ex": 1, "items": 0, "ans": 0, "words": 614, "cn": 33}, {"part": 2, "title": "Letter Writing", "html": "<div class=\"wm-sub\">\n<h3>\n<h3>The Form of Letters<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Six Essential Points of Form:<\/h4>\n<ul class=\"wm-sub\">\n<li><strong>1. Heading:<\/strong> Writer's address and date<\/li>\n<li><strong>2. Salutation:<\/strong> Courteous greeting<\/li>\n<li><strong>3. Communication:<\/strong> The body of the letter<\/li>\n<li><strong>4. Subscription:<\/strong> Courteous leave-taking<\/li>\n<li><strong>5. Signature:<\/strong> Writer's name<\/li>\n<li><strong>6. Superscription:<\/strong> Address on envelope<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-example\">\n<h4>Sample Letter Format:<\/h4>\n<div class=\"wm-example\">16 North Usman Road\nChennai 600 017\n4 October 2001\n\nDear Sir,\n\nI shall be much obliged if you send me as soon as possible the books which I ordered a week ago.\n\nYours faithfully,\nAbdul Ghani<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Social Letters - Friendly Letters<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Characteristics:<\/h4>\n<ul class=\"wm-sub\">\n<li>Easy, conversational style<\/li>\n<li>Nature of friendly chat<\/li>\n<li>Informal and free-and-easy<\/li>\n<li>Can touch on many subjects<\/li>\n<li>Can use colloquial expressions<\/li>\n<li>Must still follow grammar rules<\/li>\n<\/ul>\n<h4>Forms of Address:<\/h4>\n<p><strong>To family:<\/strong> Dear Father, My dear Mother, Dear Uncle, Dear Hari<\/p>\n<p><strong>To friends:<\/strong> Dear Shri Desai, Dear Desai, Dear Ramchandra<\/p>\n<p><strong>To older friends:<\/strong> Dear Mr Krishna Rao<\/p>\n<h4>Subscription Forms:<\/h4>\n<p><strong>To relatives:<\/strong> Yours affectionately, Your loving son/brother/friend<\/p>\n<p><strong>To friends:<\/strong> Yours very sincerely, With kind regards<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Sample Friendly Letter:<\/h4>\n<div class=\"wm-example\">18 Patel Road,\nMumbai 400014.\n24 Sept. 2001\n\nMy dear Uncle,\n\nI have just remembered that it is your birthday on Saturday and so I must send you a birthday letter at once. And I begin with the old greeting, Many happy returns of the day! I hope the day itself will be peaceful and happy for you and that you will be spared in happiness and health to us all for years yet.\n\nYou have always been a kind and generous uncle to me, and I take this opportunity of thanking you from the bottom of my heart for all you have done for me.\n\nI am sending you a book which I think you will like. You were always a great reader, and I am glad that your eyesight remains as good as ever.\n\nWith love and best wishes,\nYour loving nephew,\nSohrab<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Business Letters<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Key Characteristics:<\/h4>\n<ul class=\"wm-sub\">\n<li>Terse, clear, and to the point<\/li>\n<li>Much more formal than friendly letters<\/li>\n<li>Use polite expressions<\/li>\n<li>Avoid business \"jargon\"<\/li>\n<li>Give clear descriptions of goods wanted<\/li>\n<li>Specify payment method<\/li>\n<\/ul>\n<h4>Modes of Address:<\/h4>\n<p><strong>To a tradesman:<\/strong> Dear Sir, conclude with Yours faithfully<\/p>\n<p><strong>To a firm:<\/strong> Dear Sirs, conclude with Yours faithfully<\/p>\n<p><strong>To professionals:<\/strong> Dear Sir/My dear Sir, conclude with Yours faithfully/Yours truly<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Sample Business Letter:<\/h4>\n<div class=\"wm-example\">16 Church Street\nAnaparthi 533 341\n14 Dec. 2001\n\nThe Manager\nSouthern Agency\nRajahmundry 533 101\n\nDear Sir,\n\nI shall be grateful if you will kindly supply the following items of Godrej furniture:\n\n1 almirah – model 2\n3 chairs – model 4\n2 chairs – model 6\n1 table – model 101\n\nPlease send them carriage forward to the above address, and your bill will be paid on receipt.\n\nYours faithfully,\nV.J. Manohar<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Notes of Invitation<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Formal Invitations:<\/h4>\n<ul class=\"wm-sub\">\n<li>Written in third person<\/li>\n<li>No heading or salutation<\/li>\n<li>No complimentary close<\/li>\n<li>Writer's name in body<\/li>\n<li>Address and date to the left below<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-example\">\n<h4>Formal Invitation Example:<\/h4>\n<div class=\"wm-example\">Mr and Mrs V.A. Paul request the pleasure of Mr K. Gopalan's company at dinner on Friday, 14 July, at eight o'clock.\n\n18 Peters Road\nChennai 600 014<\/div>\n<h4>Formal Acceptance:<\/h4>\n<div class=\"wm-example\">Mr K. Gopalan has pleasure in accepting the kind invitation of Mr and Mrs V.A. Paul to dinner on Friday, 14 July, at eight o'clock.\n\n12 Kamaraj Salai\nChennai 600 005<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n<h3>Comprehensive Exercises<\/h3>\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Exercise 135 - Friendly Letters (12 topics)<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>Topics 1-4:<\/h4>\n<ul>\n<li>To cousin requesting camera loan<\/li>\n<li>From boarding school boy to sick mother<\/li>\n<li>To father about home events<\/li>\n<li>To cousin about circus experience<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Topics 5-8:<\/h4>\n<ul>\n<li>From boy about approaching vacation<\/li>\n<li>From son about examination hopes<\/li>\n<li>To younger brother about studies<\/li>\n<li>Reply to the above<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Topics 9-12:<\/h4>\n<ul>\n<li>From mother about bad school report<\/li>\n<li>Reply to the above<\/li>\n<li>About recovery from long illness<\/li>\n<li>About railway accident experience<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 142 - Business Letters (7 topics)<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>Commercial:<\/h4>\n<ul>\n<li>Complaint about faulty watch<\/li>\n<li>Request for house repairs<\/li>\n<li>Complaint about bread quality<\/li>\n<li>Baker's apology<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Services:<\/h4>\n<ul>\n<li>Holiday bread suspension<\/li>\n<li>Request for catalogues<\/li>\n<li>House-agent inquiry<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 145 - Newspaper Letters (9 topics)<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>Public Issues:<\/h4>\n<ul>\n<li>Reckless driving<\/li>\n<li>Insanitary bazaars<\/li>\n<li>Street noises<\/li>\n<li>Free library establishment<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Community Welfare:<\/h4>\n<ul>\n<li>Orphanage funds appeal<\/li>\n<li>Municipal water quality<\/li>\n<li>Social Service League<\/li>\n<li>Street-begging evils<\/li>\n<li>Flood relief funds<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["161-193"], "desc": "To family: Dear Father, My dear Mother, Dear Uncle, Dear Hari", "n": 60, "ex": 3, "items": 0, "ans": 0, "words": 675, "cn": 34}, {"part": 2, "title": "The Appreciation of Poetry", "html": "<div class=\"wm-sub\">\n<h4>\n                    What is Poetry?\n                <\/h4>\n<div class=\"wm-sub\">\n<p>Though many have tried to define poetry, no one has succeeded in giving a satisfactory definition of it. Poetry seems to elude all attempts to describe it. Yet we should know something about poetry, and learn to cultivate our feeling for it, so that we may gradually come to recognize it, and know when it is present.<\/p>\n<div class=\"wm-hl\">The best we can do is to point out some essential characteristics of true poetry.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>\n                    Poetry vs. Verse\n                <\/h4>\n<div class=\"wm-sub\">\n<p><strong>Verse<\/strong> is the form of poetry. Poets generally (but not always) write their poetry in verse-form. But there is a lot of verse written which is no poetry at all.<\/p>\n<div class=\"wm-hl\">Verse is the body, and the poetry is the soul; and body without a soul is a dead body.<\/div>\n<h4>Key Differences:<\/h4>\n\n<div class=\"wm-sub\">\n<ul>\n<li><strong>Regular Rhythm:<\/strong> Equal intervals of accented syllables<\/li>\n<li><strong>Rhyme:<\/strong> Words with same vowel and consonant sounds<\/li>\n<li><strong>Stanzas:<\/strong> Organized units or divisions<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<ul>\n<li><strong>Music:<\/strong> Verbal beauty and rhythm combined<\/li>\n<li><strong>Vision:<\/strong> Spiritual insight and imagery<\/li>\n<li><strong>Emotion:<\/strong> Touches the heart and arouses feeling<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>\n                    Example: Prose vs. Verse\n                <\/h4>\n<div class=\"wm-sub\">\n\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n                            \"The untrodden snow lay all bloodless on Linden, when the sun was low; and the flow of Iser, rolling rapidly, was dark as winter.\"\n                        <\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n                            \"On Linden, when the sun was low,<br/>\n                            All bloodless lay the untrodden snow;<br/>\n                            And dark as winter was the flow<br/>\n                            Of Iser, rolling rapidly.\"\n                        <\/div>\n<p><em>From Campbell's poem \"Hohenlinden\"<\/em><\/p>\n<\/div>\n<\/div>\n<\/div>", "src": ["244-265"], "desc": "Though many have tried to define poetry, no one has succeeded in giving a satisfactory definition of it.", "n": 61, "ex": 0, "items": 0, "ans": 0, "words": 223, "cn": 35}, {"part": 2, "title": "Essential Characteristics of Poetry", "html": "<div class=\"wm-sub\">\n<h3>1. Music - Verbal Beauty<\/h3>\n<p>The poet chooses words of beautiful sound and arranges them harmoniously to create \"word music.\" The sound of the lines helps make their meaning clearer.<\/p>\n<div class=\"wm-sub\">\n<h4 style=\"color: white; background: rgba(255,255,255,0.1);\">\n                        Musical Effects in Poetry\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>a) Rhyme<\/h4>\n<div class=\"wm-example\">\n                            \"Strew on her roses, roses,<br/>\n                            And never a spray of yew,<br/>\n                            In quiet she reposes:<br/>\n                            Ah! would that I did too!\" <em>(M. Arnold)<\/em>\n<\/div>\n<h4>b) Vowel and Consonant Sounds<\/h4>\n<div class=\"wm-example\">\n                            \"Season of mists and mellow fruitfulness.\" <em>(Keats)<\/em><br/>\n<small>Long open vowels and soft consonants create soothing music<\/small>\n<\/div>\n<h4>c) Onomatopoeia<\/h4>\n<div class=\"wm-example\">\n                            \"The moan of doves in immemorial elms<br/>\n                            And murmuring of innumerable bees.\" <em>(Tennyson)<\/em>\n<\/div>\n<h4>d) Alliteration<\/h4>\n<div class=\"wm-example\">\n                            \"The fair breeze below, the white foam flew<br/>\n                            The furrow followed free.\" <em>(Coleridge)<\/em>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>2. Vision - Spiritual Insight<\/h3>\n<p>A great poet is a \"seer\" - one who has spiritual insight and can see truths that others cannot. They help us see natural objects in new ways.<\/p>\n<div class=\"wm-sub\">\n<h4 style=\"color: white; background: rgba(255,255,255,0.1);\">\n                        Vision Examples\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Ordinary vs. Poetic Vision<\/h4>\n\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n                                \"A primrose by a river's brim<br/>\n                                A yellow primrose was to him,<br/>\n                                And it was nothing more.\"\n                                <small><em>- Peter Bell (unimaginative man)<\/em><\/small>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n                                \"To me the meanest flower that blows can give<br/>\n                                Thoughts that do often lie too deep for tears.\"\n                                <small><em>- Wordsworth (the poet)<\/em><\/small>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>3. Emotion - Touching the Heart<\/h3>\n<p>Poetry's function is to touch the heart and arouse emotion. Only emotion can rouse emotion - if the poet feels nothing, readers will feel nothing.<\/p>\n<div class=\"wm-example\">\n                    \"And the stately ships go on<br/>\n                    To their haven under the hill;<br/>\n                    But O for the touch of a vanish'd hand,<br/>\n                    And the sound of a voice that is still!\" <em>(Tennyson)<\/em>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>\n                     Imagery - Creating Mental Pictures\n                <\/h4>\n<div class=\"wm-sub\">\n<p>Poets create vivid mental pictures through three main methods:<\/p>\n<h4>a) By Description<\/h4>\n<div class=\"wm-example\">\n                        \"The curfew tolls the knell of parting day,<br/>\n                        The lowing herd wind slowly o'er the lea,<br/>\n                        The ploughman homeward plods his weary way,<br/>\n                        And leaves the world to darkness and to me.\" <em>(Gray)<\/em>\n<\/div>\n<h4>b) By Figures of Speech<\/h4>\n<p>Using simile, metaphor, and personification to compare and illuminate.<\/p>\n<h4>c) By Picturesque Epithets<\/h4>\n<div class=\"wm-example\">\n                        \"All in a hot and <strong>copper<\/strong> sky,<br/>\n                        The <strong>bloody<\/strong> sun, at noon.\" <em>(Coleridge)<\/em>\n<\/div>\n<\/div>\n<\/div>", "src": ["244-265"], "desc": "The poet chooses words of beautiful sound and arranges them harmoniously to create \"word music.\" The sound of the lines helps make their meaning clearer.", "n": 62, "ex": 0, "items": 0, "ans": 0, "words": 336, "cn": 36}, {"part": 2, "title": "Poetry Analysis: \"Daffodils\"", "html": "<div class=\"wm-example\">\n                I wandered lonely as a cloud<br/>\n                That floats on high o'er vales and hills,<br/>\n                When all at once I saw a crowd,<br/>\n                A host of golden daffodils,<br/>\n                Beside the lake, beneath the trees,<br/>\n                Fluttering and dancing in the breeze.<br/><br/>\n\n                Continuous as the stars that shine<br/>\n                And twinkle on the milky way,<br/>\n                They stretched in never-ending line<br/>\n                Along the margin of a bay:<br/>\n                Ten thousand saw I at a glance<br/>\n                Tossing their heads in sprightly dance.<br/><br/>\n\n                The waves beside them danced, but they<br/>\n                Outdid the sparkling waves in glee:<br/>\n                A poet could not but be gay<br/>\n                In such a jocund company!<br/>\n                I gazed—and gazed—but little thought<br/>\n                What wealth the show to me had brought.<br/><br/>\n\n                For oft when on my couch I lie<br/>\n                In vacant or in pensive mood,<br/>\n                They flash upon that inward eye<br/>\n                Which is the bliss of solitude;<br/>\n                And then my heart with pleasure fills,<br/>\n                And dances with the daffodils.\n            <\/div>\n<div class=\"wm-sub\">\n<h4>\n                     Complete Analysis\n                <\/h4>\n<div class=\"wm-sub\">\n\n<div class=\"wm-sub\">\n<h4>What the poem is about:<\/h4>\n<p>The poet tells us that during a solitary walk beside a lake on a bright Spring morning, he suddenly came upon thousands of yellow daffodils dancing in the breeze. The sight filled him with pleasure, but he didn't realize at the time how much the experience had enriched his life. Later, the memory of this beautiful scene would return as a mental picture, giving him repeated joy.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Simple yet effective language:<\/h4>\n<p>The poem uses very simple language with no difficult words. <em>Daffodil<\/em> is a bulbous plant of the lily family bearing a yellow trumpet-shaped flower that grows wild in English woods and flowers in Spring.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Visual Elements:<\/h4>\n<ul>\n<li><strong>Description:<\/strong> First three verses describe daffodils by a lake, lit by sun and dancing in wind<\/li>\n<li><strong>Similes:<\/strong>\n<ul>\n<li>Solitary poet compared to a lonely cloud<\/li>\n<li>Endless line of daffodils compared to stars in the milky way<\/li>\n<\/ul>\n<\/li>\n<li><strong>Personification:<\/strong> Daffodils described as \"dancing in glee\" and \"tossing their heads\"<\/li>\n<li><strong>Hyperbole:<\/strong> \"Ten thousand saw I at a glance\" - poetic exaggeration<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Musical Elements:<\/h4>\n<ul>\n<li><strong>Rhythm:<\/strong> Line 6 quickens compared to preceding lines, echoing the dancing movement<\/li>\n<li><strong>Alliteration:<\/strong> \"And dances with the daffodils\" (line 6, stanza 4)<\/li>\n<li><strong>Repetition:<\/strong> \"I gazed—and gazed\" emphasizes the length of time spent in wonder<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Most Memorable Lines:<\/h4>\n<div class=\"wm-example\">\n                            \"They flash upon that inward eye<br/>\n                            Which is the bliss of solitude\"\n                        <\/div>\n<p>The <strong>\"inward eye\"<\/strong> refers to the faculty of visualizing or calling up mental pictures from memory or imagination. Such mind-pictures give us joy when we are alone and at leisure.<\/p>\n<\/div>\n<\/div>\n<\/div>", "src": ["244-265"], "desc": "The poet tells us that during a solitary walk beside a lake on a bright Spring morning, he suddenly came upon thousands of yellow daffodils dancing in the breeze.", "n": 63, "ex": 0, "items": 0, "ans": 0, "words": 403, "cn": 37}, {"part": 2, "title": "Poetry Exercises and Examples", "html": "<div class=\"wm-exercise\">\n<h3>Interactive Poetry Quiz<\/h3>\n<div>\n<div class=\"wm-qitem\">What are the three essential characteristics of poetry?<\/div>\n<div>\n<div>Rhythm, Rhyme, and Stanzas<\/div>\n<div>Music, Vision, and Emotion<\/div>\n<div>Metaphor, Simile, and Alliteration<\/div>\n<div>Description, Narration, and Dialogue<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>\n                     Exercise 163 - Specimen Poems with Analysis\n                <\/h4>\n<div class=\"wm-sub\">\n<h4>Poem 1: \"She dwelt among the untrodden ways\" - Wordsworth<\/h4>\n<div class=\"wm-example\">\n                        She dwelt among the untrodden ways<br/>\n                        Beside the springs of Dove;<br/>\n                        A maid whom there were none to praise<br/>\n                        And very few to love.<br/><br/>\n\n                        A violet by a mossy stone<br/>\n                        Half-hidden from the eye!<br/>\n                        –Fair as a star, when only one<br/>\n                        Is shining in the sky.<br/><br/>\n\n                        She lived unknown, and few could know<br/>\n                        When Lucy ceased to be;<br/>\n                        But she in her grave, and, oh,<br/>\n                        The difference to me\n                    <\/div>\n<div class=\"wm-qitem\">\n<h4>Questions:<\/h4>\n<ol>\n<li>Give a suitable title to the poem.<\/li>\n<li>Name and explain the figure of speech used in the second stanza.<\/li>\n<li>Which lines in the poem show intense feeling? What feeling has the poet expressed?<\/li>\n<li>What do you think of the language used in the poem?<\/li>\n<\/ol>\n<\/div>\n<div class=\"wm-answer\">\n<h4 class=\"wm-answer\">Answers:<\/h4>\n<ol>\n<li><strong>\"The Lost Love\"<\/strong> or <strong>\"She Dwelt Among the Untrodden Ways\"<\/strong><\/li>\n<li><strong>Simile:<\/strong> The girl is compared to the half-hidden violet and the lonely star to emphasize (a) her solitude and obscurity, and (b) her beauty of soul as well as body.<\/li>\n<li><strong>The last two lines<\/strong> express the feeling of <em>love and bereavement<\/em>.<\/li>\n<li>The most striking feature is its <strong>simplicity<\/strong>. The poet uses simple, everyday words, mostly of one syllable; yet they produce a poem with magic charm.<\/li>\n<\/ol>\n<\/div>\n<h4>Poem 2: \"Laugh and be merry\" - John Masefield<\/h4>\n<div class=\"wm-example\">\n                        Laugh and be merry, better the world with a song.<br/>\n                        Better the world with a blow in the teeth of a wrong.<br/>\n                        Laugh, for the time is brief, a thread the length of a span.<br/>\n                        Laugh and be proud to belong to the old proud pageant of man.<br/><br/>\n\n                        Laugh and be merry: remember, in olden time,<br/>\n                        God made Heaven and Earth for joy. He took in a rhyme,<br/>\n                        Made them, and filled them with the strong red wine of His mirth.<br/>\n                        The splendid joy of the stars; the joy of the earth.<br/><br/>\n\n                        So we must laugh and drink from the deep blue cup of the sky.<br/>\n                        Join the jubilant song of the great stars sweeping by,<br/>\n                        Laugh, and battle, and work, and drink of the wine outpoured<br/>\n                        In the dear green earth, the sign of the joy of the Lord.<br/><br/>\n\n                        Laugh and be merry together, like brothers akin,<br/>\n                        Guesting awhile in the rooms of a beautiful inn,<br/>\n                        Glad till the dancing stops, and the lilt of the music ends.<br/>\n                        Laugh till the game is played: and be you merry, my friends.\n                    <\/div>\n<div class=\"wm-qitem\">\n<h4>Questions:<\/h4>\n<ol>\n<li>What is the central idea of the poem?<\/li>\n<li>What is the \"blow\" with which the poet wants us to better the world?<\/li>\n<li>Quote three striking examples of metaphors used in the poem.<\/li>\n<li>Explain: (a) \"the old proud pageant of man\" (b) \"Guesting awhile in the rooms of a beautiful inn\"<\/li>\n<\/ol>\n<\/div>\n<div class=\"wm-answer\">\n<h4 class=\"wm-answer\">Answers:<\/h4>\n<ol>\n<li>Life is short and we must therefore <strong>laugh and be cheerful<\/strong>, and enjoy all the beauty and happiness that can be found on this earth.<\/li>\n<li>It is our <strong>laughter and merriment<\/strong> that will serve as a blow and hit out boldly against wrong and injustice in the world.<\/li>\n<li>\n<ul>\n<li>\"Laugh, for the time is brief, a thread the length of a span.\"<\/li>\n<li>\"Made them and filled them with the strong red wine of His mirth.\"<\/li>\n<li>\"Laugh till the game is played.\"<\/li>\n<\/ul>\n<\/li>\n<li>\n<strong>(a)<\/strong> We are part of the spectacular progress of mankind which is marked with many glorious achievements.<br/>\n<strong>(b)<\/strong> We should be happy and cheerful together during the short time we are in this beautiful world in the same way as brothers who are staying for a short while in a beautiful inn where there is dancing and music.\n                            <\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["244-265"], "desc": "Name and explain the figure of speech used in the second stanza.", "n": 64, "ex": 1, "items": 3, "ans": 4, "words": 618, "cn": 38}, {"part": 2, "title": "Paraphrasing", "html": "<div class=\"wm-sub\">\n<h4>\n                     What is Paraphrasing?\n                <\/h4>\n<div class=\"wm-sub\">\n<p>The word \"paraphrase\" (from the Greek, meaning literally \"equivalent sentence\") is defined as <strong>\"restatement of the sense of a passage in other words.\"<\/strong><\/p>\n<div class=\"wm-hl\">It is \"the reproduction in one's own natural idiom or style of the full sense of a passage written in another idiom or style.\"<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>\n                     Uses of Paraphrasing\n                <\/h4>\n<div class=\"wm-sub\">\n<h4>a) As an Exercise in Composition<\/h4>\n<ul>\n<li><strong>Tests comprehension:<\/strong> Good test of ability to understand what one reads<\/li>\n<li><strong>Trains expression:<\/strong> Fine training in expressing ideas simply, clearly and directly<\/li>\n<li><strong>Improves skills:<\/strong> Gives practice in grammatical and idiomatic composition<\/li>\n<\/ul>\n<h4>b) As a Method of Explanation<\/h4>\n<p>Often the best way of explaining an involved or ornate passage of prose or an obscure piece of poetry.<\/p>\n<div class=\"wm-example\">\n<strong>Original (Browning):<\/strong><br/>\n                        \"Enough now, if the Right<br/>\n                        And Good and Infinite<br/>\n                        Be named here, as thou callest thy hand thine own.\"<br/><br/>\n<strong>Paraphrase:<\/strong><br/>\n                        \"It is enough if in age we can get as absolute a knowledge of Right and Wrong, Good and Evil, the Changing and the Eternal, as we have of our own hands.\"\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>\n                     Characteristics of a Good Paraphrase\n                <\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h3>1. Translation<\/h3>\n<p>Must faithfully reproduce and interpret the thought of the original passage.<\/p>\n<h4>Example - Expanding Terse Style:<\/h4>\n\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n                                \"Prosperity doth best discover vice, but Adversity doth best discover virtue.\"\n                            <\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n                                \"When a man is prosperous, there is more chance of his bad qualities coming to light; but when he is unfortunate or in trouble, his good qualities are more likely to show themselves.\"\n                            <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>2. Fullness<\/h3>\n<p>Must reproduce not only the substance but also the details. Nothing in the original may be left unrepresented, but nothing should be added.<\/p>\n<div class=\"wm-hl\">\"The truth, the whole truth, and nothing but the truth.\"<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>3. Wholeness<\/h3>\n<p>The passage must be treated as a whole. Don't work line by line - grasp the central meaning first.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<h3>4. Complete Prose<\/h3>\n<p>Should read as an independent, complete composition in idiomatic English, perfectly clear without reference to the original.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>\n                     Method of Procedure\n                <\/h4>\n<div class=\"wm-sub\">\n<ol>\n<li><strong>Read carefully<\/strong> until you grasp the general meaning<\/li>\n<li><strong>Note details:<\/strong> difficult words, idioms, metaphors, figures of speech<\/li>\n<li><strong>Prepare to reproduce<\/strong> in your own words<\/li>\n<li><strong>Treat as a whole<\/strong> - don't work word by word<\/li>\n<li><strong>Rearrange if needed<\/strong> to make meaning clearer<\/li>\n<li><strong>Break up or combine sentences<\/strong> as needed<\/li>\n<li><strong>Don't change words unnecessarily<\/strong><\/li>\n<li><strong>No explanatory notes<\/strong> - everything must be in the paraphrase itself<\/li>\n<li><strong>Write a rough draft first<\/strong><\/li>\n<li><strong>Revise carefully<\/strong><\/li>\n<li><strong>Write the fair copy<\/strong><\/li>\n<\/ol>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h3>Specimen Paraphrases<\/h3>\n<div class=\"wm-sub\">\n<h4>\n                        Example 1: Scott's \"Breathes there the man\"\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Original:<\/h4>\n<div class=\"wm-example\">\n                            Breathes there the man, with soul so dead,<br/>\n                            Who never to himself hath said,<br/>\n                            This is my own, my native land?<br/>\n                            Whose heart hath ne'er within him burn'd.<br/>\n                            As home his footsteps he hath turn'd.<br/>\n                            From wandering on a foreign strand?<br/>\n                            If such there breathe, go, mark him well;<br/>\n                            For him no Minstrel raptures swell;<br/>\n                            High though his titles, proud his name,<br/>\n                            Boundless his wealth as wish can claim;<br/>\n                            Despite those titles, power, and pelf,<br/>\n                            The wretch, concentred all in self,<br/>\n                            Living, shall forfeit fair renown,<br/>\n                            And, doubly dying, shall go down<br/>\n                            To the vile dust, from whence he sprung.<br/>\n                            Unwept, unhonour'd, and unsung.\n                        <\/div>\n<h4>Paraphrase:<\/h4>\n<div class=\"wm-answer\">\n                            It is difficult to believe that any man can be so spiritually dead as to have no love for his native country after travelling in foreign lands. But if such an unpatriotic person does exist, take careful note of his career; and you will find that he will never inspire poets to celebrate him in deathless song. He may be a man of high rank, of noble family and of riches beyond the dreams of avarice; but these great advantages will not save him from oblivion. In spite of them all, he will win no fame during his lifetime; and when he dies he will die in a double sense. His body will return to the dust whence it came, and his name will be forgotten. None will weep for him, none will honour him, and no poet will keep his name alive in immortal poetry.\n                        <\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["244-265"], "desc": "The word \"paraphrase\" (from the Greek, meaning literally \"equivalent sentence\") is defined as \"restatement of the sense of a passage in other words.\"", "n": 65, "ex": 1, "items": 0, "ans": 1, "words": 650, "cn": 39}, {"part": 2, "title": "Common Abbreviations", "html": "<div>\n<!-- Academic Degrees -->\n<div class=\"wm-example\" data-category=\"academic\">\n<div>B.A.<\/div>\n<div>Bachelor of Arts<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"academic\">\n<div>M.A.<\/div>\n<div>Master of Arts<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"academic\">\n<div>Ph.D.<\/div>\n<div>Doctor of Philosophy (L philosophiae doctor)<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"academic\">\n<div>D.Lit.<\/div>\n<div>Doctor of Literature<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"academic\">\n<div>M.B.<\/div>\n<div>Bachelor of Medicine (L medicinae baccalaureus)<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"academic\">\n<div>M.D.<\/div>\n<div>Doctor of Medicine (L medicinae doctor)<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"academic\">\n<div>M.Sc.<\/div>\n<div>Master of Science<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"academic\">\n<div>D.Sc.<\/div>\n<div>Doctor of Science<\/div>\n<\/div>\n<!-- Chemical Elements -->\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>H<\/div>\n<div>Hydrogen<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>He<\/div>\n<div>Helium<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>C<\/div>\n<div>Carbon<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>N<\/div>\n<div>Nitrogen<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>O<\/div>\n<div>Oxygen<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>Na<\/div>\n<div>Sodium<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>Au<\/div>\n<div>Gold<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>Ag<\/div>\n<div>Silver<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>Fe<\/div>\n<div>Iron<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"chemistry\">\n<div>Cu<\/div>\n<div>Copper<\/div>\n<\/div>\n<!-- Organizations -->\n<div class=\"wm-example\" data-category=\"organization\">\n<div>U.N.O.<\/div>\n<div>United Nations Organization<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"organization\">\n<div>F.A.O.<\/div>\n<div>Food and Agriculture Organization<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"organization\">\n<div>W.H.O.<\/div>\n<div>World Health Organization<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"organization\">\n<div>I.L.O.<\/div>\n<div>International Labour Organization<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"organization\">\n<div>I.M.F.<\/div>\n<div>International Monetary Fund<\/div>\n<\/div>\n<!-- Military & Awards -->\n<div class=\"wm-example\" data-category=\"military\">\n<div>V.C.<\/div>\n<div>Victoria Cross<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"military\">\n<div>D.S.O.<\/div>\n<div>Distinguished Service Order<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"military\">\n<div>M.C.<\/div>\n<div>Military Cross<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"military\">\n<div>O.M.<\/div>\n<div>Order of Merit<\/div>\n<\/div>\n<!-- Measurements -->\n<div class=\"wm-example\" data-category=\"measurement\">\n<div>kg<\/div>\n<div>Kilogram(s)<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"measurement\">\n<div>cm<\/div>\n<div>Centimetre(s)<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"measurement\">\n<div>km<\/div>\n<div>Kilometre(s)<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"measurement\">\n<div>mg<\/div>\n<div>Milligram(s)<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"measurement\">\n<div>ml<\/div>\n<div>Millilitre(s)<\/div>\n<\/div>\n<!-- Technology -->\n<div class=\"wm-example\" data-category=\"technology\">\n<div>DNA<\/div>\n<div>Deoxyribonucleic acid<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"technology\">\n<div>RNA<\/div>\n<div>Ribonucleic acid<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"technology\">\n<div>ECG<\/div>\n<div>Electrocardiogram<\/div>\n<\/div>\n<div class=\"wm-example\" data-category=\"technology\">\n<div>EEG<\/div>\n<div>Electro-encephalogram<\/div>\n<\/div>\n<\/div>", "src": ["244-265"], "desc": "B.A. Bachelor of Arts M.A. Master of Arts Ph.D. Doctor of Philosophy (L philosophiae doctor) D.Lit. Doctor of Literature M.B. Bachelor of Medicine (L medicinae", "n": 66, "ex": 0, "items": 0, "ans": 0, "words": 116, "cn": 40}]</script>
<script>
/* =====================================================================
   Wren & Martin study application — vanilla JS, no dependencies.
   State lives in localStorage under the wm3 namespace.
   ===================================================================== */
(function () {
  'use strict';

  var CH = JSON.parse(document.getElementById('wm-data').textContent);
  var PARTS = [
    { n: 1, name: 'Part 1', title: 'Grammar',
      blurb: 'Sentences, the parts of speech, nouns, adjectives, articles, pronouns and verbs.' },
    { n: 2, name: 'Part 2', title: 'Analysis, Usage & Composition',
      blurb: 'Analysis and transformation of sentences, correct usage, idioms, and written composition.' }
  ];

  var K = 'wm3:';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var el = function (t, c, h) {
    var n = document.createElement(t);
    if (c) n.className = c;
    if (h != null) n.innerHTML = h;
    return n;
  };
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };

  /* ---------------------------------------------------- storage */
  function load(k, d) {
    try { var v = localStorage.getItem(K + k); return v == null ? d : JSON.parse(v); }
    catch (e) { return d; }
  }
  function save(k, v) {
    try { localStorage.setItem(K + k, JSON.stringify(v)); } catch (e) {}
  }
  var S = {
    seen: load('seen', {}),      // chapter n -> true
    done: load('done', {}),      // chapter n -> true
    mark: load('mark', {}),      // chapter n -> true
    exdone: load('exdone', {}),  // "n:i" -> true
    last: load('last', null),
    recent: load('recent', []),
    theme: load('theme', null),
    open: load('open', { 1: true, 2: true })
  };
  var flush = function () {
    save('seen', S.seen); save('done', S.done); save('mark', S.mark);
    save('exdone', S.exdone); save('last', S.last); save('recent', S.recent);
    save('open', S.open);
  };

  /* ---------------------------------------------------- theme */
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
  }
  applyTheme(S.theme || (window.matchMedia &&
    window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  function toggleTheme() {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    S.theme = t; applyTheme(t); save('theme', t);
  }

  /* ---------------------------------------------------- derived counts */
  var TOTAL = CH.length;
  var TOTAL_EX = CH.reduce(function (a, c) { return a + c.ex; }, 0);
  function nDone() { return Object.keys(S.done).length; }
  function nMark() { return Object.keys(S.mark).length; }
  function nExDone() { return Object.keys(S.exdone).length; }
  function pct() { return TOTAL ? Math.round(nDone() / TOTAL * 100) : 0; }
  function byN(n) { for (var i = 0; i < CH.length; i++) if (CH[i].n === +n) return CH[i]; return null; }

  /* ---------------------------------------------------- sidebar */
  function buildTOC() {
    var toc = $('#toc');
    toc.innerHTML = '';
    PARTS.forEach(function (P) {
      var list = CH.filter(function (c) { return c.part === P.n; });
      var wrap = el('section', 'part');
      var open = S.open[P.n] !== false;
      var head = el('button', 'part-head',
        '<svg class="chev" width="11" height="11" viewBox="0 0 24 24" fill="none" ' +
        'stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>' +
        '<span>' + esc(P.name) + ' — ' + esc(P.title) + '</span>' +
        '<span class="n">' + list.length + '</span>');
      head.setAttribute('aria-expanded', String(open));
      head.addEventListener('click', function () {
        var now = head.getAttribute('aria-expanded') !== 'true';
        head.setAttribute('aria-expanded', String(now));
        S.open[P.n] = now; save('open', S.open);
      });
      var ul = el('ul', 'part-list');
      list.forEach(function (c) {
        var li = el('li');
        var b = el('button', 'toc-item' + (S.done[c.n] ? ' done' : ''),
          '<span class="num">' + pad(c.cn) + '</span>' +
          '<span class="t">' + esc(c.title) + '</span>' +
          (S.mark[c.n] ? '<span class="flag" title="Bookmarked">\u25c6</span>' : ''));
        b.dataset.ch = c.n;
        b.addEventListener('click', function () { go('ch', c.n); });
        li.appendChild(b); ul.appendChild(li);
      });
      wrap.appendChild(head); wrap.appendChild(ul); toc.appendChild(wrap);
    });
    syncSidebar();
  }

  function syncSidebar() {
    $('#sbFill').style.width = pct() + '%';
    $('#sbPct').textContent = pct() + '%';
    $('#sbCount').textContent = nDone() + ' of ' + TOTAL + ' done';
    $('#cntCh').textContent = TOTAL;
    $('#cntBm').textContent = nMark() || '';
    $('#cntEx').textContent = TOTAL_EX;

      if (!S.mark[n] && f) f.remove();

  /* ---------------------------------------------------- drawer */
  function setNav(open) {

  /* ---------------------------------------------------- search index */
  var IDX = null;
  function index() {
    if (IDX) return IDX;
    var box = document.createElement('div');
    IDX = CH.map(function (c) {
      box.innerHTML = c.html;
      var t = (box.textContent || '').replace(/\s+/g, ' ').trim();
      return { n: c.n, t: t, lt: t.toLowerCase(), lti: c.title.toLowerCase() };
    });
    box.innerHTML = '';
    return IDX;
  }

  function search(qs) {
    var q = qs.trim().toLowerCase();
    if (q.length < 2) return [];
    var terms = q.split(/\s+/).filter(Boolean);
    var out = [];
    index().forEach(function (r) {
      var score = 0, at = -1;
      terms.forEach(function (t) {
        if (r.lti.indexOf(t) > -1) score += 40;
        var i = r.lt.indexOf(t);
        if (i > -1) { score += 6; if (at < 0) at = i; }
      });
      if (r.lti.indexOf(q) > -1) score += 60;
      var whole = r.lt.indexOf(q);
      if (whole > -1) { score += 22; if (at < 0 || whole < at) at = whole; }
      if (!score) return;
      out.push({ n: r.n, score: score, snip: snippet(r.t, at, terms) });
    });
    return out.sort(function (a, b) { return b.score - a.score || a.n - b.n; }).slice(0, 60);
  }

  function snippet(text, at, terms) {
    if (at < 0) at = 0;
    var s = Math.max(0, at - 70), e = Math.min(text.length, at + 190);
    var frag = (s > 0 ? '…' : '') + text.slice(s, e) + (e < text.length ? '…' : '');
    frag = esc(frag);
    terms.forEach(function (t) {
      if (t.length < 2) return;
      frag = frag.replace(
        new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'),
        '<mark>$1</mark>');
    });
    return frag;
  }

  /* ---------------------------------------------------- routing */
  var view = { name: 'home', arg: null };

  function go(name, arg, noPush) {
    view = { name: name, arg: arg == null ? null : arg };
    if (!noPush) {
      var h = name === 'ch' ? '#/ch/' + arg : '#/' + name;
      if (location.hash !== h) history.pushState(null, '', h);
    }
    setNav(false);
    render();
    $('#view').focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  function fromHash() {
    var m = /^#\/ch\/(\d+)/.exec(location.hash);
    if (m) return { name: 'ch', arg: +m[1] };
    var k = (location.hash || '').replace('#/', '');
    if (['home', 'toc', 'marks', 'ex-all', 'ex-todo', 'ex-chapter', 'search'].indexOf(k) > -1)
      return { name: k, arg: null };
    return { name: 'home', arg: null };
  }
  window.addEventListener('popstate', function () {
    var r = fromHash(); view = r; render();
  });

    V.innerHTML = '';

    if (n === 'ch') renderChapter(byN(view.arg));

      'Every chapter in reading order, across both parts.');
    else if (n === 'marks') renderList(CH.filter(function (c) { return S.mark[c.n]; }),
      'Bookmarks', 'Chapters you have flagged to come back to.',
      'No bookmarks yet. Open a chapter and choose Bookmark to add one.');
    else if (n === 'search') renderSearch();
    else if (n.indexOf('ex-') === 0) renderExercises(n);
    else renderHome();
    syncSidebar();

      ? byN(view.arg).title : 'Wren & Martin';

  /* an outline of the chapter, shown only where there is room for it */
  var railObserver = null;
  function buildRail(art, body) {
    if (railObserver) { railObserver.disconnect(); railObserver = null; }
    var all = Array.prototype.filter.call(body.querySelectorAll('h3, h4'), function (h) {
      return (h.textContent || '').trim().length > 1;
    });
    var tops = all.filter(function (h) { return h.tagName === 'H3'; });
    // with a full set of top-level headings the sub-headings only add noise
    var hs = tops.length >= 3 ? tops : all;
    if (hs.length > 24) hs = hs.slice(0, 24);
    if (hs.length < 3) return;

    var rail = el('nav', 'rail');
    rail.setAttribute('aria-label', 'Sections in this chapter');
    var ol = el('ol');
    rail.appendChild(el('h3', null, 'In this chapter'));
    rail.appendChild(ol);

    var links = [];
    hs.forEach(function (h, i) {
      h.id = h.id || 'sec-' + i;
      var li = el('li', h.tagName === 'H4' ? 'sub' : '');
      var b = el('button', null, esc(h.textContent.trim()));
      b.addEventListener('click', function () {
        h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      li.appendChild(b); ol.appendChild(li);
      links.push({ h: h, b: b });
    });
    art.classList.add('has-rail');
    art.appendChild(rail);

    if (!('IntersectionObserver' in window)) return;
    railObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        links.forEach(function (l) {
          l.b.setAttribute('aria-current', String(l.h === en.target));
        });
      });
    }, { rootMargin: '0px 0px -78% 0px', threshold: 0 });
    links.forEach(function (l) { railObserver.observe(l.h); });
  }

  /* attach a Show answer control to every answer block */
  function wireAnswers(scope) {
    Array.prototype.forEach.call(scope.querySelectorAll('.wm-answer'), function (a, i) {
      a.id = a.id || 'ans-' + Date.now().toString(36) + '-' + i;
      var b = el('button', 'reveal', 'Show answer');
      b.setAttribute('aria-expanded', 'false');
      b.setAttribute('aria-controls', a.id);
      a.parentNode.insertBefore(b, a);
      b.addEventListener('click', function () {
        var open = !a.classList.contains('shown');
        a.classList.toggle('shown', open);
        b.textContent = open ? 'Hide answer' : 'Show answer';
        b.setAttribute('aria-expanded', String(open));
      });
    });
  }

  /* ---- search ---- */

  var t = null;
  $('#q').addEventListener('input', function (e) {
    lastQ = e.target.value;
    clearTimeout(t);
    t = setTimeout(function () {
      if (lastQ.trim().length >= 2) {
        if (view.name !== 'search') go('search'); else render();
      } else if (view.name === 'search' && !lastQ.trim()) {
        go('home');
      }
    }, 160);
  });
  $('#q').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.target.value = ''; lastQ = ''; go('home'); }
  });

  /* ---------------------------------------------------- misc chrome */
  Array.prototype.forEach.call(document.querySelectorAll('.mode'), function (b) {
    b.addEventListener('click', function () { go(b.dataset.go); });
  });

  var tt = $('#totop');
  window.addEventListener('scroll', function () {
    tt.classList.toggle('on', window.scrollY > 640);
  }, { passive: true });
  tt.addEventListener('click', function () {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    $('#view').focus({ preventScroll: true });
  });

  document.addEventListener('keydown', function (e) {
    if (e.target.matches('input,textarea')) return;
    if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
    if (view.name !== 'ch') return;
    if (e.key === 'ArrowRight' || e.key === 'j') {
      var nx = byN(+view.arg + 1); if (nx) go('ch', nx.n);
    } else if (e.key === 'ArrowLeft' || e.key === 'k') {
      var pv = byN(+view.arg - 1); if (pv) go('ch', pv.n);
    }
  });

  /* ---------------------------------------------------- boot */
  buildTOC();
  view = fromHash();
  render();
})();

</script>
</body>
</html>
