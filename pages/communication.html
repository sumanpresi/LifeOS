<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Class 8 English — Learn, Speak, Write</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<script>
  /* Inline and blocking, for the same reason index.html does this: run
     from a module it would land after first paint and every load of a
     dark-themed app would flash a full-brightness page inside the frame. */
  (function () {
    var BASE = { light:"light", dark:"dark", warm:"dark", quantiva:"light" };
    var SKIN = { warm:"warm", quantiva:"quantiva" };
    function apply(v) {
      var r = document.documentElement;
      if (!BASE[v]) {
        v = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      r.setAttribute("data-theme", BASE[v]);
      if (SKIN[v]) r.setAttribute("data-skin", SKIN[v]); else r.removeAttribute("data-skin");
      return v;
    }
    try { apply(localStorage.getItem("lifeos-theme")); } catch (e) {}
    /* Same origin, so the parent writing the key raises `storage` in here.
       The event does not fire in the document that made the change, which
       is exactly the split we want: parent writes, frame listens. */
    window.addEventListener("storage", function (e) {
      if (e.key === "lifeos-theme") { try { apply(e.newValue); } catch (_) {} }
    });
    if (window.matchMedia) {
      var mq = matchMedia("(prefers-color-scheme: dark)");
      var onSys = function () {
        try {
          var v = localStorage.getItem("lifeos-theme");
          if (v !== "light" && v !== "dark" && v !== "warm") apply(null);
        } catch (_) {}
      };
      if (mq.addEventListener) mq.addEventListener("change", onSys);
      else if (mq.addListener) mq.addListener(onSys);
    }
  })();
</script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F4;
  --card:#FFFFFF;
  --ink:#16283C;
  --ink-soft:#4A5D73;
  --ink-faint:#8496A9;
  --rule:#DCE3EB;
  --blue:#2B4C7E;
  --blue-tint:#E6EDF7;
  --green:#15795A;
  --green-tint:#E2F1EB;
  --red:#C0392B;
  --red-tint:#FBE9E7;
  --amber:#C9871F;
  --amber-tint:#FBF0DC;
  --margin-rule:#D96A5B;
  --board:#2C5145;
  --shadow:0 1px 2px rgba(22,40,60,.06), 0 8px 24px -14px rgba(22,40,60,.28);
  --radius:14px;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  --body:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --accent:var(--blue);
  --accent-tint:var(--blue-tint);
  /* The page's outer measure. Structural things — dialogue, option lists,
     stat grids — may use all of it; running PROSE is capped separately
     below, because the two want different widths. */
  --maxw:820px;
  /* The comfortable reading measure. Prose is limited to this regardless of
     how wide the page gets: at 17px this is roughly 68 characters a line,
     inside the 55-75 that reads without the eye losing its place. The
     column was already running to 95 characters on a large screen, so
     widening it further would have made reading harder, not easier. */
  --measure:68ch;
}

/* ============================================================
   THEMES
   ============================================================
   This page is loaded in an iframe, and CSS custom properties do not
   cross a document boundary — which is why it stayed on its light blue
   palette while the rest of the app went dark. It needs its own copies.

   It does not need its own PLUMBING, though: the frame is same-origin,
   so it reads the same localStorage key the parent writes, and the
   `storage` event fires in every other same-origin document when the
   parent changes it. No postMessage, no parent-side code, no load-order
   race.

   Every value below was checked against this page's own card surface:
   the lowest is 5.48:1 in dark and 6.07:1 in warm, both clear of AA.
   ============================================================ */
html[data-theme="dark"]{
  --paper:#1A1917;
  --card:#23221F;
  --ink:#EDE9E0;
  --ink-soft:#B6AE9D;
  --ink-faint:#9E9787;
  --rule:#35332E;
  --blue:#93B4DE;      --blue-tint:#232B35;
  --green:#7FB98F;     --green-tint:#1F2B24;
  --red:#E8836C;       --red-tint:#33221E;
  --amber:#DFAC66;     --amber-tint:#332A1C;
  --margin-rule:#D96A5B;
  --board:#243A33;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
}
html[data-skin="quantiva"]{
  /* One sans throughout, as in the reference — this page normally pairs
     a display sans with a serif body, which is the pairing Quantiva drops. */
  --display:"Plus Jakarta Sans","Inter",sans-serif;
  --body:"Plus Jakarta Sans","Inter",sans-serif;
  --paper:#FBF5E8;
  --card:#FFFDF6;
  --ink:#0E1210;
  --ink-soft:#454C48;
  --ink-faint:#5C6360;
  --rule:#E6E2D4;
  /* --blue is this page's accent ROLE; Quantiva's accent is forest green. */
  --blue:#12503C;      --blue-tint:#E4EFE8;
  --green:#1F7A4D;     --green-tint:#E2F1E7;
  --red:#B03A2E;       --red-tint:#F8E7E4;
  --amber:#9A6410;     --amber-tint:#F6EEDC;
  --margin-rule:#12503C;
  --board:#123A2C;
  --shadow:0 1px 2px rgba(18,40,32,.05), 0 8px 24px -14px rgba(18,40,32,.3);
}
html[data-skin="warm"]{
  --paper:#2A211A;
  --card:#33281F;
  --ink:#F4EDE3;
  --ink-soft:#CBBFAE;
  --ink-faint:#B2A799;
  --rule:#4A3B30;
  /* --blue is this page's accent role, not a promise of the colour. In
     Warm Glass a blue accent would be the one cold thing on screen. */
  --blue:#9BB48C;      --blue-tint:#2F3529;
  --green:#4ECB8D;     --green-tint:#22332A;
  --red:#F5967E;       --red-tint:#3D2820;
  --amber:#E3B26A;     --amber-tint:#3A2D1D;
  --margin-rule:#DFA079;
  --board:#2E3A2C;
  --shadow:0 1px 2px rgba(20,14,9,.42), 0 8px 24px -14px rgba(20,14,9,.7);
}
body.teacher{ --accent:var(--board); --accent-tint:#E3EDE9; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;
  line-height:1.6;
  overflow-x:hidden;
}
h1,h2,h3,h4,.u,.btn,.chip,nav,button,input,select{font-family:var(--display)}
h1,h2,h3,h4{line-height:1.15;margin:0;letter-spacing:-.01em;font-weight:800}
p{margin:0 0 .85em}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}

/* ---------- utility text ---------- */
.u{font-family:var(--display);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-faint)}
.mono{font-family:var(--mono)}
.muted{color:var(--ink-soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.rail{display:none}
.main{min-width:0;padding:0 0 96px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

/* PROSE vs STRUCTURE.

   Only continuous prose is held to the reading measure. Anything the eye
   scans rather than reads — dialogue lines, answer options, worked
   examples, tables, the formula strip — keeps the full width, so the extra
   room on a large screen is used by the parts that benefit from it instead
   of stretching sentences past the point of comfort. */
.card > p,
.card > .goal-list li,
.callout,
.qtext,
.hero .lead{max-width:var(--measure)}

/* top bar (mobile) */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));
  background:rgba(237,240,244,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.brandmark{
  width:30px;height:30px;flex:none;border-radius:8px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.85rem;
}
.brandtext{font-family:var(--display);font-weight:800;font-size:.95rem;letter-spacing:-.01em}
.brandsub{font-family:var(--mono);font-size:.6rem;color:var(--ink-faint);letter-spacing:.08em;text-transform:uppercase}
.topbar .spacer{flex:1}

/* mode switch */
.modeswitch{display:flex;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px}
.modeswitch button{
  border:0;background:transparent;cursor:pointer;border-radius:999px;
  font-size:.72rem;font-weight:600;padding:5px 10px;color:var(--ink-soft);letter-spacing:.02em;
}
.modeswitch button[aria-pressed="true"]{background:var(--accent);color:#fff}

/* bottom nav (mobile) */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
  border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  border:0;background:transparent;cursor:pointer;padding:9px 2px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.63rem;font-weight:600;color:var(--ink-faint);letter-spacing:.01em;
}
.tabbar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px;margin:0 0 14px;
}
.card.flush{padding:0;overflow:hidden}
.sec{margin:0 0 14px}

/* signature: notebook margin rule */
.ruled{position:relative;padding-left:20px}
.ruled:before{
  content:"";position:absolute;left:8px;top:2px;bottom:2px;width:2px;
  background:var(--margin-rule);opacity:.65;border-radius:2px;
}

.eyebrow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* ---------- hero / dashboard ---------- */
.hero{padding:22px 0 6px}
.hero h1{font-size:clamp(1.6rem,7vw,2.4rem);letter-spacing:-.025em}
.hero .lead{font-size:1.02rem;color:var(--ink-soft);margin-top:8px;max-width:46ch}
.today{
  margin-top:16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.today .band{background:var(--accent);color:#fff;padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.today .band .u{color:rgba(255,255,255,.78)}
.today .body{padding:16px}
.today h2{font-size:1.25rem}

.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:800;line-height:1.1}
.stat span{font-family:var(--mono);font-size:.58rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  font-weight:600;font-size:.9rem;padding:11px 16px;border-radius:10px;cursor:pointer;
  min-height:44px;text-decoration:none;
}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--card);color:var(--ink);border-color:var(--rule)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:.82rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---------- chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;background:var(--accent-tint);color:var(--accent);font-weight:600;
}
.chip.core{background:var(--blue-tint);color:var(--blue)}
.chip.useful{background:var(--amber-tint);color:var(--amber)}
.chip.adv{background:#EEE9F5;color:#5B4A85}
.chip.ref{background:#ECEFF2;color:var(--ink-soft)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- progress ---------- */
.bar{height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}

/* ---------- course map ---------- */
.unit{margin:0 0 18px}
.unit-head{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding:0 2px}
.unit-head h3{font-size:1.05rem}
.lessonlist{display:grid;gap:8px}
.lesson-row{
  display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;
  background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px;
  cursor:pointer;text-align:left;width:100%;font-family:inherit;font-size:inherit;color:inherit;
}
.lesson-row:hover{border-color:var(--accent)}
.lesson-row .num{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-family:var(--mono);font-size:.78rem;font-weight:600;background:var(--paper);color:var(--ink-soft);
}
.lesson-row.done .num{background:var(--green-tint);color:var(--green)}
.lesson-row.soon{opacity:.6;cursor:default}
.lesson-row.soon:hover{border-color:var(--rule)}
.lesson-row h4{font-size:.98rem;font-weight:600;font-family:var(--display)}
.lesson-row p{margin:2px 0 0;font-size:.82rem;color:var(--ink-faint);font-family:var(--display)}

/* ---------- lesson header + tabs ---------- */
/* Compact by padding, never by type size: the title stays as large as it
   was, the room around it does the shrinking, so the lesson body starts
   higher up the screen. */
.lessonhead{padding:10px 0 4px}
.backlink{
  background:none;border:0;color:var(--ink-soft);font-size:.8rem;font-weight:600;
  cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:6px;
}
.lessonhead h1{font-size:clamp(1.4rem,6vw,2rem);margin-top:4px}
.lessonhead .tagline{color:var(--ink-soft);margin-top:4px;font-size:.98rem;max-width:var(--measure)}
.meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint)}

.steps{
  position:sticky;top:52px;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--rule);margin-bottom:16px;
}
.steps .inner{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;max-width:var(--maxw);margin:0 auto;padding:8px 12px}
.steps .inner::-webkit-scrollbar{display:none}
.steps button{
  flex:none;border:0;background:transparent;cursor:pointer;white-space:nowrap;
  font-size:.82rem;font-weight:600;color:var(--ink-soft);padding:7px 12px;border-radius:8px;min-height:38px;
}
.steps button[aria-current="true"]{background:var(--accent);color:#fff}
.steps button .tick{color:var(--green);margin-left:5px}
.steps button[aria-current="true"] .tick{color:#fff}

/* ---------- lesson content blocks ---------- */
.block-title{font-size:1.08rem;margin-bottom:6px}
.goal-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:7px}
.goal-list li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:.96rem}
.goal-list li .k{font-family:var(--mono);font-size:.7rem;color:var(--accent);padding-top:.25em}

.convo{display:grid;gap:8px;margin:10px 0}
.line{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.line .who{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);padding-top:.35em;min-width:52px}
.line .say{background:var(--paper);border-radius:10px;padding:7px 12px;font-size:1rem;line-height:1.5}
.line.b .say{background:var(--accent-tint)}

.formula{
  font-family:var(--mono);font-size:.86rem;background:var(--ink);color:#EAF0F7;
  padding:10px 12px;border-radius:10px;display:inline-block;margin:6px 0;letter-spacing:.01em;
}
.formula em{color:#FFD79A;font-style:normal}

.exlist{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.exlist li{padding:8px 12px;background:var(--paper);border-radius:9px;font-size:1rem}
.exlist li b{font-weight:600;background:linear-gradient(transparent 62%, #FBE08A 62%);padding:0 1px}

table.pattern{width:100%;border-collapse:collapse;margin-top:10px;font-size:.95rem}
table.pattern th{
  text-align:left;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--rule)
}
table.pattern td{padding:7px 8px;border-bottom:1px solid var(--rule)}
table.pattern td.hi{color:var(--accent);font-weight:600}
.insight{
  margin-top:12px;padding:11px 13px;background:var(--amber-tint);border-radius:10px;
  font-size:.94rem;border-left:3px solid var(--amber)
}
.insight b{font-family:var(--display)}

/* sentence breakdown */
.breakdown{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tok{
  border:1px dashed var(--ink-faint);background:var(--card);border-radius:9px;
  padding:7px 11px;cursor:pointer;font-family:var(--body);font-size:1rem;color:var(--ink);min-height:40px
}
.tok[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-tint);color:var(--accent);font-weight:600}
.tokinfo{min-height:56px;background:var(--paper);border-radius:10px;padding:11px 13px;font-size:.94rem}
.tokinfo .role{font-family:var(--mono);font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:3px}

/* compare */
.compare{display:grid;gap:10px;margin-top:10px}
.compare .side{border:1px solid var(--rule);border-radius:12px;padding:12px}
.compare .side h4{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.compare .side ul{margin:6px 0 0;padding-left:18px;font-size:.95rem}
.compare .side li{margin-bottom:3px}

/* mistakes */
.mistake{border:1px solid var(--rule);border-radius:12px;padding:12px;margin-bottom:8px}
.mistake .wrong{color:var(--red);text-decoration:line-through;text-decoration-color:rgba(192,57,43,.45)}
.mistake .right{color:var(--green);font-weight:600}
.mistake .why{font-size:.9rem;color:var(--ink-soft);margin-top:6px;font-family:var(--display)}
.mk{font-family:var(--mono);font-size:.75rem;font-weight:600;margin-right:6px}
.mk.x{color:var(--red)}
.mk.v{color:var(--green)}

/* ---------- exercises ---------- */
.q{border:1px solid var(--rule);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card)}
.q .qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.q .qtext{font-size:1.02rem;margin-bottom:10px}
.q .qtext .gap{font-family:var(--mono);color:var(--accent)}
.opts{display:grid;gap:7px}
.opt{
  display:flex;align-items:center;gap:10px;text-align:left;width:100%;
  border:1px solid var(--rule);background:var(--card);border-radius:10px;padding:11px 12px;
  cursor:pointer;font-family:var(--body);font-size:1rem;color:var(--ink);min-height:46px
}
.opt .key{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);border:1px solid var(--rule);border-radius:5px;padding:1px 5px;flex:none}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--green);background:var(--green-tint)}
.opt.wrong{border-color:var(--red);background:var(--red-tint)}
.opt.correct .key,.opt.wrong .key{border-color:currentColor}
.opt.correct .key{color:var(--green)}
.opt.wrong .key{color:var(--red)}
.opt[disabled]{cursor:default}

input.text, textarea.text{
  width:100%;border:1px solid var(--rule);border-radius:10px;padding:11px 12px;
  font-family:var(--body);font-size:1rem;color:var(--ink);background:var(--card);min-height:46px
}
textarea.text{min-height:120px;line-height:1.6;resize:vertical}
input.text:focus,textarea.text:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-tint)}
input.text.ok{border-color:var(--green);background:var(--green-tint)}
input.text.no{border-color:var(--red);background:var(--red-tint)}

.words{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.word{border:1px solid var(--rule);background:var(--card);border-radius:9px;padding:8px 11px;cursor:pointer;font-family:var(--body);font-size:1rem;min-height:40px}
.word:hover{border-color:var(--accent)}
.word.used{opacity:.3;pointer-events:none}

.fb.bad{background:var(--red-tint);border-left:3px solid var(--red)}
.fb.info{background:var(--accent-tint);border-left:3px solid var(--accent)}
.fb .lbl{font-family:var(--display);font-weight:700;font-size:.86rem;display:block;margin-bottom:3px}

/* speaking */
.situation{border:1px solid var(--rule);border-radius:12px;padding:13px;margin-bottom:10px}
.situation h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.task{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:11px;padding:11px 12px;margin-bottom:8px}
.task p{margin:0;font-size:.98rem}
.task .done{background:var(--green-tint);color:var(--green);border-color:var(--green)}

/* teacher */
.tnote{border:1px solid var(--board);border-radius:12px;overflow:hidden;margin-bottom:12px}
.tnote .th{background:var(--board);color:#fff;padding:8px 13px;font-family:var(--display);font-weight:700;font-size:.85rem;display:flex;justify-content:space-between;gap:10px;align-items:center}
.tnote .tb{padding:13px;background:#F6F9F8}
.tnote ul{margin:6px 0;padding-left:20px;font-size:.95rem}
.tnote li{margin-bottom:4px}
.timeline{display:grid;gap:8px;margin-top:8px}
.tstep{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.tstep .t{font-family:var(--mono);font-size:.68rem;color:var(--board);font-weight:600;padding-top:.25em}
.ask{background:var(--card);border:1px solid var(--rule);border-radius:9px;padding:9px 11px;margin-bottom:6px;font-size:.96rem}
.ask:before{content:"“";font-family:var(--body)}
.ask:after{content:"”";font-family:var(--body)}
.locked{background:var(--card);border:1px dashed var(--rule);border-radius:12px;padding:16px;text-align:center;color:var(--ink-soft);font-size:.95rem}

/* score */
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-bottom:12px}
.score .big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1}
.score .big small{font-size:1rem;color:var(--ink-faint);font-weight:600}
.tag{display:inline-block;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:5px;margin:0 4px 4px 0}
.tag.g{background:var(--green-tint);color:var(--green)}
.tag.r{background:var(--red-tint);color:var(--red)}

/* review / progress */
.weak{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
.weak:last-child{border-bottom:0}
.weak .n{font-family:var(--mono);font-size:.72rem;color:var(--red)}

/* toast */
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(72px + env(safe-area-inset-bottom));
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-family:var(--display);font-size:.86rem;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:90vw;text-align:center
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* =========================================================
   CONTENT LAYER
   All lessons use the same shape, so a new chapter is added
   by appending one object to LESSONS — no new UI code.
   Grammar follows standard descriptions of English usage
   (the Wren & Martin tradition); explanations, examples and
   exercises here are written fresh for classroom use.
   ========================================================= */

const LEVELS = [
  { id:"book1", title:"Prerequisites from Book 1", note:"The sentence machinery everything else stands on", rule:"Do these first if any of them feels shaky." },
  { id:"build", title:"Level 1 · Build Sentences", note:"Joining ideas so your writing stops sounding like a list" },
  { id:"speak", title:"Level 2 · Speak Naturally", note:"The patterns real conversation actually runs on" },
  { id:"write", title:"Level 3 · Write Clearly", note:"From one paragraph to a whole composition" }
];

/* Chapters not yet written appear in the map so the shape of the course is
   visible from day one. Switching one on means appending a lesson object to
   LESSONS with the same id — no UI code changes. */
const PLANNED = [
  { unit:"build", id:"clauses",     ref:"Book 2 · Ch 5–7", title:"Clauses", tagline:"Noun, adjective and adverb clauses", tier:"CORE" },
  { unit:"build", id:"agreement2",  ref:"Book 2 · Ch 17", title:"Agreement of the Verb with the Subject", tagline:"The hard cases: each, either, one of, none", tier:"CORE" },
  { unit:"build", id:"nounspronouns", ref:"Book 2 · Ch 18", title:"Nouns and Pronouns", tagline:"Correct usage and common confusions", tier:"CORE" },
  { unit:"build", id:"verbs2",      ref:"Book 2 · Ch 20", title:"Verbs", tagline:"Tense, form and the verbs learners get wrong", tier:"CORE" },
  { unit:"build", id:"conjunctions2", ref:"Book 2 · Ch 22", title:"Conjunctions", tagline:"Choosing the joining word that fits the meaning", tier:"CORE" },
  { unit:"build", id:"wordorder2",  ref:"Book 2 · Ch 23", title:"Order of Words", tagline:"Why English puts words in a fixed place", tier:"CORE" },
  { unit:"speak", id:"morestructures", ref:"Book 2 · Ch 32", title:"More Structures", tagline:"used to, would rather, had better, so…that", tier:"CORE" },
  { unit:"speak", id:"reported",    ref:"Book 2 · Ch 41", title:"Direct and Indirect Speech", tagline:"Reporting what somebody said", tier:"CORE" },
  { unit:"speak", id:"dialogue2",   ref:"Book 2 · Ch 42", title:"Dialogue Writing", tagline:"Writing the way people actually speak", tier:"CORE" },
  { unit:"write", id:"letters",     ref:"Book 2 · Ch 36", title:"Letter Writing", tagline:"Formal and informal, and the difference", tier:"CORE" },
  { unit:"write", id:"comprehension2", ref:"Book 2 · Ch 37", title:"Comprehension", tagline:"Reading a passage and answering well", tier:"CORE" },
  { unit:"write", id:"essay2",      ref:"Book 2 · Ch 40", title:"Essay Writing", tagline:"Planning before you write", tier:"ADVANCED" },
  { unit:"write", id:"precis",      ref:"Book 2 · Ch 35", title:"Precis Writing", tagline:"Saying the same thing in a third of the words", tier:"ADVANCED" }
];

const LESSONS = [

/* ============================ 1 ============================ */
{
id:"sentence", unit:"book1", ref:"Book 1", title:"The Sentence", tier:"CORE", minutes:20, difficulty:"Easy",
tagline:"What turns a group of words into a complete thought — and what stops it.",
objectives:[
  "Tell a complete sentence from an incomplete one",
  "Name the four kinds of sentence and the mark each one ends with",
  "Say and write sentences that make full sense on their own"
],
why:"Everything else in this course sits on top of the sentence. If you can hear when a thought is finished, you will punctuate correctly, speak clearly, and never write half a thought and stop.",
convo:{
  setting:"At the stationery shop",
  lines:[["Shopkeeper","Good morning. What would you like?"],["Anu","Two ruled notebooks, please."],["Shopkeeper","Ruled or plain?"],["Anu","Ruled. How much is it?"],["Shopkeeper","Ninety rupees."]],
  q:{prompt:"Anu answers with one word: “Ruled.” Is that a sentence?", options:["No — but in speaking, a short reply like this is completely normal","Yes — every group of words is a sentence","No, and Anu has made a grammar mistake"], a:0,
     why:"“Ruled.” has no naming part and no verb, so it is not a full sentence. In conversation we drop words the listener can already supply — the full thought is “I would like ruled notebooks.” In writing, you usually need the whole sentence."}
},
discover:{
  prompt:"Read these five groups of words. Which ones leave you waiting for more?",
  items:["The tall boy near the gate","The tall boy near the gate waved at us","Because the bus was late","Rain fell all night","Running down the stairs quickly"],
  insight:"Groups 1, 3 and 5 leave you hanging — something is missing. Groups 2 and 4 finish the thought. That finished feeling is what a sentence gives you."
},
explain:[
  { h:"What a sentence is",
    body:"A sentence is a group of words that makes complete sense by itself. It normally has two parts: the part that names who or what we are talking about, and the part that tells something about it.",
    formula:"naming part + telling part = <em>sentence</em>",
    examples:["<b>Rain</b> fell all night.","<b>My younger sister</b> reads before bed.","<b>The old bridge</b> shook in the storm."],
    note:"Every sentence begins with a capital letter and ends with a full stop, a question mark or an exclamation mark." },
  { h:"The four kinds of sentence",
    body:"English sentences do four jobs. Which job a sentence does decides how it ends.",
    examples:["<b>Statement:</b> The train leaves at six.","<b>Question:</b> Does the train leave at six?","<b>Command or request:</b> Please close the window.","<b>Exclamation:</b> What a long journey that was!"],
    note:"A command often hides its naming part. In “Close the window,” the person spoken to is understood — it means “(You) close the window.”" }
],
pattern:{
  headers:["Sentence","Job it does","Ends with"],
  rows:[["The train leaves at six","Tells you something","."],["Does the train leave at six","Asks something","?"],["Please close the window","Orders or requests","."],["What a long journey that was","Shows strong feeling","!"]],
  hi:2,
  insight:"The end mark is not decoration. It tells your reader which of the four jobs the sentence is doing — the same words with a different mark can be a statement or a question."
},
breakdown:{
  sentence:"My younger sister reads a story every night.",
  parts:[["My younger sister","Naming part","Who the sentence is about. Notice it is three words, not one — a naming part can be long."],["reads","Verb","The word that tells what she does. Every sentence needs one."],["a story","Object","What she reads. Some verbs need an object like this; others do not."],["every night","Time expression","When it happens. Extra information — the sentence would still work without it."]],
  meaning:"One girl, one habit, repeated every night. Take away “reads” and nothing is left but a list of words."
},
compare:{
  title:"Sentence vs Fragment",
  left:{h:"Sentence", when:"Makes complete sense on its own. Has a naming part and a verb.", ex:["The bus arrived late.","We waited under the tree."]},
  right:{h:"Fragment", when:"A piece of a sentence. Something is missing, so the thought stops halfway.", ex:["Because the bus arrived late.","Waiting under the tree."]},
  mini:{prompt:"Which one is a fragment?", options:["The lights went out suddenly.","When the lights went out suddenly."], a:1, why:"“When” makes the reader expect a second half: When the lights went out suddenly, we lit a candle."}
},
mistakes:[
  {wrong:"because I missed the bus.", right:"I was late because I missed the bus.", why:"“Because” joins a reason to a main idea. On its own it leaves the thought unfinished.", cat:"Sentence structure"},
  {wrong:"The boy in the blue shirt.", right:"The boy in the blue shirt won the race.", why:"There is a naming part but no verb, so nothing is being said about the boy.", cat:"Sentence structure"},
  {wrong:"I woke up late I missed the bus.", right:"I woke up late, so I missed the bus.", why:"Two complete thoughts cannot be pushed together with nothing between them. Use a full stop or a joining word.", cat:"Punctuation"},
  {wrong:"where is my pen", right:"Where is my pen?", why:"A sentence starts with a capital letter, and a question ends with a question mark.", cat:"Punctuation"}
],
practice:[
  {t:"mcq", level:1, cat:"Sentence structure", q:"Which group of words is a complete sentence?", options:["The heavy rain last Tuesday night","The heavy rain flooded our street","Flooding our street last Tuesday"], a:1, why:"Only the second one has a verb (“flooded”) telling you what the rain did."},
  {t:"mcq", level:1, cat:"Punctuation", q:"Choose the correct end mark: “Where do you live___”", options:[".","?","!"], a:1, why:"The sentence asks something, so it ends with a question mark."},
  {t:"fill", level:2, cat:"Sentence structure", q:"Add a verb to finish the sentence: “The old clock on the wall ___ every hour.”", a:["rings","chimes","strikes"], why:"A naming part alone is not a sentence. A verb such as “rings” tells what the clock does.", hint:"What sound does a clock make?"},
  {t:"correct", level:3, cat:"Punctuation", q:"my brother plays football every sunday", a:["My brother plays football every Sunday.","My brother plays football every Sunday"], why:"Capital letter at the start, capital S for a day of the week, and a full stop at the end."},
  {t:"correct", level:3, cat:"Sentence structure", q:"Although she studied hard.", a:["She studied hard.","she studied hard"], why:"“Although” needs a second half. Either finish the thought — “Although she studied hard, she was nervous” — or drop the joining word.", hint:"Remove the word that leaves you waiting."},
  {t:"order", level:4, cat:"Word order", words:["the","boy","near","the","gate","waved","at","us"], a:"The boy near the gate waved at us.", why:"Naming part first (the boy near the gate), then the verb (waved), then the rest."},
  {t:"build", level:5, cat:"Sentence structure", q:"Write one statement about your classroom.", model:"Our classroom has three tall windows.", hint:"Naming part + verb, ending with a full stop."},
  {t:"build", level:6, cat:"Sentence structure", q:"Someone asks: “What did you do after school yesterday?” Answer in one full sentence.", model:"After school I helped my mother in the kitchen.", hint:"Do not answer with one word — say the whole thought."}
],
speak:{
  situations:[
    {h:"At home", lines:[["Mother","Have you finished your homework?"],["You","Yes, I finished it before dinner."],["Mother","What did you write about?"],["You","I wrote a paragraph about our school garden."]]},
    {h:"With a friend", lines:[["Friend","Is this seat free?"],["You","Yes, it is. Please sit down."],["Friend","Thanks. What a hot day it is!"]]}

  {t:"mcq", cat:"Punctuation", q:"“What a fine morning it is___”", options:[".","?","!"], a:2, why:"It expresses strong feeling, so it is an exclamation."},
