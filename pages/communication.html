<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Wren &amp; Martin — English Grammar &amp; Composition</title>
<style>
/* ============================================================
   Wren & Martin study application
   Visual direction: the Indian school exercise book — a red
   margin rule down the page, blue-black fountain-pen ink,
   ruled paper. The margin rule is the signature element.
   ============================================================ */
:root{
  --paper:#F6F4ED;      /* page */
  --card:#FFFDF7;       /* written surface */
  --ink:#1B2430;        /* fountain-pen blue-black */
  --ink-2:#5A6472;      /* pencil */
  --ink-3:#8A9099;      /* faint */
  --rule:#DFD8C8;       /* hairline / ruled line */
  --rule-2:#EDE7D9;
  --margin:#C0392B;     /* the red margin rule + teacher's pen */
  --blue:#23507E;       /* examples */
  --moss:#3D6B52;       /* rules */
  --amber:#8C6212;      /* notes */
  --sel:#FDF3D2;

  --sans:"IBM Plex Sans","Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Sitka Text",Charter,Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Menlo,Consolas,monospace;

  --sbw:288px;          /* sidebar width */
  --gut:clamp(16px,4vw,44px);
  --radius:3px;
  --shadow:0 1px 2px rgba(27,36,48,.06),0 8px 24px -12px rgba(27,36,48,.18);
}
html[data-theme="dark"]{
  --paper:#11151A; --card:#181D24; --ink:#E7E4DB; --ink-2:#A2AAB6; --ink-3:#767E8A;
  --rule:#2B323B; --rule-2:#232A32; --margin:#E06A5C; --blue:#7FAEE0;
  --moss:#7FBF9B; --amber:#D9A94A; --sel:#37301A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:clamp(16px,.95rem + .2vw,18px);
  line-height:1.7;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--sel);color:var(--ink)}
:focus-visible{outline:2.5px solid var(--margin);outline-offset:2px;border-radius:2px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--blue)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------------------------------------------------- app frame */
.app{display:flex;min-height:100dvh}

/* ---------------------------------------------------- sidebar */
.sidebar{
  width:var(--sbw);flex:0 0 var(--sbw);background:var(--card);
  border-right:1px solid var(--rule);
  display:flex;flex-direction:column;height:100dvh;position:sticky;top:0;
  z-index:60;
}
.brand{padding:20px var(--gut) 14px;border-bottom:1px solid var(--rule);position:relative}
.sb-close{
  display:none;position:absolute;top:10px;right:8px;align-items:center;justify-content:center;
  min-width:40px;min-height:40px;border-radius:var(--radius);color:var(--ink-2);
}
.sb-close:hover{background:var(--paper);color:var(--ink)}
.brand-mark{
  font-family:var(--sans);font-size:10px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--margin);margin-bottom:6px;
}
.brand h1{
  font-family:var(--serif);font-size:22px;line-height:1.15;margin:0;font-weight:600;
  letter-spacing:-.01em;
}
.brand p{margin:4px 0 0;font-family:var(--sans);font-size:11.5px;color:var(--ink-2);letter-spacing:.02em}

.sb-search{padding:12px var(--gut) 10px}
.search-field{position:relative;display:flex;align-items:center}
.search-field svg{position:absolute;left:9px;width:14px;height:14px;color:var(--ink-3);pointer-events:none}
#q{
  width:100%;padding:9px 10px 9px 29px;font-family:var(--sans);font-size:13.5px;
  background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius);
  color:var(--ink);
}
#q::placeholder{color:var(--ink-3)}

.sb-progress{padding:2px var(--gut) 12px}
.pbar{height:5px;background:var(--rule-2);border-radius:99px;overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--margin);width:0;transition:width .45s ease}
.pmeta{
  display:flex;justify-content:space-between;font-family:var(--sans);font-size:10.5px;
  letter-spacing:.05em;color:var(--ink-2);margin-top:6px;text-transform:uppercase;
}

.sb-modes{padding:0 var(--gut) 10px;border-bottom:1px solid var(--rule)}
.mode-label{
  font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin:12px 0 5px;
}
.mode{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:7px 9px;font-family:var(--sans);font-size:13.5px;color:var(--ink-2);
  border-radius:var(--radius);border-left:2px solid transparent;
}
.mode:hover{background:var(--paper);color:var(--ink)}
.mode[aria-current="page"]{background:var(--paper);color:var(--ink);border-left-color:var(--margin);font-weight:600}
.mode .cnt{margin-left:auto;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.sb-toc{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 0 40px}
.part{border-bottom:1px solid var(--rule-2)}
.part-head{
  display:flex;align-items:center;gap:8px;width:100%;padding:11px var(--gut);
  font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink);
}
.part-head .chev{transition:transform .2s;color:var(--ink-3);flex:0 0 auto}
.part-head[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.part-head .n{margin-left:auto;font-size:10px;color:var(--ink-3);letter-spacing:.04em;font-weight:500}
.part-list{list-style:none;margin:0;padding:0 0 8px}
.part-head[aria-expanded="false"]+.part-list{display:none}
.toc-item{
  display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;
  padding:6px var(--gut) 6px calc(var(--gut) - 3px);
  font-family:var(--sans);font-size:13.5px;line-height:1.4;color:var(--ink-2);
  border-left:3px solid transparent;
}
.toc-item:hover{background:var(--paper);color:var(--ink)}
.toc-item[aria-current="page"]{
  background:var(--paper);color:var(--ink);border-left-color:var(--margin);font-weight:600;
}
.toc-item .num{
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;
  flex:0 0 18px;letter-spacing:.02em;
}
.toc-item[aria-current="page"] .num{color:var(--margin)}
.toc-item .t{flex:1;min-width:0}
.toc-item .flag{flex:0 0 auto;font-size:11px;line-height:1}
.toc-item.done .num::after{content:"✓";color:var(--moss);margin-left:2px;font-weight:700}

/* ---------------------------------------------------- topbar (mobile) */
.topbar{
  display:none;position:sticky;top:0;z-index:50;align-items:center;gap:10px;
  padding:9px 12px;padding-top:max(9px,env(safe-area-inset-top));
  background:var(--card);border-bottom:1px solid var(--rule);
}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:42px;min-height:42px;border-radius:var(--radius);color:var(--ink-2);
}
.iconbtn:hover{background:var(--paper);color:var(--ink)}
.topbar .tt{
  font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;
}
.scrim{
  display:none;position:fixed;inset:0;background:rgba(20,26,34,.5);
  z-index:55;backdrop-filter:blur(2px);
}
body.nav-open .scrim{display:block}

/* ---------------------------------------------------- main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{padding:0 var(--gut) 96px;flex:1}

.crumb{
  display:flex;flex-wrap:wrap;align-items:center;gap:7px;
  font-family:var(--sans);font-size:11.5px;letter-spacing:.03em;color:var(--ink-2);
  padding:22px 0 0;max-width:var(--measure,80ch);margin:0 auto;
}
.crumb .sep{color:var(--ink-3)}
.crumb button{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--rule)}
.crumb button:hover{color:var(--margin)}

/* ---- the reading column: margin rule is the signature ---- */
.reader{--measure:74ch;max-width:var(--measure);margin:0 auto;position:relative}
.chapter-head{position:relative;padding:26px 0 20px;border-bottom:1px solid var(--rule)}
.eyebrow{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--margin);
}
.chapter-head h2{
  font-size:clamp(27px,4.4vw,40px);line-height:1.1;margin:9px 0 0;font-weight:600;
  letter-spacing:-.018em;
}
.chapter-head .lede{
  margin:12px 0 0;color:var(--ink-2);font-size:clamp(15px,2.4vw,17.5px);line-height:1.6;
  max-width:60ch;
}
.chapter-facts{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;
  font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
}
.fact{
  padding:3px 8px;border:1px solid var(--rule);border-radius:99px;color:var(--ink-2);
  background:var(--card);
}
.fact.on{border-color:var(--margin);color:var(--margin)}

.chapter-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tool{
  display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 13px;
  font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-2);
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
}
.tool:hover{border-color:var(--ink-3);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--margin);border-color:var(--margin);color:#fff}
html[data-theme="dark"] .tool[aria-pressed="true"]{color:#12161A}

/* the ruled body with red margin */
.chapter-body{
  padding:26px 0 30px 0;position:relative;
}
@media (min-width:760px){
  .chapter-body{padding-left:34px;border-left:1px solid var(--margin)}
  .chapter-body::before{
    content:attr(data-num);position:absolute;left:-34px;top:28px;width:24px;
    text-align:right;font-family:var(--sans);font-size:10px;font-weight:700;
    letter-spacing:.08em;color:var(--margin);opacity:.55;transform:translateX(-12px);
  }
}

/* ---------------------------------------------------- content semantics */
.chapter-body h3{
  font-family:var(--sans);font-size:clamp(15px,2.2vw,17px);font-weight:700;
  letter-spacing:.01em;margin:32px 0 10px;padding-bottom:6px;
  border-bottom:1px solid var(--rule-2);
}
.chapter-body h4{
  font-family:var(--sans);font-size:14px;font-weight:650;margin:22px 0 8px;color:var(--ink);
}
.chapter-body p{margin:0 0 13px}
.chapter-body ul,.chapter-body ol{margin:0 0 14px;padding-left:1.4em}
.chapter-body li{margin:0 0 6px}
.chapter-body strong,.chapter-body b{font-weight:650}
.wm-hl{background:var(--sel);padding:.05em .28em;border-radius:2px;font-weight:600}
html[data-theme="dark"] .wm-hl{background:var(--sel)}
.wm-cite{color:var(--ink-2);font-style:italic}
.wm-tag{
  font-family:var(--sans);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);border:1px solid var(--rule);border-radius:99px;padding:2px 7px;
  vertical-align:middle;margin-left:6px;font-weight:600;
}
.wm-sub{margin:20px 0}
.wm-instr{font-family:var(--sans);font-size:13px;color:var(--ink-2)}

/* labelled blocks — colour-coded left bar + eyebrow label */
.wm-rule,.wm-example,.wm-note,.wm-exercise{
  position:relative;margin:16px 0;padding:14px 16px 12px;
  border-left:3px solid var(--rule);background:var(--card);
  border-radius:0 var(--radius) var(--radius) 0;
}
.wm-rule::before,.wm-example::before,.wm-note::before,.wm-exercise::before{
  font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;display:block;margin-bottom:7px;
}
.wm-rule{border-left-color:var(--moss)}
.wm-rule::before{content:"Rule";color:var(--moss)}
.wm-example{border-left-color:var(--blue)}
.wm-example::before{content:"Example";color:var(--blue)}
.wm-note{border-left-color:var(--amber)}
.wm-note::before{content:"Note";color:var(--amber)}
.wm-exercise{border-left-color:var(--margin);background:var(--card)}
.wm-exercise::before{content:"Exercise";color:var(--margin)}
.wm-exercise .wm-exercise{border-left-width:2px;margin:12px 0}
.wm-exercise .wm-exercise::before{content:"Part"}
.wm-example .wm-example{border-left-width:2px;padding:8px 12px;margin:8px 0}
.wm-example .wm-example::before{content:none}
.wm-rule > :last-child,.wm-example > :last-child,
.wm-note > :last-child,.wm-exercise > :last-child{margin-bottom:0}

.wm-qlist{counter-reset:none}
.wm-qlist>li{margin-bottom:10px}
.wm-qitem{
  padding:4px 0 4px 2px;border-bottom:1px dotted var(--rule);
}
.wm-qitem:last-child{border-bottom:none}
.wm-opts{list-style:none;padding-left:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.wm-opts li{
  font-family:var(--sans);font-size:12.5px;padding:4px 10px;border:1px solid var(--rule);
  border-radius:99px;color:var(--ink-2);margin:0;
}
.wm-merge{margin:34px 0 4px;display:flex;align-items:center;gap:12px}
.wm-merge::after{content:"";flex:1;height:1px;background:var(--rule)}
.wm-merge-label{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-3);
}

/* answers hidden until revealed */
.wm-answer{
  display:none;margin-top:10px;padding:11px 14px;background:var(--paper);
  border:1px dashed var(--moss);border-radius:var(--radius);color:var(--ink);
}
.wm-answer.shown{display:block}
.wm-answer::before{
  content:"Answer";font-family:var(--sans);font-size:9px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--moss);
  display:block;margin-bottom:5px;
}
.reveal{
  display:inline-flex;align-items:center;gap:6px;margin-top:9px;min-height:34px;
  padding:5px 12px;font-family:var(--sans);font-size:12px;font-weight:600;
  letter-spacing:.04em;color:var(--moss);background:var(--paper);
  border:1px solid var(--moss);border-radius:var(--radius);
}
.reveal:hover{background:var(--moss);color:var(--card)}

/* tables */
.wm-tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:16px 0;
  border:1px solid var(--rule);border-radius:var(--radius);background:var(--card)}
.chapter-body table{border-collapse:collapse;width:100%;min-width:min(440px,100%);
  font-family:var(--sans);font-size:13.5px}
.chapter-body th,.chapter-body td{
  padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule-2);vertical-align:top;
}
.chapter-body th{
  background:var(--paper);font-weight:650;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);white-space:nowrap;
}
.chapter-body tr:last-child td{border-bottom:none}

/* ---- on-this-page rail (wide screens only) ---- */
.rail{display:none}
.reader-main{min-width:0}
@media (min-width:1360px){
  .reader.has-rail{
    display:flex;gap:44px;align-items:flex-start;
    max-width:calc(var(--measure) + 254px);
  }
  .reader.has-rail > .reader-main{flex:1 1 auto;max-width:var(--measure)}
  .reader.has-rail > .rail{
    display:block;flex:0 0 210px;position:sticky;top:28px;
    max-height:calc(100dvh - 56px);overflow-y:auto;overscroll-behavior:contain;
    padding-left:18px;border-left:1px solid var(--rule);
  }
}
.rail h3{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin:0 0 9px;
}
.rail ol{list-style:none;margin:0;padding:0}
.rail li{margin:0}
.rail button{
  display:block;width:100%;text-align:left;padding:5px 0 5px 11px;
  font-family:var(--sans);font-size:12px;line-height:1.4;color:var(--ink-2);
  border-left:2px solid var(--rule-2);
}
.rail button:hover{color:var(--ink);border-left-color:var(--ink-3)}
.rail button[aria-current="true"]{color:var(--margin);border-left-color:var(--margin);font-weight:600}
.rail li.sub button{padding-left:20px;font-size:11.5px;color:var(--ink-3)}
.rail li.sub button:hover{color:var(--ink-2)}

/* ---------------------------------------------------- pager */
.pager{
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  max-width:var(--measure,74ch);margin:34px auto 0;padding-top:22px;
  border-top:1px solid var(--rule);
}
.pg{
  display:flex;flex-direction:column;gap:3px;padding:13px 15px;min-height:64px;
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  text-align:left;justify-content:center;
}
.pg:hover:not(:disabled){border-color:var(--margin)}
.pg:disabled{opacity:.35;cursor:not-allowed}
.pg .dir{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-3)}
.pg .nm{font-family:var(--sans);font-size:13px;font-weight:600;line-height:1.3}
.pg.next{text-align:right;align-items:flex-end}

/* ---------------------------------------------------- dashboard */
.dash{max-width:1040px;margin:0 auto;padding-top:30px}
.dash-hero{padding:0 0 26px;border-bottom:2px solid var(--margin)}
.dash-hero .eyebrow{margin-bottom:10px}
.dash-hero h2{
  font-size:clamp(32px,6.5vw,58px);line-height:1.02;margin:0;font-weight:600;
  letter-spacing:-.028em;
}
.dash-hero .sub{
  margin:12px 0 0;color:var(--ink-2);font-size:clamp(15px,2.4vw,18px);max-width:56ch;
}
.section-label{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-3);margin:38px 0 12px;
  display:flex;align-items:center;gap:12px;
}
.section-label::after{content:"";flex:1;height:1px;background:var(--rule)}

.resume{
  display:flex;gap:16px;align-items:center;width:100%;text-align:left;
  padding:18px 20px;background:var(--card);border:1px solid var(--rule);
  border-left:3px solid var(--margin);border-radius:0 var(--radius) var(--radius) 0;
}
.resume:hover{box-shadow:var(--shadow)}
.resume .rn{
  font-family:var(--sans);font-size:26px;font-weight:700;color:var(--margin);
  font-variant-numeric:tabular-nums;line-height:1;flex:0 0 auto;
}
.resume .rt{flex:1;min-width:0}
.resume .rt b{display:block;font-size:17px;font-weight:600;line-height:1.3}
.resume .rt span{
  font-family:var(--sans);font-size:11.5px;color:var(--ink-2);letter-spacing:.04em;
  text-transform:uppercase;
}
.resume .go{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--margin);flex:0 0 auto}

.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.stat{padding:15px 16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius)}
.stat b{display:block;font-family:var(--sans);font-size:25px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-family:var(--sans);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2)}

.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
.pcard{
  padding:20px;background:var(--card);border:1px solid var(--rule);
  border-radius:var(--radius);text-align:left;display:block;width:100%;
}
.pcard:hover{border-color:var(--margin);box-shadow:var(--shadow)}
.pcard .pn{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;
  text-transform:uppercase;color:var(--margin)}
.pcard h3{margin:8px 0 6px;font-size:20px;font-weight:600;line-height:1.2}
.pcard p{margin:0 0 14px;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.5}
.pcard .pbar{margin-top:12px}

.list-rows{display:flex;flex-direction:column;gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--radius);overflow:hidden}
.row{
  display:flex;gap:13px;align-items:center;width:100%;text-align:left;
  padding:13px 16px;background:var(--card);
}
.row:hover{background:var(--paper)}
.row .rn{font-family:var(--sans);font-size:11px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;flex:0 0 46px;letter-spacing:.04em}
.row .rt{flex:1;min-width:0;font-size:15.5px}
.row .rt small{display:block;font-family:var(--sans);font-size:11px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rx{font-family:var(--sans);font-size:11px;color:var(--ink-3);flex:0 0 auto}
.empty{
  padding:28px 20px;text-align:center;color:var(--ink-2);font-family:var(--sans);
  font-size:13.5px;border:1px dashed var(--rule);border-radius:var(--radius);
}

/* search results */
.hit{
  display:block;width:100%;text-align:left;padding:15px 17px;background:var(--card);
}
.hit:hover{background:var(--paper)}
.hit .hn{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--margin);margin-bottom:4px}
.hit b{display:block;font-size:16.5px;font-weight:600;margin-bottom:5px}
.hit p{margin:0;font-family:var(--sans);font-size:12.5px;color:var(--ink-2);line-height:1.55}
.hit mark{background:var(--sel);color:var(--ink);font-weight:600;padding:0 2px;border-radius:2px}

/* exercise browser */
.exgroup{margin-bottom:26px}
.exgroup > h3{
  font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-2);margin:0 0 10px;
  display:flex;align-items:center;gap:10px;
}
.exgroup > h3 button{color:var(--margin);font-size:11px;text-decoration:underline;
  text-underline-offset:2px;margin-left:auto}
.exdone{
  display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:34px;
  padding:5px 12px;font-family:var(--sans);font-size:12px;font-weight:600;
  color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--radius);
}
.exdone[aria-pressed="true"]{background:var(--moss);border-color:var(--moss);color:var(--card)}

/* to-top */
.totop{
  position:fixed;right:16px;bottom:16px;bottom:max(16px,env(safe-area-inset-bottom));
  width:44px;height:44px;border-radius:50%;background:var(--card);
  border:1px solid var(--rule);box-shadow:var(--shadow);color:var(--ink-2);
  display:none;align-items:center;justify-content:center;z-index:40;
}
.totop.on{display:flex}
.totop:hover{color:var(--margin);border-color:var(--margin)}

/* ---------------------------------------------------- responsive
   >=1120  : sidebar + wide reading column
   900-1119: sidebar + reading column  (Z Fold 6 inner ≈ 968px lands here)
   <900    : drawer + reading column   (Z Fold cover ≈ 344px still fine)
   ------------------------------------------------------------- */
@media (min-width:1400px){
  .reader{--measure:78ch}
  :root{--sbw:312px}
}
@media (max-width:1119px) and (min-width:900px){
  :root{--sbw:250px}
  .reader{--measure:66ch}
}
@media (max-width:899px){
  .app{display:block}
  .topbar{display:flex}
  .sidebar{
    position:fixed;inset:0 auto 0 0;width:min(304px,78vw);flex-basis:auto;
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    box-shadow:var(--shadow);padding-top:env(safe-area-inset-top);
  }
  body.nav-open .sidebar{transform:none}
  .sb-close{display:inline-flex!important}
  .reader{--measure:100%}
  .view{padding-bottom:120px}
  .crumb{padding-top:16px}
  .chapter-head{padding-top:18px}
  .pager{grid-template-columns:1fr}
  .pg.next{text-align:left;align-items:flex-start}
}
@media (max-width:420px){
  :root{--gut:15px}
  body{font-size:16.5px}
  .chapter-body{padding-left:0}
  .stat-row{grid-template-columns:1fr 1fr}
  .row .rn{flex-basis:38px}
  .wm-rule,.wm-example,.wm-note,.wm-exercise{padding:12px 13px 11px}
}
@media print{
  .sidebar,.topbar,.pager,.totop,.chapter-tools,.crumb,.reveal{display:none!important}
  .wm-answer{display:block!important}
  body{background:#fff}
  .reader{--measure:100%}
}
</style>
</head>
<body>

<div class="scrim" id="scrim" hidden></div>

<div class="app">

  <nav class="sidebar" id="sidebar" aria-label="Chapters and study modes">
    <div class="brand">
      <button class="sb-close" id="sbClose" aria-label="Close chapter list">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="brand-mark">Wren &amp; Martin</div>
      <h1>English Grammar<br>&amp; Composition</h1>
      <p>A study companion</p>
    </div>

    <div class="sb-search">
      <div class="search-field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
        </svg>
        <input id="q" type="search" placeholder="Search all chapters…" autocomplete="off"
               aria-label="Search every chapter, rule, example and exercise">
      </div>
    </div>

    <div class="sb-progress">
      <div class="pbar"><i id="sbFill"></i></div>
      <div class="pmeta"><span id="sbPct">0%</span><span id="sbCount">0 of 66 read</span></div>
    </div>

    <div class="sb-modes">
      <div class="mode-label">Study</div>
      <button class="mode" data-go="home"><span>Dashboard</span></button>
      <button class="mode" data-go="toc"><span>All chapters</span><span class="cnt" id="cntCh"></span></button>
      <button class="mode" data-go="marks"><span>Bookmarks</span><span class="cnt" id="cntBm"></span></button>
      <div class="mode-label">Practice</div>
      <button class="mode" data-go="ex-all"><span>All exercises</span><span class="cnt" id="cntEx"></span></button>
      <button class="mode" data-go="ex-todo"><span>Not yet done</span><span class="cnt" id="cntTodo"></span></button>
      <button class="mode" data-go="ex-chapter"><span>This chapter's exercises</span></button>
    </div>

    <div class="sb-toc" id="toc"></div>
  </nav>

  <!-- ============ main ============ -->
  <div class="main">
    <header class="topbar">
      <button class="iconbtn" id="navBtn" aria-label="Open chapter list" aria-expanded="false" aria-controls="sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M3 6h18M3 12h18M3 18h18"></path>
        </svg>
      </button>
      <span class="tt" id="topTitle">Wren &amp; Martin</span>
      <button class="iconbtn" id="themeBtnM" aria-label="Switch between light and dark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
        </svg>
      </button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<button class="totop" id="totop" aria-label="Back to top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
    <path d="M12 19V5M5 12l7-7 7 7"></path>
  </svg>
</button>

ive Noun:<\/strong> The name of a number (or collection) of persons or things taken together and spoken of as one whole.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                        • <span class=\"wm-hl\">crowd<\/span>, <span class=\"wm-hl\">mob<\/span>, <span class=\"wm-hl\">team<\/span>, <span class=\"wm-hl\">flock<\/span>, <span class=\"wm-hl\">herd<\/span><br/>\n                        • <span class=\"wm-hl\">army<\/span>, <span class=\"wm-hl\">fleet<\/span>, <span class=\"wm-hl\">jury<\/span>, <span class=\"wm-hl\">family<\/span>, <span class=\"wm-hl\">nation<\/span><br/>\n                        • <span class=\"wm-hl\">parliament<\/span>, <span class=\"wm-hl\">committee<\/span>\n<\/div>\n<div class=\"wm-example\">\n<strong>In Sentences:<\/strong><br/>\n                        • The police dispersed the <span class=\"wm-hl\">crowd<\/span>.<br/>\n                        • The French <span class=\"wm-hl\">army<\/span> was defeated at Waterloo.<br/>\n                        • The <span class=\"wm-hl\">jury<\/span> found the prisoner guilty.<br/>\n                        • A <span class=\"wm-hl\">herd<\/span> of cattle is passing.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nAbstract Nouns\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Abstract Noun:<\/strong> Usually the name of a quality, action, or state considered apart from the object to which it belongs.\n                    <\/div>\n<div class=\"wm-sub\">\n<div>\n<h4>Qualities:<\/h4>\n<div class=\"wm-example\">\n                                goodness, kindness, whiteness, darkness, hardness, brightness, honesty, wisdom, bravery\n                            <\/div>\n<h4>Actions:<\/h4>\n<div class=\"wm-example\">\n                                laughter, theft, movement, judgement, hatred\n                            <\/div>\n<\/div>\n<div>\n<h4>States:<\/h4>\n<div class=\"wm-example\">\n                                childhood, boyhood, youth, slavery, sleep, sickness, death, poverty\n                            <\/div>\n<h4>Arts &amp; Sciences:<\/h4>\n<div class=\"wm-example\">\n                                grammar, music, chemistry, mathematics, physics\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nFormation of Abstract Nouns\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>From Adjectives<\/th>\n<th>From Verbs<\/th>\n<th>From Common Nouns<\/th>\n<\/tr>\n<tr>\n<td>kind → kindness<br/>honest → honesty<\/td>\n<td>obey → obedience<br/>grow → growth<\/td>\n<td>child → childhood<br/>slave → slavery<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nCountable vs Uncountable Nouns\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<div>\n<div class=\"wm-rule\">\n<strong>Countable Nouns:<\/strong><br/>\n                                Names of objects, people, etc. that we can count.\n                            <\/div>\n<div class=\"wm-example\">\n                                book, pen, apple, boy, sister, doctor, horse<br/>\n<em>Have plural forms: books, pens, apples<\/em>\n<\/div>\n<\/div>\n<div>\n<div class=\"wm-rule\">\n<strong>Uncountable Nouns:<\/strong><br/>\n                                Names of things that we cannot count.\n                            <\/div>\n<div class=\"wm-example\">\n                                milk, oil, sugar, gold, honesty<br/>\n<em>No plural forms: cannot say \"milks\"<\/em>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n Exercise 3 &amp; 4\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<strong>Exercise 3:<\/strong> Point out the nouns and classify them:\n                        <ol>\n<li>The crowd was very big.<\/li>\n<li>Always speak the truth.<\/li>\n<li>We all love honesty.<\/li>\n<li>Solomon was famous for his wisdom.<\/li>\n<li>The elephant has great strength.<\/li>\n<li>A committee of five was appointed.<\/li>\n<\/ol>\n<\/div>\n<div class=\"wm-exercise\">\n<strong>Exercise 4:<\/strong> Write collective nouns for:\n                        <ol>\n<li>cattle: <em>herd<\/em><\/li>\n<li>soldiers: <em>army<\/em><\/li>\n<li>sailors: <em>crew<\/em><\/li>\n<\/ol>\n<strong>Write qualities for boys who are:<\/strong>\n<ol>\n<li>lazy: <em>laziness<\/em><\/li>\n<li>cruel: <em>cruelty<\/em><\/li>\n<li>brave: <em>bravery<\/em><\/li>\n<li>foolish: <em>foolishness<\/em><\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["10-30"], "desc": "Common Noun: A name given in common to every person or thing of the same class or kind.", "n": 5, "ex": 2, "items": 0, "ans": 0, "words": 355, "cn": 5}, {"part": 1, "title": "The Noun: Gender", "html": "<div class=\"wm-sub\">\n<h3>\nFour Types of Gender\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Gender Type<\/th>\n<th>Definition<\/th>\n<th>Examples<\/th>\n<\/tr>\n<tr>\n<td><strong>Masculine<\/strong><\/td>\n<td>Denotes a male animal<\/td>\n<td>boy, lion, hero, cock-sparrow<\/td>\n<\/tr>\n<tr>\n<td><strong>Feminine<\/strong><\/td>\n<td>Denotes a female animal<\/td>\n<td>girl, lioness, heroine, hen-sparrow<\/td>\n<\/tr>\n<tr>\n<td><strong>Common<\/strong><\/td>\n<td>Denotes either male or female<\/td>\n<td>parent, child, friend, pupil, servant<\/td>\n<\/tr>\n<tr>\n<td><strong>Neuter<\/strong><\/td>\n<td>Denotes things without life<\/td>\n<td>book, pen, room, tree<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nPersonification\n<\/h3>\n<div class=\"wm-sub\">\n<p>Objects without life are often personified (spoken of as if they were living beings):<\/p>\n<div class=\"wm-sub\">\n<div>\n<h4>Masculine Gender Applied To:<\/h4>\n<div class=\"wm-example\">\n                                Objects remarkable for <strong>strength and violence<\/strong>:<br/>\n                                • The Sun, Summer, Winter, Time, Death<br/><br/>\n<em>\"The sun sheds his beams on rich and poor alike.\"<\/em>\n<\/div>\n<\/div>\n<div>\n<h4>Feminine Gender Applied To:<\/h4>\n<div class=\"wm-example\">\n                                Objects remarkable for <strong>beauty, gentleness, and gracefulness<\/strong>:<br/>\n                                • The Moon, the Earth, Spring, Autumn, Nature, Liberty, Justice, Mercy, Peace, Hope, Charity<br/><br/>\n<em>\"The moon has hidden her face behind a cloud.\"<\/em>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nWays of Forming Feminine\n<\/h3>\n<div class=\"wm-sub\">\n<h4>1. By using entirely different words:<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Masculine<\/th>\n<th>Feminine<\/th>\n<th>Masculine<\/th>\n<th>Feminine<\/th>\n<\/tr>\n<tr>\n<td>boy<\/td>\n<td>girl<\/td>\n<td>king<\/td>\n<td>queen<\/td>\n<\/tr>\n<tr>\n<td>brother<\/td>\n<td>sister<\/td>\n<td>man<\/td>\n<td>woman<\/td>\n<\/tr>\n<tr>\n<td>father<\/td>\n<td>mother<\/td>\n<td>husband<\/td>\n<td>wife<\/td>\n<\/tr>\n<\/table><\/div>\n<h4>2. By adding syllables (-ess, -ine, -trix, -a):<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Masculine<\/th>\n<th>Feminine<\/th>\n<th>Masculine<\/th>\n<th>Feminine<\/th>\n<\/tr>\n<tr>\n<td>author<\/td>\n<td>authoress<\/td>\n<td>lion<\/td>\n<td>lioness<\/td>\n<\/tr>\n<tr>\n<td>actor<\/td>\n<td>actress<\/td>\n<td>prince<\/td>\n<td>princess<\/td>\n<\/tr>\n<tr>\n<td>hero<\/td>\n<td>heroine<\/td>\n<td>sultan<\/td>\n<td>sultana<\/td>\n<\/tr>\n<\/table><\/div>\n<h4>3. By placing a word before or after:<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Masculine<\/th>\n<th>Feminine<\/th>\n<\/tr>\n<tr>\n<td>grandfather<\/td>\n<td>grandmother<\/td>\n<\/tr>\n<tr>\n<td>manservant<\/td>\n<td>maidservant<\/td>\n<\/tr>\n<tr>\n<td>peacock<\/td>\n<td>peahen<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>", "src": ["10-30"], "desc": "Objects without life are often personified (spoken of as if they were living beings):", "n": 6, "ex": 0, "items": 0, "ans": 0, "words": 190, "cn": 6}, {"part": 1, "title": "The Noun: Number", "html": "<div class=\"wm-sub\">\n<h3>\nSingular vs Plural\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Singular Number:<\/strong> Denotes one person or thing<br/>\n<strong>Plural Number:<\/strong> Denotes more than one person or thing\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                        tree → trees, box → boxes, ox → oxen, man → men\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nRules for Forming Plurals\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Rule<\/th>\n<th>Examples<\/th>\n<\/tr>\n<tr>\n<td>1. Generally add -s<\/td>\n<td>boy → boys, girl → girls, book → books<\/td>\n<\/tr>\n<tr>\n<td>2. Words ending in -s, -sh, -ch, -x: add -es<\/td>\n<td>class → classes, dish → dishes, box → boxes<\/td>\n<\/tr>\n<tr>\n<td>3. Most words ending in -o: add -es<\/td>\n<td>potato → potatoes, hero → heroes<\/td>\n<\/tr>\n<tr>\n<td>4. Some words ending in -o: add -s only<\/td>\n<td>piano → pianos, photo → photos<\/td>\n<\/tr>\n<tr>\n<td>5. Words ending in -y after consonant: change -y to -ies<\/td>\n<td>baby → babies, city → cities<\/td>\n<\/tr>\n<tr>\n<td>6. Words ending in -f or -fe: change to -ves<\/td>\n<td>thief → thieves, wife → wives, leaf → leaves<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nIrregular Plurals\n<\/h3>\n<div class=\"wm-sub\">\n<h4>Change of vowel:<\/h4>\n<div class=\"wm-example\">\n                        man → men, woman → women, foot → feet, tooth → teeth, goose → geese, mouse → mice\n                    <\/div>\n<h4>Add -en:<\/h4>\n<div class=\"wm-example\">\n                        ox → oxen, child → children\n                    <\/div>\n<h4>Same form for both:<\/h4>\n<div class=\"wm-example\">\n                        sheep, deer, fish, aircraft, series, species\n                    <\/div>\n<h4>Foreign plurals:<\/h4>\n<div class=\"wm-example\">\n<strong>Latin:<\/strong> formula → formulae, radius → radii<br/>\n<strong>Greek:<\/strong> crisis → crises, phenomenon → phenomena\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nSpecial Cases\n<\/h3>\n<div class=\"wm-sub\">\n<h4>Used only in plural:<\/h4>\n<div class=\"wm-example\">\n<strong>Instruments:<\/strong> scissors, spectacles, bellows<br/>\n<strong>Clothing:<\/strong> trousers, jeans, shorts<br/>\n<strong>Others:<\/strong> thanks, assets, annals\n                    <\/div>\n<h4>Look plural but are singular:<\/h4>\n<div class=\"wm-example\">\n<strong>Subjects:<\/strong> mathematics, physics, electronics<br/>\n<strong>News:<\/strong> news<br/>\n<strong>Diseases:<\/strong> measles, mumps<br/>\n<strong>Games:<\/strong> billiards, draughts\n                    <\/div>\n<h4>Collective nouns used as plurals:<\/h4>\n<div class=\"wm-example\">\n                        poultry, cattle, vermin, people, gentry<br/>\n<em>\"These poultry are mine.\"<\/em>\n<\/div>\n<\/div>\n<\/div>", "src": ["10-30"], "desc": "Singular Number: Denotes one person or thing Plural Number: Denotes more than one person or thing", "n": 7, "ex": 0, "items": 0, "ans": 0, "words": 241, "cn": 7}, {"part": 1, "title": "The Noun: Case", "html": "<div class=\"wm-sub\">\n<h3>\nUnderstanding Cases\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Examine these sentences:<\/strong><br/>\n                        1. <span class=\"wm-hl\">John<\/span> threw a stone.<br/>\n                        2. The horse kicked <span class=\"wm-hl\">the boy<\/span>.\n                    <\/div>\n<div class=\"wm-rule\">\n<strong>Nominative Case:<\/strong> When a noun is used as the subject of a verb<br/>\n<strong>Accusative Case:<\/strong> When a noun is used as the object of a verb or after a preposition\n                    <\/div>\n<div class=\"wm-example\">\n<strong>To find cases:<\/strong><br/>\n                        • <strong>Nominative:<\/strong> Put \"Who?\" or \"What?\" before the verb<br/>\n                        • <strong>Accusative:<\/strong> Put \"Whom?\" or \"What?\" before the verb and its subject\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nDirect and Indirect Objects\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>Compare:<\/strong><br/>\n                        1. Rama gave a ball.<br/>\n                        2. Rama gave <span class=\"wm-hl\">Hari<\/span> a ball.\n                    <\/div>\n<div class=\"wm-rule\">\n<strong>Indirect Object:<\/strong> The person to whom something is given<br/>\n<strong>Direct Object:<\/strong> The thing that is given<br/>\n<em>Position: Indirect Object comes immediately after the verb, before the Direct Object<\/em>\n<\/div>\n<div class=\"wm-example\">\n<strong>Transformations:<\/strong><br/>\n                        • Rama gave Hari a ball. = Rama gave a ball <strong>to<\/strong> Hari.<br/>\n                        • I bought Rama a ball. = I bought a ball <strong>for<\/strong> Rama.<br/>\n                        • Will you do me a favour? = Will you do a favour <strong>to<\/strong> me?\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nPossessive Case\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Possessive Case:<\/strong> Shows ownership or possession<br/>\n<strong>Question it answers:<\/strong> \"Whose?\"\n                    <\/div>\n<div class=\"wm-example\">\n                        This is <span class=\"wm-hl\">Rama's<\/span> umbrella.<br/>\n                        Whose umbrella? — Rama's.\n                    <\/div>\n<h4>Formation Rules:<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Type<\/th>\n<th>Rule<\/th>\n<th>Examples<\/th>\n<\/tr>\n<tr>\n<td>Singular noun<\/td>\n<td>Add 's<\/td>\n<td>boy's book, king's crown<\/td>\n<\/tr>\n<tr>\n<td>Plural ending in s<\/td>\n<td>Add ' only<\/td>\n<td>boys' school, girls' school<\/td>\n<\/tr>\n<tr>\n<td>Plural not ending in s<\/td>\n<td>Add 's<\/td>\n<td>men's club, children's books<\/td>\n<\/tr>\n<\/table><\/div>\n<h4>Uses beyond possession:<\/h4>\n<div class=\"wm-example\">\n<strong>Authorship:<\/strong> Shakespeare's plays<br/>\n<strong>Origin:<\/strong> A mother's love<br/>\n<strong>Time/Space:<\/strong> A week's holiday, a stone's throw<br/>\n<strong>Place:<\/strong> At the baker's (= baker's shop)\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nNouns in Apposition\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Apposition:<\/strong> When one noun follows another to describe it<br/>\n<em>The noun in apposition is in the same case as the noun it explains<\/em>\n<\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                        1. <span class=\"wm-hl\">Rama, our captain,<\/span> made fifty runs. (Nominative)<br/>\n                        2. Yesterday I met <span class=\"wm-hl\">your uncle, the doctor.<\/span> (Accusative)<br/>\n                        3. Have you seen <span class=\"wm-hl\">Ganguli, the artist's<\/span> drawings? (Genitive)\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Further coverage — possessive case, apposition and practice<\/span><\/div>\n<div class=\"wm-sub\">\n<h4>Possessive Case Rules<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Basic Rule<\/h4>\n<p>The possessive case shows ownership or relationship between nouns.<\/p>\n<p><strong>Formation:<\/strong> Add 's to most nouns<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Examples<\/h4>\n<ul>\n<li><strong>The boy's book<\/strong> - one boy owns the book<\/li>\n<li><strong>The boys' books<\/strong> - multiple boys own books<\/li>\n<li><strong>Children's toys<\/strong> - toys belonging to children<\/li>\n<li><strong>James's car<\/strong> or <strong>James' car<\/strong> - both acceptable<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Special Cases<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Situation<\/th>\n<th>Rule<\/th>\n<th>Example<\/th>\n<\/tr>\n<tr>\n<td>Singular noun<\/td>\n<td>Add 's<\/td>\n<td>cat's tail<\/td>\n<\/tr>\n<tr>\n<td>Plural ending in 's'<\/td>\n<td>Add '<\/td>\n<td>cats' tails<\/td>\n<\/tr>\n<tr>\n<td>Irregular plural<\/td>\n<td>Add 's<\/td>\n<td>men's clothes<\/td>\n<\/tr>\n<tr>\n<td>Personified objects<\/td>\n<td>Use possessive<\/td>\n<td>India's heroes, Nature's laws<\/td>\n<\/tr>\n<tr>\n<td>Time/Space/Weight<\/td>\n<td>Use possessive<\/td>\n<td>a day's march, a stone's throw<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Nouns in Apposition<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Definition<\/h4>\n<p>When one noun follows another to describe it, the second noun is in <strong>apposition<\/strong> to the first.<\/p>\n<p><strong>Key Point:<\/strong> A noun in apposition is in the same case as the noun it explains.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Examples<\/h4>\n<div class=\"wm-example\">\n<p><strong>Rama, our captain, made fifty runs.<\/strong><\/p>\n<p>📝 \"Captain\" is in apposition to \"Rama\" (both nominative case)<\/p>\n<\/div>\n<div class=\"wm-example\">\n<p><strong>Yesterday I met your uncle, the doctor.<\/strong><\/p>\n<p>📝 \"Doctor\" is in apposition to \"uncle\" (both accusative case)<\/p>\n<\/div>\n<div class=\"wm-example\">\n<p><strong>Have you seen Ganguli, the artist's drawings?<\/strong><\/p>\n<p>📝 \"Artist\" is in apposition to \"Ganguli\" (both genitive case)<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Practice Exercise<\/h4>\n<p><strong>Identify the possessive forms and explain their usage:<\/strong><\/p>\n<ol>\n<li>The ship sustained heavy damage.<\/li>\n<li>I have called several times.<\/li>\n<li>Every dog has his day.<\/li>\n<li>Yesterday I met your uncle, the doctor.<\/li>\n<li>Have you seen Ganguli, the artist's drawings?<\/li>\n<\/ol>\n<div class=\"wm-answer\" style=\" margin-top: 15px; padding: 15px; background: #f0fff4; border-radius: 5px;\">\n<p class=\"wm-answer\"><strong class=\"wm-answer\">Answers:<\/strong><\/p>\n<p>1. No possessive form<\/p>\n<p>2. No possessive form<\/p>\n<p>3. \"dog\" is possessive (every dog has his own day)<\/p>\n<p>4. \"doctor\" is in apposition to \"uncle\"<\/p>\n<p>5. \"artist's\" is possessive genitive, \"drawings\" belongs to the artist<\/p>\n<\/div>\n<\/div>", "src": ["10-30", "26-42"], "desc": "The possessive case shows ownership or relationship between nouns.", "n": 8, "ex": 1, "items": 0, "ans": 3, "words": 555, "cn": 8}, {"part": 1, "title": "The Adjective", "html": "<div class=\"wm-sub\">\n<h3>\nWhat is an Adjective?\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Adjective:<\/strong> A word used with a noun to describe or point out the person, animal, place or thing which the noun names, or to tell the number or quantity.\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                        1. Sita is a <span class=\"wm-hl\">clever<\/span> girl. (What kind?)<br/>\n                        2. I don't like <span class=\"wm-hl\">that<\/span> boy. (Which boy?)<br/>\n                        3. He gave me <span class=\"wm-hl\">five<\/span> mangoes. (How many?)<br/>\n                        4. There is <span class=\"wm-hl\">little<\/span> time for preparation. (How much?)\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nAttributive vs Predicative Use\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<div>\n<h4>Attributive Use:<\/h4>\n<div class=\"wm-example\">\n                                The <span class=\"wm-hl\">lazy<\/span> boy was punished.<br/>\n<em>(Adjective used with the noun as an epithet)<\/em>\n<\/div>\n<\/div>\n<div>\n<h4>Predicative Use:<\/h4>\n<div class=\"wm-example\">\n                                The boy is <span class=\"wm-hl\">lazy<\/span>.<br/>\n<em>(Adjective used with a verb, forms part of predicate)<\/em>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nTypes of Adjectives\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Type<\/th>\n<th>Purpose<\/th>\n<th>Question<\/th>\n<th>Examples<\/th>\n<\/tr>\n<tr>\n<td><strong>Quality<\/strong><\/td>\n<td>Show kind or quality<\/td>\n<td>Of what kind?<\/td>\n<td>large city, honest man, foolish crow<\/td>\n<\/tr>\n<tr>\n<td><strong>Quantity<\/strong><\/td>\n<td>Show how much<\/td>\n<td>How much?<\/td>\n<td>some rice, much patience, little intelligence<\/td>\n<\/tr>\n<tr>\n<td><strong>Number<\/strong><\/td>\n<td>Show how many or order<\/td>\n<td>How many?<\/td>\n<td>five fingers, first day, many things<\/td>\n<\/tr>\n<tr>\n<td><strong>Demonstrative<\/strong><\/td>\n<td>Point out which one<\/td>\n<td>Which?<\/td>\n<td>this boy, those rascals, such things<\/td>\n<\/tr>\n<tr>\n<td><strong>Interrogative<\/strong><\/td>\n<td>Ask questions<\/td>\n<td>-<\/td>\n<td>what manner, which way, whose book<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nNumeral Adjectives\n<\/h3>\n<div class=\"wm-sub\">\n<h4>Three kinds of Numeral Adjectives:<\/h4>\n<div class=\"wm-rule\">\n<strong>1. Definite Numeral:<\/strong> Denote exact number<br/>\n                        • <strong>Cardinals:<\/strong> one, two, three (how many)<br/>\n                        • <strong>Ordinals:<\/strong> first, second, third (order in series)\n                    <\/div>\n<div class=\"wm-rule\">\n<strong>2. Indefinite Numeral:<\/strong> Do not denote exact number<br/>\n                        • all, no, many, few, some, any, certain, several, sundry\n                    <\/div>\n<div class=\"wm-rule\">\n<strong>3. Distributive Numeral:<\/strong> Refer to each one of a number<br/>\n                        • each, every, either, neither\n                    <\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                        • <span class=\"wm-hl\">Each<\/span> boy must take his turn.<br/>\n                        • India expects <span class=\"wm-hl\">every<\/span> man to do his duty.<br/>\n                        • <span class=\"wm-hl\">Either<\/span> pen will do.<br/>\n                        • <span class=\"wm-hl\">Neither<\/span> accusation is true.\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nFormation of Adjectives\n<\/h3>\n<div class=\"wm-sub\">\n<h4>From Nouns:<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Noun<\/th>\n<th>Adjective<\/th>\n<th>Noun<\/th>\n<th>Adjective<\/th>\n<\/tr>\n<tr>\n<td>boy<\/td>\n<td>boyish<\/td>\n<td>care<\/td>\n<td>careful<\/td>\n<\/tr>\n<tr>\n<td>gold<\/td>\n<td>golden<\/td>\n<td>storm<\/td>\n<td>stormy<\/td>\n<\/tr>\n<tr>\n<td>courage<\/td>\n<td>courageous<\/td>\n<td>glory<\/td>\n<td>glorious<\/td>\n<\/tr>\n<\/table><\/div>\n<h4>From Verbs:<\/h4>\n<div class=\"wm-example\">\n                        tire → tireless, talk → talkative, move → moveable\n                    <\/div>\n<h4>From other Adjectives:<\/h4>\n<div class=\"wm-example\">\n                        tragic → tragical, black → blackish, sick → sickly\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n Exercise 6 &amp; 7\n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<strong>Exercise 6:<\/strong> Pick out all adjectives and classify them:\n                        <ol>\n<li>The ship sustained heavy damage.<\/li>\n<li>I have called several times.<\/li>\n<li>Every dog has his day.<\/li>\n<li>A live ass is better than a dead lion.<\/li>\n<li>What time is it?<\/li>\n<li>Which pen do you prefer?<\/li>\n<li>There should not be much talk and little work.<\/li>\n<li>Good wine needs no bush.<\/li>\n<\/ol>\n<\/div>\n<div class=\"wm-exercise\">\n<strong>Exercise 7:<\/strong> Supply suitable adjectives:\n                        <ol>\n<li>The town stood a _____ siege. (long)<\/li>\n<li>The _____ prize was won by a Hindu. (first)<\/li>\n<li>This is a very _____ matter. (serious)<\/li>\n<li>The battle ended in a _____ victory. (decisive)<\/li>\n<li>India expects _____ man to do his duty. (every)<\/li>\n<li>The _____ bird catches the worm. (early)<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\nSpecial Adjectives\n<\/h3>\n<div class=\"wm-sub\">\n<h4>Emphasizing Adjectives:<\/h4>\n<div class=\"wm-example\">\n                        • I saw it with my <span class=\"wm-hl\">own<\/span> eyes.<br/>\n                        • That is the <span class=\"wm-hl\">very<\/span> thing we want.\n                    <\/div>\n<h4>Exclamatory Adjectives:<\/h4>\n<div class=\"wm-example\">\n                        • <span class=\"wm-hl\">What<\/span> genius!<br/>\n                        • <span class=\"wm-hl\">What<\/span> folly!<br/>\n                        • <span class=\"wm-hl\">What<\/span> a blessing!\n                    <\/div>\n<h4>Note on \"This\" and \"That\":<\/h4>\n<div class=\"wm-rule\">\n                        These are the only adjectives that change form to show number:<br/>\n                        • <strong>this<\/strong> (singular) → <strong>these<\/strong> (plural)<br/>\n                        • <strong>that<\/strong> (singular) → <strong>those<\/strong> (plural)\n                    <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Further coverage — kinds of adjectives in detail<\/span><\/div>\n<div class=\"wm-sub\">\n<h4>Definition and Types<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>What is an Adjective?<\/h4>\n<p>A word used with a noun to <strong>describe<\/strong> or <strong>point out<\/strong> the person, animal, place, or thing which the noun names, or to tell the <strong>number<\/strong> or <strong>quantity<\/strong>.<\/p>\n<\/div>\n<div class=\"wm-example\">\n<h4>Basic Examples<\/h4>\n<ul>\n<li><strong>Sita is a clever girl.<\/strong> (What kind of girl?)<\/li>\n<li><strong>I don't like that boy.<\/strong> (Which boy?)<\/li>\n<li><strong>He gave me five mangoes.<\/strong> (How many mangoes?)<\/li>\n<li><strong>There is little time.<\/strong> (How much time?)<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Attributive vs Predicative Use<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Type<\/th>\n<th>Position<\/th>\n<th>Example<\/th>\n<\/tr>\n<tr>\n<td>Attributive<\/td>\n<td>Before the noun<\/td>\n<td>The <span class=\"wm-hl\">lazy<\/span> boy was punished.<\/td>\n<\/tr>\n<tr>\n<td>Predicative<\/td>\n<td>After linking verb<\/td>\n<td>The boy is <span class=\"wm-hl\">lazy<\/span>.<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Kinds of Adjectives<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>1. Adjectives of Quality (Descriptive)<\/h4>\n<p>Show the kind or quality of a person or thing<\/p>\n<p><strong>Question answered:<\/strong> Of what kind?<\/p>\n<div class=\"wm-example\">\n<p>Kolkata is a <span class=\"wm-hl\">large<\/span> city.<\/p>\n<p>He is an <span class=\"wm-hl\">honest<\/span> man.<\/p>\n<p>This is a Grammar of the <span class=\"wm-hl\">English<\/span> language.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>2. Adjectives of Quantity<\/h4>\n<p>Show how much of a thing is meant<\/p>\n<p><strong>Question answered:<\/strong> How much?<\/p>\n<div class=\"wm-example\">\n<p>I ate <span class=\"wm-hl\">some<\/span> rice.<\/p>\n<p>He showed <span class=\"wm-hl\">much<\/span> patience.<\/p>\n<p>We have had <span class=\"wm-hl\">enough<\/span> exercise.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>3. Adjectives of Number (Numeral)<\/h4>\n<p>Show how many persons or things, or in what order<\/p>\n<p><strong>Question answered:<\/strong> How many?<\/p>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Type<\/th>\n<th>Description<\/th>\n<th>Examples<\/th>\n<\/tr>\n<tr>\n<td>Definite<\/td>\n<td>Exact number<\/td>\n<td>one, two, three (Cardinals)<br/>first, second, third (Ordinals)<\/td>\n<\/tr>\n<tr>\n<td>Indefinite<\/td>\n<td>No exact number<\/td>\n<td>all, no, many, few, some, any, several<\/td>\n<\/tr>\n<tr>\n<td>Distributive<\/td>\n<td>Each one of a number<\/td>\n<td>each, every, either, neither<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>4. Demonstrative Adjectives<\/h4>\n<p>Point out which person or thing is meant<\/p>\n<p><strong>Question answered:<\/strong> Which?<\/p>\n<div class=\"wm-example\">\n<p><span class=\"wm-hl\">This<\/span> boy is stronger than Hari.<\/p>\n<p><span class=\"wm-hl\">Those<\/span> rascals must be punished.<\/p>\n<p>Don't be in <span class=\"wm-hl\">such<\/span> a hurry.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>5. Interrogative Adjectives<\/h4>\n<p>Used with nouns to ask questions<\/p>\n<div class=\"wm-example\">\n<p><span class=\"wm-hl\">What<\/span> manner of man is he?<\/p>\n<p><span class=\"wm-hl\">Which<\/span> way shall we go?<\/p>\n<p><span class=\"wm-hl\">Whose<\/span> book is this?<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Classification Exercise<\/h4>\n<p><strong>Identify the adjectives and their types:<\/strong><\/p>\n<ol>\n<li>The ship sustained heavy damage.<\/li>\n<li>I have called several times.<\/li>\n<li>Every dog has his day.<\/li>\n<li>What time is it?<\/li>\n<li>Which pen do you prefer?<\/li>\n<\/ol>\n<div class=\"wm-answer\" style=\" margin-top: 15px; padding: 15px; background: #f0fff4; border-radius: 5px;\">\n<p class=\"wm-answer\"><strong class=\"wm-answer\">Answers:<\/strong><\/p>\n<p>1. \"heavy\" - Adjective of Quality<\/p>\n<p>2. \"several\" - Indefinite Numeral Adjective<\/p>\n<p>3. \"Every\" - Distributive Numeral Adjective<\/p>\n<p>4. \"What\" - Interrogative Adjective<\/p>\n<p>5. \"Which\" - Interrogative Adjective<\/p>\n<\/div>\n<\/div>", "src": ["10-30", "26-42"], "desc": "A word used with a noun to describe or point out the person, animal, place, or thing which the noun names, or to tell the number or quantity .", "n": 9, "ex": 3, "items": 0, "ans": 3, "words": 817, "cn": 9}, {"part": 1, "title": "Comparison of Adjectives", "html": "<div class=\"wm-sub\">\n<h4>Three Degrees of Comparison<\/h4>\n<div class=\"wm-sub\">\n<div>\n<div>\n<h4>Positive<\/h4>\n<p>Simple form<\/p>\n<p><strong>sweet<\/strong><\/p>\n<p>No comparison<\/p>\n<\/div>\n<div>\n<h4>Comparative<\/h4>\n<p>Higher degree<\/p>\n<p><strong>sweeter<\/strong><\/p>\n<p>Compares two things<\/p>\n<\/div>\n<div>\n<h4>Superlative<\/h4>\n<p>Highest degree<\/p>\n<p><strong>sweetest<\/strong><\/p>\n<p>Compares three or more<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Example Progression<\/h4>\n<div class=\"wm-example\">\n<p>1. <strong>Rama's mango is sweet.<\/strong> (Positive - simple quality)<\/p>\n<p>2. <strong>Hari's mango is sweeter than Rama's.<\/strong> (Comparative - two mangoes)<\/p>\n<p>3. <strong>Govind's mango is the sweetest of all.<\/strong> (Superlative - all mangoes)<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Formation Rules<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>One Syllable Adjectives<\/h4>\n<p>Add <strong>-er<\/strong> for comparative and <strong>-est<\/strong> for superlative<\/p>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Positive<\/th>\n<th>Comparative<\/th>\n<th>Superlative<\/th>\n<th>Special Rule<\/th>\n<\/tr>\n<tr>\n<td>sweet<\/td>\n<td>sweeter<\/td>\n<td>sweetest<\/td>\n<td>Regular<\/td>\n<\/tr>\n<tr>\n<td>brave<\/td>\n<td>braver<\/td>\n<td>bravest<\/td>\n<td>Ends in 'e' - add r, st<\/td>\n<\/tr>\n<tr>\n<td>happy<\/td>\n<td>happier<\/td>\n<td>happiest<\/td>\n<td>Y → I before -er, -est<\/td>\n<\/tr>\n<tr>\n<td>big<\/td>\n<td>bigger<\/td>\n<td>biggest<\/td>\n<td>Double final consonant<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Multi-syllable Adjectives<\/h4>\n<p>Use <strong>more<\/strong> for comparative and <strong>most<\/strong> for superlative<\/p>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Positive<\/th>\n<th>Comparative<\/th>\n<th>Superlative<\/th>\n<\/tr>\n<tr>\n<td>beautiful<\/td>\n<td>more beautiful<\/td>\n<td>most beautiful<\/td>\n<\/tr>\n<tr>\n<td>difficult<\/td>\n<td>more difficult<\/td>\n<td>most difficult<\/td>\n<\/tr>\n<tr>\n<td>industrious<\/td>\n<td>more industrious<\/td>\n<td>most industrious<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Irregular Comparisons<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Positive<\/th>\n<th>Comparative<\/th>\n<th>Superlative<\/th>\n<\/tr>\n<tr>\n<td>good, well<\/td>\n<td>better<\/td>\n<td>best<\/td>\n<\/tr>\n<tr>\n<td>bad, evil, ill<\/td>\n<td>worse<\/td>\n<td>worst<\/td>\n<\/tr>\n<tr>\n<td>little<\/td>\n<td>less, lesser<\/td>\n<td>least<\/td>\n<\/tr>\n<tr>\n<td>much, many<\/td>\n<td>more<\/td>\n<td>most<\/td>\n<\/tr>\n<tr>\n<td>old<\/td>\n<td>older, elder<\/td>\n<td>oldest, eldest<\/td>\n<\/tr>\n<tr>\n<td>far<\/td>\n<td>farther, further<\/td>\n<td>farthest, furthest<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Usage Distinctions<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Elder/Older - Eldest/Oldest<\/h4>\n<ul>\n<li><strong>Elder/Eldest:<\/strong> Used only for people in the same family<\/li>\n<li><strong>Older/Oldest:<\/strong> Used for people, animals, and things<\/li>\n<\/ul>\n<div class=\"wm-example\">\n<p>✅ John is my <span class=\"wm-hl\">elder<\/span> brother.<\/p>\n<p>✅ He is <span class=\"wm-hl\">older<\/span> than his sister.<\/p>\n<p>✅ This is the <span class=\"wm-hl\">oldest<\/span> temple in Kolkata.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Farther/Further<\/h4>\n<ul>\n<li><strong>Farther:<\/strong> Physical distance<\/li>\n<li><strong>Further:<\/strong> Additional, abstract distance<\/li>\n<\/ul>\n<div class=\"wm-example\">\n<p>✅ Kolkata is <span class=\"wm-hl\">farther<\/span> from the equator than Colombo.<\/p>\n<p>✅ I must have a reply without <span class=\"wm-hl\">further<\/span> delay.<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Comparison Practice<\/h4>\n<div>\n<div class=\"wm-qitem\">\n<p><strong>Fill in the correct form:<\/strong><\/p>\n<p>1. Iron is _______ than any other metal. (useful)<\/p>\n<ul>\n<li>more useful<\/li>\n<li>more useful<\/li>\n<li>most useful<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-qitem\">\n<p>2. She is the _______ of the two sisters. (old)<\/p>\n<ul>\n<li>elder<\/li>\n<li>eldest<\/li>\n<li>older<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>", "src": ["26-42"], "desc": "Add -er for comparative and -est for superlative", "n": 10, "ex": 1, "items": 2, "ans": 0, "words": 269, "cn": 10}, {"part": 1, "title": "Position of Adjectives", "html": "<div class=\"wm-sub\">\n<h4>General Rules<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Standard Position<\/h4>\n<p>A single adjective used attributively is generally placed <strong>immediately before<\/strong> the noun.<\/p>\n<div class=\"wm-example\">\n<p>King Francis was a <span class=\"wm-hl\">hearty<\/span> king.<\/p>\n<p>Where are you going, my <span class=\"wm-hl\">pretty<\/span> maid?<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Meaning Changes with Position<\/h4>\n<div class=\"wm-example\">\n<p><strong>a great nobleman's son<\/strong> (a son of an important nobleman)<\/p>\n<p><strong>a nobleman's great son<\/strong> (an important son of a nobleman)<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Special Positions<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Adjective After Noun<\/h4>\n<p><strong>1. In poetry:<\/strong><\/p>\n<div class=\"wm-example\">\n<p>Children <span class=\"wm-hl\">dear<\/span>, was it yesterday?<\/p>\n<p>O man with sisters <span class=\"wm-hl\">dear<\/span>!<\/p>\n<\/div>\n<p><strong>2. When several adjectives modify one noun:<\/strong><\/p>\n<div class=\"wm-example\">\n<p>There dwelt a miller <span class=\"wm-hl\">hale and bold<\/span>.<\/p>\n<p>The King, <span class=\"wm-hl\">fearless and resolute<\/span>, advanced.<\/p>\n<\/div>\n<p><strong>3. When adjective has additional explanation:<\/strong><\/p>\n<div class=\"wm-example\">\n<p>He was a man <span class=\"wm-hl\">fertile in resource<\/span>.<\/p>\n<p>A Sikh, <span class=\"wm-hl\">taller than any of his comrades<\/span>, rushed forward.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>Fixed Phrases<\/h4>\n<p>Some phrases always have the adjective after the noun:<\/p>\n<div class=\"wm-example\">\n<ul>\n<li>heir <span class=\"wm-hl\">apparent<\/span><\/li>\n<li>time <span class=\"wm-hl\">immemorial<\/span><\/li>\n<li>lord <span class=\"wm-hl\">paramount<\/span><\/li>\n<li>letters <span class=\"wm-hl\">patent<\/span><\/li>\n<li>God <span class=\"wm-hl\">Almighty<\/span><\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<\/div>", "src": ["26-42"], "desc": "A single adjective used attributively is generally placed immediately before the noun.", "n": 11, "ex": 0, "items": 0, "ans": 0, "words": 141, "cn": 11}, {"part": 1, "title": "Correct Use of Some Adjectives", "html": "<div class=\"wm-sub\">\n<h4>Some vs Any<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Basic Rule<\/h4>\n<ul>\n<li><strong>Some:<\/strong> Affirmative sentences, offers, requests<\/li>\n<li><strong>Any:<\/strong> Negative and interrogative sentences<\/li>\n<\/ul>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Type<\/th>\n<th>Use<\/th>\n<th>Example<\/th>\n<\/tr>\n<tr>\n<td>Affirmative<\/td>\n<td>some<\/td>\n<td>I will buy <span class=\"wm-hl\">some<\/span> mangoes.<\/td>\n<\/tr>\n<tr>\n<td>Negative<\/td>\n<td>any<\/td>\n<td>I will not buy <span class=\"wm-hl\">any<\/span> mangoes.<\/td>\n<\/tr>\n<tr>\n<td>Interrogative<\/td>\n<td>any<\/td>\n<td>Have you bought <span class=\"wm-hl\">any<\/span> mangoes?<\/td>\n<\/tr>\n<tr>\n<td>Offer<\/td>\n<td>some<\/td>\n<td>Will you have <span class=\"wm-hl\">some<\/span> ice-cream?<\/td>\n<\/tr>\n<tr>\n<td>Request<\/td>\n<td>some<\/td>\n<td>Could you lend me <span class=\"wm-hl\">some<\/span> money?<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Each vs Every<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Key Differences<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Aspect<\/th>\n<th>Each<\/th>\n<th>Every<\/th>\n<\/tr>\n<tr>\n<td>Minimum number<\/td>\n<td>Two or more<\/td>\n<td>More than two<\/td>\n<\/tr>\n<tr>\n<td>Focus<\/td>\n<td>Individuals<\/td>\n<td>Total group<\/td>\n<\/tr>\n<tr>\n<td>Number in group<\/td>\n<td>Limited, definite<\/td>\n<td>Indefinite<\/td>\n<\/tr>\n<tr>\n<td>Strength<\/td>\n<td>Weaker<\/td>\n<td>Stronger (no exceptions)<\/td>\n<\/tr>\n<\/table><\/div>\n<div class=\"wm-example\">\n<p>✅ <span class=\"wm-hl\">Each<\/span> boy must take his turn. (focus on individuals)<\/p>\n<p>✅ <span class=\"wm-hl\">Every<\/span> seat was taken. (all seats, no exceptions)<\/p>\n<p>✅ I was away ten days and it rained <span class=\"wm-hl\">each<\/span> day. (definite period)<\/p>\n<p>✅ It rained <span class=\"wm-hl\">every<\/span> day during my holidays. (indefinite period)<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Little, A Little, The Little<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Meanings<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Form<\/th>\n<th>Meaning<\/th>\n<th>Tone<\/th>\n<th>Example<\/th>\n<\/tr>\n<tr>\n<td>little<\/td>\n<td>not much, hardly any<\/td>\n<td>Negative<\/td>\n<td>There is <span class=\"wm-hl\">little<\/span> hope of recovery.<\/td>\n<\/tr>\n<tr>\n<td>a little<\/td>\n<td>some, though not much<\/td>\n<td>Positive<\/td>\n<td>There is <span class=\"wm-hl\">a little<\/span> hope of recovery.<\/td>\n<\/tr>\n<tr>\n<td>the little<\/td>\n<td>not much, but all there is<\/td>\n<td>Specific<\/td>\n<td><span class=\"wm-hl\">The little<\/span> knowledge he had was useful.<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h4>Few, A Few, The Few<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<h4>Meanings<\/h4>\n<div class=\"wm-tablewrap\"><table class=\"wm-tablewrap\">\n<tr>\n<th>Form<\/th>\n<th>Meaning<\/th>\n<th>Tone<\/th>\n<th>Example<\/th>\n<\/tr>\n<tr>\n<td>few<\/td>\n<td>not many, hardly any<\/td>\n<td>Negative<\/td>\n<td><span class=\"wm-hl\">Few<\/span> people can keep a secret.<\/td>\n<\/tr>\n<tr>\n<td>a few<\/td>\n<td>some<\/td>\n<td>Positive<\/td>\n<td><span class=\"wm-hl\">A few<\/span> words will convince him.<\/td>\n<\/tr>\n<tr>\n<td>the few<\/td>\n<td>not many, but all there are<\/td>\n<td>Specific<\/td>\n<td><span class=\"wm-hl\">The few<\/span> friends he has are poor.<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Usage Practice<\/h4>\n<p><strong>Choose the correct option:<\/strong><\/p>\n<div>\n<div class=\"wm-qitem\">\n<p>1. Will you have _____ tea? (offer)<\/p>\n<ul>\n<li>some<\/li>\n<li>any<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-qitem\">\n<p>2. _____ seat was taken. (no exceptions)<\/p>\n<ul>\n<li>Each<\/li>\n<li>Every<\/li>\n<\/ul>\n<\/div>\n<div class=\"wm-qitem\">\n<p>3. There is _____ hope. (some optimism)<\/p>\n<ul>\n<li>little<\/li>\n<li>a little<\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>", "src": ["26-42"], "desc": "Each boy must take his turn.", "n": 12, "ex": 1, "items": 3, "ans": 0, "words": 262, "cn": 12}, {"part": 1, "title": "Articles (A, An, The)", "html": "<div class=\"wm-sub\">\n<h3>\n                        Basic Rules \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Articles:<\/strong> A, An, The are words placed before nouns to specify whether the noun is definite or indefinite.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                            • <span class=\"wm-hl\">A<\/span> dog (any dog)<br/>\n                            • <span class=\"wm-hl\">An<\/span> elephant (any elephant)<br/>\n                            • <span class=\"wm-hl\">The<\/span> dog (specific dog)\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Repetition of Articles \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n                            When two or more adjectives qualify the same noun, the article is used before the first adjective only. When they qualify different nouns, the article is used before each adjective.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Same noun:<\/strong> I have <span class=\"wm-hl\">a<\/span> black and white dog. (one dog, both colors)<br/>\n<strong>Different nouns:<\/strong> I have <span class=\"wm-hl\">a<\/span> black and <span class=\"wm-hl\">a<\/span> white dog. (two dogs)\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Practice Exercise \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Exercise: Insert Articles Where Necessary<\/h4>\n<ol>\n<li>While there is life there is hope.<\/li>\n<li>Her knowledge of medicine had been acquired under aged Jewess.<\/li>\n<li>Sun rises in east.<\/li>\n<li>The brave soldier lost arm in battle.<\/li>\n<li>The doctor says it is hopeless case.<\/li>\n<li>Get pound of sugar from nearest grocer.<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["48-71"], "desc": "Articles: A, An, The are words placed before nouns to specify whether the noun is definite or indefinite.", "n": 13, "ex": 1, "items": 0, "ans": 0, "words": 143, "cn": 13}, {"part": 1, "title": "Personal Pronouns", "html": "<div class=\"wm-sub\">\n<h3>\n                        Definition &amp; Forms \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Personal Pronouns:<\/strong> Words used instead of nouns to represent the three persons - the person speaking (1st), the person spoken to (2nd), and the person spoken of (3rd).\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Forms:<\/strong><br/>\n<div class=\"wm-tablewrap\"><table style=\"width:100%; border-collapse: collapse; margin: 10px 0;\">\n<tr style=\"background: #f0f0f0;\">\n<th style=\"border: 1px solid #ddd; padding: 8px;\">Person<\/th>\n<th style=\"border: 1px solid #ddd; padding: 8px;\">Nominative<\/th>\n<th style=\"border: 1px solid #ddd; padding: 8px;\">Possessive<\/th>\n<th style=\"border: 1px solid #ddd; padding: 8px;\">Accusative<\/th>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">1st (Singular)<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">I<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">my, mine<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">me<\/td>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">1st (Plural)<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">we<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">our, ours<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">us<\/td>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">2nd<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">you<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">your, yours<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">you<\/td>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">3rd (Masc.)<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">he<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">his<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">him<\/td>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">3rd (Fem.)<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">she<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">her, hers<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">her<\/td>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">3rd (Neuter)<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">it<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">its<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">it<\/td>\n<\/tr>\n<tr>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">3rd (Plural)<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">they<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">their, theirs<\/td>\n<td style=\"border: 1px solid #ddd; padding: 8px;\">them<\/td>\n<\/tr>\n<\/table><\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Uses of \"It\" \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<strong>The pronoun \"it\" is used for:<\/strong><br/>\n                            1. <span class=\"wm-hl\">Things without life:<\/span> Here is your book; take it away.<br/>\n                            2. <span class=\"wm-hl\">Animals:<\/span> He loves his dog and cannot do without it.<br/>\n                            3. <span class=\"wm-hl\">Young children:<\/span> When I saw the child it was crying.<br/>\n                            4. <span class=\"wm-hl\">Weather/Time:<\/span> It is raining. It is ten o'clock.<br/>\n                            5. <span class=\"wm-hl\">Emphasis:<\/span> It was you who began the quarrel.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Practice Exercise \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Exercise: Choose the Correct Pronoun<\/h4>\n<ol>\n<li>We scored as many goals as _____. (they, them)<\/li>\n<li>Rama and _____ were present. (I, me)<\/li>\n<li>Can you sing as well as _____? (they, them)<\/li>\n<li>Between you and _____, I do not believe him. (I, me)<\/li>\n<li>Nobody but _____ was present. (he, him)<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["48-71"], "desc": "Personal Pronouns: Words used instead of nouns to represent the three persons - the person speaking (1st), the person spoken to (2nd), and the person spoken of (3rd).", "n": 14, "ex": 1, "items": 0, "ans": 0, "words": 185, "cn": 14}, {"part": 1, "title": "Reflexive and Emphatic Pronouns", "html": "<div class=\"wm-sub\">\n<h3>\n                        Reflexive Pronouns \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Reflexive Pronouns:<\/strong> Formed by adding -self (singular) or -selves (plural) to personal pronouns. Used when the action turns back upon the subject.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Forms:<\/strong> myself, yourself, himself, herself, itself, ourselves, yourselves, themselves<br/><br/>\n<strong>Examples:<\/strong><br/>\n                            • I hurt <span class=\"wm-hl\">myself<\/span>.<br/>\n                            • You will hurt <span class=\"wm-hl\">yourself<\/span>.<br/>\n                            • He hurt <span class=\"wm-hl\">himself<\/span>.<br/>\n                            • They hurt <span class=\"wm-hl\">themselves<\/span>.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Emphatic Pronouns \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Emphatic Pronouns:<\/strong> Same forms as reflexive pronouns but used for emphasis.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                            • I will do it <span class=\"wm-hl\">myself<\/span>.<br/>\n                            • I <span class=\"wm-hl\">myself<\/span> saw him do it.<br/>\n                            • The town <span class=\"wm-hl\">itself<\/span> is not very large.<br/>\n                            • We saw the Prime Minister <span class=\"wm-hl\">himself<\/span>.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Practice Exercise \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-exercise\">\n<h4>Exercise: Identify Reflexive vs Emphatic<\/h4>\n<ol>\n<li>I will go myself. (Emphatic/Reflexive)<\/li>\n<li>Rama has hurt himself. (Emphatic/Reflexive)<\/li>\n<li>We often deceive ourselves. (Emphatic/Reflexive)<\/li>\n<li>I myself heard the remark. (Emphatic/Reflexive)<\/li>\n<li>The prisoner hanged himself. (Emphatic/Reflexive)<\/li>\n<\/ol>\n<\/div>\n<\/div>\n<\/div>", "src": ["48-71"], "desc": "Reflexive Pronouns: Formed by adding -self (singular) or -selves (plural) to personal pronouns.", "n": 15, "ex": 1, "items": 0, "ans": 0, "words": 132, "cn": 15}, {"part": 1, "title": "Demonstrative, Indefinite and Distributive Pronouns", "html": "<div class=\"wm-sub\">\n<h3>\n                        Demonstrative Pronouns \n<\/h3>\n<div class=\"wm-sub\">\n<div class=\"wm-rule\">\n<strong>Demonstrative Pronouns:<\/strong> Used to point out objects to which they refer.\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Forms:<\/strong> this, that, these, those, such<br/><br/>\n<strong>Examples:<\/strong><br/>\n                            • <span class=\"wm-hl\">This<\/span> is a present from my uncle.<br/>\n                            • <span class=\"wm-hl\">These<\/span> are merely excuses.<br/>\n                            • <span class=\"wm-hl\">That<\/span> is the Red Fort.<br/>\n                            • Mumbai mangoes are better than <span class=\"wm-hl\">those<\/span> of Bengaluru.\n                        <\/div>\n<div class=\"wm-note\">\n<strong>Note:<\/strong> \"This\" refers to what is close at hand; \"that\" refers to what is farther away.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<h3>\n                        Indefinite Pronouns
