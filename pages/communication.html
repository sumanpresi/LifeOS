items": 4, "ans": 0, "words": 269, "cn": 21}, {"part": 2, "title": "Idioms", "html": "<h3>\n<p>Chapter 24: Expressions peculiar to the English language<\/p>\n<\/h3>\n<div class=\"wm-rule\">\n<div>Rule 206-207<\/div>\n<h4>Understanding Idioms<\/h4>\n<p>Idioms are expressions peculiar to a language. Many verbs acquire idiomatic meanings when followed by prepositions or adverbs.<\/p>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Business &amp; Action Idioms<\/h4>\n<div class=\"wm-example\"><strong>back up<\/strong> = support: He backed up his friend's claim.<\/div>\n<div class=\"wm-example\"><strong>blow over<\/strong> = pass off: The disturbances will blow over.<\/div>\n<div class=\"wm-example\"><strong>bear out<\/strong> = substantiate: Evidence to bear out the charge.<\/div>\n<div class=\"wm-example\"><strong>clear up<\/strong> = explain: The matter has been cleared up.<\/div>\n<div class=\"wm-example\"><strong>close with<\/strong> = accept: I closed with his offer.<\/div>\n<div class=\"wm-example\"><strong>dispose of<\/strong> = sell: He wants to dispose of his car.<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Discovery &amp; Change Idioms<\/h4>\n<div class=\"wm-example\"><strong>hit upon<\/strong> = find: I hit upon a good plan.<\/div>\n<div class=\"wm-example\"><strong>light upon<\/strong> = discover: The workman lighted upon a gold idol.<\/div>\n<div class=\"wm-example\"><strong>shake off<\/strong> = get rid of: I couldn't shake off my malaria.<\/div>\n<div class=\"wm-example\"><strong>show up<\/strong> = expose: I threatened to show him up.<\/div>\n<div class=\"wm-example\"><strong>think over<\/strong> = consider: I must think the matter over.<\/div>\n<div class=\"wm-example\"><strong>trump up<\/strong> = fabricate: He trumped up a story.<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Emotional &amp; Social Idioms<\/h4>\n<div class=\"wm-example\"><strong>long for<\/strong> = desire: She longed for death.<\/div>\n<div class=\"wm-example\"><strong>prevail on<\/strong> = persuade: I couldn't prevail on him to attend.<\/div>\n<div class=\"wm-example\"><strong>stick out for<\/strong> = persist in demanding: He's sticking out for better terms.<\/div>\n<div class=\"wm-example\"><strong>well off<\/strong> = in comfortable circumstances: He seems well off.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<h4>Growth &amp; Development<\/h4>\n<div class=\"wm-example\"><strong>gain on<\/strong> = win favor of: My behavior gained on the emperor.<\/div>\n<div class=\"wm-example\"><strong>grow upon<\/strong> = have stronger hold: The habit is growing upon him.<\/div>\n<div class=\"wm-example\"><strong>lead up to<\/strong> = culminate in: Events led up to the republic.<\/div>\n<div class=\"wm-example\"><strong>train up<\/strong> = educate: Train up a child in the way he should go.<\/div>\n<\/div>\n<div class=\"wm-example\">\n<h4>Completion &amp; Process<\/h4>\n<div class=\"wm-example\"><strong>eat away<\/strong> = corrode: Rust has eaten away the plate.<\/div>\n<div class=\"wm-example\"><strong>hear out<\/strong> = hear to the end: Please hear me out.<\/div>\n<div class=\"wm-example\"><strong>hang about<\/strong> = loiter: A fellow hanging about our bungalow.<\/div>\n<div class=\"wm-example\"><strong>stave off<\/strong> = prevent: The only person who could stave off war.<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-note\">\n<h4>Learning Tip<\/h4>\n<p>Idioms must be learned as complete expressions. The meaning often cannot be deduced from individual words. Practice using them in context to master their usage.<\/p>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Further coverage — common idioms and expressions<\/span><\/div>\n<p>Click on any idiom card to see its meaning and usage examples.<\/p>\n<div class=\"wm-sub\">\n<div class=\"wm-example\">\n<div class=\"wm-hl\">on the wrong side of sixty<\/div>\n<div>more than sixty years of age<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">a man of his words<\/div>\n<div>a trustworthy man, a man to be depended on<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">keeping the wolf from the door<\/div>\n<div>keeping off starvation<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">wolf in sheep's clothing<\/div>\n<div>hypocrite<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">turned the corner<\/div>\n<div>passed the crisis<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">turned the tables<\/div>\n<div>brought opponent to disadvantage<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">caught a Tartar<\/div>\n<div>found him more formidable than expected<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">on tenterhooks<\/div>\n<div>in a state of suspense and anxiety<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">under the thumb of<\/div>\n<div>completely under the influence of<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">in the teeth of<\/div>\n<div>in defiance or regardless of<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">at the top of the tree<\/div>\n<div>at the head of his profession<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">tread on their toes<\/div>\n<div>give offence to them<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">put the screw on<\/div>\n<div>brought pressure to bear on<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">came off second-best<\/div>\n<div>was defeated, got the worst of it<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">sent about his business<\/div>\n<div>dismissed him peremptorily<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">talk shop<\/div>\n<div>talk exclusively about business or professional affairs<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">old head on young shoulders<\/div>\n<div>to be wise beyond his years<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">one square meal<\/div>\n<div>full meal<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">rubbed shoulders<\/div>\n<div>come into close contact<\/div>\n<\/div>\n<div class=\"wm-example\">\n<div class=\"wm-hl\">black sheep<\/div>\n<div>bad characters, scoundrels<\/div>\n<\/div>\n<\/div>", "src": ["85-102", "121-141"], "desc": "Chapter 24: Expressions peculiar to the English language", "n": 48, "ex": 0, "items": 0, "ans": 0, "words": 522, "cn": 22}, {"part": 2, "title": "Phrasal Verbs and Idiomatic Expressions", "html": "<p>Phrasal verbs and idiomatic expressions built on twenty common English verbs, with their meanings and a sentence showing each in use.<\/p>\n<div class=\"wm-sub\"><h4>BEAR<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bear away<\/strong> — to win<\/p><p class=\"wm-cite\">Satish bore away many prizes at the school sports.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bear down<\/strong> — to overthrow, crush<\/p><p class=\"wm-cite\">The new leader has been able to bear down all opposition.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bear out<\/strong> — to confirm, corroborate<\/p><p class=\"wm-cite\">His evidence bears out the evidence of the first witness.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bear up<\/strong> — to keep up spirits, not to despair; to support<\/p><p class=\"wm-cite\">In his misfortune God gave him strength to bear up. A religious hope bears up a man in his trials.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bear upon<\/strong> — to be relevant to<\/p><p class=\"wm-cite\">His evidence did not bear upon the inquiry.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bear with<\/strong> — to have patience with, show forbearance to<\/p><p class=\"wm-cite\">I trust you will bear with me a few minutes more.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>BREAK<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">break down<\/strong> — to fail<\/p><p class=\"wm-cite\">He broke down in the middle of his speech.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">break off<\/strong> — to stop suddenly<\/p><p class=\"wm-cite\">He broke off in the middle of his story.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">break with<\/strong> — to quarrel with<\/p><p class=\"wm-cite\">I gave him no cause to break with me.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">break into<\/strong> — to enter by force<\/p><p class=\"wm-cite\">The burglars broke into the house.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>BRING<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bring about<\/strong> — to cause<\/p><p class=\"wm-cite\">His folly has brought about his ruin.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bring forth<\/strong> — to produce, cause<\/p><p class=\"wm-cite\">Idleness and luxury bring forth poverty and want.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bring forward<\/strong> — to adduce<\/p><p class=\"wm-cite\">He brought forward several cogent arguments in support of his scheme.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bring in<\/strong> — to yield as rent<\/p><p class=\"wm-cite\">That building brings in Rs. 7000 a month.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bring out<\/strong> — to show; to publish<\/p><p class=\"wm-cite\">Our teacher often tells us a story to bring out the meaning of a lesson. The publishers have recently brought out a cheap edition of their new dictionary.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bring round<\/strong> — to convert<\/p><p class=\"wm-cite\">He found great difficulty in bringing her round to his views.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">bring up<\/strong> — to rear<\/p><p class=\"wm-cite\">She brought up the orphan as her own child.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>CALL<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">call for<\/strong> — to demand<\/p><p class=\"wm-cite\">His master called for an explanation of his conduct.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">call out<\/strong> — to draw forth<\/p><p class=\"wm-cite\">New responsibilities often call out virtues and abilities unsuspected before.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">call in<\/strong> — to summon, send for<\/p><p class=\"wm-cite\">Call in a doctor immediately.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">call on<\/strong> — to pay a brief visit<\/p><p class=\"wm-cite\">He called on me yesterday.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">call up<\/strong> — to recollect<\/p><p class=\"wm-cite\">The old man could not call up past events.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>CARRY<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">carry out<\/strong> — to execute<\/p><p class=\"wm-cite\">He agreed to carry out my orders.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">carry away<\/strong> — to deprive of self-control<\/p><p class=\"wm-cite\">His passion carried him away.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">carry on<\/strong> — to manage<\/p><p class=\"wm-cite\">His son carried on his business in his absence.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">carry off<\/strong> — to kill<\/p><p class=\"wm-cite\">Many persons were carried off by plague.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>CAST<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cast away<\/strong> — to wreck<\/p><p class=\"wm-cite\">The ship was cast away on the coast of Africa.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cast down<\/strong> — to depress<\/p><p class=\"wm-cite\">He was much cast down by his loss.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>COME<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">come about<\/strong> — to happen<\/p><p class=\"wm-cite\">How did these things come about?<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">come by<\/strong> — to get<\/p><p class=\"wm-cite\">How did you come by his purse?<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">come off<\/strong> — to take place<\/p><p class=\"wm-cite\">When does the Convocation come off?<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">come out<\/strong> — to transpire<\/p><p class=\"wm-cite\">At last the truth has come out.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">come to<\/strong> — to amount to<\/p><p class=\"wm-cite\">The taxes come to a large sum.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">come up<\/strong> — to be mooted or raised for discussion<\/p><p class=\"wm-cite\">The question came up before the Municipal Corporation last week.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">come round<\/strong> — to recover; to agree<\/p><p class=\"wm-cite\">I expect he will come round within a week. I hope he will come round to our views.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>CRY<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cry down<\/strong> — to depreciate<\/p><p class=\"wm-cite\">Men of dissolute lives cry down religion, because they would not be under the restraints of it.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cry out against<\/strong> — to protest against<\/p><p class=\"wm-cite\">He cried out against such injustice.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cry up<\/strong> — to extol<\/p><p class=\"wm-cite\">That young author is cried up by his friends.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>CUT<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cut off<\/strong> — to die<\/p><p class=\"wm-cite\">He was cut off in the prime of life.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cut down<\/strong> — to reduce<\/p><p class=\"wm-cite\">You must cut down your expenditure.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cut out for<\/strong> — specially fitted to be<\/p><p class=\"wm-cite\">He is cut out for a sailor.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">cut up<\/strong> — to afflict, distress<\/p><p class=\"wm-cite\">His wife's death cut him up terribly.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>DO<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">done for<\/strong> — ruined<\/p><p class=\"wm-cite\">I am done for.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">done up<\/strong> — fatigued, exhausted<\/p><p class=\"wm-cite\">Having walked twenty miles, he is quite done up.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>FALL<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">fall back<\/strong> — to retreat, yield<\/p><p class=\"wm-cite\">At last the rioters fell back.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">fall in with<\/strong> — to meet accidentally; to happen to meet<\/p><p class=\"wm-cite\">At my friend's tea-party I fell in with a strange fellow. The measure falls in with the popular demand.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">fall through<\/strong> — to fail<\/p><p class=\"wm-cite\">The scheme has fallen through for want of support.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">fall out<\/strong> — to quarrel<\/p><p class=\"wm-cite\">I am told the two brothers have fallen out.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">fall off<\/strong> — to deteriorate; to diminish<\/p><p class=\"wm-cite\">It is said that the standard of efficiency in public service has recently fallen off. In the second school-term the attendance fell off.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>GET<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">get off<\/strong> — to escape<\/p><p class=\"wm-cite\">His friends expected that he would get off with a fine.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">get on with<\/strong> — to agree or live sociably with<\/p><p class=\"wm-cite\">It is hard to get on with a suspicious man.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">get away<\/strong> — to escape<\/p><p class=\"wm-cite\">The thief got away with my cash-box.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">get out<\/strong> — to remove<\/p><p class=\"wm-cite\">I can't get out this stain.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">get under<\/strong> — to subdue; to control<\/p><p class=\"wm-cite\">The revolt of the tribal chiefs has been got under. They soon got the fire under by pouring buckets of water over it.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">get at<\/strong> — to attack<\/p><p class=\"wm-cite\">The dog tried to get at me.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">get through<\/strong> — to pass<\/p><p class=\"wm-cite\">He has got through his examination.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">get out of<\/strong> — to escape from<\/p><p class=\"wm-cite\">You were lucky to get out of his clutches.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>GIVE<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">give up<\/strong> — to surrender; to have no hope of recovery<\/p><p class=\"wm-cite\">We are credibly informed that the murderer has given himself up to the police. The doctors have given him up.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">give forth<\/strong> — to publish, noise abroad<\/p><p class=\"wm-cite\">Soon after it was given forth, and believed by many, that the King was dead.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">give off<\/strong> — to emit<\/p><p class=\"wm-cite\">The fire gave off a dense smoke.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">give in<\/strong> — to submit, yield<\/p><p class=\"wm-cite\">The strikers seem determined, and are not likely to give in.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">give out<\/strong> — to publish, proclaim; to be exhausted<\/p><p class=\"wm-cite\">It was given out that he was a bankrupt. The horses gave out at the next milestone.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">give way<\/strong> — to break, snap; to yield<\/p><p class=\"wm-cite\">The rope gave way while the workmen were hauling up the iron pillar. He would not listen to me at first, but at last he gave way.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">give away<\/strong> — to distribute, present; to betray<\/p><p class=\"wm-cite\">The Governor gave away the prizes. In his cross-examination, he ultimately gave himself away.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">give over<\/strong> — to abandon<\/p><p class=\"wm-cite\">Give over this foolish attempt.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>GO<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">go by<\/strong> — to judge from; to be guided by<\/p><p class=\"wm-cite\">You cannot always go by appearances. It is a good rule to go by.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">go into<\/strong> — to examine, investigate<\/p><p class=\"wm-cite\">He promised to go into the matter.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">go upon<\/strong> — foundation for statement; base conclusions on<\/p><p class=\"wm-cite\">Have you anything to go upon? We have no data to go upon.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">go down<\/strong> — to be believed<\/p><p class=\"wm-cite\">The story won't go down.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">go off<\/strong> — to be a success<\/p><p class=\"wm-cite\">The concert went off well.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">go over<\/strong> — to examine<\/p><p class=\"wm-cite\">The auditor went over the balance sheet.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">go through<\/strong> — to suffer; to examine<\/p><p class=\"wm-cite\">The poor woman has gone through much. I must first go through the accounts.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>HOLD<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">hold out<\/strong> — to offer resistance; to give<\/p><p class=\"wm-cite\">The rebels held out for about a month. He holds out no promise of future prospects.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">hold up<\/strong> — to stop on the highway and rob<\/p><p class=\"wm-cite\">They were held up by bandits.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">hold over<\/strong> — to defer, postpone<\/p><p class=\"wm-cite\">The subject is held over till next meeting.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>KEEP<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">keep in<\/strong> — to confine after school-hours; to confine to the house<\/p><p class=\"wm-cite\">A few boys were kept in. I was kept in by a bad cold.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">keep up<\/strong> — to carry on; to maintain<\/p><p class=\"wm-cite\">They kept up a long conversation. Little disputes and quarrels are chiefly kept up by those who have nothing else to do. He is trying his best to keep up the reputation of his family. The rubber syndicate keeps up the price.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">keep on<\/strong> — to continue<\/p><p class=\"wm-cite\">She kept on talking.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">keep back<\/strong> — to conceal<\/p><p class=\"wm-cite\">I shall keep back nothing from you.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>KNOCK<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">knock about<\/strong> — to wander about<\/p><p class=\"wm-cite\">He has knocked about the world a great deal.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">knock down<\/strong> — to sell at an auction<\/p><p class=\"wm-cite\">The dressing-table was knocked down for Rs. 900.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">knock up<\/strong> — to exhaust<\/p><p class=\"wm-cite\">We were greatly knocked up after our steep climb.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>LAY<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">lay down<\/strong> — to surrender<\/p><p class=\"wm-cite\">The rebels laid down their arms.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">lay out<\/strong> — to invest; to spend<\/p><p class=\"wm-cite\">He had laid out a large sum in railway shares. Foolish people, who do not lay out their money carefully, soon come to grief.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">lay up<\/strong> — to confine to bed<\/p><p class=\"wm-cite\">He is laid up with fever.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">lay by<\/strong> — to save for future needs<\/p><p class=\"wm-cite\">He resolved to lay by a part of his income.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>LET<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">let into<\/strong> — to make acquainted with<\/p><p class=\"wm-cite\">I was let into her secret.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">let off<\/strong> — to punish leniently<\/p><p class=\"wm-cite\">This being his first offence he was let off with a fine.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>LOOK<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">look after<\/strong> — to take care of<\/p><p class=\"wm-cite\">His uncle looks after him.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">look down upon<\/strong> — to despise<\/p><p class=\"wm-cite\">He looks down upon his poor cousins.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">look up<\/strong> — to search for; to rise; to improve; to respect<\/p><p class=\"wm-cite\">Look up the word in the dictionary. Prices of piece-goods are looking up. Things are looking up. His friends look up to him.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">look forward to<\/strong> — to expect with pleasure<\/p><p class=\"wm-cite\">The old man is looking forward to the visit of his grandchildren.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">look into<\/strong> — to investigate<\/p><p class=\"wm-cite\">I will look into the matter.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">look on<\/strong> — to regard<\/p><p class=\"wm-cite\">I look on him as my son.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">look to<\/strong> — to rely on; to be careful about<\/p><p class=\"wm-cite\">Some look to legislation to hasten the progress of social reforms. Look to your manners.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">look at<\/strong> — to reject<\/p><p class=\"wm-cite\">He will not look at your offer.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>MAKE<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">make for<\/strong> — to conduce to<\/p><p class=\"wm-cite\">Contentment makes for happiness.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">make over<\/strong> — to present, give in charity<\/p><p class=\"wm-cite\">He made over his bungalow to the Islam Orphanage.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">make out<\/strong> — to discover; to read, decipher; to prove<\/p><p class=\"wm-cite\">I cannot make out the meaning of this verse. I cannot make out his handwriting. You have failed to make out your case.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">make up<\/strong> — to become reconciled<\/p><p class=\"wm-cite\">Some time ago the two brothers quarrelled, but they have now made it up.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>PASS<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">pass by<\/strong> — to overlook<\/p><p class=\"wm-cite\">He generally passed by the faults of his subordinates.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">pass through<\/strong> — to undergo<\/p><p class=\"wm-cite\">The crew of the boat passed through terrible sufferings.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">pass off as<\/strong> — to pretend to be<\/p><p class=\"wm-cite\">He passed himself off as a nobleman.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">pass for<\/strong> — to be regarded as<\/p><p class=\"wm-cite\">He passes all for a great Sanskritist.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>PICK<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">pick out<\/strong> — to select<\/p><p class=\"wm-cite\">The Committee picked out the best players for the team.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">pick up<\/strong> — to regain or recover health<\/p><p class=\"wm-cite\">He lost twenty pounds in sickness, but is now picking up.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>PULL<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">pull together<\/strong> — to co-operate, work together in harmony<\/p><p class=\"wm-cite\">Unless we pull together we cannot succeed.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">pull through<\/strong> — to pass with difficulty; to recover from illness<\/p><p class=\"wm-cite\">My cousin pposition.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>RUN<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">run down<\/strong> — to enfeeble; to disparage<\/p><p class=\"wm-cite\">On account of overwork he is run down. He always runs down his rivals.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">run out<\/strong> — to expire, come to an end<\/p><p class=\"wm-cite\">The lease of our premises has run out.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">run through<\/strong> — to squander away<\/p><p class=\"wm-cite\">He has run through his fortune.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">run up<\/strong> — to amount to; to increase<\/p><p class=\"wm-cite\">The tailor's bill has run up to a large amount. Recently my expenses have run up considerably.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">run into<\/strong> — to incur<\/p><p class=\"wm-cite\">He has run into debt.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">run against<\/strong> — to chance to meet<\/p><p class=\"wm-cite\">While turning the corner I ran against an old friend.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">run over<\/strong> — to overflow<\/p><p class=\"wm-cite\">The cistern is running over.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>SEE<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">see through<\/strong> — to detect<\/p><p class=\"wm-cite\">I saw through the trick.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">see into<\/strong> — to discern<\/p><p class=\"wm-cite\">It is hard to see into his motive.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">see off<\/strong> — to witness departure<\/p><p class=\"wm-cite\">His friends were present at the station to see him off.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>SET<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set aside<\/strong> — to annul<\/p><p class=\"wm-cite\">The High Court set aside the decree of the lower court.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set about<\/strong> — to take steps towards<\/p><p class=\"wm-cite\">He immediately set about organizing the department.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set off<\/strong> — to start; to enhance beauty by contrast<\/p><p class=\"wm-cite\">He set off for Peshawar early this morning. The frame sets off the picture.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set up<\/strong> — to start business; to establish<\/p><p class=\"wm-cite\">He has set up as a banker. I have enough capital to set me up in trade.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set up for<\/strong> — to pretend to be<\/p><p class=\"wm-cite\">He hired a palatial bungalow and set up for a millionaire.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set down<\/strong> — to snub; to charge<\/p><p class=\"wm-cite\">I was obliged to set him down. You may set down his loss to me.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set on<\/strong> — to instigate<\/p><p class=\"wm-cite\">Who set you on to do it?<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set apart<\/strong> — to reserve<\/p><p class=\"wm-cite\">These seats are set apart for ladies.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set forth<\/strong> — to explain, make known<\/p><p class=\"wm-cite\">In his speech on prohibition, he set forth his views at length.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set upon<\/strong> — to attack<\/p><p class=\"wm-cite\">The robbers set upon the defenceless travellers.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set in<\/strong> — to begin<\/p><p class=\"wm-cite\">Winter in England sets in about December.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>SPEAK<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">speak of<\/strong> — worth mentioning<\/p><p class=\"wm-cite\">In this city there is no free library to speak of.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">speak out<\/strong> — to express opinion freely<\/p><p class=\"wm-cite\">I was determined to speak out.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>STAND<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">stand up for<\/strong> — to vindicate, maintain; to champion the cause of<\/p><p class=\"wm-cite\">They are determined to stand up for their rights. He is always standing up for the weak and oppressed.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">stand over<\/strong> — to be deferred or postponed<\/p><p class=\"wm-cite\">Let this matter stand over for the present.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">stand out<\/strong> — to endure to the end without yielding<\/p><p class=\"wm-cite\">It is hard but I think I can stand it out.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">stand by<\/strong> — to support<\/p><p class=\"wm-cite\">We shall be formidable if we stand by one another.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>STRIKE<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">strike down with<\/strong> — to be attacked by<\/p><p class=\"wm-cite\">He is struck down with paralysis.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">strike off<\/strong> — to remove<\/p><p class=\"wm-cite\">The Medical Council struck off his name from the register of medical practitioners.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">strike in<\/strong> — to interrupt<\/p><p class=\"wm-cite\">While we were planning a family picnic, my sister struck in with the suggestion that we invite our neighbour's children as well.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>TAKE<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">take up<\/strong> — to occupy<\/p><p class=\"wm-cite\">The piano takes up too much room. It would take up too much time to tell you the whole story.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">take after<\/strong> — to resemble<\/p><p class=\"wm-cite\">He takes after his father.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">take in<\/strong> — to comprehend, understand<\/p><p class=\"wm-cite\">At present I am reading the Essays of Bacon, but it is sometimes difficult to take in his meaning.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">take to<\/strong> — to become addicted to<\/p><p class=\"wm-cite\">Recently he has taken to opium eating.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>TALK<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">talk over<\/strong> — to discuss; to convince by talking<\/p><p class=\"wm-cite\">We talked over the matter for an hour. I hope to talk him over to our view.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>TELL<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">tell against<\/strong> — to prove unfavourable to<\/p><p class=\"wm-cite\">I am afraid your antecedents will tell against you.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">tell upon<\/strong> — to affect<\/p><p class=\"wm-cite\">The strain is telling upon his health.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>THROW<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">throw away<\/strong> — to waste<\/p><p class=\"wm-cite\">My advice was thrown away upon him, because he ignored it.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">throw out<\/strong> — to reject<\/p><p class=\"wm-cite\">The bill was thrown out by the Assembly.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">throw up<\/strong> — to resign<\/p><p class=\"wm-cite\">In disgust he threw up his appointment.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">throw over<\/strong> — to abandon or desert<\/p><p class=\"wm-cite\">When he became rich he threw over all his old friends.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>TURN<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">turn out<\/strong> — to produce, manufacture; to prove<\/p><p class=\"wm-cite\">The factory turns out 20,000 lbs of cloth a day. He turned out to be a sharper.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">turn off<\/strong> — to dismiss<\/p><p class=\"wm-cite\">If he is lazy, why don't you turn him off?<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">turn against<\/strong> — to become hostile to<\/p><p class=\"wm-cite\">His very friends turned against him.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">turn up<\/strong> — to happen; to appear<\/p><p class=\"wm-cite\">Who can say what will turn up next? He promised to come, but he never turned up.<\/p><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>WORK<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">work on<\/strong> — to influence<\/p><p class=\"wm-cite\">We tempted him with many promises, but nothing would work on him.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">work out<\/strong> — to solve<\/p><p class=\"wm-cite\">He worked out the problem in a few minutes.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">work up<\/strong> — to excite<\/p><p class=\"wm-cite\">He is sure to work up the mob.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">work upon<\/strong> — to influence<\/p><p class=\"wm-cite\">He worked upon the ignorant villagers.<\/p><\/div>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Idiomatic expressions<\/span><\/div>\n<div class=\"wm-sub\"><h4>Idiomatic Expressions<\/h4>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">eat humble pie<\/strong> — to apologize humbly, to yield under humiliating circumstances<\/p><p class=\"wm-cite\">In spite of all his brag he had to eat humble pie.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">eat your words<\/strong> — to retract your statements, to take back what you have said<\/p><p class=\"wm-cite\">Take care what you say! You will have to eat your words.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">meet half-way<\/strong> — come to a compromise<\/p><p class=\"wm-cite\">I am prepared to meet you half-way.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">meet trouble half-way<\/strong> — to anticipate trouble; to worry about it before it comes<\/p><p class=\"wm-cite\">It is silly to meet trouble half-way.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">put on mettle<\/strong> — rouse to do one's best<\/p><p class=\"wm-cite\">This unexpected new difficulty put me on my mettle.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">of a piece with<\/strong> — in keeping with<\/p><p class=\"wm-cite\">This is of a piece with the rest of his conduct.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">not worth his salt<\/strong> — quite worthless<\/p><p class=\"wm-cite\">He is not worth his salt if he fails at this juncture.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">make both ends meet<\/strong> — to live within one's income<\/p><p class=\"wm-cite\">The cost of living has increased so much that he finds it difficult to make both ends meet.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">set face against<\/strong> — sternly oppose<\/p><p class=\"wm-cite\">As a social reformer, he set his face against nautch parties.<\/p><\/div>\n<div class=\"wm-example\"><p><strong class=\"wm-hl\">within an ace of<\/strong> — on the point of<\/p><p class=\"wm-cite\">At the battle of Marengo, Napoleon was within an ace of defeat.<\/p><\/div>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Practice<\/span>< etary under notice to quit with whom he was finding fault very fortunately without effect.<div class=\"wm-answer\">He was shot very fortunately without effect by a secretary under notice to quit with whom he was finding fault.<\/div><\/li>\n<li value=\"18\">A clever judge would see whether a witness was deliberately lying a great deal better than a stupid jury.<div class=\"wm-answer\">A clever judge would see a great deal better than a stupid jury whether a witness was deliberately lying.<\/div><\/li>\n<li value=\"19\">I was rather impressed by the manner of the orator than by his matter.<div class=\"wm-answer\">I was impressed rather by the manner of the orator than by his matter.<\/div><\/li>\n<li value=\"20\">He was driving away from the church where he had been married in a coach and six.<div class=\"wm-answer\">He was driving in a coach and six away from the church where he had been married.<\/div><\/li>\n<li value=\"21\">Stories have been related of these animals which are of an entirely fictitious character.<div class=\"wm-answer\">Stories which are of an entirely fictitious character have been related of these animals.<\/div><\/li>\n<\/ol><\/div>", "src": ["102-121"], "desc": "Phrasal verbs and idiomatic expressions built on twenty common English verbs, with their meanings and a sentence showing each in use.", "n": 49, "ex": 1, "items": 13, "ans": 13, "words": 3538, "cn": 23}, {"part": 2, "title": "Punctuation", "html": "<div class=\"wm-rule\">\n<h4>\n\n                        Full Stop or Period (.)\n                    <\/h4>\n<div class=\"wm-sub\">\n<p><strong>Usage:<\/strong> The Full Stop represents the greatest pause and separation. It marks the end of a declarative or imperative sentence.<\/p>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                            • Dear, patient, gentle, noble Nell was dead.<br/>\n                            • Come here immediately.\n                        <\/div>\n<p><strong>In Abbreviations:<\/strong> M.A. or MA, M.P. or MP, U.N.O. or UNO<\/p>\n<p><em>Note:<\/em> Mr and Mrs occur without a full stop in current English.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Comma (,) - 16 Main Uses\n                    <\/h4>\n<div class=\"wm-sub\">\n<p><strong>The comma represents the shortest pause. Main uses:<\/strong><\/p>\n<h4>1. To separate a series of words<\/h4>\n<div class=\"wm-example\">\n                            • England, France and Italy formed an alliance.<br/>\n                            • He lost lands, money, reputation and friends.\n                        <\/div>\n<h4>2. After a Nominative Absolute<\/h4>\n<div class=\"wm-example\">\n                            • This done, she returned to the old man.<br/>\n                            • The wind being favourable, the squadron sailed.\n                        <\/div>\n<h4>3. To mark off words in apposition<\/h4>\n<div class=\"wm-example\">\n                            • Paul, the apostle, was beheaded.<br/>\n                            • Milton, the great English poet, was blind.\n                        <\/div>\n<h4>4. To mark off words used in addressing people<\/h4>\n<div class=\"wm-example\">\n                            • Come into the garden, Maud.<br/>\n                            • How are you, Mohan?\n                        <\/div>\n<h4>5. Before and after participial phrases<\/h4>\n<div class=\"wm-example\">\n                            • Caesar, having conquered his enemies, returned to Rome.\n                        <\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 119 - Insert commas where necessary:<\/h4>\n                            1. The necessity of amusement made me a carpenter a bird-cager a gardener.<br/>\n                            2. Speak clearly if you would be understood.<br/>\n                            3. Even a fool when he holdeth his peace is counted wise.<br/>\n                            4. Brazil which is nearly as large as the whole of Europe is covered with vegetation.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Semicolon (;)\n                    <\/h4>\n<div class=\"wm-sub\">\n<p><strong>Usage:<\/strong> Represents a pause of greater importance than the comma.<\/p>\n<h4>1. To separate clauses of compound sentence when they contain commas<\/h4>\n<div class=\"wm-example\">\n                            • He was a brave, large-hearted man; and we all honoured him.\n                        <\/div>\n<h4>2. To separate a series of loosely related clauses<\/h4>\n<div class=\"wm-example\">\n                            • Her court was pure; her life serene;<br/>\n                              God gave her peace; her land reposed.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Colon (:)\n                    <\/h4>\n<div class=\"wm-sub\">\n<p><strong>Usage:<\/strong> Marks a more complete pause than the semicolon.<\/p>\n<h4>1. To introduce a quotation<\/h4>\n<div class=\"wm-example\">\n                            • Bacon says: \"Reading makes a full man, writing an exact man, speaking a ready man.\"\n                        <\/div>\n<h4>2. Before enumeration, examples, etc.<\/h4>\n<div class=\"wm-example\">\n                            • The principal parts of a verb in English are: the present tense, the past tense, and the past participle.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Question Mark (?)\n                    <\/h4>\n<div class=\"wm-sub\">\n<p><strong>Usage:<\/strong> Used after direct questions instead of full stop.<\/p>\n<div class=\"wm-example\">\n                            • Have you written your exercise?<br/>\n                            • If you prick us, do we not bleed?\n                        <\/div>\n<p><strong>Not used after indirect questions:<\/strong><\/p>\n<div class=\"wm-example\">\n                            • He asked me whether I had written my exercise.\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Exclamation Mark (!)\n                    <\/h4>\n<div class=\"wm-sub\">\n<p><strong>Usage:<\/strong> Used after interjections and expressions of sudden emotion.<\/p>\n<div class=\"wm-example\">\n                            • Alas! Oh dear!<br/>\n                            • What a terrible fire this is!<br/>\n                            • O, what a fall was there, my countrymen!\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Practice Exercise 120 - Insert commas where necessary:<\/h4>\n                    1. In the old Persian stories Turan the land of darkness is opposed to Iran the land of light.<br/>\n                    2. History it has been said is the essence of innumerable biographies.<br/>\n                    3. When I was in Delhi I visited the Red Fort Qutab Minar Raj Ghat India Gate and Chandni Chowk.<br/>\n                    4. All that I am all that I hope to be I owe to my angel mother.\n                <\/div>", "src": ["121-141"], "desc": "Usage: The Full Stop represents the greatest pause and separation.", "n": 50, "ex": 2, "items": 0, "ans": 0, "words": 498, "cn": 24}, {"part": 2, "title": "Spelling Rules", "html": "<div class=\"wm-rule\">\n<h4>\n\n                        Final Consonant Rules\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Rule 1: One-syllable words<\/h4>\n<p>One-syllable words ending in single vowel + single consonant double the consonant before a suffix beginning with a vowel.<\/p>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                            • beg + ed = begged<br/>\n                            • run + ing = running<br/>\n                            • sad + est = saddest<br/>\n                            • rob + er = robber\n                        <\/div>\n<p><strong>Exceptions:<\/strong><\/p>\n<div class=\"wm-example\">\n                            • wish + ed = wished (two consonants)<br/>\n                            • fear + ing = fearing (two vowels)\n                        <\/div>\n<h4>Rule 2: Two or three syllable words<\/h4>\n<p>Double the final consonant if the last syllable is stressed.<\/p>\n<div class=\"wm-example\">\n<strong>Stressed last syllable:<\/strong><br/>\n                            • begin + ing = beginning<br/>\n                            • occur + ed = occurred<br/>\n                            • permit + ed = permitted<br/>\n                            • control + er = controller\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Unstressed last syllable:<\/strong><br/>\n                            • benefit + ed = benefited<br/>\n                            • suffer + ing = suffering\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Final 'e' Rules\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Rule: Drop silent 'e' before vowel suffixes<\/h4>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                            • live + ing = living<br/>\n                            • hope + ing = hoping<br/>\n                            • move + ed = moved<br/>\n                            • drive + er = driver\n                        <\/div>\n<h4>Keep 'e' before consonant suffixes<\/h4>\n<div class=\"wm-example\">\n                            • hope + ful = hopeful<br/>\n                            • engage + ment = engagement\n                        <\/div>\n<h4>Exceptions:<\/h4>\n<div class=\"wm-example\">\n                            • true + ly = truly<br/>\n                            • whole + ly = wholly<br/>\n                            • due + ly = duly<br/>\n                            • nine + th = ninth\n                        <\/div>\n<h4>Special case: words ending in 'ce' and 'ge'<\/h4>\n<p>Keep the 'e' when adding 'able' and 'ous'<\/p>\n<div class=\"wm-example\">\n                            • notice + able = noticeable<br/>\n                            • change + able = changeable<br/>\n                            • courage + ous = courageous\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Final 'y' Rules\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Rule: 'y' following consonant changes to 'i'<\/h4>\n<p>Except before 'ing'<\/p>\n<div class=\"wm-example\">\n<strong>Change to 'i':<\/strong><br/>\n                            • happy + ly = happily<br/>\n                            • carry + ed = carried<br/>\n                            • beauty + ful = beautiful<br/>\n                            • marry + age = marriage\n                        <\/div>\n<div class=\"wm-example\">\n<strong>Keep 'y' before 'ing':<\/strong><br/>\n                            • carry + ing = carrying<br/>\n                            • marry + ing = marrying\n                        <\/div>\n<h4>'y' following vowel does not change<\/h4>\n<div class=\"wm-example\">\n                            • pray + ed = prayed<br/>\n                            • play + er = player\n                        <\/div>\n<h4>Exceptions:<\/h4>\n<div class=\"wm-example\">\n                            • pay + ed = paid<br/>\n                            • say + ed = said<br/>\n                            • lay + ed = laid<br/>\n                            • day + ly = daily<br/>\n                            • gay + ly = gaily\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        'ie' or 'ei' Rule\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Rule: 'i' before 'e' except after 'c'<\/h4>\n<p>When pronounced like 'ee' in 'jeep'<\/p>\n<div class=\"wm-example\">\n<strong>'i' before 'e':<\/strong><br/>\n                            • believe, relieve, achieve<br/>\n                            • grieve, yield, field\n                        <\/div>\n<div class=\"wm-example\">\n<strong>'ei' after 'c':<\/strong><br/>\n                            • receive, receipt, deceive<br/>\n                            • deceit, conceive, conceit\n                        <\/div>\n<h4>Exceptions:<\/h4>\n<div class=\"wm-example\">\n                            • seize, weird, protein<br/>\n                            • counterfeit, surfeit, plebeian\n                        <\/div>\n<\/div>\n<\/div>", "src": ["121-141"], "desc": "One-syllable words ending in single vowel + single consonant double the consonant before a suffix beginning with a vowel.", "n": 51, "ex": 0, "items": 0, "ans": 0, "words": 391, "cn": 25}, {"part": 2, "title": "Word Formation", "html": "<div class=\"wm-rule\">\n<h4>\n\n                        Types of Word Formation\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>1. Primary Words<\/h4>\n<p>Words not derived from other words - original stock of language<\/p>\n<h4>2. Compound Words<\/h4>\n<p>Formed by joining two or more simple words<\/p>\n<div class=\"wm-example\">\n                            • Moonlight, nevertheless, undertake, man-of-war\n                        <\/div>\n<h4>3. Primary Derivatives<\/h4>\n<p>Formed by making changes in the body of simple words<\/p>\n<div class=\"wm-example\">\n                            • Bond from bind, breach from break, wrong from wring\n                        <\/div>\n<h4>4. Secondary Derivatives<\/h4>\n<p>Formed by adding prefixes or suffixes<\/p>\n<div class=\"wm-example\">\n                            • Unhappy (prefix: un-), goodness (suffix: -ness)\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Compound Words Formation\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Compound Nouns can be formed from:<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>Noun + Noun<\/h4>\n                                Moonlight, chess-board, armchair, postman, railway, airman, fire-escape, windmill\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Adjective + Noun<\/h4>\n                                Sweetheart, nobleman, shorthand, blackboard, quicksilver, stronghold\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Verb + Noun<\/h4>\n                                Spendthrift, makeshift, breakfast, telltale, pickpocket, cut-throat, scarecrow\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Gerund + Noun<\/h4>\n                                Drawing-room, writing-desk, looking-glass, walking-stick, blotting paper\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Adverb + Noun<\/h4>\n                                Outlaw, afterthought, forethought, overcoat, downfall, afternoon\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Verb + Adverb<\/h4>\n                                Drawback, lock-up, go-between, die-hard, send-off\n                            <\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 123 - Explain the formation:<\/h4>\n                            newspaper, football, moonstruck, turncoat, brand-new, jet-black, onlooker, soothsayer, stronghold, ice-cold, worldly-wise, tempest-tossed\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        English Prefixes\n                    <\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>A- (on, in)<\/h4>\n                                abed, aboard, ashore, ajar, asleep\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Be- (by, intensive)<\/h4>\n                                beside, betimes, besmear, bedaub\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>For- (thoroughly)<\/h4>\n                                forbear, forgive\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Fore- (before)<\/h4>\n                                forecast, foretell\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Mis- (wrong, wrongly)<\/h4>\n                                misdeed, mislead, misjudge\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Over- (above, beyond)<\/h4>\n                                overflow, overcharge\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Un- (not)<\/h4>\n                                untrue, unkind, unholy\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Under- (beneath, below)<\/h4>\n                                undersell, undercharge, undergo\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Latin Prefixes\n                    <\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>Ab- (from, away)<\/h4>\n                                abuse, avert, abstract\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Ad- (to)<\/h4>\n                                adjoin, accord, affect, aggrieve\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Con- (with, together)<\/h4>\n                                contend, collect, combine, correct\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>De- (down)<\/h4>\n                                descend, dethrone, depose\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Ex- (out of)<\/h4>\n                                extract, effect\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>In- (in, into)<\/h4>\n                                invade, illustrate, immerse\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Pre- (before)<\/h4>\n                                prefix, prevent, predict\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Re- (back, again)<\/h4>\n                                reclaim, refund, renew, return\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Greek Prefixes\n                    <\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>A/An- (without, not)<\/h4>\n                                atheist, apathy, anarchy\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Anti- (against)<\/h4>\n                                antipathy, antagonist\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Auto- (self)<\/h4>\n                                autocrat, autobiography, autograph\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Mono- (alone, single)<\/h4>\n                                monoplane, monopoly\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Pan- (all)<\/h4>\n                                panacea, panorama, pantheism\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Syn- (with, together)<\/h4>\n                                synonym, sympathy, syllable, system\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Common Suffixes\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Noun Suffixes (Agent/Doer)<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>er, -ar, -or, -yer<\/h4>\n                                painter, baker, beggar, sailor, lawyer\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>ster<\/h4>\n                                spinster, punster, songster\n                            <\/div>\n<\/div>\n<h4>Noun Suffixes (State/Condition)<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>dom<\/h4>\n                                freedom, martyrdom, wisdom\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>hood<\/h4>\n                                manhood, childhood, godhead\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>ness<\/h4>\n                                darkness, boldness, goodness\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>ship<\/h4>\n                                hardship, friendship, lordship\n                            <\/div>\n<\/div>\n<h4>Adjective Suffixes<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>ful (full of)<\/h4>\n                                hopeful, fruitful, joyful\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>less (without)<\/h4>\n                                fearless, shameless, hopeless\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>ish (somewhat like)<\/h4>\n                                boorish, reddish, girlish\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>ly (like)<\/h4>\n                                manly, godly, sprightly\n                            <\/div>\n<\/div>\n<div class=\"wm-exercise\">\n<h4>Exercise 124 - Form words using suffixes:<\/h4>\n                            (a) Form adjectives from: muscle, hazard, worth, quarrel, admire, thirst, god<br/>\n                            (b) Form verbs from: friend, bath, fertile, grass, clean, sweet, critic<br/>\n                            (c) Form nouns from: sustain, attain, confess, attach, fortify, oblige, give, cruel, hate\n                        <\/div>\n<\/div>\n<\/div>", "src": ["121-141"], "desc": "Words not derived from other words - original stock of language", "n": 52, "ex": 2, "items": 0, "ans": 0, "words": 389, "cn": 26}, {"part": 2, "title": "Figures of Speech", "html": "<div class=\"wm-rule\">\n<h4>\n\n                        What are Figures of Speech?\n                    <\/h4>\n<div class=\"wm-sub\">\n<p>A Figure of Speech is a departure from the ordinary form of expression, or the ordinary course of ideas in order to produce a greater effect.<\/p>\n<h4>Classification:<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>Based on Resemblance<\/h4>\n                                Simile, Metaphor, Personification, Apostrophe\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Based on Contrast<\/h4>\n                                Antithesis, Epigram\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Based on Association<\/h4>\n                                Metonymy, Synecdoche\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Based on Construction<\/h4>\n                                Climax, Anticlimax\n                            <\/div>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Simile\n                    <\/h4>\n<div class=\"wm-sub\">\n<p><strong>Definition:<\/strong> In a Simile, a comparison is made between two objects of different kinds which have at least one point in common. Usually introduced by 'like', 'as', or 'so'.<\/p>\n<div class=\"wm-example\">\n<strong>Examples:<\/strong><br/>\n                            1. The Assyrian came down <span class=\"wm-hl\">like a wolf<\/span> on the fold.<br/>\n                            2. The righteous shall flourish <span class=\"wm-hl\">as the palm tree<\/span>.<br/>\n                            3. <span class=\"wm-hl\">As the hart panteth<\/span> after the water-brooks, <span class=\"wm-hl\">so panteth<\/span> my soul after Thee, O God.<br/>\n                            4. Words are <span class=\"wm-hl\">like leaves<\/span>: and where they most abound,<br/>\n                               Much fruit of sense beneath is rarely found.<br/>\n                            5. Life is <span class=\"wm-hl\">as tedious as a twice-told tale<\/span><br/>\n                               Vexing the dull ear of a drowsy man.<br/>\n                            6. O my Love's <span class=\"wm-hl\">like a red, red rose<\/span><br/>\n                               That's newly sprung in June;<br/>\n                               O my Love's <span class=\"wm-hl\">like the melodie<\/span><br/>\n                               That's sweetly played in tune.\n                        <\/div>\n<h4>Common Everyday Similes:<\/h4>\n<div class=\"wm-sub\">\n<div class=\"wm-sub\">\n<h4>Animal Similes<\/h4>\n                                mad as a March Hare<br/>\n                                proud as a peacock<br/>\n                                bold as brass\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Material Similes<\/h4>\n                                tough as leather<br/>\n                                clear as crystal<br/>\n                                good as gold\n                            <\/div>\n<div class=\"wm-sub\">\n<h4>Nature Similes<\/h4>\n                                old as the hills<br/>\n                                cool as a cucumber\n                            <\/div>\n<\/div>\n<p><strong>Note:<\/strong> A comparison of two things of the same kind is not a Simile.<\/p>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Metaphor\n                    <\/h4>\n<div class=\"wm-sub\">\n<p><strong>Definition:<\/strong> A Metaphor is an implied Simile. It does not state that one thing is like another, but takes that for granted and proceeds as if the two things were one.<\/p>\n<div class=\"wm-example\">\n<strong>Comparison:<\/strong><br/>\n                            • <strong>Simile:<\/strong> \"He fought like a lion\" (comparison stated)<br/>\n                            • <strong>Metaphor:<\/strong> \"He was a lion in the fight\" (comparison implied)\n                        <\/div>\n<div class=\"wm-example\">\n<strong>More Examples:<\/strong><br/>\n                            • Life is a journey (Life compared to journey)<br/>\n                            • Time is money (Time compared to money)<br/>\n                            • The classroom was a zoo (Classroom compared to zoo)<br/>\n                            • Her voice is music to my ears (Voice compared to music)<br/>\n                            • The world is a stage (World compared to stage)\n                        <\/div>\n<h4>Extended Metaphor Example:<\/h4>\n<div class=\"wm-example\">\n                            \"All the world's a stage,<br/>\n                            And all the men and women merely players;<br/>\n                            They have their exits and their entrances,<br/>\n                            And one man in his time plays many parts.\"<br/>\n<em>- Shakespeare<\/em>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"wm-rule\">\n<h4>\n\n                        Other Important Figures of Speech\n                    <\/h4>\n<div class=\"wm-sub\">\n<h4>Personification<\/h4>\n<p>Giving human qualities to non-human things<\/p>\n<div class=\"wm-example\">\n                            • The wind whispered through the trees<br/>\n                            • Time marches on<br/>\n                            • The sun smiled down on us\n                        <\/div>\n<h4>Apostrophe<\/h4>\n<p>Addressing someone absent, dead, or inanimate as if present and alive<\/p>\n<div class=\"wm-example\">\n                            • \"O Death, where is thy sting?\"<br/>\n                            • \"Twinkle, twinkle, little star\"<br/>\n                            • \"O Captain! My Captain!\"\n                        <\/div>\n<h4>Antithesis<\/h4>\n<p>Contrast of ideas by using opposite words<\/p>\n<div class=\"wm-example\">\n                            • \"It was the best of times, it was the worst of times\"<br/>\n                            • \"Give every man thy ear, but few thy voice\"<br/>\n                            • \"Man proposes, God disposes\"\n                        <\/div>\n<h4>Metonymy<\/h4>\n<p>Substituting the name of something with something closely associated<\/p>\n<div class=\"wm-example\">\n                            • \"The pen is mightier than the sword\" (pen = writing, sword = fighting)<br/>\n                            • \"The crown\" (referring to royalty)<br/>\n                            • \"Wall Street\" (referring to financial markets)\n                        <\/div>\n<h4>Synecdoche<\/h4>\n<p>Part represents the whole, or whole represents the part<\/p>\n<div class=\"wm-example\">\n                            • \"All hands on deck\" (hands = people)<br/>\n                            • \"Nice wheels\" (wheels = car)<br/>\n                            • \"The world\" (meaning all people)\n                        <\/div>\n<\/div>\n<\/div>\n<div class=\"wm-merge\"><span class=\"wm-merge-label\">Further coverage — sixteen figures with examples<\/span><\/div>\n<div class=\"wm-sub\"><h4>Simile <span class=\"wm-tag\">resemblance<\/span><\/h4><div class=\"wm-rule\"><p>A comparison made between two objects of different kinds which have at least one point in common, usually introduced by 'like', 'as', or 'so'.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>The Assyrian came down like a wolf on the fold.<\/li><li>The righteous shall flourish as the palm tree.<\/li><li>O my Love's like a red, red rose that's newly sprung in June.<\/li><li>Life is as tedious as a twice-told tale.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Metaphor <span class=\"wm-tag\">resemblance<\/span><\/h4><div class=\"wm-rule\"><p>An implied simile that takes for granted the comparison and proceeds as if the two things were one.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>The camel is the ship of the desert.<\/li><li>Life is a dream.<\/li><li>The news was a dagger to his heart.<\/li><li>Revenge is a kind of wild justice.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Personification <span class=\"wm-tag\">resemblance<\/span><\/h4><div class=\"wm-rule\"><p>Inanimate objects and abstract notions are spoken of as having life and intelligence.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>In Saxon strength that abbey frowned.<\/li><li>Laughter holding both her sides.<\/li><li>Death lays his icy hand on kings.<\/li><li>Pride goeth forth on horseback, grand and gay.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Apostrophe <span class=\"wm-tag\">resemblance<\/span><\/h4><div class=\"wm-rule\"><p>A direct address to the dead, to the absent, or to a personified object or idea.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>Milton! thou should'st be living at this hour.<\/li><li>Roll on, thou deep and dark blue Ocean–roll!<\/li><li>O death! where is thy sting? O grave! where is thy victory?<\/li><li>O liberty, what crimes have been committed in thy name?<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Hyperbole <span class=\"wm-tag\">resemblance<\/span><\/h4><div class=\"wm-rule\"><p>A statement made emphatic by overstatement.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>All the perfumes of Arabia will not sweeten this little hand.<\/li><li>Why, man, if the river were dry, I am able to fill it with tears.<\/li><li>I loved Ophelia; forty thousand brothers could not with all their quantity of love make up the sum.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Euphemism <span class=\"wm-tag\">resemblance<\/span><\/h4><div class=\"wm-rule\"><p>The description of a disagreeable thing by an agreeable name.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>He has fallen asleep (i.e., he is dead).<\/li><li>You are telling me a fairy tale (i.e., a lie).<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Antithesis <span class=\"wm-tag\">contrast<\/span><\/h4><div class=\"wm-rule\"><p>A striking opposition or contrast of words or sentiments made in the same sentence to secure emphasis.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>Man proposes, God disposes.<\/li><li>Not that I loved Caesar less, but that I loved Rome more.<\/li><li>Speech is silvern, but silence is golden.<\/li><li>To err is human, to forgive divine.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Oxymoron <span class=\"wm-tag\">contrast<\/span><\/h4><div class=\"wm-rule\"><p>A special form of antithesis whereby two contradictory qualities are predicted at once of the same thing.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>His honour rooted in dishonour stood, and faith unfaithful kept him falsely true.<\/li><li>So innocent arch, so cunningly simple.<\/li><li>She accepted it as the kind cruelty of the surgeon's knife.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Epigram <span class=\"wm-tag\">contrast<\/span><\/h4><div class=\"wm-rule\"><p>A brief pointed saying frequently introducing antithetical ideas which excite surprise and arrest attention.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>The child is the father of the man.<\/li><li>Fools rush in where angels fear to tread.<\/li><li>In the midst of life we are in death.<\/li><li>The fool doth think he is wise, but the wise man knows himself to be a fool.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Irony <span class=\"wm-tag\">contrast<\/span><\/h4><div class=\"wm-rule\"><p>A mode of speech in which the real meaning is exactly the opposite of that which is literally conveyed.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>No doubt but ye are the people, and wisdom shall die with you.<\/li><li>The atrocious crime of being a young man...<\/li><li>For Brutus is an honourable man; so are they all, all honourable men.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Metonymy <span class=\"wm-tag\">association<\/span><\/h4><div class=\"wm-rule\"><p>An object is designated by the name of something which is generally associated with it.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>The Bench (for the judges)<\/li><li>The Crown (for the king)<\/li><li>The pen is mightier than the sword<\/li><li>We are reading Milton (author for his works)<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Synecdoche <span class=\"wm-tag\">association<\/span><\/h4><div class=\"wm-rule\"><p>A part is used to designate the whole or the whole to designate a part.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>Give us this day our daily bread (bread for food)<\/li><li>All hands to the pumps (hands for crew)<\/li><li>A fleet of fifty sail (sail for ships)<\/li><li>England won the match (England for English team)<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Pun <span class=\"wm-tag\">construction<\/span><\/h4><div class=\"wm-rule\"><p>The use of a word capable of more than one application to produce a ludicrous effect.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>Is life worth living? It depends upon the liver.<\/li><li>An ambassador is an honest man who lies abroad for the good of his country.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Climax <span class=\"wm-tag\">construction<\/span><\/h4><div class=\"wm-rule\"><p>The arrangement of a series of ideas in the order of increasing importance.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>Simple, erect, severe, austere, sublime<\/li><li>What a piece of work is man! How noble in reason, how infinite in faculties! In action, how like an angel!<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Anticlimax <span class=\"wm-tag\">construction<\/span><\/h4><div class=\"wm-rule\"><p>The opposite of climax – a sudden descent from higher to lower, chiefly used for satire or ridicule.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>Here thou, great Anna! whom three realms obey, dost sometimes counsel take–and sometimes tea.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Litotes <span class=\"wm-tag\">construction<\/span><\/h4><div class=\"wm-rule\"><p>An affirmative conveyed by negation of the opposite, suggesting a strong expression by means of a weaker.<\/p><\/div>\n<div class=\"wm-example\"><ul><li>I am a citizen of no mean city (= a very celebrated city)<\/li><li>The man is no fool (= very clever)<\/li><li>I am not a little surprised (= greatly surprised)<\/li><\/ul><\/div>\n<\/div>", "src": ["121-141", "141-160"], "desc": "A Figure of Speech is a departure from the ordinary form of expression, or the ordinary course of ideas in order to produce a greater effect.", "n": 53, "ex": 0, "items": 0, "ans": 0, "words": 1303, "cn": 27}, {"part": 2, "title": "Verb Patterns", "html": "<div class=\"wm-sub\"><h4>Verb Pattern 1 — Subject + Verb<\/h4><div class=\"wm-rule\"><p>The simplest pattern with intransitive verb expressing complete sense<\/p><\/div>\n<div class=\"wm-example\"><ul><li>{'subject': 'Birds', 'verb': 'fly'}<\/li><li>{'subject': 'Fire', 'verb': 'burns'}<\/li><li>{'subject': 'The moon', 'verb': 'is shining'}<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Verb Pattern 2 — Subject + Verb + Subject Complement<\/h4><div class=\"wm-rule\"><p>Complement consists of noun, pronoun, or adjective<\/p><\/div>\n<div class=\"wm-example\"><ul><li>{'subject': 'This', 'verb': 'is', 'complement': 'a pen'}<\/li><li>{'subject': 'His brother', 'verb': 'became', 'complement': 'a soldier'}<\/li><li>{'subject': 'Gopal', 'verb': 'looks', 'complement': 'sad'}<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Verb Pattern 3 — Subject + Verb + Direct Object<\/h4><div class=\"wm-rule\"><p>Transitive verb with direct object<\/p><\/div>\n<div class=\"wm-example\"><ul><li>{'subject': 'I', 'verb': 'know', 'object': 'his address'}<\/li><li>{'subject': 'The boy', 'verb': 'has lost', 'object': 'his pen'}<\/li><li>{'subject': 'Mohan', 'verb': 'opened', 'object': 'the door'}<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Verb Pattern 8 — Subject + Verb + to-infinitive<\/h4><div class=\"wm-rule\"><p>Verb followed by to-infinitive as object<\/p><\/div>\n<div class=\"wm-example\"><ul><li>{'subject': 'She', 'verb': 'wants', 'infinitive': 'to go'}<\/li><li>{'subject': 'I', 'verb': 'forgot', 'infinitive': 'to post the letter'}<\/li><li>{'subject': 'He', 'verb': 'decided', 'infinitive': 'not to go there'}<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Verb Pattern 15 — Subject + Verb + that-clause<\/h4><div class=\"wm-rule\"><p>Verb followed by that-clause as object<\/p><\/div>\n<div class=\"wm-example\"><ul><li>{'subject': 'I', 'verb': 'suppose', 'clause': '(that) he is not at home'}<\/li><li>{'subject': 'We', 'verb': 'hoped', 'clause': '(that) you would succeed'}<\/li><li>{'subject': 'He', 'verb': 'says', 'clause': '(that) he has met your uncle'}<\/li><\/ul><\/div>\n<\/div>", "src": ["141-160"], "desc": "The simplest pattern with intransitive verb expressing complete sense", "n": 54, "ex": 0, "items": 0, "ans": 0, "words": 192, "cn": 28}, {"part": 2, "title": "Question Tags and More Structures", "html": "<div class=\"wm-sub\"><h4>Preparatory There + be<\/h4><div class=\"wm-rule\"><p>Used when subject is indefinite (preceded by a, an, some, much, many, etc.)<\/p><\/div>\n<div class=\"wm-example\"><ul><li>There is a book on the desk.<\/li><li>There are twelve months in a year.<\/li><li>There was someone at the door.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>It + be + adjective + to-infinitive<\/h4><div class=\"wm-rule\"><p>Impersonal construction with infinitive<\/p><\/div>\n<div class=\"wm-example\"><ul><li>It is easy to learn Hindi.<\/li><li>It will be difficult to give up smoking.<\/li><li>It was impossible to lift the box.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>too + adjective + to-infinitive<\/h4><div class=\"wm-rule\"><p>Expressing excessive degree preventing action<\/p><\/div>\n<div class=\"wm-example\"><ul><li>She is too weak to carry the box.<\/li><li>I am too busy to attend the party.<\/li><li>He talks too fast to be understood.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"wm-sub\"><h4>Conditionals Type 1<\/h4><div class=\"wm-rule\"><p>Open condition: If + present, will/shall/can/may + infinitive<\/p><\/div>\n<div class=\"wm-example\"><ul><li>If you study hard, you will get a first class.<\/li><li>If it rains, we shall postpone our picnic.<\/li><li>If he runs all the time, he can get there in time.<\/li><\/ul><\/div>\n<\/div>\n<div class=\"w
